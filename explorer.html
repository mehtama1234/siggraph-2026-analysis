 axisymmetric shapes, keeping 69.44% of reachable configurations above 90% density accuracy and shape fidelity for at least one operating speed. This enables readable, morphing LED displays for dynamic, shape-changing applications."}}, {"t": "Gaussian Point Splatting", "th": "gaussian splatting", "m": ["stochastic sampling", "atomic operations", "frustum culling"], "pr": "Gaussian splatting rendering scales poorly to scenes with millions of Gaussians", "ap": "Stochastic sampling of pixel-sized opaque points with 64-bit atomic splatting and hierarchical culling", "co": "Renders hundreds of millions of Gaussians in real time with minimal perceptual difference from original", "u": "https://www.semanticscholar.org/paper/c6bfc2265a4a7b348e6b14b333c25dfece18299a", "rc": {"bp": "Gaussian splatting is a new method for rendering 3D scenes: instead of ray-tracing (simulating light bouncing), you store the scene as a collection of blurry Gaussian shapes and paint them onto the screen. It's fast and can handle millions of small Gaussians. But the bottleneck: rendering millions of overlapping Gaussians is still slow on modern hardware, especially when you have scenes with hundreds of millions of Gaussians.", "wh": "Standard Gaussian splatting processes Gaussians one at a time, projecting each onto the screen and blending. This doesn't parallelize well because of rendering order: you need to know which Gaussian is in front, which is behind. On a GPU with millions of parallel threads, this becomes a coordination nightmare. You need a method that lets threads work independently without strong synchronization.", "ap": "Gaussian Point Splatting rethinks the algorithm. Instead of rendering continuous Gaussian shapes, they sample discrete points from each Gaussian. Each point is tiny (pixel-sized) and opaque, and they splat it to the framebuffer using atomic operations—low-level hardware primitives that let millions of threads update memory safely without explicit locks. Multiple points can hit the same pixel, and that's okay: the algorithm figures out how many points to sample from each Gaussian and how to distribute them so that the final opacity matches the original Gaussian splatting output. They use hierarchical culling to skip Gaussians that are off-screen or hidden.", "ww": "Sampling discrete points decouples the problem: thread independence means massive parallelism. Atomic operations are fast—they're built into modern GPUs. The key insight is that you can solve the \"how many points per Gaussian\" problem mathematically: given a target opacity and the number of pixels a Gaussian covers, you can compute the sampling rate. The atomic splat becomes a counting problem, which has a clean mathematical solution.", "po": "The method renders hundreds of millions of Gaussians in real time—orders of magnitude faster than prior methods. The only trade-off is slight noise and aliasing differences, which are imperceptible at interactive frame rates, making it practical for real-time 3D graphics at massive scale."}}, {"t": "Closed-Form Convolution for physically-accurate defocus in Gaussian Splatting", "th": "depth-of-field rendering", "m": ["gaussian splatting", "depth-of-field", "closed-form convolution"], "pr": "3D Gaussian Splatting assumes perfect focus but real captures contain lens defocus blur under large apertures", "ap": "Closed-form convolution of projected Gaussians with Circle of Confusion kernel via error function", "co": "Physically accurate depth-of-field in 3DGS enabling refocusing and aperture manipulation from blurry captures", "u": "https://www.semanticscholar.org/paper/c6e82a79decf7384225a952d514d81ec5f5f8d42", "rc": {"bp": "Gaussian splatting produces sharp, perfect focus—every part of the image is in focus. But real cameras have a lens that creates depth-of-field blur: nearby objects are sharp if you focus on them, far objects blur, and there's a zone of acceptable sharpness. Reconstructing scenes from real, blurry photos requires modeling this blur, but Gaussian splatting doesn't do it. The result: poor reconstruction quality when real lens blur is present.", "wh": "Standard Gaussian splatting renders Gaussians assuming a perfect pinhole camera with infinite depth of field. Real cameras with apertures create a circle of confusion—the extent of blur increases with distance from the focal plane. When you feed Gaussian splatting a photograph with real lens blur, the model hallucinates sharpness and gets confused about where surfaces are. You need a physically accurate blur model integrated into the rendering process, but naive convolution is expensive and doesn't interact well with the Gaussian splatting algorithm.", "ap": "The researchers derive a closed-form analytical solution for convolving a projected 3D Gaussian with the Circle of Confusion (the blur kernel). They use the error function (erf), a standard mathematical function, to express the convolution analytically. This lets them compute the blurred Gaussian's shape in closed form rather than approximating. They extend it to anisotropic Gaussians (elliptical rather than circular) and approximate polygonal apertures by decomposing them into rectangles, each with its own convolution solution.", "ww": "Closed-form solutions are fast—no numerical integration needed. The error function is efficient to evaluate. By placing the blur computation at the rasterization level (where Gaussians are projected), it's integrated into the core algorithm rather than bolted on. The mathematical framework is physically accurate, meaning it reflects how real cameras work rather than using ad-hoc approximations.", "po": "The method enables high-fidelity 3D reconstruction from blurry, multi-focus image sets. It supports post-capture effects like refocusing and aperture manipulation—you can change the focal distance or simulate different lenses after the fact. Experiments show it significantly improves reconstruction quality on defocus-focused benchmarks."}}, {"t": "Neural Quadrature Rule and Autoregressive Adaptive Sampling", "th": "monte carlo integration", "m": ["neural networks", "adaptive sampling", "learned integration"], "pr": "Monte Carlo integration cannot effectively use auxiliary information or adapt sampling to informative regions", "ap": "End-to-end neural network learning sampler and integrator jointly with learned priors over integrand structure", "co": "Substantial improvements in equal-sample setting across diverse graphics applications via coupled sampling-integration", "u": "https://www.semanticscholar.org/paper/c93139eec41cbef87c122938d2237b1703233a78", "rc": {"bp": "Rendering needs to compute the brightness at each pixel by integrating light contributions—a complex mathematical integral over many possible light paths. Monte Carlo integration is the standard tool: you randomly sample paths and average the brightness. But classical Monte Carlo only averages brightness values; it ignores the rich information you already have about each sample, like where it came from or what geometry it touched.", "wh": "Standard Monte Carlo estimators can't effectively use auxiliary information (sample position, geometric features) to improve accuracy. They also struggle to concentrate samples where they matter most. Imagine integrating a spiky function: you need many samples in the spike, few elsewhere, but classical Monte Carlo is blind to this. Adapting the sampling distribution toward important regions (importance sampling) is hard to do well without good prior knowledge.", "ap": "The researchers propose learning both the sampler and the integrator end-to-end using neural networks. Instead of a hand-crafted Monte Carlo formula, they train a neural sampler that learns where to place samples (adapting the sampling distribution), and a neural integrator that learns how to combine samples with their auxiliary information. The model trains on a dataset of integrands (brightness functions from different lighting scenarios), so it learns priors specific to the domain. The sampler draws samples smartly, and the integrator makes better use of each one.", "ww": "Neural networks are good at discovering structure in data. By training on a family of related integrands (all from rendering, or all from a specific type of problem), the network learns shared patterns. The integration step can now encode geometric insight: a sample that grazes a specular surface is weighted differently than one that hits diffuse. The coupling between sampling and integration lets feedback flow: the integrator can learn to expect certain types of information from certain regions, and the sampler adapts.", "po": "On diverse applications—lighting, transmittance, generalized winding number, walk-on-spheres—spanning low and high dimensions, the method achieves substantial improvements in accuracy at equal sample counts. Though the neural networks add overhead, end-to-end speedups over learned baselines are substantial, enabling faster rendering."}}, {"t": "GPU-accelerated Certified Hausdorff Distance Between Triangle Meshes", "th": "hausdorff distance", "m": ["branch-and-bound", "gpu acceleration", "adaptive subdivision"], "pr": "Hausdorff distance branch-and-bound becomes prohibitively expensive on large models under tight tolerances", "ap": "GPU-accelerated certified branch-and-bound with sorted double-buffered wavefront and adaptive subdivision", "co": "Robust deep-refinement handling via resource-aware deferral while maintaining efficient SIMT mapping", "u": "https://www.semanticscholar.org/paper/c9ef4d7db340b8315658fba824d95c1cbb18306d", "rc": {"bp": "When simulating collisions, or checking if two 3D meshes overlap, you need to compute the distance between them: how far apart are the closest points? The Hausdorff distance is the most careful measurement—the farthest distance you'd have to travel to match every point on one surface to the nearest point on the other. Computing this on large meshes can be slow.", "wh": "Exact Hausdorff distance requires checking every point on one surface against every point on the other—a massive search. Branch-and-bound algorithms prune the search space by keeping upper and lower bounds on the answer, but when meshes are nearly touching or overlapping, pruning is limited and the search is exhaustive. Modern GPUs are powerful but have limited memory; the search tree for a large mesh can overflow. You need an algorithm that maintains numerical precision under tight tolerances while fitting the search in GPU memory.", "ap": "The researchers adapt branch-and-bound for GPU execution. Instead of sequential tree traversal and priority queues (which don't parallelize), they use a wavefront pipeline: bulk-parallel worklists for different phases (bound evaluation, culling, subdivision, compaction). This maps naturally to SIMT (single-instruction, multiple-thread) hardware. For thin, elongated primitives that produce loose bounds, they introduce adaptive subdivision: selective double longest-edge bisection that keeps constant cardinality. For deep-refinement cases where memory fills up, they add a deferral mechanism: prioritize candidates likely to be culled, postpone expensive ones.", "ww": "Wavefront algorithms are GPU-friendly—each thread handles independent work, synchronization is minimal. Adaptive subdivision avoids exploding bound looseness on thin features without creating too many cells. The deferral mechanism is clever: by predicting which branches won't contribute to the final answer, you avoid materializing them, staying within memory.", "po": "The method handles large meshes under tight tolerances and near-zero distance configurations efficiently. It's robust, maintains numerical precision, and uses GPU-acceleration effectively, making it practical for collision detection and geometry processing in interactive and simulation pipelines."}}, {"t": "Texture-Aware Remeshing for Texture-aware Geometry Processing", "th": "texture-aware processing", "m": ["remeshing", "vertex colors", "texture hoisting"], "pr": "Standard geometry processing tools ignore textures when meshes use UV parameterization with texture maps", "ap": "Remeshing hoists textures to vertex colors via per-triangle processing preserving appearance", "co": "Enables texture-aware geometry processing on segmentation, parameterization, and vector field operations", "u": "https://www.semanticscholar.org/paper/ca6a55ba8b9e7499725f75e9908209c650b58de7", "rc": {"bp": "3D artists paint textures (images applied to surfaces) using UV coordinates: they lay a 2D texture map flat, paint on it, then wrap it back onto the 3D surface. But geometry-processing algorithms often ignore textures because they don't know how to incorporate them. If you could treat textures as colors at the vertices themselves rather than maps, geometry algorithms could see and respect texture details naturally.", "wh": "Texture maps live in 2D UV space; geometry processing algorithms work in 3D. These are two different coordinate systems, making it hard to apply texture-aware algorithms like detecting edges based on texture gradients, or segmenting surfaces based on texture patterns. Most geometry software simply ignores textures when processing because the standard representation (UV + texture map) doesn't integrate well. Vertex-color meshes would work, but converting UV-textured meshes to vertex colors risks losing or distorting image quality.", "ap": "They developed a remeshing procedure that hoists textures from 2D UV maps into 3D vertex colors. For each triangle in the input mesh, they create a denser remeshed triangle, sample colors from the texture map at each new vertex, and store those colors as vertex attributes. This converts any UV-textured mesh into an equivalent vertex-color mesh that preserves the original appearance. With vertex colors in place, geometry algorithms can now incorporate texture information: surface segmentation can split based on color boundaries, Tutte parameterizations can preserve color variation, edge detection can find texture edges, and vector field operations can incorporate color gradients.", "ww": "Per-triangle remeshing is simple and preserves the original image because you're literally sampling the texture at new vertices—no approximation. Vertex colors are a standard, widely-supported format in graphics APIs, so algorithms can process them easily. By lifting the problem from image space to 3D vertex space, all the spatial geometry tools become applicable to texture.", "po": "Texture-aware geometry processing produces richer results than geometry-only or image-only methods. Segmentation respects texture boundaries, parameterizations avoid tearing textures, and filter operations like edge detection work in 3D space while preserving texture structure, making it practical for artists to maintain visual coherence while processing geometry."}}, {"t": "JGS2-GQ: Training-free 2nd Jacobi with Gaussian Quadrature", "th": "volumetric simulation", "m": ["gaussian quadrature", "jacobi solver", "perturbation subspace"], "pr": "JGS2 Cubature method degrades with high-resolution deformation lacking representative training data", "ap": "Training-free Gaussian quadrature integration with adaptive region generation for subspace integration", "co": "Stable volumetric simulation without data generation, handling large novel deformations and frictional contact", "u": "https://www.semanticscholar.org/paper/ccf06f092ccd17471354f493956b7c6f4105e43a", "rc": {"bp": "When a jello jiggles or a foam compresses, we want to predict exactly how it moves and deforms. This matters for animation, robot simulation, and design preview—you need fast, reliable answers without waiting hours for the computer.", "wh": "Jacobi-style solvers split the work into pieces, but overcompensate; prior data-driven fixes require expensive training and fail on new, detailed deformations.", "ap": "Instead of learning from examples, this paper uses classical mathematics: they treat the local solve as something that can be approximated by a low-degree polynomial. That means you can use Gaussian quadrature—a technique from calculus that computes integrals without needing data—to figure out the global influence analytically. The algorithm adaptively figures out the right region to integrate over for each piece, and does it without any training.", "ww": "A polynomial is a simple, smooth function, and Gaussian quadrature is basically the exact formula for integrating polynomials: it evaluates the function at a few clever points and combines them mathematically. No training, no data needed, just math that works.", "po": "The result is a simulator that handles large, never-before-seen deformations without training data, stays stable and convergent, and can even model friction and contact. It's versatile—you can use it on high-resolution foam, cloth, flesh, or anything else without preprocessing."}}, {"t": "Progressing Level-of-Detail Animation for Volumetric Elastodynamics", "th": "level-of-detail animation", "m": ["progressive dynamics", "velocity splitting", "finite elements"], "pr": "LOD animation design requires slow high-resolution preview iteration for volumetric elastodynamics", "ap": "VelPro Splitter integrator with velocity splitting and cross-level consistency in progressive dynamics", "co": "Decoupled finest-level enrichment from LOD levels, enabling efficient multi-resolution volumetric animation", "u": "https://www.semanticscholar.org/paper/cd75edf71b3d2981a6b8b3dbffc549063d0d6545", "rc": {"bp": "Animators and designers want to see a low-resolution preview of how their volumetric object will behave—a quick test—then refine it to high-resolution reality. The level-of-detail pipeline lets you iterate fast and then commit to expensive detail computation only once you're happy.", "wh": "When you solve a coarse simulation, the velocity (motion information) it produces isn't enough to guide a fine simulation: the coarse motion is smooth and lacks the fine vibrations and jitter that make high-res look lively. Previous methods enriched the velocity after the fact, but they mixed in geometric detail unevenly, and if you wanted many LOD levels (for very fine detail), the enrichment quality suffered.", "ap": "This paper introduces a smarter velocity splitter that separates the coarse motion into two parts: a low-frequency bulk motion and a high-frequency ripple component. It recombines these so that the coarse motion is used mainly for the bulk, while the high-frequency richness is generated independently from high-res data. The splitting is done consistently across all detail levels, so whether you have 2 LOD steps or 20, the final detail quality stays the same.", "ww": "Velocity is information about how fast and in which direction things move. By splitting it into slow-changing (bulk) and fast-changing (jiggles) parts, you can handle them separately: bulk motion guides the overall shape, jiggle details add richness. This decoupling means you don't need to stack more and more detail levels to get good shading—the high-res detail is generated, not inherited from coarse layers.", "po": "Animators can now run a cheap coarse-LOD simulation in seconds, preview the macro motion, then generate a high-fidelity version with rich bouncing and detail—all with cross-LOD consistency so the result makes sense as a refinement, not a divergent artifact."}}, {"t": "StyleID: A Perception-Aware Dataset and Metric for Stylization-Agnostic Facial Identity Recognition", "th": "face stylization", "m": ["psychometric calibration", "diffusion stylization", "semantic encoding"], "pr": "Identity encoders brittle under face stylization, confusing texture/color changes with identity drift", "ap": "Perception-aware benchmark with 2AFC psychometric experiments and fine-tuned semantic encoders", "co": "StyleID dataset and calibrated models achieving human-aligned perception of stylized face identity", "u": "https://www.semanticscholar.org/paper/cd868d46b4ea009f3e1328c363dbfd5a32b5773f", "rc": {"bp": "An artist wants to draw a face in cartoon, watercolor, or pencil style while keeping it recognizable as the same person. A computer should be able to verify identity is preserved across these artistic transformations, so systems can measure and improve consistency.", "wh": "Current face-recognition models are trained on natural photos, so when you apply stylization—turning a photo into a cartoon—the model gets confused. It mistakes the new colors or exaggerated features for a different person, or it can't tell one stylized version from another. There's no agreed standard for what \"same identity under cartoon style\" should even mean.", "ap": "This paper created two datasets: one where humans rated whether stylized portraits looked like the same person (across diffusion- and flow-based stylizations at different intensities), and another derived from careful controlled experiments asking humans to pick the stronger or weaker version of a face at different style strengths. Using this human-ground-truth data, they fine-tuned existing face encoders to match human perception, so the model learns what matters to human eyes across styles.", "ww": "A face encoder learns from human perception instead of just trying to memorize faces. When humans judge identity across styles, they ignore color-palette shifts but care about facial geometry—eye spacing, jaw shape, nose. By training the encoder on human judgments at many style levels, it learns to ignore irrelevant style changes and focus on the skeletal structure.", "po": "The resulting calibrated encoders now correctly recognize stylized faces as the same or different person with high correlation to human judgment. This lets artists and studios measure and debug identity consistency in their stylization pipelines, and it provides a benchmark to evaluate new stylization methods."}}, {"t": "Mechanical Cloaking of Halftoned Imagery", "th": "mechanical metamaterials", "m": ["halftoning", "porous structures", "material design"], "pr": "Metamaterial cloaking lacks mechanical domain application, visually encoding properties", "ap": "Parametric porous structures halftoning images while maintaining near-isotropic mechanical properties", "co": "Visually matches target image while appearing mechanically homogeneous and isotropic", "u": "https://www.semanticscholar.org/paper/cf67084f1ab94274f536f7f7bf02fd7c79e697e0", "rc": {"bp": "Imagine camouflaging an object by making it mechanically invisible—not hiding it to the eye, but hiding how it deforms and resists pressure. If you press on it, an observer can't tell where the hard or soft parts are. This is useful for defense, architecture, and material design.", "wh": "You want a porous structure (like a sponge or honeycombed material) whose patterns look like a picture when you view it, but whose mechanical behavior is perfectly uniform and isotropic—responding the same way to pressure from any direction. These two goals seem opposed: a picture's contrast requires regions that look different, while uniform mechanics requires everything to behave the same.", "ap": "This paper defines a parametric family of porous structures—essentially patterns of holes and solid material arranged in a specific way. The holes and walls are shaped and positioned so that even though the visual pattern produces high contrast (dark/light like a halftone image), the overall mechanical properties remain uniform and isotropic.", "ww": "Mechanics comes from the geometry of the microstructure: which direction the walls run, how thick they are, and how they're connected. By carefully designing the hole patterns, you can create regions that look different but have identical mechanical stiffness in all directions because the underlying network of walls distributes load uniformly.", "po": "You can 3D-print a part that looks like a portrait when viewed but behaves like solid, uniform steel when compressed or bent. This opens doors to camouflaged structural components, artistic sculptures with hidden properties, and new metamaterial designs for aerospace and defense."}}, {"t": "MeshFEM: A Block-accelerated Solver for Nonlinear Finite Elements", "th": "nonlinear solver", "m": ["sparse cholesky", "block structure", "multifrontal"], "pr": "Direct sparse solvers underperform on block-sparse Hessians from spatial FEM problems", "ap": "Block-accelerated multifrontal Cholesky with fast parallel assembly and heuristic Hessian projection", "co": "BlockCatamari solver achieving significantly faster factorizations on shared-memory systems", "u": "https://www.semanticscholar.org/paper/d64c5bfa21ac2e68081416479184d966d6e872b6", "rc": {"bp": "Many graphics and design problems boil down to finding the best shape or configuration by minimizing some energy or cost function: a fabric that drapes naturally, a metal part that doesn't buckle, a shape optimized for aerodynamics. Solving these optimization problems fast and accurately is a bottleneck.", "wh": "These problems are nonlinear and high-dimensional, requiring specialized solvers. Direct sparse solvers (which use matrix factorization and are very accurate) are preferred for tough cases, but they're slow because they don't exploit the structure of these problems: the energy typically breaks into small local terms over small neighborhoods, producing a block-sparse Hessian—many tiny dense blocks of numbers grouped together.", "ap": "This paper builds a framework that accelerates every phase of Newton's method using the block-sparse structure. They develop BlockCatamari, a custom Cholesky factorization solver that's heavily optimized for these dense blocks, and pair it with fast assembly routines, smart recomputation strategies, and element-wise Hessian projections.", "ww": "Block sparsity means you can use SIMD and cache-friendly operations on many small dense matrices instead of laboriously shuffling around a huge sparse matrix. Modern CPUs are good at dense-matrix math, so by exploiting the block structure you get many-fold speedups across assembly, factorization, and solve phases.", "po": "The resulting solver handles high-dimensional geometry optimization problems (like cloth simulation, shape optimization, and deformation) dramatically faster and more accurately than existing methods, enabling interactive design on unstructured grids without sacrificing precision."}}, {"t": "SCom DAG: compact representation of spatial data for real-time rendering", "th": "spatial data compression", "m": ["directed acyclic graph", "octree", "transformation encoding"], "pr": "Volumetric data representation lacks compact encoding balancing fidelity and compression across dimensions", "ap": "Similarity Compressed DAG with octree subdivision, spatial/data transformations, hyper-octahedral groups", "co": "Compact lossy representation for 2D/3D/4D data with controlled quality, efficient browser rendering", "u": "https://www.semanticscholar.org/paper/d67b50e1f28d31c99a0a1e9eb72118c1308804aa", "rc": {"bp": "Rendering a huge game world, visualizing a massive volumetric medical scan, or streaming 4D animation over the internet requires compressing spatial data—textures, 3D shapes, volumetric data—without losing quality. Current methods struggle when you have mixed dimensionality (2D images, 3D geometry, 4D video all in one scene).", "wh": "Compression is hard when you need to represent many different data types, handle both geometric detail and temporal change, and still fit in memory or bandwidth. Existing approaches are tuned for one type—either textures or meshes or volumes—and switching methods is inefficient.", "ap": "This paper proposes SCom DAG (Similarity Compressed Directed Acyclic Graph), which uses an octree (a tree that recursively subdivides space) to find regions that are similar except for a simple transformation—a rotation, scale, or shift. It stores the transformation on each edge and the actual data only once, reducing redundant copies. It works on 2D, 3D, 4D, or any dimensionality uniformly.", "ww": "Many real spatial data—textures, shapes, volumes—have self-similarity: a pattern that repeats at different scales or positions with only minor transformations. By identifying and exploiting these repetitions, you avoid storing the same pattern many times. A graph data structure lets you point to shared data blocks via transformations.", "po": "A single framework compresses textures, meshes, volumetric scans, and time-varying volumetric animation with quality comparable to the best specialized method for each, but with drastically smaller memory footprint. This is especially valuable for low-end devices and web-based visualization."}}, {"t": "Fast VEM Fluid Simulation", "th": "fluid simulation", "m": ["virtual element method", "cut-cell", "geometric multigrid"], "pr": "Cut-cell methods for boundary-conforming fluid simulation yield poorly conditioned pressure systems", "ap": "Virtual Element Method on convexity-preserving cut-cell grids with geometric multi-grid solver", "co": "High-fidelity flow-boundary interaction with substantially reduced computational cost", "u": "https://www.semanticscholar.org/paper/d8a7ab59ec57e445d36a47ba5adbb6ec8dde7574", "rc": {"bp": "Flowing water around a complex obstacle—a ship's hull, a turbine, a seaweed forest—produces beautiful, chaotic motion that matters for animation and engineering. Simulating this with fidelity requires respecting the boundary geometry exactly, but that usually leads to a solver nightmare.", "wh": "Accurate boundary representation requires body-fitted grids (where the grid cells conform exactly to the boundary), usually via cut-cell methods, but these create poorly shaped cells and very difficult linear systems for pressure projection. Solving these systems becomes prohibitively slow, defeating the purpose of a fast simulation.", "ap": "FastVEM uses the Virtual Element Method, a modern discretization technique that robustly handles irregular, cut-cell grids by not requiring perfect cell geometry. They pair this with a Particle-in-Cell scheme for advection and develop a geometric multi-grid solver with a special prolongation operator and boundary-aware hierarchy that keeps the coarse-level problems well-conditioned.", "ww": "Virtual Element Method is flexible with cell geometry, so it doesn't penalize irregular cut cells. The multi-grid solver is designed so coarse levels don't become dense and ill-conditioned (a classic multi-grid failure mode on cut cells). The diffusion-free prolongation prevents numerical artifacts from spreading.", "po": "You can now simulate fluid flowing around complex boundaries at much higher speed and comparable accuracy to traditional solvers, enabling real-time flow visualization, interactive design, and detailed animation of water, smoke, and air around intricate obstacles."}}, {"t": "Monte Carlo Rendering of Biharmonic Diffusion Curves", "th": "vector graphics rendering", "m": ["monte carlo", "variational optimization", "pde solving"], "pr": "No Monte Carlo solver exists for biharmonic diffusion curves with coupled boundary conditions", "ap": "Variational inverse problem formulation treating Dirichlet data as unknown, stochastic gradient estimation", "co": "Monte Carlo rendering of biharmonic diffusion curves with coupled Dirichlet-Neumann conditions", "u": "https://www.semanticscholar.org/paper/dad15ba4275869f279181d90f6c77b9a8e73d5bd", "rc": {"bp": "An artist draws smooth curves and color gradients to create vector graphics—a clean, scalable image. The computer fills the regions between the curves with color via diffusion, creating smooth blends. Making this render efficiently and accurately is a mathematical challenge.", "wh": "Biharmonic diffusion curves use fourth-order differential equations (biharmonic equations), which are harder to solve than standard diffusion. Previous solvers were deterministic and slow. You can split the biharmonic into two second-order equations, but they're tightly coupled with mixed boundary conditions (some parts specify value, others specify slope), so you can't solve them independently.", "ap": "This paper treats it as an inverse problem: the boundary colors the user draws are known, but the intermediate Laplace equation's boundary values are unknown and must be found. They set up an optimization that minimizes the difference between predicted and desired final color, using stochastic gradient estimation (Monte Carlo sampling) to evaluate it.", "ww": "Monte Carlo sampling—throwing random rays or samples—is natural for graphics and scales to complex geometry. By treating unknown boundaries as optimization variables, you convert a tightly coupled system into an unconstrained optimization, which Monte Carlo samplers can handle efficiently by estimating gradients stochastically.", "po": "Biharmonic diffusion curves now render via the same modern stochastic framework as other graphics problems, eliminating need for expensive deterministic solvers and making it practical to integrate into GPU-accelerated renderers and offline pipelines."}}, {"t": "Tempo3D: Efficient Temporal-Aware Fine-Tuning and Multi-View Latent Aggregation for 3D Generation", "th": "3D generation", "m": ["temporal fine-tuning", "lora", "multi-view aggregation"], "pr": "Single-view 3D diffusion models produce inadequate geometry and incorrect topology from ambiguity", "ap": "Temporal-aware TS-LoRA fine-tuning and multi-view latent aggregation with score-based velocity field", "co": "High-fidelity VecSet-based 3D generation with structure-to-details learning and geometric refinement", "u": "https://www.semanticscholar.org/paper/db8566e48ee6d791ae976f63c1bbe18364675b39", "rc": {"bp": "Given a single photo or sketch of an object, generate a full 3D model with fine detail—bumps, creases, realistic surface texture. This is valuable for game asset creation, CAD modeling, and digital twins, but single-view ambiguity makes it hard to guess 3D geometry.", "wh": "A single view doesn't constrain geometry fully—a sphere could be flat or deeply rounded from the side. Existing methods rely on massive training data to learn implicit priors from billions of examples, which is expensive and often misses fine details. The geometry representation (like VecSet) globally entangles different parts, so learning local detail is hard.", "ap": "Tempo3D uses flow-based generative models—which naturally transition from structure to detail over time. They introduce Time-Segmented LoRA, which splits learning across different time windows: early time learns overall structure, late time focuses on fine details. They also gather views of the object from multiple angles using a large language model, and aggregate these views' information (via special projection and velocity field aggregation) to resolve ambiguity.", "ww": "Flow models inherently move from blurry to detailed over time, so splitting the learning task by time windows means early epochs build structure, later epochs add detail—this naturally decouples coarse shape from fine texture. Multiple views provide extra clues about 3D geometry, and aggregating them statistically reduces ambiguity.", "po": "You can generate high-detail 3D models from a single image using resource-efficient training (no need for massive datasets), and the fine details are richer and more accurate than prior methods because they're generated from a structure-aware process and cross-validated against multiple viewpoints."}}, {"t": "HeadRouter: A Training-free Image Editing Framework for MM-DiTs by Adaptively Routing Attention Heads", "th": "image editing", "m": ["attention routing", "diffusion transformers", "token refinement"], "pr": "MM-DiTs lack semantic text guidance consistency in image editing unlike UNet-based structures", "ap": "Training-free attention head routing with dual-token refinement for text/image semantic alignment", "co": "Accurate text-guided editing on multimodal Transformers through adaptive head routing mechanism", "u": "https://www.semanticscholar.org/paper/dd1476c271eee1084a0cef7643dcb8ded430fb96", "rc": {"bp": "An image editor wants to follow text instructions like \"make the sky purple\" or \"add glasses to the face.\" Diffusion Transformer models (modern generative AI) are powerful but were designed for generation, not editing—they don't naturally accept precise text guidance for changing specific regions.", "wh": "Unlike older UNet-based models where you could see which attention layers attended to text vs. image, Transformer-based models fuse text and image tokens in complex ways, so it's unclear how to steer them toward particular edits. Text guidance gets muddled among the image tokens.", "ap": "HeadRouter discovers that different attention heads in the Transformer specialize in different image semantics (some focus on color, others on structure). The algorithm detects which heads matter for a given editing task and routes the text guidance through them, bypassing irrelevant heads. A dual-token refinement module clarifies both text and image tokens to reduce ambiguity.", "ww": "Attention heads learn to extract different features: some detect edges, others colors, others textures. By routing text guidance selectively to the heads that handle the semantic content you want to edit, you achieve precision. The refinement module removes noise in the token representations.", "po": "Text-guided image editing on Diffusion Transformers now works precisely and without retraining: you can edit a region with fine semantic control, faithful preservation of the unedited areas, and high output quality—enabling professional image editing in generative AI systems."}}, {"t": "MOCHI: Motion Enhancement of Collaborative Human-object Interactions", "th": "motion capture enhancement", "m": ["grasp optimization", "diffusion refinement", "physics constraints"], "pr": "Multi-human object interaction capture contains contact misalignment, jitter, and missing finger articulation", "ap": "Two-stage framework: physics-aware grasp optimization then diffusion-based full-body motion refinement", "co": "Enhanced MHOI data with plausible hand grasps, temporal consistency, and complete articulation details", "u": "https://www.semanticscholar.org/paper/df5993c552a9f8a2c907e9c3ecb0ef5280c63ae7", "rc": {"bp": "Two people lifting a heavy box together—each anticipating the other's move, adjusting grip and timing—is visually rich. Capturing and refining this multi-person, multi-object collaboration is key for animation, VR, and understanding human behavior, but acquisition is messy.", "wh": "Capturing two people interacting with an object simultaneously is hard: mocap markers get occluded, hands misalign with the object, fingers aren't captured, temporal jitter creeps in, and sequences have gaps. Raw capture is noisy and unusable for realistic animation.", "ap": "MOCHI is a two-stage framework: first, it optimizes realistic hand grasps from the noisy body input (making sure hands are physically plausible and aligned with the object), then it extends these grasps into full collaborative sequences. Second, it uses a diffusion model trained on single-person motion to refine the full-body motion of all participants together, leveraging the prior that individual human motion is smooth and natural.", "ww": "Physics priors and motion priors work together: grasp optimization uses physics (hands can't penetrate objects) to fix contact. Diffusion refinement uses learned patterns of human motion (what walk cycles and gestures look like) to smooth temporal noise and fill gaps. Each stage makes the next one's job easier.", "po": "Noisy multi-person interaction captures become clean, physically plausible, temporally smooth, and finger-complete. This enables realistic character animation of collaborative tasks and provides high-quality training data for systems that need to understand human-human-object interaction."}}, {"t": "SegviGen: Repurposing 3D Generative Model for Part Segmentation", "th": "part segmentation", "m": ["generative model", "voxel colorization", "interactive segmentation"], "pr": "3D part segmentation requires large annotated data or suffers from cross-view inconsistency blurs", "ap": "Repurpose pretrained 3D generative models with part-indicative colorization on active voxels", "co": "40% improvement on interactive segmentation with only 0.32% training data via generative priors", "u": "https://www.semanticscholar.org/paper/e12da73668e5e1e7c8199f24d228151b9a26e8ee", "rc": {"bp": "When you have a 3D model (say, a chair), you want to know what its parts are: the seat, the backrest, the legs. Labeling parts is tedious, but having part information enables editing, animation, and assembly simulation. Can you do this without manually annotating thousands of 3D models?", "wh": "Training a segmentation model from scratch requires large annotated 3D datasets and computational resources. Lifting 2D image segmentation to 3D via multi-view aggregation produces blurry boundaries and inconsistencies across views because images from different angles give conflicting cues.", "ap": "SegviGen leverages a pretrained 3D generative model (one already trained on diverse 3D shapes). It encodes the input shape, then asks the generative model to imagine the shape painted with part-indicative colors (different colors for seat vs. backrest). From these colored predictions, it infers part boundaries. It works in a unified framework for interactive labeling, full automatic segmentation, and segmentation refined by 2D images.", "ww": "A generative model has learned rich 3D structure priors from diverse training data—it understands that chairs have parts with specific relationships and proportions. By colorizing these parts, you're asking the generative model to apply its knowledge directly to the task, transferring its priors without expensive retraining.", "po": "Part segmentation now requires 0.32% of the training data compared to supervised baselines, runs interactively with strong user control, and works across object categories without category-specific tuning. The framework is practical and efficient, enabling rapid annotation workflows."}}, {"t": "Efficient Fur and Hair Multiple Scattering Using Volumetric Approximation", "th": "hair rendering", "m": ["volumetric scattering", "participating media", "fiber geometry"], "pr": "Multiple scattering in dense hair/fur expensive and prior approximations fail, appearing dry or blurred", "ap": "Volumetric approximation as anisotropic participating medium with explicit fiber for direct lighting", "co": "7-10x faster than path tracing, reproducing rich scattering appearance under varied lighting", "u": "https://www.semanticscholar.org/paper/e136176109825e95fe86bca0cfa843415440ea3a", "rc": {"bp": "Rendering hair or fur that looks soft and realistic requires simulating light bouncing multiple times between fibers. Direct simulation is prohibitively slow, but simple approximations often look too glossy or too blurred. Animation studios need fast, beautiful hair rendering for production.", "wh": "Multiple scattering (light bouncing between hairs) is expensive to compute directly. Existing approximations fail on dense hair—they either produce overly dry, crispy appearance or overly soft, featureless blur. Volumetric approaches that approximate hair as a fog lose fiber-level detail that makes hair look real.", "ap": "This method treats dense hair as an anisotropic participating medium—like fog but with directional properties. It keeps explicit fiber geometry for direct lighting (to catch fine details and shadows), but approximates multiple scattering volumetrically. It accumulates how much hair coverage exists in each screen pixel, then stochastically samples one higher-order scattering bounce to approximate all the rest.", "ww": "Using volumetric approximation for multiple bounces is fast because you compute one sample and extrapolate; keeping explicit geometry for direct light preserves detail because direct light-fiber interaction is local and tractable. The combination captures soft volumetric glow (from multi-bounce) plus crisp fiber shadows (from geometry).", "po": "Hair and fur render 7–10x faster than path tracing while looking nearly identical—soft, luminous, with rich color and detail. This is production-ready for animation studios, and it works across diverse lighting conditions without tuning."}}, {"t": "Sketch2Arti: Sketch-based Articulation Modeling of CAD Objects", "th": "articulation modeling", "m": ["sketch-based modeling", "part discovery", "motion inference"], "pr": "Articulation modeling from CAD requires manual translation of designer sketches to rigged 3D models", "ap": "Sketch-based discovery of movable parts and motion parameters, category-agnostic training", "co": "First sketch-to-CAD articulation system with controllable internal completion generalization", "u": "https://www.semanticscholar.org/paper/e15914e3620558c15b5511ffc511a899ea5abeff", "rc": {"bp": "A designer wants to describe how a machine part moves—\"this door swings on these hinges, that slider glides up and down.\" Drawing this by hand in 3D CAD is tedious. Can the designer just sketch arrows and strokes on a 2D view, and the computer infers the articulation?", "wh": "Articulation modeling requires discovering which parts are rigid and move independently, what type of motion each undergoes (rotation, translation, etc.), and the motion parameters (rotation axis, limits). This is complex, under-constrained from a single 2D sketch, and varies by object category, making it hard to train.", "ap": "Sketch2Arti takes a CAD model and user sketches (arrows indicating motion direction). It automatically identifies movable parts from the sketch context and predicts motion parameters, iteratively supporting multiple articulations on one object. For shells without interior geometry, it can generate plausible interiors (gears, linkages, etc.) consistent with the predicted motion and sketch constraints.", "ww": "Sketches encode intent: a downward arrow means vertical translation, a circular arrow means rotation. The system learns to associate sketch patterns with motion types and part boundaries in a category-agnostic way—no pre-training on chair-specific or door-specific data—so it generalizes to novel objects.", "po": "Designers can sketch articulation intent and the computer infers a moving, interactive 3D model with realistic internal structures, even for shell models. This accelerates CAD modeling and enables rapid prototyping of mechanisms from loose sketches."}}, {"t": "Radiance Caching for Differentiable Path Tracing", "th": "inverse rendering", "m": ["radiance caching", "differentiable rendering", "variance reduction"], "pr": "Differentiable path tracing suffers high variance and poor conditioning for inverse rendering", "ap": "Radiance cache with spatial blending field interpolating between cache and unbiased estimators", "co": "Recover material parameters even with unidentifiable lighting, improved speed and robustness", "u": "https://www.semanticscholar.org/paper/e1fadec6cbc24a2721eb27abf0e2b563f835a7b9", "rc": {"bp": "An engineer has photos of a physical scene and wants to recover what the material is (shiny metal? rough plastic?), where the lights are, and how bright they are. This inverse rendering problem is central to digital fabrication, scene relighting, and model conversion.", "wh": "Inverse rendering is notoriously ill-posed and brittle: changing lighting and material in opposite ways can produce identical images, so there's ambiguity. Standard gradient-based inverse rendering is also high-variance—noisy—because you're differentiating through a monte carlo renderer, and mixing high variance with numerical instability often fails.", "ap": "This paper revisits radiance caching (storing precomputed light values at points in the scene) but uses it differently: they introduce a spatial blending field that locally interpolates between cached smooth estimates and unbiased Monte Carlo estimates. The blended estimates are more stable for gradients. They derive a family of strategies and consistency losses from this idea and find the most effective combination.", "ww": "Gradients computed from high-variance estimates are themselves noisy and misleading. A radiance cache provides low-variance estimates locally, which have stable, meaningful gradients; blending it with unbiased estimates maintains correctness while reducing variance. The spatial blending learns which regions need smoothing.", "po": "Material and lighting recovery is now more robust and faster, and can recover material properties even when lighting is ambiguous—something prior methods couldn't do. This enables reliable inverse rendering in practice, making it a standard tool for 3D content creation and digitization."}}, {"t": "Differentiable Neutron Transport", "th": "differentiable simulation", "m": ["differentiable rendering", "monte carlo", "automatic differentiation", "inverse design"], "pr": "Inverse problems in neutron transport remain extremely challenging despite shared foundation with rendering", "ap": "Extend differentiable rendering to multi-energy neutron transport via automatic differentiation of Monte Carlo", "co": "Gradient-based optimization for nuclear shielding design, sensitivity analysis, and sensor shape optimization", "u": "https://www.semanticscholar.org/paper/e27308b51ccad73345d687f83720475510ac6880", "rc": {"bp": "Nuclear engineers need to design shields and systems that protect from dangerous radiation, and they need to understand how small changes in materials affect that protection. Normally, testing these designs requires expensive computation or real-world experiments. This paper brings a technique from computer graphics—one that solves the opposite problem (inferring scene properties from images)—to solve the inverse problem in nuclear systems: instead of simulating the neutron paths and asking where they go, we ask: what materials or shield shape do we need to achieve a desired outcome?", "wh": "The math that governs neutrons bouncing through a system is the same math that governs light bouncing through fog or fire in a rendered image, but nuclear engineers have not been using the graphics advances that solve inverse problems. Normally, changing a design and re-simulating from scratch is slow. What makes this hard is computing the sensitivity—understanding how a tiny change in shielding material affects the final answer—without re-simulating the whole thing.", "ap": "The team generalized the automatic differentiation of light transport simulations to handle neutrons at different energies, proposed a simpler way to track where surfaces move, and created new ways to estimate how the answer changes with respect to material properties. They then used these gradients to optimize shield geometry, analyze which materials matter most, and design sensor shapes.", "ww": "When you render light through fog, you can compute gradients (sensitivities) using calculus through random sampling—the same trick that lets computer graphics optimize scene properties from photos works for neutrons. By adapting this technique to multi-energy neutrons and handling moving boundaries smartly, the gradients become cheap to compute. Once you have gradients, you can use the same optimization algorithms that work in graphics to automatically find good shield designs.", "po": "Instead of trial-and-error or expensive full re-simulations, engineers can now use gradient-based optimization to design shields and understand sensitivity—the same fast, principled approach that works in computer graphics rendering."}}, {"t": "Manifold k-NN: Accelerated k-NN Queries for Manifold Point Clouds", "th": "spatial search acceleration", "m": ["dynamic programming", "voronoi diagrams", "manifold-aware", "nearest neighbor"], "pr": "Standard k-NN structures like kd-trees fail to exploit intrinsic low-dimensional structure of manifold data", "ap": "Generalize dynamic programming nearest neighbor search to support arbitrary k-NN via recursive refinement of Voronoi cells", "co": "1-10x speedup for manifold-aligned k-NN queries and support for dynamic prefix queries", "u": "https://www.semanticscholar.org/paper/e305d9e1418bfe8263955a39e34963ba224cf138", "rc": {"bp": "Finding the nearest neighbors to a point—the closest points in a cloud—is a fundamental operation in geometry processing, used to detect surfaces, smooth shapes, and build algorithms that understand 3D structure. For points sampled from a smooth surface in 3D space, the cloud often lies on an invisible low-dimensional 'manifold' (a wrinkled 2D surface embedded in 3D), and conventional search structures do not exploit this structure, wasting time searching where no points exist.", "wh": "Standard tree-based search structures like kd-trees divide space uniformly and do not know that the points lie on a thin surface. Worse, most fast neighbor-search methods only find the single nearest neighbor, but many applications need the k-nearest neighbors—the closest several points. Existing faster algorithms that use clever geometry tricks are limited to k=1, so there is tension between speed and flexibility.", "ap": "The paper generalizes the dynamic-programming neighbor search to support any value of k by recursively building on the insight that the k-th nearest neighbor must lie in a predictable set of candidates. This lets the algorithm narrow down possibilities faster than a standard tree.", "ww": "If point p1 is your nearest neighbor, then the second-nearest must be either in the points before p1 in your sorted order or in p1's 'successor list' (a pre-computed set of candidates). By recursively applying this logic, you can skip huge regions of space and avoid checking points that cannot possibly be in your k-nearest set. Manifold-aware structure exploits the fact that points cluster on a surface, so most of space is empty.", "po": "The method is 1–10 times faster than conventional trees when searching for k nearest neighbors in manifold-aligned point clouds, and it naturally supports dynamic queries (finding neighbors within a changing subset), making it practical for real-time geometry processing."}}, {"t": "Explicit flows for implicit surfaces", "th": "shape deformation flow", "m": ["invertible neural networks", "implicit surfaces", "flow matching", "shape morphing"], "pr": "Shape deformation often requires intricate advection schemes without explicit evaluation at arbitrary times", "ap": "Use invertible neural networks to parameterize implicit surface deformation as explicit flow", "co": "Direct flow-based shape morphing, editing, and pairwise-to-any transformations via flow composition", "u": "https://www.semanticscholar.org/paper/e5978ce756dda6677833578b990fd01bcb2d04df", "rc": {"bp": "When animators morph one 3D shape into another (for a creature transforming, a face changing expression, or a character's pose shifting), they need a smooth, natural sequence of intermediate shapes. The deformation must respect the shape's interior volume, not just the surface, and ideally you should be able to query the shape at any moment in time without computing the entire sequence.", "wh": "Most deformation methods require you to step through time or interpolate between keyframes, and many only work well with explicit surface geometry. Implicit surfaces (defined by a function that gives 'inside' or 'outside' at any point) are better for morphing because they handle both surface and interior naturally, but they make it hard to have an explicit formula for the deformation at any time and place.", "ap": "The team uses invertible neural networks to construct a time-parameterized deformation flow for shapes defined implicitly. The invertibility ensures the deformation is a bijection (one-to-one mapping), and neural networks learn the flow from data. They apply this to morphing, editing, and multi-pair transformations where you compute a morphing to a central shape and compose flows to get morphings between any two shapes.", "ww": "A 'flow' is a mathematical concept where every point moves along a path without crossing other paths—like fluid flow where particles never collide. If you parameterize the deformation as a flow, you guarantee it is physically valid. By using invertible neural networks (networks where you can run them backward as easily as forward), you ensure that the transformation is indeed a valid flow, and you can analytically compute gradients that help keep the shape geometrically clean.", "po": "You get an explicit, queryable formula for shape deformation at any time and location without costly advection or interpolation, and the method handles complex pairwise-to-many morphings by composing flows, which is elegant and efficient."}}, {"t": "A Precision Controlled Surface-Surface Intersection Algorithm for NURBS", "th": "surface intersection", "m": ["nurbs", "hausdorff distance", "convex hulls", "curve fitting"], "pr": "Surface-surface intersection precision control impacts watertightness, meshing, and CAE accuracy for NURBS", "ap": "A priori precision control via Lipschitz continuity, convex hulls, and Hausdorff distance constraints", "co": "Superior precision and robustness over commercial/open-source kernels with categorized intersection processing", "u": "https://www.semanticscholar.org/paper/e6dcf3c2b435e9d025a9f45842622a933b90160a", "rc": {"bp": "When two 3D surfaces pass through each other (common in CAD design, 3D printing, mesh generation, and engineering simulations), you need to find the curve where they intersect precisely. If the intersection curve is wrong, manufactured parts will not fit together, simulations will diverge, or 3D prints will have gaps or overlaps.", "wh": "The most widely used surface description in CAD is NURBS (a mathematical formula for smooth surfaces). Computing where two NURBS surfaces intersect is not straightforward—you must solve equations numerically, and the answer depends on how much precision you accept. Too coarse and parts fail; too fine and the algorithm becomes impractical.", "ap": "The method leverages Lipschitz bounds and convex hulls to guarantee a maximum error in the intersection curve (Hausdorff distance), then uses a novel curve-fitting approach to measure and control the error of the final fitted curve. A fast bounding-box computation and normal-range analysis sort intersection types upfront.", "ww": "The paper uses two geometric properties: Lipschitz continuity (roughly, a bound on how fast the surface changes) and convex hulls (the smallest box containing a surface patch). These bounds let you control the maximum distance between the computed polyline (piecewise-linear approximation) and the true intersection curve. By analyzing the surface normals, you can determine whether intersections exist and what type they are, which lets you handle different cases efficiently.", "po": "The result is a certified precision control on surface-surface intersections for NURBS—the algorithm delivers an explicit guarantee on accuracy before you run it, and outperforms commercial and open-source kernels in precision, speed, and robustness."}}, {"t": "DiffSurFlow: Efficient and Robust Differentiable Fluid Optimization via Surrogate Strategy on Flow Map", "th": "differentiable fluids", "m": ["adjoint method", "flow map", "surrogate gradient", "physics-informed optimization"], "pr": "Full-gradient backpropagation in differentiable fluids is computationally expensive over long horizons", "ap": "Surrogate gradient method leveraging flow map structure to retain critical gradient highways", "co": "Significant speedups and memory reductions while maintaining near-identical gradients vs full backward pass", "u": "https://www.semanticscholar.org/paper/eb1f1a0a63b923ff57e67dfc7804fa28b2cf2f09", "rc": {"bp": "Animating fluids in computer graphics and optimizing fluid-based designs in engineering requires simulating how fluids flow over time. To optimize (for example, shape a pipe so fluid flows efficiently, or craft a scene where splashing looks dramatic), you need gradients—information about how changing the shape or parameters affects the motion—but simulating backward through long, chaotic fluid motion is computationally painful.", "wh": "The paper observes that within the flow map (the transformation that takes a particle's position at one time to its position at the next), there are dominant gradient pathways that carry sensitivity across many time steps with high fidelity. The method designs a 'surrogate' gradient model that keeps these critical long-horizon connections but prunes the redundant, low-impact backward computations, saving memory and time while maintaining gradient accuracy.", "ap": "The team identifies which adjoint (backward) computations matter most using the flow map structure, discards the rest in a physics-informed way, and integrates this with tailored acceleration techniques. This creates a sparse backpropagation that preserves accuracy while cutting computation and memory.", "ww": "", "po": "Fluid optimization becomes significantly faster and more memory-efficient, enabling long-horizon fluid simulations with rich, turbulent motion to be optimized automatically—something difficult with standard full-backward methods."}}, {"t": "Single-View Holographic Volumetric 3D Printing with Coupled Differentiable Wave-Optical and Photochemical Optimization", "th": "holographic fabrication", "m": ["wave optics", "photochemistry", "differentiable optimization", "phase holograms"], "pr": "Volumetric 3D printing micro-scale fidelity challenged by complex optical diffraction and chemical effects", "ap": "Couple differentiable wave-optical forward model with photochemical model capturing inhibitor diffusion", "co": "Hologram synthesis achieving ~10 micron lateral resolution via pre-compensating for chemical blur", "u": "https://www.semanticscholar.org/paper/eb2f235fee81221bdc09039127ba64dbb7bb4930", "rc": {"bp": "3D printing usually builds objects layer by layer, which is slow. Volumetric additive manufacturing aims to harden an entire 3D volume at once using light and chemistry, potentially printing complex shapes in seconds. Achieving fine detail (10 micrometers or finer) requires precise control of where light hits and how the chemistry responds, and that requires solving an inverse problem: given a desired shape, what hologram (light pattern) do you project?", "wh": "Light diffracts—it bends around edges—making the projected pattern not match the desired shape exactly. Additionally, the liquid resin does not harden instantly; inhibitor chemicals diffuse, blur the boundary, and further obscure the pattern. Optimizing the hologram naively only accounts for light optics and ignores the chemistry, leading to blurry prints.", "ap": "The team formulates hologram synthesis as coupled inverse problem: they build a differentiable model of wave-optical diffraction and a simplified photochemical model capturing inhibitor diffusion and nonlinear dose response. They then optimize the hologram sequence to minimize the discrepancy between the predicted hardened shape and the desired shape.", "ww": "By modeling both the wave optics (how light diffracts) and the photochemistry (how inhibitor spreads and how resin hardens nonlinearly), you can predict the final hardened shape more accurately. This allows you to pre-compensate in the hologram—designing the light pattern to overshoot in places where chemistry will blur it, so the final result matches the target shape.", "po": "Single-view holographic 3D printing can now achieve finer detail (10 micrometers) in seconds by compensating for both optical and chemical blur, enabling volumetric manufacturing of small, high-fidelity parts."}}, {"t": "HumanFlow: Controllable Human Image Generation via Flow Matching", "th": "human image synthesis", "m": ["flow matching", "diffusion models", "control networks", "topology constraints"], "pr": "Balancing high visual fidelity with strict human-centric control in controllable image generation remains challenging", "ap": "Unified flow-matching framework with Control Encoder, Token-ControlNet, and Human Topology Consistency Loss", "co": "High-fidelity controllable full-body human image generation with structural topology constraints", "u": "https://www.semanticscholar.org/paper/ec578747b0444c4831ec1c10fdc99ac35e52909c", "rc": {"bp": "Generating realistic images of people in different poses, clothing, and settings is valuable for fashion, film, virtual characters, and social media. Users want fine control—they can specify a pose skeleton, clothing style, or body shape—while maintaining high visual quality. The challenge is reconciling strict control constraints with visual realism, because controlling a human strictly often breaks the naturalness of the image.", "wh": "Neural generative models (like diffusion models) can produce realistic human images, but they typically learn mappings from one input type to one output type. Using separate models for different control conditions wastes parameters and does not leverage cross-modal dependencies—the fact that pose and clothing appearance are related. A unified model must learn to accept diverse control inputs and still preserve the statistical patterns of how humans actually look.", "ap": "HumanFlow uses a flow-matching framework (a smooth generative process) with three innovations: Stochastic Condition Masking to train omni-directional generation, Decoupled Gated LoRA to attach per-modality adapters, and Human Topology Consistency Loss to enforce anatomical realism. A large-scale dataset (MiCoGen) of over one million full-body images supports training.", "ww": "By randomly masking different modalities (inputs) during training—sometimes treating pose as the control and cloth as the target, sometimes vice versa—the model learns flexible, bidirectional generation. A lightweight adapter (ControlNet) per modality keeps the core model's strong prior intact. Constraining the generated skeleton to obey realistic joint angles and bone ratios ensures the person looks anatomically plausible.", "po": "The result is high-fidelity, controllable human image generation—users specify pose, clothing, or body shape and get photorealistic results that obey the control while maintaining natural anatomy and visual quality."}}, {"t": "Efficient Multiscale Lanczos Eigenpair Extraction", "th": "eigenvalue computation", "m": ["lanczos iteration", "multigrid", "linear algebra", "spectral methods"], "pr": "Standard Lanczos eigenpair extraction lacks convergence speed and robustness for large-scale geometry problems", "ap": "Extend implicitly restarted Lanczos with multigrid acceleration to improve convergence", "co": "Enhanced convergence speed and robustness for eigenpair extraction in geometry processing applications", "u": "https://www.semanticscholar.org/paper/ee77dd23bb7c6f27cadeab8d3b76b6920202f129", "rc": {"bp": "Many geometry and graphics algorithms need to find the principal directions of a surface (its 'eigenvectors') or the natural frequencies of a vibrating shape (also eigenvectors). These eigenpair extractions are expensive for large problems, and existing libraries like ARPACK are slow or fail to converge on some practical cases.", "wh": "For very large problems, even the best existing libraries (based on implicitly restarted Lanczos iteration) struggle with convergence speed and robustness. There is no easy way to accelerate them for geometric problems where the underlying structure has a natural multi-scale hierarchy (coarse and fine detail).", "ap": "The paper adds a multigrid extension to the implicitly restarted Lanczos method, letting it solve on coarser versions of the problem and feed the solution back to the fine level for faster convergence.", "ww": "Multigrid methods are a classical technique in numerical computing: solve the problem on a coarse grid first to get a rough answer, then use that to warm-start the fine-grid solver, greatly accelerating convergence. By layering a multigrid strategy on top of Lanczos iteration, you combine the best of both approaches—Lanczos efficiency with multigrid acceleration.", "po": "Eigenvalue computations for large geometry processing problems converge faster and more robustly, making algorithms that depend on eigenanalysis (like shape deformation, modal analysis, or spectral methods) practical for bigger datasets."}}, {"t": "High-Fidelity 4D Cloth Capture Pipeline with a Two-Level Pattern", "th": "cloth motion capture", "m": ["marker tracking", "photogrammetry", "physics simulation", "mesh optimization"], "pr": "High-fidelity cloth capture requires resolving fine wrinkles, large deformation, and self-occlusion simultaneously", "ap": "Two-level marker pattern with physics-based optimization deforming template to match captured geometry", "co": "1 mm spatial resolution 4D cloth capture with temporal coherence via keypoint triangulation and mesh deformation", "u": "https://www.semanticscholar.org/paper/f291a09eba5ca150836e36cc20003193d431eded", "rc": {"bp": "Capturing how cloth moves—wrinkles, folds, and self-contact—at high spatial resolution is essential for realistic character animation, cloth simulation validation, and digital fashion. A 1 millimeter spatial resolution reveals fine wrinkles that make cloth look convincing, but achieving this with cameras is challenging because cloth can self-occlude (fold over itself) and deforms dramatically.", "wh": "Cloth has fine-scale features (wrinkles are millimeters wide), self-occludes frequently, and can move fast. Standard marker-based capture uses uniform markers, making it hard to localize sub-pixel positions and identify occluded regions. High-fidelity 4D capture would normally require many cameras or sophisticated depth imaging.", "ap": "The system uses only 16 RGB cameras and a two-level marker pattern (coarse control markers + dense noise for precision). Markers are detected, unwarped to remove perspective, localized at sub-pixel precision, and triangulated across views. A physics-based mesh deformation then fits a template to the point cloud while maintaining physical plausibility.", "ww": "A clever two-level marker design solves this: large, colored L-shaped markers are easy to detect robustly and reveal orientation, while dense noise patterns inside each marker provide sub-pixel precision and marker identity. By 'unwarping' detected markers to a canonical frame, perspective distortion and most deformation are removed, allowing the localization algorithm to achieve sub-pixel accuracy. Physics-based optimization then deforms a template mesh to match captured points while enforcing penetration-free constraints.", "po": "Cloth motion can be captured at 1 millimeter resolution with just 16 cameras, revealing fine wrinkles and folds even during complex self-contact, enabling high-fidelity cloth animation and simulation validation."}}, {"t": "Subgrid Marching Tetrahedra", "th": "mesh reconstruction", "m": ["marching tetrahedra", "normal coordinates", "topology", "contouring"], "pr": "Classic marching schemes cannot capture arbitrarily many surface patches per cell or thin sheet details", "ap": "Generalize normal coordinates from topology to encode surface connectivity via integer intersection counts", "co": "Manifold intersection-free meshes capturing fine features and thin sheets without geometric orientation requirements", "u": "https://www.semanticscholar.org/paper/f3992af7251e65e527f5ada79e32f0a1a96d722c", "rc": {"bp": "Converting a continuous mathematical surface into a triangle mesh (a polygonal approximation) is a fundamental operation in computer graphics, CAD, simulation, and 3D printing. Existing algorithms like marching cubes work well when the surface is smooth, but they struggle with multiple surfaces inside one cell, thin sheets, and surfaces with boundaries (not enclosed volumes).", "wh": "Marching cubes assumes one simple surface patch per cell and expects clear inside/outside orientation. Many real-world problems have multiple surfaces (a wire thinner than a cell, complex branching geometry) inside a single cell. The Nyquist-Shannon theorem suggests features smaller than the cell cannot be resolved, yet fine features do need to be captured to avoid over-simplification.", "ap": "Subgrid marching generalizes marching cubes by using normal coordinates to represent surface topology. Each cell is processed independently, but the encoding allows arbitrarily many surfaces and fine features within a cell. The result is a conforming mesh that respects boundaries across tet (tetrahedron) grid lines.", "ww": "Using 'normal coordinates' from topology, you can encode surface connectivity as integer intersection counts along each grid edge—how many times the surface crosses. This sidesteps the Nyquist limit because you encode topology (connectivity), not geometry (positions), which can be arbitrarily fine. Multiple surfaces per cell are handled naturally because the intersection counts encode all the topology, and cells process independently while remaining conforming (connected) across boundaries.", "po": "Meshes produced by subgrid marching are far more accurate than classic marching cubes for the same grid resolution, capture thin features and fine details, and handle surfaces with boundaries and non-manifold geometry—enabling better conversion of implicit surfaces, polygon soup, and other difficult inputs to clean meshes."}}, {"t": "Points as Tori: Fast Pointwise Signed Distance for Point Clouds", "th": "signed distance fields", "m": ["implicit surfaces", "tori fitting", "neural networks", "winding numbers"], "pr": "Computing signed distance to point clouds requires costly global optimization or spatial discretization", "ap": "Locally fit point clouds with tori using pre-trained network for curvature and shift parameters", "co": "Fast analytical signed distance parameterization enabling reconstruction, offsets, and Boolean operations on point clouds", "u": "https://www.semanticscholar.org/paper/f458cfecdac341fec619c09195ecd5c9236c8362", "rc": {"bp": "When you have a cloud of 3D points (from photos, 3D scanning, or synthetic renderers), you often want to query the signed distance at any location: how far is a point from the surface, and is it inside or outside? Signed distance fields power morphological operations (offsets, shrinking), Boolean operations (union, intersection), and shape visualization. Computing this efficiently without storing a dense grid is valuable.", "wh": "Point clouds do not explicitly define a surface—you must infer it from the points and normals. Standard approaches either require a costly global optimization step or discretize space into a dense grid (memory-intensive). You need a method that is fast, requires no optimization, and works at arbitrary spatial resolution.", "ap": "The method fits tori locally to point clouds using a neural network that predicts curvature and shift parameters feed-forward. Each point's torus contributes an analytical signed distance function. The method works directly without explicit surface reconstruction.", "ww": "A torus (donut) has a closed-form, analytical formula for signed distance at any point—you just plug in coordinates and get the answer. By fitting a torus locally to each point in the cloud (using a learned neural network to predict per-point curvature and offset), you inherit the torus's analytical distance function. This is parallelizable, requires no global solve, and connects to classical reconstruction theory (winding numbers and Poisson reconstruction) which validates the mathematical foundation.", "po": "Signed distance to arbitrary point clouds (from photos, 3D Gaussians, neural fields) can be queried at any spatial resolution instantly, enabling direct applications like surface offsetting, Boolean operations, and visualization without computing an explicit mesh."}}, {"t": "UniVidX: A Unified Multimodal Framework for Versatile Video Generation via Diffusion Priors", "th": "video diffusion generation", "m": ["diffusion models", "lora", "multimodal", "conditional generation"], "pr": "Existing video diffusion approaches train separate models per task, ignoring joint multimodal correlations", "ap": "Unified framework with Stochastic Condition Masking, Decoupled Gated LoRA, and Cross-Modal Self-Attention", "co": "Versatile multimodal video generation with preserved VDM priors and cross-modal consistency", "u": "https://www.semanticscholar.org/paper/f479dc5ff16c10a6dd3d2f8ab10497f3f97b8c65", "rc": {"bp": "Video generation models can produce realistic video from text or other prompts, but controlling the output—specifying exactly what the video should look like—is difficult. One video model per task (one for pose control, one for semantic segmentation guidance, etc.) wastes capacity. A unified model that accepts diverse control inputs and produces videos under all of them would be more flexible and efficient.", "wh": "Video diffusion models (the generative engine) have strong priors from being trained on large video corpora, but adapting them to many control modalities without losing those priors is hard. If you train separate models, you lock in fixed input-output mappings and ignore correlations between modalities (the fact that pose and appearance are linked).", "ap": "UniVidX formulates diverse video tasks as conditional generation via three mechanisms: Stochastic Condition Masking for omni-directional learning, Decoupled Gated LoRA for modality-specific adapters, and Cross-Modal Self-Attention for information sharing. Each modality has its own LoRA that activates when that modality is the generation target.", "ww": "By randomly shuffling which modalities are controls vs. targets during training (sometimes depth controls the generation, sometimes a text prompt does), the model learns flexible, bidirectional mapping. Lightweight per-modality adapters (LoRAs) preserve the core model's prior. Cross-modal attention (sharing information between modalities during generation) ensures consistency—details from all modalities are considered when generating each frame.", "po": "A single model can handle many video generation tasks (pose-guided, semantic-guided, sketch-to-video, etc.) with cross-modal consistency, avoiding the need to train separate models for each condition."}}, {"t": "Feature-Preserving Offset Meshing", "th": "offset mesh generation", "m": ["mesh processing", "feature preservation", "geometric algorithms", "offset surfaces"], "pr": "Existing offset meshing focuses on constant-radius offsets and lacks sharp feature preservation", "ap": "Explicitly generate offset vertices and triangles with feature-capturing energy and mitered offset support", "co": "First method supporting mitered offsets with sharp feature preservation on clean and dirty meshes", "u": "https://www.semanticscholar.org/paper/f4be3b9b0d8020a944b034b931a9aace7b9a0755", "rc": {"bp": "Creating an offset (a parallel copy at a fixed distance) of a 3D surface is useful for manufacturing (wall thickness, structural reinforcement), mechanical design (clearance checking), and shape processing. When surfaces have sharp edges or creases, a naive offset would round or distort them, but you want to preserve crisp features. Handling imperfect meshes (with holes, flipped normals, or self-intersections) is also real-world necessary.", "wh": "Standard constant-radius offsetting does not preserve sharp edges—they round off or disappear. Adding 'mitered' offsets (which preserve sharp angles) is complex and becomes even harder when meshes are imperfect. Prior methods focus on clean meshes and give up on dirty ones or sacrifice fea
