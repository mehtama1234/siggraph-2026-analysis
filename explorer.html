equency space; etching at the right frequencies keeps them from interfering. Encoding only the real part of the phase reduces the required etch depth while retaining enough phase modulation.", "po": "A single transparent surface now displays full-color 3D images with improved brightness compared to previous methods. This \"invisible holographic window\" paves the way for practical AR glasses or displays that overlay 3D content onto the real world without requiring multiple layers or sacrificing see-through transmission."}}, {"t": "Floating-Point Robustness in Parametric Surface Continuous Collision Detection: From Algorithm to Benchmarking", "th": "collision detection", "m": ["continuous collision detection", "robustness analysis", "benchmarking"], "pr": "Ensuring floating-point robustness for parametric surface collision detection remains open", "ap": "Time-dependent inclusion-based method with error decomposition and rational arithmetic benchmarking", "co": "First floating-point robust CCD framework for parametric surfaces with rigorous validation", "u": "https://www.semanticscholar.org/paper/5a1feaca6f1cceccd8126cda4a02b4966cda85cd", "rc": {"bp": "When you simulate or fabricate an object described by smooth curved surfaces (like a NURBS surface used in CAD), collision detection must catch when two surfaces touch or intersect. Standard robust collision detection works well for polygonal meshes (made of flat triangles) but curves introduce subtle edge cases where tiny numerical errors in floating-point arithmetic lead to missed collisions or false positives.", "wh": "Parametric surfaces like NURBS are defined by equations, not discrete points, so geometric tests—\"do these surfaces intersect?\"—involve solving polynomial equations to high precision. Floating-point arithmetic introduces two types of error: coefficient error (the input surface coefficients have limited precision) and arithmetic error (rounding during calculations). Distinguishing between them and managing both is difficult; existing CCD methods either ignore the problem or use expensive symbolic computation.", "ap": "The authors present a floating-point-robust CCD framework built on the Time-Dependent Inclusion-Based Method (TDIBM). The key innovation is an error decomposition strategy that explicitly separates coefficient error from arithmetic rounding error, allowing the algorithm to make conservative ('safe') decisions about whether a collision truly occurred. To validate the method, they reverse-engineered a benchmark: starting from ground-truth collision scenarios, they generated exact datasets using rational arithmetic, then measured how well different algorithms recover the true collision events.", "ww": "By decomposing error sources, the algorithm can apply appropriate safety margins to each type of error independently. Coefficient error is unavoidable (surfaces are approximate); arithmetic error can be bounded by analyzing the floating-point operations in the algorithm. A conservative algorithm that may report \"collision\" when there is genuine uncertainty is better than silently missing real collisions. The synthetic benchmark (ground truth generated exactly, then corrupted) reveals algorithm failure modes clearly.", "po": "The method reliably detects collisions between curved surfaces in the presence of realistic floating-point errors, tested against a comprehensive benchmark of 5,468 models (the Thingi10K dataset). This closes a gap between robust mesh-based collision detection and the real needs of CAD, 3D printing, and animation with smooth surfaces."}}, {"t": "TOG 45(4) Editorial", "th": "conference editorial", "m": [], "pr": "SIGGRAPH 2026 conference editorial introduction to special issue", "ap": "Editorial documenting acceptance statistics and submissions overview", "co": "Context for 327 accepted papers from 1177 submissions across journal and conference tracks", "u": "https://www.semanticscholar.org/paper/5c910402755e8eea456ee759feb3f54fe791065c", "rc": {"bp": "This is the editorial introduction to the SIGGRAPH 2026 conference and associated journal issue. It provides context on the conference: submission statistics, acceptance rates, and organizational details. The editorial acknowledges the extraordinary volume of research (1177 submissions) and the expert committee that reviewed submissions across multiple categories.", "wh": "No technical challenge is posed in an editorial—it serves to introduce the collection and set scope. The note of interest is the scale: the conference received over a thousand submissions, indicating intense research activity in computer graphics, and the committee accepted roughly one in four, reflecting high selectivity.", "ap": "The editorial reports that 1177 complete submissions were received: 216 journal-only and 961 dual-track (eligible for both conference and journal publication). A committee of 111 experts accepted 327: 132 as journal papers (97 from the journal-only track, 35 from dual-track) and 195 as conference papers, yielding a 27% acceptance rate overall.", "ww": "The high acceptance rate (27% out of ~1200) reflects both the breadth of acceptable research in computer graphics and the quality bar set by the conference. The dual-track system allows researchers to aim for either venue (journal archival or conference presentation) or both, increasing flexibility.", "po": "This editorial contextualizes the SIGGRAPH 2026 conference as a major event showcasing 327 accepted research contributions across computer graphics—a representative snapshot of the field's activity and directions in 2026. The following papers in this batch and others across multiple batches are among those 327 contributions."}}, {"t": "Uniformly Deployable Kirigami on Arbitrary Planar Graphs", "th": "kirigami design", "m": ["computational geometry", "mechanical design", "graph theory"], "pr": "Designing deployable kirigami from arbitrary planar graphs lacks systematic framework", "ap": "Analytical framework deriving geometric constraints for uniform rigid deployability", "co": "Multiple distinct kirigami structures from same graph with full design space characterization", "u": "https://www.semanticscholar.org/paper/601f178d11bc45c62f2ccbb6f5fa35b2bd383a29", "rc": {"bp": "Kirigami—the art of paper cutting and folding—has inspired engineers and designers to create structures that fold and unfold in a controlled way. Imagine a flat piece of paper with cuts and hinges that, when opened, rigidly expands into a 3D shape. Such deployable structures have applications in aerospace (solar panels, antennas), medicine (stents), and robotics. The challenge is to design them systematically for arbitrary shapes, not just simple patterns.", "wh": "Most prior work focuses on specific restricted kirigami types—quadrilateral (four-sided) patterns or structures derived from graphs that split into two colors (like a checkerboard). These frameworks don't generalize to arbitrary graphs, especially those that can't be cleanly split into two groups. Additionally, even when deployability is possible, the full space of possible structures from a given graph, and their degrees of freedom, remains poorly understood.", "ap": "The authors introduce an analytical framework that derives kirigami structures directly from arbitrary planar graphs. The key is connecting graph topology (the connectivity of faces) to geometric constraints (how the faces must be sized and angled to fold rigidly). They show that multiple distinct kirigami structures can be generated from the same graph and provide explicit geometric conditions ensuring uniform rigid deployability—meaning every crease rotates by the same amount as every other crease.", "ww": "Planar graphs encode the combinatorial structure (which faces share edges); geometric constraints then ensure the faces can rotate together without deformation. By analyzing the degrees of freedom (how many independent angles can vary), the framework reveals that many graphs admit multiple distinct deployable designs, not just one. This gives designers a palette of options from a single logical structure.", "po": "Designers can now systematically explore and construct deployable kirigami from graphs representing virtually any planar configuration. The analytical approach reveals the full design space, including degrees of freedom for each structure, enabling targeted optimization for specific goals (minimize material, maximize range of motion, etc.). This moves kirigami from artisanal craft to a systematic design tool."}}, {"t": "Dual-Path Holographic Laser-Excited Volumetric Display", "th": "volumetric display", "m": ["laser rendering", "holography", "volumetric graphics"], "pr": "Volumetric displays require improved brightness and voxel density for practical applications", "ap": "Dual optical paths with femtosecond lasers and synchronized spatial light modulators", "co": "Centimeter-scale volumetric graphics with interactive performance under room lighting", "u": "https://www.semanticscholar.org/paper/614305ac112901da83cfab6fc904758e0a3cced3", "rc": {"bp": "Volumetric displays show 3D images floating in mid-air, viewable from all angles without glasses. Early attempts were dim or small; a new dual-laser approach aims to produce bright, room-scale volumetric graphics. The challenge is achieving sufficient brightness and voxel density (3D pixel density) so the image is crisp and visible under normal room lighting.", "wh": "Laser-excited volumetric displays work by focusing a laser beam at precise points inside a gas-filled chamber (xenon); the intense local heating causes the gas to emit light at that voxel. A single laser path, however, produces limited brightness because the signal from each voxel is weak and the laser must dwell briefly at each point. Building larger, brighter displays requires rethinking the architecture.", "ap": "The system uses two synchronized laser paths, each with a femtosecond laser, a spatial light modulator (which shapes the light beam), a 3D scanning module (galvanometer mirrors and varifocal lens to steer and focus the beam), and a xenon-filled chamber. Both paths render simultaneously into the same volume, effectively doubling the laser power and voxel density. Careful synchronization ensures the two paths don't interfere.", "ww": "Two independent laser paths rendering in parallel cooperatively increase brightness: more photons are deposited per unit time into the gas, producing brighter emission. Doubling the rendering resources roughly doubles the achievable brightness and voxel count. The varifocal lens (adjustable focus) allows sharp rendering at varying depths within the gas, improving image quality.", "po": "The system produces centimeter-scale volumetric graphics and animations bright enough to see under normal room lighting—a major step forward from prior laser volumetric displays. The authors demonstrated the prototype publicly at SIGGRAPH 2024 with interactive graphics, showing that practical, user-safe, visually compelling volumetric displays are now feasible."}}, {"t": "Thermal Non-Line-of-Sight Imaging through Rough Surfaces", "th": "computational imaging", "m": ["neural networks", "non line of sight", "thermal imaging"], "pr": "Reconstructing hidden scenes through rough surfaces suffers from severe spatial mixing", "ap": "Physics-embedded neural network estimating convolution kernels for light transport", "co": "Real-time thermal NLOS imaging through rough surfaces with relative depth estimation", "u": "https://www.semanticscholar.org/paper/638321a0651c4081c8d40831314ed64c119a0c56", "rc": {"bp": "Non-line-of-sight (NLOS) imaging uses light bouncing off an indirect relay (a rough wall) to 'see' hidden objects around a corner—useful for rescue missions and security. Thermal NLOS imaging uses heat radiation (infrared) instead of visible light, which penetrates dust and poor visibility. The challenge is reconstructing the hidden scene from noisy thermal measurements through rough, scattering surfaces.", "wh": "Rough surfaces (unlike shiny mirrors) scatter light and heat in complex ways. This scattering spreads signal from the hidden scene over a large area on the relay surface, and the inverse problem—recovering what the hidden scene looks like from relay measurements—becomes ill-posed and extremely sensitive to noise. Prior methods fail here because they assume relatively specular (mirror-like) reflection.", "ap": "NLOSFormer is a neural network that explicitly embeds physics. It models light transport as a convolution: the hidden scene, passed through the scattering relay, produces the measured pattern. The network estimates this convolution kernel directly from the thermal measurements, using it to guide reconstruction. A companion dataset (ThermalNLOS) supports training, and a novel data augmentation strategy reduces overfitting. The network outputs both the hidden scene and relative depth cues.", "ww": "By estimating the convolution kernel explicitly, the network narrows the solution space: it's not just learning \"any reconstruction\" but specifically one consistent with the measured light transport. The kernel acts as a learned model of how the rough surface scatters and mixes light; once estimated, it strongly constrains what reconstructions are plausible. Relative depth comes naturally from the model's understanding of how different distances map to the measurements.", "po": "The method reconstructs hidden scenes through rough thermal relay surfaces significantly better than prior work, even in real-time for dynamic targets. This advances thermal NLOS imaging from laboratory curiosity to practical tool for seeing around corners and through difficult visibility conditions—valuable for search-and-rescue and surveillance applications."}}, {"t": "A Unified Homogenization Framework for Straight- and Curved-Crease Origami Materials", "th": "origami materials", "m": ["homogenization", "simulation", "material modeling"], "pr": "Predicting macroscopic origami material properties from crease patterns remains challenging", "ap": "Simulation-based folding with numerical homogenization and Classical Laminate Theory", "co": "Unified framework for straight and curved crease materials revealing diverse behavior", "u": "https://www.semanticscholar.org/paper/63b649757fdc8b21479585f087d32f5e27f2267f", "rc": {"bp": "Origami—folded paper with crease patterns—can exhibit unusual mechanical properties. A sheet with the right crease pattern becomes stretchy in one direction and stiff in another, or lightweight yet strong. Designers want to predict and design these properties, but the link between the geometric crease pattern and the resulting material behavior is complex. Understanding it requires simulating the folding and measuring how forces transmit through the deformed structure.", "wh": "Crease geometry, the kinematics of how the paper folds at creases, and the elastic stretching of the sheet surface are all coupled. A straight crease behaves differently from a curved crease; the pattern's symmetry affects overall isotropy or anisotropy (uniformity in all directions vs. preferential directions). Predicting effective macroscopic stiffness and strength from crease patterns requires a computational framework that handles both the complex folding deformation and the multi-scale averaging from microscopic crease-scale to bulk material behavior.", "ap": "The authors introduce a computational framework that simulates folding of a detailed crease pattern, then applies numerical homogenization—a technique from materials science—to extract effective macroscopic properties. The framework accommodates both straight and curved creases by using a quadratic energy model (analogous to Classical Laminate Theory in composites) and a simplified crease plasticity model. They explore how pattern symmetries correlate with resulting material symmetries.", "ww": "Homogenization works by simulating the full detailed structure under load, measuring the average stress and strain, and extracting an effective stiffness—the continuum-level material property. Because origami folding has well-defined symmetries (rotational, reflective), the homogenized material inherits those symmetries, producing isotropic materials (same in all directions) or anisotropic ones (stiffer along certain axes). The energy-based framework unifies straight and curved creases despite their geometric differences.", "po": "The framework reveals a rich design space of origami materials spanning from perfectly isotropic (uniform properties in all directions) to highly anisotropic (vastly different along different directions). Designers can now predict how a chosen crease pattern maps to bulk properties like stiffness, enabling inverse design (\"find me a crease pattern with stiffness ratio X\") and exploration of metamaterial applications where natural materials don't offer sufficient variety."}}, {"t": "M-ABD: Scalable, Efficient, and Robust Multi-Affine-Body Dynamics", "th": "rigid body dynamics", "m": ["affine body dynamics", "corotational", "constraint enforcement", "specialized solvers"], "pr": "Simulating large-scale articulated assemblies with numerical stiffness and high DOF", "ap": "Linear kinematic mapping with affine body dynamics and corotational framework", "co": "Interactive simulation of hundreds of thousands of bodies via pre-factorized matrices", "u": "https://www.semanticscholar.org/paper/679616243fccddfcb544ef5f7b7c3c36a6fd73de", "rc": {"bp": "When you build a machine with gears, joints, and chains, or simulate crowds of characters interacting through rigid limbs, you need to compute how thousands or millions of connected pieces move over time. A simulation that runs at interactive speeds makes it possible to design robots, animate films, and build games where complex assemblies snap together and flex realistically. The core challenge is speed without sacrificing accuracy.", "wh": "Rigid body simulators traditionally struggle when many pieces are locked together through joints because the math becomes very stiff and complicated. Rotation is hard to represent smoothly—rotate an object mathematically and the equations become nonlinear, which makes solvers slow and unstable. When you also have hundreds of thousands of bodies coupled together, the sheer volume of numbers you need to crunch becomes prohibitive.", "ap": "Instead of tracking each body's position and orientation directly, this method uses an affine (linear-like) representation that simplifies the rotation problem. The key insight is that near-rigid objects, the material properties are similar enough that you can ignore their fine differences. This lets the method pre-compute the system matrices once at the start and reuse them throughout the entire simulation—like solving the same type of equation repeatedly rather than rebuilding it each frame. The forces and constraints flow through a compact space defined only by the actual joints, not every particle.", "ww": "By pre-computing the matrices and collapsing the problem into the minimal joint space, the solver avoids redundant work and numerical instability. The affine approach isolates the geometric twist from material variation, so the mathematics stays well-behaved even with large time steps and many bodies. Exact constraint enforcement means the joints never wobble or separate, which keeps the entire assembly coherent.", "po": "The paper shows simulations of hundreds of thousands of bodies running at interactive rates on a single CPU core—tasks that would typically require a cluster or expensive GPU. This enables real-time design iteration for mechanical systems and high-fidelity animation of complex articulated characters and rigid assemblies without the usual performance penalty."}}, {"t": "DMP: Directable Motion Retargeting through Motion Paraphrasing", "th": "motion retargeting", "m": ["diffusion", "motion paraphrasing", "masked inpainting", "loss guidance"], "pr": "Motion retargeting limits diversity, realism, and artistic control across character morphologies", "ap": "Diffusion-based motion paraphrasing with spatio-temporal constraints and masked inpainting", "co": "Diverse, controllable motion retargeting via diffusion priors and flexible constraint specification", "u": "https://www.semanticscholar.org/paper/6938da28aa6dfd43689ec786caa5fd1777c8b323", "rc": {"bp": "Motion capture is the gold standard for realistic human animation—actors wear sensors, their movements are recorded, and artists use those recordings to animate digital characters. But capturing unique, fresh motions for every character shape and performance is prohibitively expensive. Motion retargeting solves this by adapting existing captured motions to fit different body proportions and artistic intentions, letting one recording serve many purposes.", "wh": "The obvious approach—just map the joints from one body to another—produces stiff, lifeless results that lose the life and flow of the original performance. Existing retargeting methods force you to choose: either stick rigidly to the original motion (realistic but inflexible), or allow artistic freedom (creative but risking unrealistic limb contortions and joint distortions). There is no good way to let artists steer the outcome while maintaining believable human motion.", "ap": "This method treats motion retargeting as a paraphrasing problem, similar to rewording a sentence while keeping its meaning. A large-scale dataset captures the same semantic movement performed across many different body shapes, and a generative model learns both what stays constant (the core movement) and what varies (how different bodies express it). During animation, artists can add constraints—fix a hand's position, lock a foot to the ground, specify when to grab an object—and the model fills in the rest by learning from the dataset.", "ww": "By learning variations from real data, the model internalizes what realistic human motion looks like across body types. The semantic core of the movement is preserved because the model learned what variants of it remain recognizable. Constraints guide the generation without forcing unnatural poses because the model knows the boundaries of plausible motion.", "po": "Artists can now retarget motion to diverse characters and situations in a single workflow—short to tall, different body shapes, different actions—while maintaining realism and keeping full creative control. The framework handles complex interactions like grabbing objects or reacting to the environment, which standard retargeting ignores."}}, {"t": "BodyReLux: Temporally Consistent Full-Body Video Relighting", "th": "video relighting", "m": ["video diffusion", "token conditioning", "masked attention", "dynamic capture"], "pr": "Relighting full-body video while maintaining temporal consistency and photorealism", "ap": "Video diffusion with token-based lighting conditioning and masked attention control", "co": "Photorealistic temporally consistent human relighting from hybrid OLAT and dynamic capture", "u": "https://www.semanticscholar.org/paper/6bae9afcb76871594371fa7de47aeade03812629", "rc": {"bp": "In film and video production, relighting—changing how light falls on actors and environments after they've been filmed—is crucial for matching scenes, fixing technical problems, and achieving the director's vision. Doing this convincingly in video requires understanding how light bounces off skin, cloth, and hair in three dimensions while maintaining temporal consistency (the same surface shouldn't jump between lit and dark between frames).", "wh": "Video is the hardest case for relighting because you must preserve the exact shape and motion of the actor while plausibly recomputing how light hits and reflects from every surface, across thousands of frames, without flickering or losing detail. Simple approaches either blur out fine details (shadows, skin texture, hair strands) or introduce temporal flicker. Training on real video data is nearly impossible because filmmakers rarely shoot the same actor in the same pose under many different lighting conditions.", "ap": "The method captures a unique performer in many lighting conditions by using clever real-time capture: actors perform while two smoothly changing light sequences alternate so quickly that the human eye doesn't see strobing. This yields paired video frames—the same motion lit two different ways. A video diffusion model (a type of neural network trained to gradually refine noisy frames into sharp ones) learns from this data to predict how the same video should look under different lighting. Control comes through a lighting token system—each light is represented as a discrete unit—and masked attention allows smooth transitions between different light setups over time.", "ww": "Diffusion models naturally handle the complexity of human appearance (skin, hair, cloth, specularity) because they learn from real video. The pre-training on general text-to-video patterns gives the model strong priors about how things should look. Masked attention ensures continuity across time, so the model doesn't reinvent the surface geometry or texture between frames—it only redistributes light.", "po": "The result is photorealistic relighting of a specific person or actor that works for full-body performances in real time, with smooth control over arbitrary lighting setups. This dramatically speeds up post-production workflows and makes it possible to achieve creative lighting looks that were impossible to capture on set."}}, {"t": "A Real-time, Multiscale and Procedural Feather Appearance Model", "th": "appearance modeling", "m": ["procedural representation", "hierarchical encoding", "scattering model", "multiscale rendering"], "pr": "Realistic bird feather rendering requires high detail but impractical memory and computation", "ap": "Hierarchical procedural representation in UV domain with novel scattering model", "co": "Real-time feather rendering from single photo with minimal memory and high visual fidelity", "u": "https://www.semanticscholar.org/paper/6ebf9c0393cd550439edb0bb928b9c08e502bcf0", "rc": {"bp": "Feathers are everywhere in nature and animation—birds, fantasy creatures, clothing details—and they catch light in beautiful, complex ways. Rendering them realistically is essential for visual fidelity, but modeling each individual hair-like filament is computationally prohibitive. A practical feather model should be simple enough to use in real-time graphics but detailed enough to look like an actual feather under different light and viewing angles.", "wh": "Feathers have structure across many scales: a central shaft, barbs branching off it, and smaller barbules off each barb. The appearance depends on this hierarchy—you see both the overall shape and fine fiber details, plus self-shadowing where one barb blocks light from reaching another. Capturing all this geometry explicitly creates millions of triangles per feather. A simpler approach loses the delicate appearance and visual fluency that makes feathers recognizable.", "ap": "Given a single photograph of a real feather, the method extracts the overall outline and the central shaft, then reconstructs the barb and barbule details procedurally—using mathematical functions to generate fine structure on demand rather than storing it explicitly. The feathers are represented in a compact planar (unfolded) coordinate system. During rendering, the model computes how light scatters from fibers and how barbs shadow each other, plus a special sheen layer that captures the distinctive soft glow you see on fluffy feathers.", "ww": "Procedural generation scales beautifully—the same rule set generates consistent detail at any zoom level, and shading happens per-ray rather than per-triangle, so no explosion of geometry. The single-image input is practical; photographers always have feather images. The appearance model captures real physics: fibers scatter light in specific ways, and the hierarchy ensures that fine details contribute realistically to the overall look.", "po": "Feathers now render in real time using 0.02% of the memory that explicit geometry would require, with photorealistic appearance under arbitrary lighting. This makes feathered characters and creatures practical for games, films, and interactive applications without the traditional fidelity-versus-speed tradeoff."}}, {"t": "ATGS: Anchored Temporal Gaussian Splatting for Long Volumetric Video Representation", "th": "volumetric video", "m": ["gaussian splatting", "time-conditioned anchors", "temporal windowing", "multi-level features"], "pr": "Long volumetric videos suffer from temporal instability and motion complexity artifacts", "ap": "Time-conditioned anchors organizing Gaussians with temporal windowing strategy", "co": "Stable volumetric video reconstruction for long sequences with complex motions", "u": "https://www.semanticscholar.org/paper/71945117d6f400609038c5ea15ffba3d63c59c40", "rc": {"bp": "Volumetric video—capturing performers or scenes in full 3D from multiple camera angles and reconstructing them as free-viewpoint video—is the future of immersive media. It enables viewers to choose their perspective, move their heads in VR, and see the scene from any angle. The challenge is handling long performances (several minutes or longer) with complex movements while maintaining visual consistency and smooth motion.", "wh": "Existing volumetric video methods struggle with temporal stability because they track motion frame-by-frame. Over a long sequence, small errors accumulate, and the same person or surface flickers or drifts between frames. Representing motion directly with individual primitives (like tiny spheres of light called Gaussians) is inherently unstable over long time ranges—tracking a tiny detail through hundreds of frames is error-prone. Scalability is also poor; systems need to process huge amounts of time and spatial data.", "ap": "Instead of tracking individual Gaussians through time independently, the method anchors them to time-dependent spatial reference points that move predictably. These anchors are like temporary \"hooks\" that constrain where Gaussians can appear and move, which drastically simplifies the tracking problem. Only the anchors relevant to a specific time frame are activated, reducing computational load. A multi-level feature representation captures global patterns, local spatial fine detail, and local temporal smoothness, constraining how Gaussians are generated frame by frame.", "ww": "Anchors reduce long-range tracking to local, short-term problems, which are much more stable. The coarse-to-fine hierarchy ensures that gross motion is correct first, then details refine within that stable skeleton. Temporal windowing means you only compute what you need, eliminating wasted effort on irrelevant frames.", "po": "Long volumetric video sequences with dancers, actors, or complex interactions now stay temporally coherent without flickering or drifting. Scenes with fast, intricate motion (like martial arts or sports) render smoothly from any viewpoint, opening up immersive experiences that were previously impossible at this quality level."}}, {"t": "Tensor Decomposition-Based Four-dimensional Background-Oriented Schlieren Tomography for High-Speed, High-Fidelity Flow Field Reconstruction", "th": "flow reconstruction", "m": ["tensor decomposition", "neural networks", "ray tracing", "mixed-precision computing"], "pr": "Time-resolved flow field reconstruction from Schlieren tomography is memory and time expensive", "ap": "Tensor decomposition with neural networks and distortion correction optimization", "co": "Fast high-fidelity flow field reconstruction via tensor decomposition and ray tracing", "u": "https://www.semanticscholar.org/paper/72d01ad780c5d789ea664c3a49b28f1e51613b14", "rc": {"bp": "Understanding airflow and pressure around fast-moving objects—jets, missiles, wings, wind-tunnel tests—is critical for aerospace and automotive design. Schlieren tomography is an experimental technique that uses light distortion to visualize invisible air currents. Reconstructing the full 3D flow from 2D images is a classic inverse problem, and faster, more accurate reconstruction enables real-time feedback for designers and researchers.", "wh": "Flow fields are four-dimensional—three spatial dimensions plus time—and reconstructing them from 2D projections is mathematically underdetermined; many different 3D flows could produce the same images. The raw data from multiple camera angles is enormous and noisy, and small errors in interpreting distortions (bent light rays) accumulate into large reconstruction mistakes. Traditional methods are slow and require extensive pre-training.", "ap": "The method organizes all the spatial-temporal data into a four-dimensional tensor (a multi-dimensional array) and decomposes it into components using mathematical factorization. A lightweight neural network works alongside the decomposition to correct for distortions—it learns how light rays bend in an inhomogeneous flow and iteratively adjusts the reconstruction. The computation uses mixed precision (different numerical accuracies for different steps) to speed things up without losing critical precision.", "ww": "Tensor decomposition exploits the redundancy and structure in flow fields; similar flow patterns repeat spatially and over time. The neural network learns the physics of distortion directly from data rather than requiring hand-tuned models. Mixed precision keeps the computationally expensive parts fast while protecting the accuracy where it matters.", "po": "Reconstruction runs in 12.6 seconds per frame without pre-training, a major speedup that enables real-time or near-real-time flow visualization. This makes it practical for experimental scientists to adjust their tests on the fly and for engineers to iterate on designs based on live flow data."}}, {"t": "Spatiotemporal FLIP for Fast Free-Surface and Two-Phase Simulation With Very Large Time Steps", "th": "fluid simulation", "m": ["flip", "space-time sampling", "phase-field", "particle-grid methods"], "pr": "Large time steps in liquid simulation cause temporal aliasing and free-surface artifacts", "ap": "4D space-time particle sampling with separable kernels and phase-field weighting", "co": "Order-of-magnitude larger time steps in FLIP solvers preserving flow structures", "u": "https://www.semanticscholar.org/paper/72de78bc50217a495f56db9de532298725379e7b", "rc": {"bp": "Simulating water splashing, waves sloshing in a tank, or liquid interacting with air—two-phase flow—is essential for realistic animation and engineering analysis. The standard approach limits time steps to maintain stability, which means computing the same physics many times to advance just a few seconds of simulation. Larger time steps enable faster animation and design iteration.", "wh": "Hybrid solvers (part particles, part grid) are fast, but large time steps cause aliasing—when particles move far between frames, their sampling of the flow becomes coarse and jerky, producing visual artifacts like jagged surfaces or lost splash details. The longer you let particles move in a single step, the more information you lose about the fine structure of the flow.", "ap": "The method treats particles not just as points in 3D space but as samples in 4D space-time—the same particle position is jittered not only in 3D but also randomly shifted along the time axis. When particles deposit their density onto the grid, a 4D kernel (a mathematical weight function) spreads them smoothly across both space and time, producing a temporal average of particle contributions rather than a single snapshot. This is mathematically equivalent to a Monte Carlo estimate of integrated flow properties over the time interval.", "ww": "By integrating over time, the method naturally averages out the aliasing that comes from coarse temporal sampling. The time-slab integration means that even if a particle moves far in one step, its contribution is temporally smoothed, avoiding the jagged artifacts. The grid-collapse step ensures the method integrates seamlessly into existing solvers.", "po": "Time steps can be ten times larger than conventional methods allow, dramatically accelerating liquid simulations while preserving detailed splashes, waves, and flow structures. This makes real-time liquid animation practical and speeds up engineering simulations where time is a constraint."}}, {"t": "Fast and Accurate Gaussian Process Modelling of Real-World Materials", "th": "BRDF modeling", "m": ["gaussian process", "bayesian regression", "covariance kernels", "spherical harmonics"], "pr": "BRDF modeling requires both accuracy and computational efficiency for diverse materials", "ap": "Gaussian process regression with generalized distance kernel and factorization", "co": "Fast analytical BRDF representations with compact form and flexible accuracy", "u": "https://www.semanticscholar.org/paper/746d55da081851bf071478aa96d47055b9b4add1", "rc": {"bp": "Materials reflect light in complex, distinctive ways—brushed aluminum looks different from polished gold, and silk cloth differs from rough leather. Capturing and representing this appearance mathematically is crucial for photorealistic rendering and material design. A compact representation enables real-time rendering while a flexible one adapts to any material type.", "wh": "Traditional methods either require many samples per material (expensive to measure and store) or use rigid mathematical models that don't capture real-world complexity. Modern measurements produce high-dimensional data (viewing angle, illumination angle, wavelength), and standard interpolation methods either bloat the representation or smooth away important fine structure like specular peaks and anisotropic patterns.", "ap": "This method uses Bayesian regression with a Gaussian process—a statistical framework that treats the material's reflectivity as a smooth function and learns it from sparse samples. Instead of the usual Gaussian kernel, it uses a generalized distance covariance kernel specifically designed to preserve fine features in material appearance (like sharp specular highlights). The data is organized cleverly so that factorization dramatically reduces the dimensionality, making the computation tractable—fitting and rendering both reduce to matrix operations.", "ww": "Gaussian processes provide a principled uncertainty estimate; they know which regions of the material's properties are well-constrained and which are not. The custom kernel respects the structure of material appearance better than generic smoothing. Factorization exploits the inherent separability in material data (viewing angle decouples from illumination angle in certain coordinate systems), avoiding the full curse of dimensionality.", "po": "A complete BRDF representation fits in seconds rather than hours or days, is compact enough for real-time rendering, and adapts its complexity to match the material's actual complexity. The representation converts easily to standard rendering formats, making it plug-and-play for existing graphics pipelines. Different materials—isotropic brushed metals, anisotropic fabrics, pearls—all work uniformly."}}, {"t": "Inverse Rendering for Discrete X-Ray Computed Tomography", "th": "computed tomography", "m": ["inverse rendering", "gradient optimization", "volumetric loss", "material distributions"], "pr": "Discrete tomography becomes ill-posed with sparse or limited-angle X-ray projections", "ap": "Gradient-based volumetric optimization with probability distributions over materials", "co": "Inverse rendering approach surpasses SIRT/DART in sparse and limited-angle scenarios", "u": "https://www.semanticscholar.org/paper/74f38a1a0377c1cf80f97597dcfca5747960b501", "rc": {"bp": "Discrete X-ray tomography reconstructs what's inside an object—a cast iron engine block, an aluminum bracket, a composite material—by shooting X-rays through it at many angles and reconstructing the 3D composition from the 2D radiographs. When only a handful of angles are available (the practical, radiation-safe case), reconstruction becomes dramatically harder and ambiguous.", "wh": "With few images, many different internal structures could plausibly produce the same X-ray shadows. Standard tomography algorithms (SIRT, DART, TVR-DART) use handcrafted constraints and heuristics that work for simple cases but struggle with sparse or limited-angle data—they get stuck in local minima and produce artifacts. These methods also ignore subtle effects like X-rays scattering inside the object.", "ap": "This method treats the problem as inverse rendering: instead of simulating X-rays from a known object, it inverts the process. Each location in the 3D volume is represented as a probability distribution over the known materials (steel is likely here, air is likely there). The method minimizes a loss function by comparing predicted X-rays (computed by simulating rays through the probabilistic volume) to the measured X-rays. Gradients flow backward through the ray simulation, adjusting the material probabilities to fit the data better. It naturally incorporates scattering and works on GPUs.", "ww": "Gradient-based optimization is powerful and flexible—it can incorporate nonlinear effects like scattering that traditional methods ignore. The probabilistic formulation naturally handles uncertainty; regions with conflicting evidence become ambiguous (high entropy) rather than forced into one material. GPU parallelization makes the optimization tractable even with fine spatial resolution.", "po": "Reconstruction quality surpasses traditional methods, especially in sparse and limited-angle scenarios where ambiguity is highest. The method handles scattering and nonlinear effects that other approaches miss, and the probabilistic output tells you which reconstructed details are confident versus ambiguous—critical information for engineering decisions."}}, {"t": "The Antipodal Method: Fast, Accurate, and Robust 3D Generalized Winding Numbers", "th": "geometry processing", "m": ["winding numbers", "ray tracing", "boundary integrals", "spherical projection"], "pr": "Computing generalized winding numbers trades off accuracy versus computational efficiency", "ap": "Ray-surface intersection plus boundary integral formulation with efficient discretization", "co": "22X CPU speedup and 109 queries/second GPU throughput for precise winding numbers", "u": "https://www.semanticscholar.org/paper/78de1b1dbadf5036e2ed801d92b0b7f13931fb16", "rc": {"bp": "Determining whether a point is inside or outside a 3D shape is a fundamental operation in computer graphics, simulation, and manufacturing. You need it to check if an object has collided with something, to apply volume forces, to slice shapes in CAD software, or to prepare geometry for 3D printing. The method must work on any shape—open surfaces, self-intersecting meshes, tangled or non-manifold geometry—that real data contains.", "wh": "Ray casting dominates the cost; the new formulation reduces it dramatically by exploiting the sphere projection structure. The boundary integral component handles tricky cases (tangent intersections, small loops) that raw ray casting misses. Precomputation and GPU implementation reach billions of queries per second.", "ap": "This method expresses insidedness as the sum of two geometric quantities: the signed number of times a ray pierces the surface, and a boundary integral computed over the surface's projection onto a sphere surrounding the query point. The integral is rewritten to avoid expensive surface calculations—it becomes a 2D computation on the sphere projection instead. For meshes, this discretizes efficiently. For curved parametric surfaces, the method adapts the same principle with analytic precision.", "ww": "", "po": "Speedups of 22× on CPU and 109 queries per second on GPU make generalized winding numbers practical for real-time geometry processing, large-scale simulations, and interactive design. The same algorithm works uniformly on meshes and smooth surfaces, open and closed, manifold and non-manifold—solving a long-standing robustness problem."}}, {"t": "Stress-Aware Panelization of Freeform Surfaces", "th": "surface panelization", "m": ["surface flow", "stress analysis", "elastic shells", "shape optimization"], "pr": "Panelizing freeform surfaces requires balancing geometric fidelity and structural robustness", "ap": "Continuous surface flow coupled to stress analysis via creased elastic shells", "co": "Joint optimization of geometry and panelization for both aesthetic and structural goals", "u": "https://www.semanticscholar.org/paper/7a9194585ca321f9b7abd6e1291494c8940ea887", "rc": {"bp": "Architects design beautiful freeform surfaces—curved facades, flowing shells, undulating roofs—but actually building them is expensive because you can't cut them from flat sheet materials efficiently. The solution is panelization: approximating the freeform surface with an assembly of flat polygonal panels that can be cut from wood, metal, or glass and then assembled. The panels must fit the surface tightly and also support their own weight and external loads (snow, wind) without deforming or breaking.", "wh": "Panelization is a two-way fight: make the panels very small and flat-fitting, but the structure becomes expensive and complex; make them larger and simpler, and the deviation from the intended shape becomes visible. The structural requirements are global—a weak spot creates cascading stress concentrations that might require reinforcement far away. Solving panelization and structural optimization separately usually yields compromises; jointly optimizing both is hard because you have many combinatorial choices (which boundary vertices form a panel?) coupled to complex nonlinear stress analysis.", "ap": "The method formulates panelization as continuous surface flow where candidate panels are creased elastic shells (like origami). Rather than choosing panel edges discretely, the algorithm flows the surface toward an optimal panelization while simultaneously computing internal stresses. The objective function integrates an arbitrary stress-based measure (minimize peak stress, or spread stress evenly) over the shell. Gradients of this objective with respect to the surface shape enable gradient-based optimization, and terms in the flow encourage the result to stay close to the original design intent.", "ww": "Continuous flow converts the discrete combinatorial problem into a smooth optimization, enabling gradient methods. Creased shells can be analyzed as simple elastic structures, making stress computation and differentiation tractable. The integrated objective couples geometry and mechanics throughout optimization, so the algorithm never settles on a geometrically beautiful but structurally weak solution.", "po": "Panelizations are geometrically faithful to the original freeform design and structurally optimized for fabrication loads—no post-hoc reinforcement needed. The method accelerates architectural fabrication workflows and enables more ambitious freeform designs to be built cost-effectively."}}, {"t": "Untangling Surfaces via Shape and Mesh Repulsion", "th": "surface untangling", "m": ["energy minimization", "shape repulsion", "mesh penalties", "multi-level enforcement"], "pr": "Self-intersections in meshes break downstream simulation, fabrication, and learning pipelines", "ap": "Energy-based framework enforcing embeddedness at both shape and mesh levels", "co": "Reliable self-intersection removal via global shape and local mesh repulsion energies", "u": "https://www.semanticscholar.org/paper/7b7774a3773f8caf2fee47e5e4aebd86cc2af11e", "rc": {"bp": "Self-intersecting surfaces (where the surface pierces through itself) break downstream pipelines: physics simulations diverge, 3D printing fails, and machine learning models trained on valid geometry behave unexpectedly. Untangling surfaces—removing self-intersections while preserving the intended shape—is essential for cleaning up 3D scans, procedurally generated geometry, and artistic models.", "wh": "Self-intersections are global topological tangles, not local collisions; moving two vertices apart in one spot may create new intersections elsewhere. Local collision-response methods (push vertices away from each other) often just shift the problem. A true fix requires reasoning about the overall shape configuration simultaneously, which most methods don't do.", "ap": "This method defines two energies: a shape-level energy that penalizes global entanglement (measured in the continuous surface, independent of how finely it's tessellated), and a mesh-level energy that prevents local discrete interactions (triangles piercing through each other). Together, they enforce embeddedness—the geometric property that a surface doesn't self-intersect. The framework works on surfaces with boundary, non-manifold configurations, multi-object scenes, and handles cases where the surface has immersion failures (high curvature pathologies).", "ww": "The shape-level energy prevents the untangling from just shifting self-intersections rather than removing them; it's insensitive to mesh resolution, so coarse and fine meshes converge to the same shape. The mesh-level penalty catches local discrete issues that the shape-level energy might miss. Neither energy requires modifying the mesh connectivity, so the untangling respects the user's intended surface topology.", "po": "Complex self-tangled surfaces untangle reliably across varied geometry types and dataset challenges, enabling robust downstream processing. Scanned point clouds converted to mesh, procedurally generated shapes, and hand-sculpted models all now have a single, reliable untangling mechanism that preserves artistic intent while removing pathologies."}}, {"t": "Grow3D: Hierarchical Next-Scale Octree Prediction for Fast and High-Fidelity 3D Shape Generation", "th": "3D shape generation", "m": ["auto-regressive", "next-scale prediction", "vq-vae", "octree attention"], "pr": "3D shape generation via diffusion or auto-regressive models requires dozens of slow steps", "ap": "Next-scale prediction auto-regressive framework with VQ-VAE and octree attention", "co": "Fast high-quality 3D shape generation via coarse-to-fine octree structure prediction", "u": "https://www.semanticscholar.org/paper/7cb46f245cb3e124a0320d769417e8bb83021902", "rc": {"bp": "Generating diverse, high-quality 3D shapes on demand—furniture, tools, characters, creatures—is valuable for design, gaming, and storytelling. Existing generative models (diffusion and autoregressive) produce excellent results but require many generation steps, making them slow. Faster inference enables interactive design and real-time applications.", "wh": "Standard diffusion and autoregressive models generate the entire shape incrementally, which requires dozens to hundreds of steps. Recent work shows that next-scale prediction—generating coarser structures first, then refining them level by level—is faster and higher quality, but this works only for fixed-resolution grids. Real 3D data is often sparse (most of space is empty), so fixed grids waste computation on empty regions. Adaptive variable-length representations like sparse octrees are more efficient but incompatible with existing next-scale methods.", "ap": "This method encodes 3D shapes into a multiscale octree representation using a specialized compression network (VQ-VAE with residual serialization). An octree is a hierarchical tree where each level subdivides space more finely—like a zoom-in-and-refine view. A generative model then predicts the octree structure and geometry features level by level, from coarse to fine. The key innovation is an attention mechanism that understands octree structure and only attends to truly relevant features at each scale, avoiding wasted computation on empty or irrelevant branches.", "ww": "Octrees naturally compress sparse shapes, eliminating the resolution waste of fixed grids. Next-scale prediction is fast because each level is a small prediction task; coarse levels guide subsequent refinements. Octree-aware attention focuses computation where it matters, respecting the hierarchical structure rather than treating space uniformly.", "po": "High-quality 3D shapes generate in a small number of steps, orders of magnitude faster than standard diffusion or autoregressive models. This enables interactive shape creation, real-time game asset generation, and design workflows where artists iterate rapidly."}}, {"t": "A Robust and Efficient Intersection Algorithm for NURBS Surfaces: Handling Small Loops and Tangent Intersections", "th": "NURBS intersection", "m": ["winding number theory", "subdivision scheme", "vector field analysis", "topological detection"], "pr": "NURBS surface intersection fails on complex topology with small loops and tangencies", "ap": "Winding number theory combined with subdivision scheme for vector field detection", "co": "Robust detection of all intersection branches including small loops and tangencies", "u": "https://www.semanticscholar.org/paper/7d60e630cd05bb43caf0977ccdd7fba2096ff63d", "rc": {"bp": "NURBS surfaces (Non-Uniform Rational B-Splines) are the standard mathematical representation for curves and surfaces in CAD systems and design software. When two NURBS surfaces meet, their intersection curve defines edges and seams in the model. Computing this intersection correctly is fundamental to CAD reliability; mistakes in topology (failing to detect a loop, missing an isolated point) cause cascading failures in downstream operations.", "wh": "Identifying all intersection branches robustly is hard because complex topology can include tiny loops (nearly tangent curves that form small loops before separating), degenerate tangent intersections (curves touching but not crossing), and self-intersections. Industrial methods work most of the time but fail on edge cases. Existing approaches trade speed for robustness; catching all topology is slow.", "ap": "The method detects intersection branches by computing their starting points robustly. It combines winding number theory (a mathematical tool for counting how many times a curve winds around a point) with a subdivision scheme. The idea is to find points on the parametric domain where the vector field (a mathematical representation of potential intersection directions) has special structure (singularities). Winding numbers detect small loops and isolated singularities; subdivision localizes tangent intersection points precisely.", "ww": "Winding numbers count global topology without explicitly computing intersections, making small loops visible even if they're nearly tangent. Subdivision converges to tangent points precisely. Starting points are more robust to compute than full curves, so the method avoids numerical creep and instability that plague direct curve tracing.", "po": "Topologically correct intersection computation on complex inputs—small loops, tangencies, degenerate configurations—now outperforms both commercial and open-source CAD kernels. This improves reliability of CAD systems for manufacturing, design fabrication, and complex assemblies where topological errors are expensive."}}, {"t": "Interactive Yarn-level Knitwear with Nested Douglas-Rachford Splitting", "th": "cloth simulation", "m": ["douglas-rachford splitting", "nested decomposition", "convexification", "admm"], "pr": "Yarn-level knitwear simulation is prohibitively expensive due to high DOF and non-convex coupling", "ap": "Nested Douglas-Rachford splitting decoupling non-convex variational energy subproblems", "co": "Stable high-resolution knitwear simulation via convexification and theoretically grounded metrics", "u": "https://www.semanticscholar.org/paper/80e2957983181a5ac0b822330b5018626661eb78", "rc": {"bp": "Knitted garments—sweaters, socks, scarves—have richly detailed structure: yarn strands interlock in complex patterns. Simulating knitwear at the yarn level (rather than treating it as a triangular mesh) captures intricate wrinkles, folds, and draping that matter for visual realism in high-end animation. However, yarn-level simulation is computationally prohibitive; each stitch involves thousands of tiny degrees of freedom.", "wh": "Yarn-level knitwear has multiple competing physical effects: stretching and compression in the yarn, bending resistance (yarn doesn't fold like paper), twisting, shearing, and contacts where yarns collide. These effects are tightly coupled and nonlinear, making optimization per frame slow. Standard numerical methods require expensive line searches and frequent small steps because the system is non-convex (multiple local solutions exist).", "ap": "The method extends Douglas-Rachford Splitting (DRS), an optimization algorithm, to handle non-convex problems. The key innovation is nested decomposition: instead of solving the full coupled problem, it breaks it into independent sub-problems (one for stretching, one for bending, etc.), each of which is convex (has a single optimum). The nested structure ensures these sub-problems couple correctly across yarn threads and contacts. The paper derives principled metric selection for each sub-problem based on convergence theory, replacing ad-hoc tuning.", "ww": "Splitting converts a hard non-convex problem into a sequence of easier convex sub-problems, improving robustness and convergence. Convexity eliminates the need for line searches and frequent convergence checks. Theoretical metric selection grounds parameter choices, yielding near-optimal convergence without trial-and-error.", "po": "Yarn-level knitwear simulates efficiently enough for animation workflows, maintaining high-resolution detail and realistic deformation without the computational burden that previously limited adoption. This enables feature-quality cloth simulation with yarn-level realism in film and animation pipelines."}}, {"t": "Guidestar-Free Adaptive Optics with Asymmetric Apertures", "th": "adaptive optics imaging", "m": ["phase retrieval", "machine learning", "computational sensing"], "pr": "Real-time wavefront sensing without guidestar or dedicated sensor in adaptive optics", "ap": "Asymmetric apertures with phase retrieval and machine learning for computational wavefront sensing", "co": "First guidestar-free closed-loop AO system with order of magnitude fewer measurements", "u": "https://www.semanticscholar.org/paper/814cfe34cda97cde72f42f94f9f7ce28b39fb7d0", "rc": {"bp": "Telescopes and microscopes struggle to see clearly through turbulent air or cloudy glass — the atmosphere or optical imperfections scramble incoming light waves. We want to correct this distortion in real-time and in software, recovering sharp images of distant objects without needing artificial reference beacons (guidestars) placed in the sky.", "wh": "Measuring how much the light has been distorted requires knowing either the original light pattern (which you don't have for natural scenes) or a bright reference star at a known position (which may not exist or be too faint). The trick is getting the wavefront measurement from the blurry image alone, using only the quirky shape of the telescope's opening.", "ap": "They use an asymmetric telescope pupil (an oddly-shaped opening instead of a circular one) that encodes wavefront distortions into measurable patterns in the image. Two neural networks then infer the optical distortion from these patterns and predict what the true image looks like. A deformable mirror at the pupil plane applies the computed correction optically, closing the loop in real-time.", "ww": "An asymmetric pupil breaks the symmetry of how light spreads in the image, so the blurry pattern itself now contains information about the distortion — like a broken mirror shape tells you how light was bent. Neural networks learn this relationship from training data, so correcting distortions that haven't been seen before still works reasonably well.", "po": "The system corrects optical aberrations without a guidestar, uses 100× fewer images, and needs 1000× less computation than older phase-retrieval methods. It enables sharp imaging of natural scenes through unknown obstacles (dust, haze, or fog) with only a camera and a controllable mirror."}}, {"t": "Learning Sparse Singularities for Cross Field Design", "th": "quad mesh generation", "m": ["neural networks", "singularity learning", "geodesic distance fields"], "pr": "Manual quad mesh design; neural networks struggle with cross field discontinuities", "ap": "Learn sparse singularities and indices, then use smooth conventional methods to connect", "co": "Smooth cross fields with varying topologies via learned singularities", "u": "https://www.semanticscholar.org/paper/83abfb7bed6c44e990f40adaa87585dbafad7328", "rc": {"bp": "Quad meshes are four-sided grids that artists and engineers drape over 3D shapes to control how surfaces behave and look — they're essential for character animation, manufacturing, and numerical simulation. Hand-drawing these grids is tedious and requires expertise, so automating the process would save enormous time.", "wh": "Neural networks that directly predict quad grids struggle because small changes in the shape create large, chaotic shifts in the quad pattern, even when the underlying 'singularities' (special points where quads meet at odd angles) barely move. This creates visually jarring, inconsistent results when you blend multiple suggestions.", "ap": "Instead of predicting the entire quad grid, they train a network to predict only the sparse singular points: where they lie and their 'index' (how many quads spiral around them). They convert this into auxiliary fields to make the learning problem well-behaved. Then conventional algorithms smoothly connect the singular points to build the full, coherent quad grid.", "ww": "Singular points are the core structure that determines a quad grid's shape. By learning those rare, stable points instead of the millions of quad edges, the network sees a cleaner problem with less noise. The subsequent smooth-connection step (done non-neuronally) guarantees that the final grid is always valid and coherent, regardless of small prediction errors.", "po": "The method generates smooth, topologically varying quad grids and simplifies dataset preparation. Results are stable across shape variations and automatically handle coordinate invariance and insensitivity to tessellation choices — properties that matter for production automation."}}, {"t": "Pixel Cube: Diffusion-based Portrait Video Relighting Through Realistic Lighting Reproduction", "th": "portrait video relighting", "m": ["diffusion models", "neural rendering", "hdr environment maps"], "pr": "Dynamic portrait video relighting lacks photorealism and temporal consistency", "ap": "Video diffusion models trained on hybrid real+rendered data with HDR environment map control", "co": "Temporally consistent realistic relighting preserving subject identity and facial details", "u": "https://www.semanticscholar.org/paper/84f3047c877f42606af9d6619d802ff103110485", "rc": {"bp": "Relit portrait videos are videos where the lighting on an actor's face is changed after filming — perhaps to match a new scene or mood. The challenge is making the relighting look photorealistic and keeping it consistent frame-to-frame so the actor's face doesn't flicker or look artificial.", "wh": "Older methods either work on still images (ignoring flicker) or are too slow for video. Building a learning model requires diverse training data showing the same actor under many different lighting conditions, which is expensive to capture. Generative models also struggle to preserve fine facial details (skin tone, wrinkles, hair) while changing lighting.", "ap": "They built a physical LED lighting rig to capture real portrait videos under known lighting. A diffusion model (a generative tool that learns patterns by removing noise from images) is trained on this hybrid dataset of real and rendered videos. At runtime, the model takes an HDR environment map (a 360-degree image describing the new lighting) and synthesizes the relit frame.", "ww": "Diffusion models are naturally good at preserving details (like wrinkles) while smoothing unrealistic lighting artifacts because they learn what real skin looks like under varied light. The real LED captures and the HDR control signal together teach the model to respect both identity and photorealism. Temporal consistency emerges because the underlying video diffusion model is trained to keep motion smooth.", "po": "Videos relight with photorealistic quality, preserve the actor's expression and fine facial features, and generalize to unseen subjects, motions, and new lighting conditions. The model works on in-the-wild videos (filmed normally) with no manual setup."}}, {"t": "A Two-Millisecond Passthrough Headset for Perceptual Studies", "th": "virtual reality headsets", "m": ["catadioptric optics", "low-latency rendering", "passthrough display"], "pr": "HMD end-to-end latency 12-60ms prevents perceptual studies of lower latencies", "ap": "Video passthrough HMD with catadioptric design achieving 2ms e2e latency", "co": "First passthrough HMD platform for studying sub-10ms latency effects on user experience", "u": "https://www.semanticscholar.org/paper/86b5a8083ebcead20fb679d94166bbcde26d71b6", "rc": {"bp": "In virtual reality, the delay between when you move your head and when the display updates (latency) makes you feel disconnected and dizzy. Lower latency makes VR feel more real and responsive. Current headsets have 12-60 ms latency; understanding whether even lower latencies matter for user comfort and performance requires a device that can test it.", "wh": "Modern VR systems use clever tricks (pose prediction, late reprojection) to hide latency, but these tricks only work down to about 12 ms. Testing true latencies below that requires new hardware that doesn't need those tricks — a much harder engineering problem.", "ap": "They built a video passthrough headset called Camsicle with two cameras and a special mirror-lens system (catadioptric design) that displays the real world with only 2 milliseconds of end-to-end latency. The cameras capture what you see, the system processes it instantly, and the display shows it with virtually no delay.", "ww": "By using cameras and mirrors instead of prediction hacks, there's no accumulated error — the user sees the physical world nearly as if the headset weren't there. This true low-latency passthrough is the key to testing whether sub-12-ms latencies actually matter for user preference, rather than just theory.", "po": "User studies with 57 participants show that 2 ms and 14.3 ms latencies are preferred over 23 and 29 ms in a ball-catching task. The platform enables perceptual research on latency thresholds that was previously impossible, grounding subjective VR comfort in measurable physical quantities."}}, {"t": "Woodstock: Interactive Modeling of Fungal Wood Decay", "th": "biological material simulation", "m": ["volumetric simulation", "anisotropic diffusion", "grain-aligned meshes"], "pr": "Simulating complex fungal wood decay with biological and mechanical interactions", "ap": "Volumetric tree representation with anisotropic diffusion, fungal colonization, and moisture dynamics", "co": "Realistic simulation of cuboid fractures, trunk hollowing, and environmental moisture effects", "u": "https://www.semanticscholar.org/paper/88ef33768b45dfaeb903fb38b43a7e1815d59442", "rc": {"bp": "When fungi decay wood, they don't just eat away randomly — they break down specific chemicals (lignin, sugars, defenses), and the wood's moisture and grain structure determine how fast and where the decay spreads and causes structural failure. Simulating this process realistically would help visualize how trees rot and inform timber engineering.", "wh": "Wood decay couples biology (fungal spread, chemical degradation), fluid flow (moisture moving through grain), and mechanics (wood fracturing and hollowing) in complex ways. Each domain has different physics, and they strongly influence each other. No prior method unified them.", "ap": "They represent wood as a 3D volumetric model with explicit grain alignment, internal moisture, and tissue health states (intact, colonized, consumed). They simulate three coupled processes: anisotropic spread of fungal colonies (following grain and moisture), consumption of wood resources, and stress-driven fracture patterns (driven by moisture and material loss).", "ww": "Tracking moisture, fungal spread, and material failure together lets each influence the others correctly. Fungal spread follows grain (anisotropic), so it doesn't just make a sphere around the infection point. Moisture and chemical consumption weaken wood locally, leading to realistic cuboid fracture patterns (characteristic of rot) rather than smooth erosion.", "po": "Simulations realistically capture the progression of rot: fungal colonization spread, characteristic cube-shaped fracture patterns, trunk hollowing, and environmental moisture effects on structural stability. The rendering shows volumetric decay as a realistic 3D process, not an abstract animation."}}, {"t": "Uncertainty-aware geometry processing on Gaussian Process Implicit Surfaces", "th": "probabilistic geometry processing", "m": ["gaussian processes", "differential operators", "kac-rice formula"], "pr": "Geometry processing on uncertain/probabilistic surface representations", "ap": "Kac-Rice formula to embed differential operators on Gaussian Process Implicit Surfaces", "co": "Uncertainty-aware geometry processing with principled handling of noise and ambiguity", "u": "https://www.semanticscholar.org/paper/89a577193e34cd580c346b65d08d1a6a23236640", "rc": {"bp": "When you scan a 3D shape with sensors (cameras, LiDAR) or reconstruct it from partial data, there's always uncertainty — ambiguity about the exact surface. Most geometry processing assumes a single, definite shape, throwing away that uncertainty. The goal is to do useful operations (smoothing, curvature, flow) while acknowledging and using the uncertainty.", "wh": "Classical geometry processing (computing gradients, Laplacians, running smoothing algorithms) assumes a crisp, deterministic surface. But if the input is uncertain, a single fixed surface can mask important ambiguities. Building math for uncertain surfaces from scratch is non-trivial.", "ap": "They use Gaussian Process Implicit Surfaces, a probabilistic representation that stores a distribution over plausible shapes instead of one fixed shape. They define analogs of classical operators (gradient, divergence, Laplacian) that work on this distribution, computing expected values using the Kac-Rice formula (a tool from random surface theory).", "ww": "Gaussian processes naturally encode uncertainty, and the Kac-Rice formula lets you compute integrals and derivatives over random surfaces by embedding them into a fixed volumetric domain. This converts an intractable problem (differentiate a probabilistic surface) into an integral over a volume, which is computationally tractable.", "po": "You can now do geometry processing (like smoothing or curvature estimation) that accounts for input noise and ambiguity rather than pretending the input is perfect. This bridges classical surface equations and modern probabilistic shape representations, enabling principled handling of noisy or incomplete scans."}}, {"t": "MotionBricks: Scalable Real-Time Motions with Modular Latent Generative Model and Smart Primitives", "th": "motion generation and synthesis", "m": ["latent generative models", "smart primitives", "motion authoring"], "pr": "Real-time generative motion control lacks scalability and multi-modal control interfaces", "ap": "Modular latent generative backbone with smart primitives for navigation and interaction", "co": "Real-time generation of 350k+ motions with unified control interface and zero-shot adaptation", "u": "https://www.semanticscholar.org/paper/8c10d76b4727be49cda4bbb2a7d9c3e8791148bb", "rc": {"bp": "In video games, movies, and robotics, characters need to move in real-time with precise control — walk faster, face a direction, reach for an object. Generative AI can synthesize convincing motions, but it's slow and hard to control in the fine-grained, multi-faceted way that production pipelines need.", "wh": "Generative models trained on massive motion datasets can produce diverse and realistic motion, but they require seconds of computation. Real-time demands milliseconds. Existing models also respond poorly to multi-modal control: velocity commands, style choices, and exact keyframes simultaneously, which production rarely addresses.", "ap": "MotionBricks uses a large modular neural backbone trained on 350,000 motion clips that generates motions in a learned 'latent' space (compressed, efficient representation). On top, 'smart primitives' provide an authoring interface for intuitive control: speed commands, style labels, and spatial keyframe constraints. The model learns to blend these controls naturally.", "ww": "Modularity means the core model learns general motion patterns once, then different downstream tasks (walking, reaching, dancing) reuse the same backbone without retraining. Smart primitives encode common control needs so the system learns what users actually want without task-specific annotations. This amortizes computation across many use cases.", "po": "The system generates diverse motions in real-time (critical for interactive apps), supports multi-modal control (velocity, style, keyframes), and works on new tasks zero-shot (without fine-tuning). It bridges the gap between research generative methods and production demands for control and speed."}}, {"t": "ReActor: Reinforcement Learning for Physics-Aware Motion Retargeting", "th": "motion retargeting robotics", "m": ["reinforcement learning", "bilevel optimization", "physics simulation"], "pr": "Robot motion retargeting produces physical inconsistencies and dynamically infeasible motions", "ap": "Bilevel optimization jointly adapting reference motions while training tracking policy via RL", "co": "Physically plausible retargeted motions enabling robust imitation learning across morphologies", "u": "https://www.semanticscholar.org/paper/8c964e7a26e5c9da1c8f5a62ada31f9a297da7d0", "rc": {"bp": "Teaching robots to move like humans is hard: human motions evolved for human bodies, but robots have different arm lengths, joint ranges, and physics. Naively copying a human motion onto a quadruped or unusual robot often produces sliding feet, self-collisions, or motions that violate physics, so the robot can't actually execute them.", "wh": "Retargeting (adapting a reference motion to a new body) is traditionally done by hand or with heuristics that ignore physics. If you account for physics, the optimization becomes complex and brittle. Reinforcement learning can produce physically valid motions, but it requires a lot of trial-and-error.", "ap": "ReActor uses a two-level optimization: the top level adapts the reference motion's parameters (e.g., joint angles) to match the robot's shape, and the bottom level trains a tracking policy using reinforcement learning to follow the adapted motion while respecting physics constraints. They derive approximations to make the bilevel problem solvable.", "ww": "By tightly coupling retargeting and RL training, the motion adapts to the specific robot body and the physics constraints, rather than one then the other. RL ensures the final motion is actually feasible for the robot to execute. The framework needs only sparse semantic hints (which human joints map to which robot joints), not manual tuning.", "po": "Robots can execute retargeted motions without foot sliding, self-collision, or dynamic infeasibility, even when retargeting to very different morphologies (e.g., a quadruped from a human). The method validates on real hardware, making human-inspired motion practical for robotics."}}, {"t": "Gabor Fields: Orientation-Selective Level-of-Detail for Volume Rendering", "th": "neural volume rendering", "m": ["gabor filters", "gaussian splatting", "frequency filtering"], "pr": "Gaussian-based volume representations lack efficient hierarchical level-of-detail strategies", "ap": "Mixture of Gabor kernels enabling orientation-selective frequency filtering via primitive pruning", "co": "Continuous smooth LOD transitions without refitting or extra storage; faster ray traversal", "u": "https://www.semanticscholar.org/paper/8cb0bbc0263e7ee2ca11230aea1423d732e187ce", "rc": {"bp": "Rendering complex 3D volumes (smoke, clouds, semi-transparent materials) is computationally expensive. To speed it up, we use hierarchies: show low detail far from the camera and high detail up close. This is easy with traditional voxel grids but hard with modern Gaussian-based representations, which are memory-efficient but don't have built-in levels of detail.", "wh": "Gaussian representations avoid the memory cost of voxel grids, but constructing a hierarchical version is awkward: prefiltering bloats memory, recomputing each level is expensive, and smooth transitions between levels are hard to guarantee. You need a method that prunes or filters without refitting.", "ap": "Gabor Fields replace Gaussian elements with Gabor kernels (sinusoidal functions modulated by a Gaussian envelope) that naturally encode frequency and orientation. Rendering can select which frequencies to use at each viewing distance. Pruning high-frequency kernels automatically reduces detail without refitting or extra storage.", "ww": "Gabor kernels inherently encode frequency information (spatial scale), so reducing detail is as simple as dropping the high-frequency components. This is cheap and automatic, unlike Gaussian prefiltering. Stochastically sampling different frequencies at different ray depths creates smooth transitions between hierarchy levels.", "po": "Gabor Fields enable smooth, continuous level-of-detail for Gaussian volumes with no refitting, no extra memory, and faster rendering. Ray traversal accelerates because high-frequency components can be masked, allowing the renderer to skip large volumetric regions."}}, {"t": "Monte Carlo PDE Solvers for Nonlinear Radiative Boundary Conditions", "th": "physics-based simulation", "m": ["monte carlo methods", "pde solvers", "fixed-point iteration"], "pr": "Monte Carlo PDE solvers cannot handle nonlinear radiative boundary conditions", "ap": "Picard-style fixed-point iteration with heteroscedastic regression denoising for on-boundary estimates", "co": "Stable convergent solver for thermal radiation with higher accuracy than linearization", "u": "https://www.semanticscholar.org/paper/8ddd357b6dbde1a4963520edb79eb84cec035814", "rc": {"bp": "Heat transfer in 3D shapes with realistic radiation (where hot surfaces emit infrared and cool other surfaces) is governed by complex equations that require numerical solving. Thermal simulations matter for engineering and also for graphics (hot metal rendering). Monte Carlo methods handle complex geometry robustly, but they don't yet handle the nonlinear radiation boundary conditions.", "wh": "Radiation produces a nonlinear boundary condition (the heat loss depends on the surface temperature to the fourth power, following Stefan-Boltzmann law). Nonlinear equations are much harder to solve than linear ones. Existing Monte Carlo PDE solvers handle linear boundary conditions but not this nonlinearity.", "ap": "They use Picard fixed-point iteration: repeatedly
