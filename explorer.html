y sampling different frequencies at different ray depths creates smooth transitions between hierarchy levels.", "po": "Gabor Fields enable smooth, continuous level-of-detail for Gaussian volumes with no refitting, no extra memory, and faster rendering. Ray traversal accelerates because high-frequency components can be masked, allowing the renderer to skip large volumetric regions."}}, {"t": "Monte Carlo PDE Solvers for Nonlinear Radiative Boundary Conditions", "th": "physics-based simulation", "m": ["monte carlo methods", "pde solvers", "fixed-point iteration"], "pr": "Monte Carlo PDE solvers cannot handle nonlinear radiative boundary conditions", "ap": "Picard-style fixed-point iteration with heteroscedastic regression denoising for on-boundary estimates", "co": "Stable convergent solver for thermal radiation with higher accuracy than linearization", "u": "https://www.semanticscholar.org/paper/8ddd357b6dbde1a4963520edb79eb84cec035814", "rc": {"bp": "Heat transfer in 3D shapes with realistic radiation (where hot surfaces emit infrared and cool other surfaces) is governed by complex equations that require numerical solving. Thermal simulations matter for engineering and also for graphics (hot metal rendering). Monte Carlo methods handle complex geometry robustly, but they don't yet handle the nonlinear radiation boundary conditions.", "wh": "Radiation produces a nonlinear boundary condition (the heat loss depends on the surface temperature to the fourth power, following Stefan-Boltzmann law). Nonlinear equations are much harder to solve than linear ones. Existing Monte Carlo PDE solvers handle linear boundary conditions but not this nonlinearity.", "ap": "They use Picard fixed-point iteration: repeatedly update boundary conditions and resolve the PDE, letting the solution converge by successive approximations. A denoising technique using heteroscedastic regression reduces the variance of Monte Carlo estimates at boundaries, focusing effort where it matters most.", "ww": "Picard iteration converts a hard nonlinear problem into a sequence of easier linear solves. Each solve uses Monte Carlo's robustness on complex geometry. The denoising step targets boundary variance specifically, filling a gap that prior methods (which denoised only interior points) left open.", "po": "Monte Carlo solvers now handle nonlinear thermal radiation boundaries with significantly higher accuracy than linearization approximations. The method works on complex geometries (the whole point of Monte Carlo) and is empirically stable even with bad initial guesses."}}, {"t": "Autoregressive Diffusion with Hybrid Representation for Interactive Human Motion Generation", "th": "human motion generation", "m": ["autoregressive diffusion", "hybrid representation", "text conditioning"], "pr": "Motion generation requires offline computation or sacrifices controllability for real-time", "ap": "Autoregressive hybrid representation combining explicit root features with latent body embedding", "co": "Real-time streaming motion generation with text and kinematic constraint control", "u": "https://www.semanticscholar.org/paper/8e28267f4c5e3133f2c8cca55e9dc1f62a1a3d0c", "rc": {"bp": "Animating 3D human characters in real-time for interactive games or VR requires generating believable motion fast and with responsive control — the player says \"walk forward and turn left\" and the character does it immediately, in a natural way, matching the narrative voice they requested.", "wh": "Offline generative models produce high-quality motion but are too slow for interactivity. Online methods are fast but often lack nuanced control (text semantics, long-horizon goals) and struggle to maintain temporal coherence over long sequences. The two worlds haven't converged.", "ap": "ARDY (Autoregressive Diffusion) streams motion generation in real-time using a hybrid representation: the character's root position (where they're walking) is explicit for precise control, and the body's pose is learned in a latent space for efficiency. A two-stage transformer-denoiser with variable context window generates new poses conditioned on text prompts and keyframe constraints.", "ww": "The hybrid representation separates concerns: trajectory control (where the character walks) is direct and stable, while body animation (posture, arm swing) is learned flexibly. Variable context lets the model look at different amounts of past motion depending on the situation. Training on text labels and ground-truth keyframes teaches the model to fuse both signals naturally.", "po": "The system generates high-fidelity human motion in real-time, responsive to text prompts and flexible kinematic constraints, with support for long-horizon goals. It bridges offline quality and online speed, enabling interactive animation with semantic and spatial control that was previously unavailable."}}, {"t": "Spatially Accelerated Winding Numbers for Curved Geometry", "th": "winding number computation", "m": ["bounding volume hierarchy", "moment data", "nurbs evaluation"], "pr": "Fast winding number evaluation limited to discrete inputs; slow on curved geometry", "ap": "Bounding volume hierarchy with precomputed moments for arbitrary NURBS curves and patches", "co": "Sub-linear complexity winding numbers on curved geometry preserving feature accuracy", "u": "https://www.semanticscholar.org/paper/8f09b64e0ca548613b3809628591abac8d85d376", "rc": {"bp": "Winding numbers answer a fundamental question: is a point inside or outside a 3D shape? This seems simple for clean, closed surfaces, but real meshes are messy — they have gaps, overlaps, and curved boundaries. A robust inside-outside test is essential for simulation, texturing, and boolean operations.", "wh": "Direct evaluation of winding numbers on large, complex meshes is slow, so spatial acceleration is needed. Existing fast methods approximate by clustering primitives far from the query point. But they only work on discrete meshes (triangles, points), not smooth curves or patches.", "ap": "They extend winding number acceleration to curved geometry (NURBS curves and trimmed patches) using a Bounding Volume Hierarchy that stores precomputed moment data at each node. Queries use fast approximations for far clusters but directly evaluate nearby curved primitives, preserving geometric accuracy.", "ww": "Precomputing moments (integrals of basis functions) at hierarchy nodes enables accurate approximations for distant clusters without refitting. Direct evaluation near the query preserves fine details (like thin features) that would be lost with purely approximate methods. The two-tier strategy keeps asymptotic complexity low while maintaining accuracy.", "po": "Winding number queries on curved geometry (NURBS) achieve sub-linear complexity while preserving geometric features, enabling containment queries on arbitrary curved shapes — not just triangle meshes. This is useful for procedural design and simulation on parametric surfaces."}}, {"t": "Probe-based Walk on Spheres for Efficient Path Reusing", "th": "monte carlo pde solving", "m": ["walk on spheres", "variance reduction", "control variates"], "pr": "Walk on Spheres has slow O(N^-1/2) convergence despite mesh-free flexibility", "ap": "Reuse intermediate walk states as fixed spherical probes with Poisson integral evaluation", "co": "Substantially improved sample efficiency via probe-based path reusing and variance reduction", "u": "https://www.semanticscholar.org/paper/90c07037c62cb5975ac553f08e35e19bfe1a7274", "rc": {"bp": "Walk on Spheres (WoS) is a flexible, meshless method for solving partial differential equations (heat, diffusion) by simulating random walks. It's robust to complex geometry, but converges slowly, requiring millions of walks. The goal is to reuse information from intermediate points along walks to speed convergence.", "wh": "Each random walk in WoS visits many points before reaching a boundary, but classical methods discard all intermediate values and only record the final result. Using intermediate points seems promising, but their probability distribution (shaped by dynamically generated spheres) is intractable to evaluate.", "ap": "Walk on Probes (WoP) replaces dynamic spheres with fixed, pre-distributed probe spheres throughout the domain. This converts the tricky distribution of walk points into simple samples on fixed sphere boundaries. A Poisson integral formula then cheaply evaluates each intermediate point's contribution without needing to recompute from scratch.", "ww": "Fixed probe boundaries have known, tractable distributions (uniform on a sphere), so their contribution to the solution is easy to compute. By reusing intermediate points, each random walk becomes multiple independent unbiased estimates instead of just one, dramatically improving variance without additional simulations.", "po": "Walk on Probes substantially improves sample efficiency and convergence speed while preserving WoS's flexibility for complex geometries. The method is general: it combines reuse with control variates and self-normalization for further variance reduction."}}, {"t": "Fast and Exact Winding Numbers for Triangle Meshes", "th": "winding number computation", "m": ["ray-mesh intersection", "analytical reduction", "robust geometry"], "pr": "Winding number computation on noisy meshes with gaps and self-intersections is slow", "ap": "Analytical reduction of surface integral to single ray-mesh test and edge sum", "co": "Orders of magnitude faster exact winding numbers with no approximations besides floating-point", "u": "https://www.semanticscholar.org/paper/94b32f4d8fce93c29bf8742983e480a33be8d839", "rc": {"bp": "Winding numbers — a measure of whether a point is inside a 3D shape — are used constantly in graphics and simulation. Computing them naively on large meshes is slow, but existing fast methods use approximations. The goal is to compute exact winding numbers quickly on realistic, messy meshes with gaps and overlaps.", "wh": "The classical formula for winding numbers is a surface integral that's expensive to evaluate. Fast approximations lose accuracy on imperfect meshes. There's a tension between accuracy and speed that existing methods don't fully resolve.", "ap": "They analytically simplify the surface integral to just a single ray-mesh intersection test plus an elementary sum over boundary edges. This reduction is mathematically exact (no approximation), yet vastly faster than the direct integral because it replaces billions of floating-point operations with a few geometric queries.", "ww": "The mathematical reduction works because the integral has special structure: most of it cancels, leaving only the contribution from ray intersections and edges. By computing analytically what would be expensive numerically, they keep the algorithm exact while making it practical on large meshes.", "po": "Winding number queries are orders of magnitude faster than prior methods while remaining exact (only floating-point rounding error). The algorithm is simple, debuggable, and robust even on extremely noisy or corrupt meshes, making it a practical replacement for existing approximation methods."}}, {"t": "Fiber-level Woven Fabric Capture from a Single Microscopic Image", "th": "fabric appearance capture", "m": ["differentiable rendering", "procedural models", "microscopy imaging"], "pr": "Fiber-level fabric geometry and appearance capture requires special devices or manual design", "ap": "Coarse-to-fine parameter estimation with differentiable procedural geometry and appearance models", "co": "Single microscope image to fiber-level fabric geometry and realistic rendering", "u": "https://www.semanticscholar.org/paper/95a4bbea4671e4d5b71901f84bfa1b99ca2aec9d", "rc": {"bp": "Fabric looks different under different lighting because of its fiber structure — how threads braid and bend affects how light bounces. Rendering fabric photorealistically requires capturing this structure at the fiber level, but current capture methods use expensive devices or hand-crafted pipelines. The goal is to infer fiber geometry and appearance from a single cheap microscope image.", "wh": "A microscope image and a final rendered image of woven fabric look vastly different — one is a 2D close-up of surface texture, the other a 3D view of complex shading. Inferring full 3D fiber geometry and optical properties from such minimal, 2D information seems under-constrained.", "ap": "They use differentiable procedural models: 3D fiber geometry and shading behavior are parameterized by a few numbers (thread thickness, weave pattern, fiber properties). A neural network predicts initial parameters, then optimization adjusts them to match the microscope image via differentiable rasterization (simulation-based fitting). Refinement improves details.", "ww": "Procedural models are expressive enough to capture real woven fabric but compact enough that optimization over parameters is tractable. Differentiable rasterization lets gradient-based optimization refine parameters to match observations. The coarse-to-fine approach first gets the macro structure right, then refines.", "po": "From a single microscope image, the method recovers fiber-level geometry and appearance suitable for photorealistic rendering. It sidesteps expensive CT scanners and manual authoring, enabling fiber-level fabric assets to be created from affordable tools."}}, {"t": "SAND: Spatially Adaptive Network Depth for Fast Sampling of Neural Implicit Surfaces", "th": "neural implicit surfaces", "m": ["neural implicit representation", "adaptive network depth", "multi-layer perceptron"], "pr": "High computational cost of neural implicit surface evaluations at all spatial locations", "ap": "Spatially adaptive network depth map with tailed MLP for efficient query point evaluation", "co": "Terminating network evaluation adaptively based on spatial geometry complexity reduces computation", "u": "https://www.semanticscholar.org/paper/96d71743cc43e1737ef59def660cabf17b4679da", "rc": {"bp": "When you describe a shape as a mathematical function, you can render it anywhere with perfect precision. But those functions run slow on computers, especially inside graphics engines where we need to evaluate them billions of times per second. We want the speed of simple tricks with the precision of mathematics.", "wh": "The key insight is that implicit representations naturally become harder to get right as you move away from surfaces, and as local geometry gets more complex. A flat floor is easy; a sharp corner or thin feature is hard. But conventional models treat all locations identically.", "ap": "SAND learns a volumetric map recording how deep a network needs to go in each region to be accurate enough. It then uses a modified network architecture where layers can terminate early: each hidden layer has an output option (called a 'tail'), so computation can stop as soon as the necessary accuracy is reached, without traversing the entire network.", "ww": "This works because neural networks can learn internal shortcuts. If a region needs less accuracy, the network can produce good-enough answers partway through. By explicitly allowing early termination and learning where to terminate, the method directs computation only to places where it matters geometrically.", "po": "According to the abstract, SAND achieves spatial adaptivity without retraining—directing computational resources to geometrically important and complex regions. The result is faster sampling of shapes encoded as neural functions, making them practical for real-time graphics."}}, {"t": "AtomSlicer: Constant-Thickness Field-Aligned Non-Planar Slicing and Continuous Toolpaths for FFF", "th": "3D printing toolpaths", "m": ["field-aligned layers", "phase fields", "collision-free toolpaths"], "pr": "Multi-axis 3D printing requires continuous collision-free toolpaths with constant bead geometry", "ap": "Field-aligned phase fields partitioned into layers with 2-RoSy-aligned toolpath synthesis", "co": "Reduces travel moves by 1-2 orders of magnitude while preserving field constraints and constant thickness", "u": "https://www.semanticscholar.org/paper/96efc601fc1ba81fdb8c1789c5de9c7797884538", "rc": {"bp": "3D printers using molten plastic (FFF) can tilt their nozzle in any direction, not just print flat layers. This opens the door to printing without the stepped staircases that plague vertical walls and to using far less support material. But making this work requires solving intricate geometry problems that didn't exist in flat-layer printing.", "wh": "Tilting the nozzle means each layer is no longer flat. Layers must follow prescribed direction fields (user intent), keep constant bead thickness (the plastic comes out at a fixed rate), avoid collisions and tool retractions, and flow continuously from one layer to the next. Doing all of this simultaneously is combinatorially hard—every constraint couples to every other one.", "ap": "AtomSlicer encodes the shape using three perpendicular phase fields (a mathematical trick for describing geometry smoothly), samples them into oriented atoms (spatial building blocks), partitions the model into layers, reconstructs each layer as a mesh, and then synthesizes toolpaths aligned to user-specified direction fields. The key is treating those fields as hard constraints: if the geometry cannot be printed respecting the specification, the algorithm reports it rather than quietly breaking the rules.", "ww": "By separating the problem into phases—encoding, partitioning, reconstruction—the method avoids the combinatorial explosion of trying to optimize everything at once. Each phase works locally on clean geometric building blocks (atoms), so constraints decouple and become tractable.", "po": "The abstract shows AtomSlicer reduces non-extruding travel (wasted motion) to just a few percent and cuts travel moves by one to two orders of magnitude versus earlier methods. For a large test set of 10,000 shapes and 13 physical prints, it stays 9 to 60 times faster than competing algorithms."}}, {"t": "CasLayout: Cascaded 3D Layout Diffusion for Indoor Scene Synthesis with Implicit Relation Modeling", "th": "3D scene generation", "m": ["cascaded diffusion", "sparse relation graphs", "conditional constraints"], "pr": "3D indoor scene synthesis lacks global architectural constraints and struggles with local semantic consistency", "ap": "Cascaded diffusion framework with sparse relation graphs and building elements as constraints", "co": "Reduces data requirements and enables zero-shot image-to-scene generation via LLM/VLM integration", "u": "https://www.semanticscholar.org/paper/975b63c859859ecd141d62cc63d550fb8fa45765", "rc": {"bp": "Imagine designing a living room: you mentally sketch the room's layout, picture where furniture fits, ensure nothing overlaps, and respect walls and doors. Creating realistic virtual rooms automatically is the same task, but machines must learn it. Today's methods either ignore spatial logic or drown in redundant connections, making them brittle and data-hungry.", "wh": "Scene design is a cascade of decisions. First, how many sofas and chairs? Then, how big? Then, where in the room and what spacing? Every decision depends on earlier ones, but also on the room's structure. A fully connected dependency graph between all objects creates redundancy and noise. Data scarcity makes learning hard.", "ap": "CasLayout breaks the problem into four discrete stages, each with explicit purpose: predict object counts and types, refine sizes and features, model spatial relations in a learned space (not pixel space), and generate precise bounding boxes. For spatial relations, the method builds a sparse graph (only relevant connections) rather than forcing every object to know about every other one. LLMs and vision-language models can guide the pipeline for zero-shot tasks like creating a scene from a photo.", "ww": "Breaking the task into stages mirrors how humans design: we sketch a plan, refine dimensions, check how objects relate, then finalize placement. Each stage focuses on one type of decision, so the network learns cleaner patterns. Sparse relations mean the model only learns necessary connections, not noise from irrelevant object pairs.", "po": "By decomposing the joint generation task, CasLayout reduces data requirements, maintains physical validity within floor plans by treating walls and doors as explicit constraints, and enables flexible integration with large language models for image-to-scene and text-to-scene generation."}}, {"t": "Implicit Minimal Surfaces for Bijective Correspondences", "th": "surface correspondence", "m": ["implicit representation", "complex sections", "ginzburg-landau functional"], "pr": "Computing bijective surface correspondences requires complex combinatorial mesh modifications and barrier functions", "ap": "Implicit 4D mapping surface using complex sections minimized via Ginzburg-Landau functional", "co": "Robust correspondence computation without initialization requirement or mesh modifications needed", "u": "https://www.semanticscholar.org/paper/981d199c34921eff47930fbf8e9a2b9787521739", "rc": {"bp": "Matching points on two shapes—finding which part of the first surface corresponds to which part of the second—is central to animation, shape transfer, and reconstruction. The ideal match is bijective (one-to-one and reversible) and covers the whole surface without tearing. Finding such matches is notoriously hard.", "wh": "Existing algorithms rely on combinatorial operations (mesh connectivity changes), barrier functions that prevent overlap, or require a good initial guess. All of these are fragile: they fail on noisy data, require hand-tuning, and sometimes need manual setup. The problem is that bijectivity is a global topological property that resists local optimization.", "ap": "This paper represents the match as a 4-dimensional surface sitting in the product space formed by combining the two input surfaces. The map between the surfaces is stored implicitly—as the zero-set of a complex function (roughly, points where a complex number equals zero). Distortion is minimized by shrinking this mapping surface's area using the Ginzburg-Landau functional, a principle borrowed from physics and differential geometry that naturally favors smooth, minimal solutions.", "ww": "The Ginzburg-Landau functional, well-understood in physics, tends to prefer configurations that are globally optimal and smooth. By encoding bijectivity as an implicit geometric object and minimizing its area rather than penalizing overlap locally, the method sidesteps combinatorics. The implicit representation avoids mesh topology changes; the map is always continuous.", "po": "The result avoids combinatorial mesh modifications and barrier functions, making it more robust to noise and simpler to implement. It does not assume a good starting point and can untangle wrong matches from faster, cheaper methods. Landmark points or curves guide the optimization, giving designers control."}}, {"t": "Mixed Material Point Methods for Stiff Elastoplasticity", "th": "material point methods", "m": ["material point method", "implicit integration", "mixed discretization"], "pr": "Simulating stiff elastoviscoplastic materials requires stable CFL-rate integration handling high-strain deformation", "ap": "Mixed Material Point Methods with implicit integration producing well-posed symmetric optimization", "co": "Extends mixed discretization to handle finite-strain viscoelasticity and general flow rules efficiently", "u": "https://www.semanticscholar.org/paper/98aa5aaa669fa6d8b27950a7f675d1ecabf9a455", "rc": {"bp": "In animation and engineering, we simulate how materials deform and flow—cloth, clay, snow, metals. Some materials are easy to simulate (soft and squishy), others are brutally hard (stiff rubber, plastic that resists deformation). Stiff materials demand tiny time steps, making simulations slow. We need stable, fast algorithms that handle the widest range of materials.", "wh": "Explicit time-stepping (the usual approach) requires tiny steps for stiff materials to remain stable—a CFL rate constraint. Implicit methods can use larger steps but create complex nonlinear systems that are expensive to solve. Standard implicit solvers also struggle when materials become nearly incompressible (volume-preserving).", "ap": "This method extends a mixed formulation (separating constraints from variables cleverly) to handle finite-strain viscoelasticity and general flow rules. The implicit time-stepping produces a symmetric optimization problem with compact stencils (local, sparse structure). The authors propose an efficient GPU solver, making the implicit system practical on modern hardware.", "ww": "By reformulating the equations as a symmetric optimization problem rather than a general nonlinear system, the solver can use better algorithms (like preconditioned conjugate gradient). Compact stencils mean sparse matrices and fast linear algebra. Running on GPUs adds massive parallelism.", "po": "The method enables stable simulation of stiff elastoviscoplastic materials up to the incompressible limit without requiring prohibitively small time steps. Examples range from granular materials and snow to elastic solids, and it supports two-way coupling with rigid bodies, greatly expanding the range of real-world phenomena that graphics pipelines can handle."}}, {"t": "Hi-SPAD: Video-Rate Hyperspectral Imaging and Inference with Single-Photon Cameras", "th": "hyperspectral imaging", "m": ["single-photon sensors", "pushbroom configuration", "spectrum reconstruction"], "pr": "Hyperspectral imaging requires high spatial, spectral, temporal resolution under passive ambient lighting", "ap": "Pushbroom architecture combining single-photon avalanche diode sensors for photon-counting spectral sensing", "co": "Demonstrates 26fps hyperspectral video with 123 spectral channels under ambient illumination", "u": "https://www.semanticscholar.org/paper/9c19574958436862d23aac162cd06ac80be46575", "rc": {"bp": "Knowing what material an object is made of—its chemical composition or reflectance properties—requires measuring not just brightness but the full spectrum of light. Today's hyperspectral cameras are bulky and slow. We want spectrum measurement fast, in video, with passive indoor lighting, using tiny sensor chips.", "wh": "Single-photon sensors (SPAD) count individual light particles, giving extreme sensitivity and speed. But they produce quantized, nonlinear measurements with massive noise. Hyperspectral imaging normally requires many wavelength measurements per pixel. Combining both seems impossible: quantization and nonlinearity fight against spectral reconstruction.", "ap": "Hi-SPAD uses a pushbroom camera design (a line of pixels that sweeps across the scene) paired with SPAD sensors arranged in a grid that captures color. The system measures how many photons arrive in each tiny time window for each color band. Despite the heavy quantization and noise, reconstruction algorithms and material classification work by leveraging the fact that errors decrease exponentially as measurements accumulate.", "ww": "The key insight is that photon counting, while noisy per sample, improves steadily as you collect more measurements. With enough observations in the right setup (pushbroom plus color-sorted photon detectors), the nonlinearity becomes manageable. Theoretical analysis shows error bounds shrink exponentially, so practical reconstruction becomes feasible.", "po": "The lab-built Hi-SPAD camera achieves hyperspectral video at 26 frames per second with 123 spectral channels under ambient lighting. The abstract validates accurate material classification and full-spectrum reconstruction through simulation and real prototypes, establishing the feasibility of photon-counting hyperspectral video in dynamic scenes."}}, {"t": "Structural MAT: Clean and Scalable Medial Axis Simplification via Explicit Surface Correspondence", "th": "medial axis transform", "m": ["voronoi diagram", "qem simplification", "surface correspondence"], "pr": "Computing high-quality medial axis transform with structural features and robust reconstruction from discrete meshes", "ap": "Explicit surface correspondence tracking during QEM-like Voronoi simplification with priority control strategies", "co": "Produces MAT with strong structural alignment and regularity while achieving high runtime efficiency", "u": "https://www.semanticscholar.org/paper/9d38f6bac96864c2ab8226e19ebf4a745728f32a", "rc": {"bp": "The medial axis of a shape is its skeleton—the locus of centers of circles that touch the boundary from inside. It completely describes the original shape and is invaluable for shape analysis and animation. Computing a clean, accurate medial axis from a triangle mesh is notoriously hard; results are usually tangled and unstable.", "wh": "Without explicit correspondence between medial axis vertices and surface regions, the simplification process can destroy structural integrity. The medial axis may no longer faithfully capture the shape's geometry, especially near fillets and feature regions where the rolling-ball interpretation breaks down.", "ap": "Structural MAT tracks correspondence explicitly throughout simplification. Every medial axis vertex is labeled with the surface region(s) it corresponds to. Edge collapses are sequenced according to priority rules that respect this correspondence, ensuring medial axis triangles reflect true symmetries. The method treats correspondence as a geometric constraint governing the order of operations.", "ww": "By maintaining explicit correspondence, each medial axis feature remains tied to the surface symmetry it represents. Priority control ensures that important structural features (e.g., fillets) are preserved before simplifying less important parts. Correspondence also guides decisions about which edges should collapse, naturally enforcing boundary regularity.", "po": "The result is a medial axis that is runtime-efficient, structurally aligned with input geometry, has clean boundaries, high-quality triangles, and robust to noise. Performance improves across a large test set and on 10,000 diverse shapes; the method remains expressive for both articulated shapes and CAD models."}}, {"t": "ProXeek: Seeking and Leveraging Real-World Objects and Environments as Haptic Proxies for Virtual Reality through Multimodal Reasoning", "th": "haptic VR interaction", "m": ["large language model", "multimodal reasoning", "proxy matching"], "pr": "Providing realistic haptic feedback in VR without bulky hardware or pre-fabricated physical proxies", "ap": "LLM-based multi-agent system using multimodal reasoning to match virtual objects with real-world proxies", "co": "Leverages environmental snapshots to identify viable haptic proxies with higher fidelity than 3D-printed replicas", "u": "https://www.semanticscholar.org/paper/9f27d2de680da2dba1dc836890f24ed7b552c832", "rc": {"bp": "Virtual reality feels immersive when you can touch and feel objects. Active haptic devices (motors, cables) that push back on your hands are ideal but bulky and expensive. The clever idea: use whatever's lying around in your room—a pillow, cup, table—as a stand-in for the virtual object you're touching.", "wh": "Finding the right physical proxy for a virtual object requires reasoning about both the virtual thing (how it should feel and resist touch) and the real environment (what objects are available, their material properties, their shape). A designer must annotate virtual objects with haptic hints, and the system must match those hints to real objects. This is inherently multimodal and ambiguous.", "ap": "ProXeek uses a large language model capable of vision and reasoning to solve this matching problem. Designers annotate virtual interactables with haptic characteristics via a node-based editor. When a user starts VR, they photograph their room using the VR headset. The LLM-based system combines understanding of the virtual haptics, the room's physical objects, and geometric constraints to find the best match.", "ww": "Large language models trained on diverse internet text and images have strong reasoning about objects, materials, and spatial fit. By framing the matching as a reasoning task (rather than pure geometry), the system can leverage semantic understanding: a squishy pillow \"feels like\" a cushioned seat; a wooden table is rigid. Multi-objective optimization balances multiple goals—comfort, realism, safety.", "po": "ProXeek effectively identifies viable proxies and delivers significantly higher haptic fidelity than 3D-printed replicas and visual-only interaction, according to user studies. It enables designers to opportunistically use real-world objects without pre-fabrication or special setup, making haptic VR practical in ordinary homes."}}, {"t": "NeuBase: Spline Surfaces with Neural Basis Functions", "th": "neural surface representation", "m": ["neural basis functions", "subdivision surface", "neural map"], "pr": "Neural surface representations lack intuitive real-time deformation and geometric properties for manipulation", "ap": "Catmull-Clark subdivision base surface with neural basis function offset fields via neural maps", "co": "Enables direct real-time deformation preserving linearity, locality, smoothness, and affine equivariance", "u": "https://www.semanticscholar.org/paper/a0a4e2605d2e19115e1cc95a7cd450f21cda5f24", "rc": {"bp": "Designing surfaces by hand is tedious—you move control points, waiting for the surface to update each time. Real-time deformation, where dragging a handle smoothly deforms the surface instantly, is what you want. Neural networks can fit surfaces to data beautifully, but they're black boxes that resist direct manipulation.", "wh": "Neural parametric surfaces fit detail well but break key geometric properties. Moving a control point should move only nearby surface—local control—and shouldn't break smoothness or require retraining. Neural networks globally couple all parameters to all outputs, so local intuitive edits are impossible.", "ap": "NeuBase pairs a traditional subdivision surface base (which has local control and smoothness built in) with an offset field defined by neural basis functions. The neural basis functions are encoded via a learned map. This hybrid approach lets the surface fit detail via neural learning while preserving the desirable properties of classical subdivision surfaces.", "ww": "By construction, the method maintains linearity (the surface depends linearly on control weights), locality (each control point influences only nearby surface), smoothness (inherited from subdivision), and affine equivariance (rotating the control mesh rotates the surface). These properties are not learned; they're architectural. So direct manipulation works without retraining.", "po": "NeuBase supports intuitive real-time surface deformation: designers deform the control mesh and see results instantly. The surface achieves better fitting accuracy than other neural parametric representations while staying efficient even for complex shapes with dense control meshes. It balances neural expressiveness with classical geometric guarantees."}}, {"t": "Walk on Decomposed Subdomains: A Hybrid Monte Carlo–Deterministic Solver for Elliptic PDEs", "th": "PDE solving", "m": ["monte carlo", "domain decomposition", "hybrid solver"], "pr": "Solving elliptic PDEs on complex geometries requires either heavy meshing or long slow random walks with high variance", "ap": "Hybrid approach combining Monte Carlo first-passage operators with deterministic global linear solve", "co": "Achieves geometric flexibility of Monte Carlo with stable, reusable solution operators and controlled variance", "u": "https://www.semanticscholar.org/paper/a0afb5b2a3cf8dfa6dd65a6efeb97b4c585c8ddd", "rc": {"bp": "Many phenomena in graphics and engineering are governed by elliptic PDEs—Poisson's equation for smoke, heat transfer for materials, electromagnetic potentials. Solving them on complex evolving shapes (like deforming cloth or fracturing materials) is slow and requires heavy mesh construction.", "wh": "Traditional methods (finite element or finite difference) require meshing the domain, often with extreme refinement near geometric features. Grid-free Monte Carlo methods (random walk techniques) adapt to any geometry but lose accuracy fast, especially near boundaries. Neither approach is ideal: finite element is slow and meshing-heavy; Monte Carlo is grid-free but high-variance and slow to converge.", "ap": "Walk on Decomposed Subdomains combines both approaches. The domain is split into simple, regular pieces. Within each piece, Monte Carlo estimates local solutions (Poisson kernels) where random walks are short and variance is controlled. These local solutions are assembled into a sparse global system solved deterministically, replacing the need to simulate random walks across the whole domain.", "ww": "Decomposition makes Monte Carlo estimates stable: short walks mean low variance. The deterministic global solve then uses these local operators as building blocks, trading the stochastic variance of long walks for a fixed, resolution-dependent discretization error. The local estimates are reusable across different boundary conditions, further amortizing cost.", "po": "The method combines the geometric flexibility and parallelism of Monte Carlo with the stability of deterministic solves. It naturally handles arbitrary and evolving geometry without meshing, adapts computational effort to geometry complexity, and provides stable, reusable solution operators for repeated problems."}}, {"t": "Generalized Aberrations for Processing-Aware Optical Design", "th": "optical design optimization", "m": ["ray aberrations", "levenberg-marquardt", "end-to-end optimization"], "pr": "Processing-aware optical design lacks effective second-order optimization due to rank-deficient Jacobians", "ap": "Generalized transverse ray aberrations lifting scalar losses into high-dimensional ray-level residuals", "co": "Enables robust Levenberg-Marquardt optimization for end-to-end imaging pipeline design", "u": "https://www.semanticscholar.org/paper/a164aa8aaccaabc2fec7ee662e38ee4589ae64d4", "rc": {"bp": "Camera lenses today are not just optical systems—they're part of an end-to-end pipeline: optics capture light, then software reconstructs and enhances the image. Modern design should optimize the optics specifically for the downstream software, not for traditional goals like flat focus or low aberration. This needs better mathematical tools.", "wh": "Optimizing optics jointly with software means the designer must choose from thousands of optical parameters to minimize a single number (image quality or reconstruction loss). The Jacobian matrix (how each parameter affects the result) becomes rank-deficient: there are many more parameters than constraints, so standard least-squares methods like Levenberg-Marquardt fail with numerical instability.", "ap": "The paper introduces generalized transverse ray aberrations (GTRA), a generalization of classical spot-radius optimization. Instead of working with a single scalar loss, GTRA lifts scalar task-driven losses into high-dimensional ray-level residuals. This creates many more constraints, filling out the Jacobian matrix and making it invertible and well-behaved for Levenberg-Marquardt solvers.", "ww": "Classical optical design used ray aberrations (deviations per ray) to drive optimization—this gives many constraints per design. Task-driven end-to-end design uses one scalar loss—too few constraints. GTRA bridges the gap by decomposing the scalar loss back into per-ray residuals, which restores the constraint-rich structure that makes robust solvers work.", "po": "The method decisively outperforms first-order optimizers on over 100 design instances for end-to-end image restoration, including smartphone telephoto lenses, microscope objectives, and cameras. It brings the robustness of traditional optical design to the flexibility of end-to-end pipelines, making joint optimization practical."}}, {"t": "Role-Aware Virtual Agents for Navigational Interaction guided by a Multimodal Large Language Model", "th": "virtual agent navigation", "m": ["multimodal language model", "navigation planning", "role-aware behavior"], "pr": "Virtual agents need consistent role-aligned behaviors in dynamic immersive environments with spatial reasoning", "ap": "Multimodal LLM interprets scene information and role instructions to generate discrete navigation decisions", "co": "Enables role-aware embodied agent behaviors responding to dynamic user actions in AR/VR", "u": "https://www.semanticscholar.org/paper/a16ead96909aaa0d7a932cf767a65cf035f13f92", "rc": {"bp": "Animated characters in VR need to move and respond convincingly to what you're doing. A simple script that follows waypoints is rigid and unnatural. If you're hiding and the character is seeking, it should move like someone searching, not like a robot. Large language models trained on human behavior might encode this intuition.", "wh": "Agents need to generate navigation decisions that match their role in a narrative (seeker vs. hider), respond to dynamic changes in the scene or user behavior, and move in spatially consistent ways—all in real time in an immersive environment. Language models excel at reasoning but don't inherently understand spatial layout or embodied physics.", "ap": "The system feeds multimodal inputs to a large language model: scene information (geometry, room layout), user state (location, actions), and a high-level role instruction (seeker, guard, etc.). The model outputs navigation decisions and stylized planning paths. These are then executed by the virtual agent in the immersive environment.", "ww": "Modern multimodal language models integrate vision, text, and reasoning, so they can understand scene context and role constraints jointly. By grounding language instructions in spatial information, the model can reason about the character's intentions and how to move in ways that express that role.", "po": "The approach enables virtual agents to behave consistently with narrative roles and respond to dynamic actions. In examples like hide-and-seek, agents reason about the user's possible intentions given the role and the scene, generating movement behaviors that feel intentional rather than scripted."}}, {"t": "AniGen: Unified S3 Fields for Animatable 3D Asset Generation", "th": "animatable asset generation", "m": ["s3 fields", "flow-matching", "confidence-decaying fields"], "pr": "3D generation models produce static geometry; auto-rigging produces inconsistent skeletons and skinning", "ap": "Unified S3 Fields framework with confidence-decaying skeleton field and dual skin feature field", "co": "Directly generates animate-ready 3D assets with consistent rigging from single-image conditioning", "u": "https://www.semanticscholar.org/paper/a1fe3edc36d65e9e7b5dfdb0d39ff6141f01b9bb", "rc": {"bp": "Creating animated characters for games and film is expensive: you model the shape, then rig it with a skeleton and weights that dictate how the surface deforms as joints move. Generative models can create static 3D shapes from images, but automatically rigging them (auto-rigging) is brittle and often produces skeletons that don't match the geometry.", "wh": "The skeleton and skin weights are invisible in the rendered image, so it's hard to predict them from vision alone. The topology of the skeleton (which joints connect) must match the topology of the shape's parts. Topology is a discrete global property; local image cues don't constrain it well. Existing systems predict rigs after generating geometry, losing geometric coherence.", "ap": "AniGen represents shape, skeleton, and skin weights as three fields (S3 Fields) defined over the same spatial domain. It treats them as mutually consistent: the skeleton should trace symmetry axes, and skin weights should distribute influence smoothly. A flow-matching generative model first synthesizes a sparse structural scaffold (rough skeleton and shape), then fills in dense geometry and articulation in a learned latent space.", "ww": "Representing all three as fields over the same space forces geometric coherence. The model learns that bone predictions are ambiguous at Voronoi boundaries (edges where multiple surface regions equidistant), so it uses a confidence-decaying skeleton field to handle uncertainty. Decoupling skin weights from specific joint counts allows one network to predict rigs of arbitrary complexity.", "po": "AniGen directly generates animate-ready 3D assets from a single image. It substantially outperforms state-of-the-art systems by producing topologically consistent skeletons and skin weights that match the generated geometry, eliminating the brittleness of post-hoc auto-rigging."}}, {"t": "Learning a Delighting Prior for Facial Appearance Capture in the Wild", "th": "facial appearance capture", "m": ["inverse rendering", "delighting prior", "dataset modulation"], "pr": "In-the-wild facial appearance capture struggles with complex disentanglement of reflectance from unknown illumination", "ap": "Trains delighting prior network with dataset latent modulation integrating heterogeneous training data sources", "co": "Achieves high-quality reflectance estimation from casual video, enabling relightable facial scan collections", "u": "https://www.semanticscholar.org/paper/a64b4687cf2fbcfd04171157022038c8496fffe7", "rc": {"bp": "Professional facial capture (scanning faces to build digital copies for rendering) requires expensive studio setups with precise lighting. Smartphone cameras in the wild have unpredictable, uncontrolled illumination. We want studio-quality results from casual videos, which means disentangling what the face looks like from how the lighting happened to fall on it.", "wh": "Inverse rendering—solving for surface reflectance given an image—is ill-posed when illumination is unknown. The same pixel could be bright because the surface is shiny or because the light was strong. Many combinations of reflectance and lighting explain the image equally well, so optimization gets stuck.", "ap": "Instead of purely solving for reflectance, the method trains a powerful neural \"delighting\" network as a prior. It learns to estimate per-pixel illumination from the input video. Training combines two sources: the OLAT dataset (same face lit from different directions) and Light Stage scans (studio gold-standard captures). Dataset Latent Modulation (DLM) fuses these heterogeneous sources by conditioning the network on learnable source-aware tokens.", "ww": "A learned delighting prior constrains the otherwise ill-posed inverse problem. The network learns which variations are reliable (surface properties) and which are artifacts of lighting from the training data. By training on both casual and studio data with source-aware conditioning, the model learns universal delighting principles rather than overfitting to one data source.", "po": "The approach enables simple, automatic appearance capture from casual smartphone video, outperforming prior methods significantly. The authors transform the multi-view NeRSemble dataset into NeRSemble-Scan, a large-scale collection of 4K-resolution relightable facial scans, and open-source both the model and dataset to democratize high-end facial capture."}}, {"t": "PR-Cage: Progressive Feasibility Relaxation for Tight Bounding Cage Generation", "th": "cage generation", "m": ["quadric error metric", "edge collapse", "feasibility relaxation"], "pr": "Cage generation balances conflicting objectives of simplicity and tightness for geometric fidelity", "ap": "Progressive feasibility relaxation via staircase schedule on thickness parameter with constrained QEM framework", "co": "Achieves extreme simplification while maintaining high geometric adherence through nested optimization", "u": "https://www.semanticscholar.org/paper/a6eb454c649f5138b1a744c05e64538e3f6b412a", "rc": {"bp": "A cage is a low-polygon surface that wraps tightly around a more detailed shape. It serves as a simple proxy for rigging (animating by moving cage vertices), level-of-detail rendering, and deformation. A good cage is simple (few faces) and tight (stays close to the original shape). But simplicity and tightness fight each other.", "wh": "Aggressive simplification makes the cage diverge from the shape. Tight cages stay complex. The tradeoff is hard to navigate manually. Furthermore, simplification algorithms can create degenerate triangles (zero area) or flipped normals (facing inward), breaking geometric validity.", "ap": "PR-Cage uses nested optimization: an outer layer that guides simplification via a thickness parameter tau (defining how far the cage can stray from the original), and an inner iteration using Quadric Error Metric (QEM) with linear inequality constraints to suppress degeneracy and normal flips. The key insight is progressively relaxing tau on a schedule, which allows the algorithm to find the optimal balance between simplicity and tightness.", "ww": "Gradually relaxing the feasibility region (increasing tau) first forces a tight cage, then permits looser approximations as simplification proceeds. This guides the optimization toward good tradeoffs. Inequality constraints prevent invalid triangle configurations—the algorithm won't accept a solution with flipped normals or degenerate geometry.", "po": "PR-Cage consistently outperforms existing methods, achieving extreme simplification while maintaining high geometric fidelity. Its utility is demonstrated in downstream applications where tight cages are essential, and it relies only on simple edge operations (collapses and flips), ensuring high computational efficiency and robustness."}}, {"t": "Nexus: Native Mesh Generation with Diffusion", "th": "mesh generation", "m": ["diffusion", "octree", "topology modeling", "space-time interval"], "pr": "Autoregressive mesh methods suffer from error accumulation and inefficient inference", "ap": "Diffusion-based decoupled generation of vertices via octree and topologies via embeddings", "co": "Outperforms autoregressive baselines via holistic, parallelizable mesh generation avoiding sequential bottlenecks", "u": "https://www.semanticscholar.org/paper/a9a986382361845b0c753e4a3735592fe900ae6d", "rc": {"bp": "When you design a character, build a video-game world, or create special effects for a film, you need 3D shapes made from triangles—the most universal building block in computer graphics. Today, most of these shapes are sculpted by hand or generated sequentially, one piece at a time, which is slow and prone to mistakes because early errors cascade through the entire process.", "wh": "The team splits the problem into two independent tasks that can happen in parallel. First, they use a diffusion model—a process that gradually refines noise into a clean image—to generate the vertex positions (the corner points of all the triangles). They organize these vertices as an octree, which is a hierarchical 3D grid that lets them work coarse to fine, like sketching with broad strokes then adding detail. Second, they tackle the harder problem: figuring out which vertices connect to form faces (the actual triangles). They invented something called Space-time Interval, an extension of a prior concept called Spacetime Distance, that encodes all the connectivity information into a smooth, continuous embedding per vertex. Then another diffusion model reconstructs those embeddings to recover the final shape.", "ap": "", "ww": "Splitting vertex generation from connectivity generation avoids the bottleneck: vertices can be created efficiently without worrying about topology, and then topology can be derived globally rather than point-by-point. The diffusion approach inherently captures global structure because it refines the entire shape at once, and diffusion models are proven to be good at learning structure from data. The continuous embeddings from Space-time Interval allow complex, non-obvious topology—including non-standard configurations where surfaces fold in on themselves—to be recovered smoothly and globally.", "po": "The method outperforms hand-crafted, sequential approaches on standard datasets, and blind studies from 3D practitioners show strong preference for the results. It handles arbitrarily complex topology and scales to real-world scenarios like generating shapes from photographs, making it practical for production film, gaming, and interactive applications."}}, {"t": "Component Modes Synthesis Method with Multiple Partitions for Large-scale Eigenvalue Problem", "th": "modal analysis", "m": ["component mode synthesis", "domain partitioning", "basis acceleration"], "pr": "Component Mode Synthesis substructure bases do not span solution space efficiently for large-scale modal analysis", "ap": "Multiple spatially staggered domain partitions with low-frequency interface basis approximations", "co": "3 orders of magnitude accuracy improvement with better scaling on distributed computing clusters", "u": "https://www.semanticscholar.org/paper/b4e2c09b7b77c0a4ead896d256adc0ca091a2dba", "rc": {"bp": "When engineers design structures like buildings, bridges, or aircraft, they need to simulate how the thing vibrates and moves when disturbed. This vibrational analysis is critical for safety and performance, but for large, complex structures, the math becomes so expensive that it can take days to compute on supercomputers.", "wh": "The full problem is too large to solve in one go. Standard approaches divide the structure into smaller chunks (substructures) and solve each one independently, then stitch the results together. But the quality of the results depends on having a good basis—a set of mathematical building blocks—that captures all the important vibrational modes. When you use just the natural vibrations from each individual substructure, you don't get enough diversity to represent the full structure's behavior accurately, so you need many more modes than should theoretically be necessary.", "ap": "Instead of using vibration modes from just one partition of the structure, the researchers use modes from multiple overlapping partitions—like dividing a bridge into chunks in different ways and mining vibrations from each way separately. This gives a richer set of building blocks. They further speed things up by approximating the interfaces between chunks (the boundaries where pieces touch) using low-frequency signals derived from those modes, rather than keeping the full expensive representation at every interface.", "ww": "Overlapping partitions expose more of the structure's natural patterns; each partition captures different aspects of how the thing wants to move. Using modes from many different partitions is like getting suggestions from many different people—you get a more complete picture. The low-frequency approximation at interfaces works because most of the important information lives in the big, slow vibrations, not the tiny, fast ones, so you can throw away the fast wiggles without losing much accuracy.", "po": "The method improves accuracy by three orders of magnitude compared to standard Component Mode Synthesis, meaning you get the same answer using vastly fewer mathematical degrees of freedom. It also scales better on distributed supercomputers—communication and memory usage both improve—making large-scale simulations for film effects and industrial design far more practical."}}, {"t": "Semantic-Structural Alignment for Generative Pictorial Charts", "th": "generative visualization", "m": ["diffusion transformer", "semantic alignment", "structural guidance"], "pr": "Traditional statistical graphics lack visual appeal, memorability, and engagement compared to pictorial charts", "ap": "Multi-modal diffusion transformer with dual structural and semantic alignment guided by text and chart image", "co": "Generates artistically compelling pictorial charts maintaining structural consistency across visual channels", "u": "https://www.semanticscholar.org/paper/b6f416db6773802e499df51b1a4fc4ee3755c275", "rc": {"bp": "A bar chart showing sales numbers is precise but forgettable. A pictorial chart—one where bars are replaced by stacks of little coins or houses or people—is fun to look at and memorable. The challenge is to automate this transformation: take a boring statistical chart and turn it into an artistically compelling visual story while keeping the numbers accurate.", "wh": "You want two things at once, and they pull in opposite directions. You want artistic flair and visual interest—textures, shapes, thematic imagery—but you also want the chart to faithfully represent the underlying data. A system that blindly stylizes images might make things beautiful but wrong. You need a system that understands what the chart means (the statistics) and also respects the abstract structure (the grid, the axes, the proportions) while layering on artistic expression.", "ap": "The researchers frame this as two parallel control signals guiding a generative model. One signal is a text prompt—a description of the visual or semantic intent, like \"underwater theme\" or \"ancient Rome.\" The other signal is the original statistical chart itself, which provides the structure: \"this bar is 30% of the total, arranged vertically.\" They use a Diffusion Transformer (a neural network trained to gradually refine images) and inject two mechanisms to keep it honest: structural alignment, which anchors the output's spatial layout to the input chart, and semantic alignment, which borrows textures and artistic details from reference images to fill in the aesthetic layer.", "ww": "By separating structure from aesthetics as two independent controls, the model can learn them independently and then fuse them. The structural alignment acts as a \"fence\" preventing the artistic layers from distorting the data representation. The semantic alignment lets you borrow real, coherent visual styles rather than hallucinating them, because the model is conditioned on references that have the textures you want. Diffusion models naturally excel at composing multiple conditions into a coherent image.", "po": "The system produces pictorial charts that are both artistically compelling and mathematically faithful across diverse visual channels—length, area, angle, position—and semantic domains. Quantitative tests and user studies show it outperforms simpler approaches like stylization or image editing, enabling visual storytelling that actually respects the underlying data."}}, {"t": "Dual Contouring over Expanded Cubes (DCx) for Zero-Level Set Extraction from Neural Unsigned Distance Functions", "th": "mesh extraction", "m": ["dual contouring", "signed distance fields", "non-manifold handling"], "pr": "Extracting manifold and non-manifold surfaces from unsigned distance functions loses topology", "ap": "Extended Dual Contouring on expanded cubes with voxel-to-mesh lookup tables for arbitrary topology", "co": "Efficiently extracts both manifold and non-manifold surfaces from neural UDFs via optimization-based active cube detection", "u": "https://www.semanticscholar.org/paper/b7c2df840a2f0724a3a4cd7c452725187a538ed4", "rc": {"bp": "When you scan a real object with depth sensors or photogrammetry, or when a neural network predicts a 3D shape from an image, you get a continuous mathematical surface representation called a signed distance function. But some shapes—statues with overhangs, cloth with folds, hollow objects—can't be cleanly represented this way because the math breaks down at spots where topology is weird. You need a different representation that can handle any topology: unsigned distance functions.", "wh": "Unsigned distance functions (the distance from any point to the nearest surface, without caring about inside vs. outside) can represent any topology, including non-manifold shapes where surfaces fold back on themselves. But here's the catch: the standard tool for extracting a triangle mesh from these functions—Dual Contouring, which works brilliantly for signed distance—relies on detecting sign changes to figure out where the surface is. Without the sign, you lose that signal, and active-cube detection becomes unreliable. Also, in non-manifold regions, even detecting where to put triangle vertices becomes ambiguous.", "ap": "The researchers adapt Dual Contouring to work on unsigned distances, calling it DCx. Instead of asking \"did the sign flip?\", they use optimization to decide which voxel blocks (small 2×2×2 cubes) are active. Then, crucially, they operate on expanded cubes—groups of eight voxels—and use a lookup table mapping each possible local voxel configuration to a set of connectivity patterns (which vertices connect to which). This replaces hand-coded logic with template-based extraction: given a configuration, you already know which triangles to place and how they connect.", "ww": "Optimization-based activation works because unsigned distance can still be queried at every point; you just need to decide activity differently. The lookup table approach is powerful because it encodes non-manifold connectivity rules directly. By working on expanded cubes rather than individual voxels, the method has enough local context to make the right connectivity choices, avoiding the failure modes of standard Dual Contouring on unsigned distance.", "po": "DCx successfully extracts both manifold and non-manifold surface meshes from neural unsigned distance functions, which are increasingly common in neural 3D reconstruction. The method is simple, easy to implement, and handles edge cases that broke prior work, making it practical for generative 3D and reconstruction pipelines."}}, {"t": "Learned Universal Interoperable Virtual Try-ON", "th": "virtual try-on", "m": ["diffusion correspondence", "SMPL proxy", "physics simulation"], "pr": "Virtual try-on requires garment-to-body transfer despite mismatched skeletons and dense correspondences", "ap": "SMPL proxy with geometry-driven and diffusion-based correspondence models plus simulator-driven fitting", "co": "Handles complex multi-layer garments on diverse humanoids while maintaining physical plausibility", "u": "https://www.semanticscholar.org/paper/b866b857860c8953dc1b843ffaaee0de3fac7b39", "rc": {"bp": "In film and games, dressing a character in clothing is tedious. A designer places each garment by hand, adjusting folds and collisions. The dream is to build a library of real clothing and characters, then automatically dress any character in any garment, even if they're wildly different shapes (a human in a robot's outfit, a cartoon character in historical armor). This would unlock massive asset reuse.", "wh": "Garments and characters rarely come from the same pipeline; they have different underlying structures (skeletons), different body shapes, different numbers of vertices, and different geometric scales. Standard correspondence methods—figuring out which point on the garment touches which point on the body—assume dense point-to-point alignment, which breaks when you're trying to match a tight shirt designed for one body to a completely different body with different proportions. You also need the clothing to drape realistically under gravity, not just snap into place.", "ap": "The key insight is to use a universal intermediate form: SMPL, a standard parametric human body model. They break the problem into two stages. First, align the garment to SMPL using a geometry-driven method that understands shape. Second, align SMPL to the target character (human, robot, cartoon) using a diffusion model that leverages both rich visual features from multiple camera angles and a pretrained 2D vision model that understands human form, even across stylization. Once they have correspondences, they register SMPL's displacement surface to the garment, then smoothly transition the garment through SMPL to the target body, using physics simulation to make it drape naturally.", "ww": "SMPL acts as a Rosetta Stone: every garment learns to align to it, and every character learns to align to it, so transitively they can all align to each other. Using a diffusion model for the second stage is smart because it's naturally good at understanding spatial correspondence under large pose and shape changes. The physics simulation ensures the garment doesn't pass through bodies or fold unnaturally; it finds the equilibrium state under gravity.", "po": "The system handles complex, non-manifold garment geometry and generalizes to humans, robots, cartoons, and creatures while remaining computationally tractable. It enables fast asset reuse in production and supports post-transfer customization like changing garment size, solving a longstanding bottleneck in character dressing pipelines."}}, {"t": "Lifting Lines and Tone: Image-Space Stylization in Path-Space", "th": "non-photorealistic rendering", "m": ["path-space lifting", "stylized rendering equation", "geometry-driven mapping"], "pr": "Path-space stylization lacks mechanism for enforcing image-space consistency from hand-drawn styles", "ap": "Geometric lifting of image-space stylizations into path-space via parametrization and parallel transport", "co": "Principled SRE-compatible framework enabling feature lines and tone while preserving image-space structure", "u": "https://www.semanticscholar.org/paper/bf8c9518d79f12fbe5951208eaa02881186a4590", "rc": {"bp": "Non-photorealistic rendering (NPR) is the art of making 3D scenes look like drawings, paintings, or stylized illustrations instead of photographs. Feature lines (the silhouettes and sharp edges you see in a sketch) and tone-based styles (hatching, stippling) are essential to the look. But modern rendering systems compute light bouncing through space (path-space rendering), and image-space stylization techniques designed for 2D don't play well with it.", "wh": "Image-space stylization—detecting edges and hatching patterns by looking at the 2D rendered image—can produce inconsistent results under complex lighting because it treats every pixel independently. Modern physically-based rendering (the stylized rendering equation, SRE) computes light paths through space, which is powerful and accurate, but it has no native way to enforce that a feature line stays in the same place when light interacts with other objects. You need a way to lift 2D image patterns into 3D space while respecting light transport.", "ap": "The researchers propose a unified framework: for any image-space stylization, establish a geometric mapping from image-space to path-space. For feature lines, they combine path-space geometry (where objects are in 3D) with a mathematical tool from differential geometry called parallel transport, which lets you slide information along a curved surface while keeping it locally consistent. This gives you a curvature-aware, stochastic line detection that lives in path-space but produces image-consistent results. For tone-based styles (hatching), they derive a canonical lifting using ideas from wave optics (stationary-phase approximations), anchored to a material-independent mapping.", "ww": "Geometric mappings preserve structure: if a line is a silhouette in 3D, it should stay a silhouette when light bounces around. Parallel transport prevents distortion when the underlying geometry curves. The wave-optics motivation for tone is elegant: stationary-phase theory tells you which regions of path-space contribute most to image-space patterns, letting you do the computation where it's efficient and then project back to the image.", "po": "The method enables image-space NPR styles to coexist with complex light transport effects—shadows, reflections, transmittance—while maintaining visual consistency. Feature lines and tone styles now interact naturally with rendering physics, enabling richer, more visually coherent non-photorealistic images."}}, {"t": "Robust Planar Maps for 3D Vectorization", "th": "3D vectorization", "m": ["planar partitioning", "spatial hierarchy", "curve-line intersection"], "pr": "Vectorizing 3D scenes with proper occlusion requires robust handling of curve intersections and numerical errors", "ap": "Spatial hierarchy acceleration provides fundamental planar map representation with curve-line intersection", "co": "Scalable, output-sensitive vectorization robust to curve soup with topologically valid results", "u": "https://www.semanticscholar.org/paper/c2c2e8ebbe080a492e7b7d6528c76206a56104f5", "rc": {"bp": "When you draw a stylized illustration of a 3D scene, you draw outlines (silhouettes where the object edge faces away), curves from the surface (like contour lines on a map), and regions of solid color. Converting a 3D scene into a clean 2D vector illustration—curves and filled regions—is called vectorization. This is crucial for art direction and technical illustration.", "wh": "Curves from 3D geometry can be arbitrarily complex: they might cross each other (perspective!), touch tangentially, or create intricate tangles. When you try to organize these into a clean 2D map of regions (where each region is a single flat color), you need to know the precise topology—which region touches which, what's on top. Even tiny numerical errors can break the topology. Also, curves come from different source geometries: triangles, smooth splines, subdivision surfaces. You need a method that works across all of them.", "ap": "The key insight is that the spatial acceleration structure—the data structure used to speed up curve-curve intersection queries—can itself become the planar map representation. They build a hierarchical grid, query which grid cells are crossed by which curves, and this automatically partitions the image plane into regions. Cells are well-defined geometrically and remain valid even with numerical noise. They replace the hard problem (detecting all curve-curve intersections perfectly) with an easier one: checking which curves cross which grid cells, then detecting curve-line intersections (a line from the grid to a curve). They allow trade-offs: you can reduce precision to speed up, and the output remains topologically valid.", "ww": "Spatial hierarchies are robust because cells are always well-defined—numerical errors just shift a boundary slightly, they don't invalidate the topology. Curve-line intersection is algebraically simpler than curve-curve intersection, so it's faster and more stable. The hierarchy also naturally handles \"curve soup\" (segments that don't explicitly connect in the input) because the algorithm discovers connectivity implicitly from intersections.", "po": "The method robustly vectorizes complex 3D scenes across arbitrary surface representations and scales to scenes with many curves. It's orders of magnitude more efficient than naive approaches while handling messy real-world data like segment gaps, providing the clean, topologically valid 2D vector illustrations that traditional illustrators depend on."}}, {"t": "Soft Anisotropic Diagrams for Differentiable Image Representation", "th": "neural image representation", "m": ["gaussian splatting", "apollonius diagrams", "differentiable rendering"], "pr": "Gaussian splatting image representation lacks differentiability and efficient spatial representation", "ap": "Soft anisotropic Apollonius diagrams with learnable per-site temperatures and top-K propagation rendering", "co": "4-19x speedups over baselines with 46 dB PSNR on Kodak at matched bitrate via efficient GPU computation", "u": "https://www.semanticscholar.org/paper/c31bcff334a3f57122537816efca96ab5e420f66", "rc": {"bp": "Today, images are stored as grids of colored pixels. But you can also represent an image as a small set of abstract objects—Voronoi regions, each colored by a weighted blend—and store just the objects, not the grid. This is compact and lets you edit and resize images continuously. The challenge is making this work with neural networks and keeping it fast enough for real-time graphics.", "wh": "Most neural representations of images live in an abstract mathematical space (called a latent space) that's hard to interpret or edit. Soft Anisotropic Diagrams (SAD) tries to use an explicit, geometric representation: sites (points) with color and shape, blended at each pixel. But making this representation smooth enough for neural networks to learn—trainable, with good gradients—is tricky. Also, computing which sites affect each pixel is slow if done naively, and you need to keep the per-site costs constant regardless of image complexity.", "ap": "Each site specifies an anisotropic metric (a direction-dependent distance measure, like an ellipse) and a color weight, and each pixel is colored as a soft blend of its nearest sites. This creates a generalized Voronoi partition (called an Apollonius diagram). The trick is making it trainable: they use a softmax to create smooth blending with learnable per-site temperatures. For speed, they maintain a per-pixel top-K list of nearest sites and update it using a scheme inspired by jump-flooding (a fast algorithm for nearest-neighbor search), augmented with random sampling to ensure global coverage. Training uses gradient-weighted initialization and adaptive budget control (adding sites when needed, pruning when not).", "ww": "Softmax blending is smooth and differentiable, letting gradients flow during training. The top-K approximation is fast because queries are local and small; the jump-flooding update is inherently parallel, friendly to GPUs. Anisotropic metrics are more expressive than circles; they let sites adapt to local image structure. Adaptive densification and pruning let the method use just enough complexity for each image, avoiding overfitting.", "po": "SAD is fast (2.2s to encode on Kodak, vs 28s for a competitor), compact, and beats Image-GS and Instant-NGP at the same bitrate and computational budget. It provides a clean, interpretable, trainable representation suitable for neural graphics pipelines and real-time applications."}}, {"t": "A practical partitioner for distributed simulations on sparse dynamic domains using optimal transport", "th": "distributed simulation", "m": ["optimal transport", "power diagram", "domain partitioning"], "pr": "Physics simulations on rapidly evolving dynamic domains require even load distribution and minimal inter-node data exchange", "ap": "Optimal transport power diagram partitioner with surface and temporal consistency metrics", "co": "Outperforms state-of-the-art in film production distributed simulations via artist-friendly partitioning", "u": "https://www.semanticscholar.org/paper/c49244b243f1352ff41c4a9b8d736e261e2bfbe1", "rc": {"bp": "In visual effects (fire, explosions, water splashing), artists simulate fluid flow, flames, and smoke by solving physics equations on large computational grids. These simulations can take hours on a supercomputer. To speed this up, studios distribute the work across many computers, each solving a piece of the grid. The bottleneck: how do you split the grid to minimize communication and balance work fairly, especially when the active region shrinks and grows over time?", "wh": "Traditional partitioning divides the grid evenly, but in fire or fluid simulation, the interesting stuff is usually concentrated in a small region. If you partition evenly, some computers sit idle while others do all the work. If you partition adaptively, you might create many small pieces at boundaries that require expensive communication. You need something that balances work (even load), minimizes inter-node data exchange (few expensive messages), and stays consistent across time (partitions don't jump around wildly, confusing the artists).", "ap": "They use optimal transport, a mathematical framework from physics and economics that computes the most \"efficient\" way to redistribute resources. Optimal transport produces a power diagram—a partition of space where each region is associated with a generator point, and the region's size is chosen to be proportional to the local computational cost. The power diagram is intuitive: you can place generator points where the simulation is expensive, and the diagram automatically expands those regions. They also introduce metrics to quantify partition quality: a surface index (how much data crosses region boundaries) and a temporal consistency index (how much regions shift between time steps).", "ww": "Optimal transport theory guarantees that the partition minimizes wasted communication for a given load distribution. Power diagrams are geometric and artist-friendly—you can move points around intuitively. The metrics are grounded in what matters for production: communication cost and stability. By optimizing over these metrics on real film data, they found the sweet spot.", "po": "The method outperforms state-of-the-art partitioning on real production simulations of liquids, flames, and explosions, reducing communication and achieving better load balance while remaining intuitive for artists to control and predictable over time."}}, {"t": "MorphSkein: A Shape-Changing Afterimage Display Preserving Pixel Density During Surface-Area Changes Across Troposkein-Based Shapes", "th": "shape-changing displays", "m": ["persistence of vision", "troposkein geometry", "density preservation"], "pr": "Shape-changing displays lose pixel density as surface area expands, limiting usability", "ap": "Telescopic pole and LED-strip rewinders with troposkein geometry and angular velocity optimization", "co": "Preserves pixel density across expanding axisymmetric shapes via mathematical modeling and interpolation", "u": "https://www.semanticscholar.org/paper/c4b40104eb8be51f960feba2a8737012d04d8b00", "rc": {"bp": "Imagine a display made of spinning LED strips arranged like a spinning rope—the motion creates an illusion of a 3D shape, lit up with colors. As the shape morphs (the rope gets fatter or taller), you want the displayed image to adjust but stay readable: pixels should stay roughly the same size so text and details don't become invisible.", "wh": "Shape-changing displays (made from physical materials that morph) inherently change surface area as they move. If you want to cover a growing surface with a fixed number of LEDs, they spread out—pixel density drops, details vanish. You could add more LEDs, but then when the shape shrinks, you have too many LEDs crammed together and the display wastes energy. The challenge: keep pixel density nearly constant as the shape morphs without dynamically adding/removing LEDs.", "ap": "MorphSkein uses a troposkein—a shape mathematically formed by spinning cables under centrifugal force. LEDs are arranged on flexible strips wound on rewinders. As the base rotates faster, centrifugal force pushes the cables outward, making them wider and taller. As they shift shape, the system releases new rows of LEDs from the rewinders and renders extra columns per revolution on the strips. The density is preserved horizontally (more content per spin) and vertically (more rows as the troposkein expands).", "ww": "Troposkein geometry is predictable mathematically; the researchers model it and derive the relationship between rotation speed, shape, and required LED count. By releasing new rows opportunistically and increasing content per frame, they compensate for area changes. The key is getting the rotation speed right: it controls the final shape and determines how much new content to render to maintain density.", "po": "The system maintains pixel density (1.44 px/cm²) across naturally occurring
