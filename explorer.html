ture preservation.", "ap": "The method generates offset vertices and triangles explicitly, with energy penalties for feature loss. It builds geometry first, then establishes connectivity. It supports variable offset distances (different offsets on different parts) and uses conservative speed-ups to reject geometry that will not contribute to the output.", "ww": "By explicitly generating offset vertices and triangles with constraints that encourage sharp features to stay sharp, and by prioritizing geometry generation before connectivity, you can adapt local solutions to match the original features. Using exact arithmetic where robustness matters (detecting sharp edges, computing critical angles) and fast floating-point elsewhere balances precision and speed. Early rejection of non-contributing geometry skips wasteful computation.", "po": "Offset meshes can now preserve sharp edges and creases (mitered offsets) while supporting variable offset distances, and the method extends to imperfect meshes where prior techniques fail."}}, {"t": "Constant Mean Curvature Surfaces from Discrete Harmonic Maps", "th": "differential geometry", "m": ["harmonic maps", "discrete differential geometry", "willmore energy", "optimization"], "pr": "Discretizing constant mean curvature surfaces lacks direct boundary control and handles closed cases poorly", "ap": "Discretize via harmonic Gauss maps using Dirichlet energy minimization and novel Möbius-invariant formulation", "co": "Direct boundary control and natural handling of closed/periodic CMC surfaces with robust Willmore energy", "u": "https://www.semanticscholar.org/paper/fa87a6f23f6e155452042a4c514932d1c9bf92b5", "rc": {"bp": "Minimal surfaces—shapes that have the smallest surface area for their boundary—appear in physics (soap films), architecture (pavilions, domes), and art. A special case is constant mean curvature (CMC) surfaces, where the curvature is uniform everywhere; they have aesthetic appeal and appear in nature. Computing them from discrete data (points, boundary curves) is a classical challenge in discrete differential geometry.", "wh": "CMC surfaces satisfy a differential equation based on curvature, and computing them discretely requires careful numerical approximation. Standard discretizations can be fragile, especially for boundary-value problems. There is a classical continuous theory using Gauss maps (a way to encode surface orientation) that is elegant, but translating it to discrete meshes is not straightforward.", "ap": "The team discretizes CMC surfaces by requiring their Gauss maps to be harmonic, then solves a discrete Dirichlet energy minimization problem. They add a discrete Möbius-invariant energy formulation for robustness and show how to construct discrete CMC surfaces with control over boundary tangent planes.", "ww": "The key insight is that the Gauss map of a CMC surface is harmonic (solves Laplace's equation, the fundamental smoothness equation). Discretizing this relationship directly via harmonic energy minimization mirrors the continuous theory exactly. By using a novel Möbius-invariant discretization of energy for sphere-valued maps, the method achieves robustness beyond standard inverse-cotangent formulations.", "po": "CMC surfaces can be computed by solving simple, direct discretizations that remain faithful to the continuous theory, with control over boundary conditions and support for closed, periodic, and free-boundary examples."}}, {"t": "STyMo: Fast and Controllable Few-Shot Motion Style Transfer", "th": "motion style transfer", "m": ["motion synthesis", "style decomposition", "few-shot learning", "character animation"], "pr": "Motion style transfer typically requires large stylized datasets or pre-trained models with limited generalization", "ap": "Decompose style into static posture and temporal dynamics components trainable from seconds of paired data", "co": "Few-shot motion style transfer with interpretable runtime control over posture, exaggeration, and per-region style", "u": "https://www.semanticscholar.org/paper/faf7fc5343ce0bbd3570d683e0a416aafdc3da81", "rc": {"bp": "When animators or game developers want a character to move in a particular style—happy bouncing, angry stalking, old-age shuffling—they need to apply that style to motion. Training on large collections of styled motion is expensive and inflexible. A few-shot method that learns style from seconds of video and trains quickly would enable rapid iteration and easy authoring.", "wh": "Most motion style transfer methods require large, expensive datasets or pre-trained models that do not generalize outside their training set. Achieving this in minutes instead of hours would enable iterative authoring. The challenge is learning style quickly without overfitting.", "ap": "STyMo decomposes style into static posture and temporal dynamics, trains on paired before/after motion sequences, and learns to adjust posture intensity and temporal exaggeration at runtime. A gate prevents artifacts on out-of-distribution motions.", "ww": "Style has two independent pieces: a static component (posture—how the character holds themselves) and a dynamic component (the frame-to-frame motion signature). By decomposing these, you can train each separately and tune them independently at runtime (adjusting posture intensity or temporal exaggeration). A 'stylizability gate' detects when a motion is too different from training data and prevents artifacts.", "po": "Few-shot motion style transfer trains in one to two minutes from seconds of paired data, supports interpretable, tunable style control, and works on diverse motion styles from subtle emotional changes to exaggerated character archetypes."}}, {"t": "OmniHands: Robust Motion Capture of Interactive Hands via A Versatile Transformer", "th": "hand motion capture", "m": ["transformer", "tokenization", "attention"], "pr": "Hand motion capture lacks unified approach for single/interactive hands and real-world robustness", "ap": "Transformer with Relation-aware Two-Hand Tokenization and 4D Interaction Reasoning fusion", "co": "Universal hand capture from monocular/multi-view supporting both single and interactive hands", "u": "https://www.semanticscholar.org/paper/fdcfd1062f940599716e16d8354098b96fe21159", "rc": {"bp": "When you film someone's hands interacting—two hands reaching for an object, playing piano, or gesturing together—you want to replay that motion in animation or virtual reality. The challenge: reconstruct the exact 3D position and movement of both hands from a camera video, even as they touch, occlude each other, or move in complex ways. Getting hands right is the last mile in realistic digital humans.", "wh": "Hand capture fails in two ways. First, most methods either work on one hand alone OR two hands together, but not both fluidly—you have to retrain or switch approaches. Second, the real problem is ambiguity: from a flat video, figuring out where a hand's joints are requires understanding both its local shape and where it sits relative to the other hand. If hands are tangled together, the network can easily confuse left for right or miss which fingers belong where. Third, lab methods often break on real-world footage because the video is messier, the light changes, and the hands move faster than the training data showed.", "ap": "The authors build a universal architecture around a smart tokenization trick called Relation-aware Two-Hand Tokenization. Instead of treating each hand as an isolated set of numbers, they embed the spatial relationship between the two hands directly into the \"tokens\" (the way the network thinks about the data). This tells the network \"these two hand tokens are X units apart and oriented this way\" from the outset. On top of that, they add a 4D module that fuses the hand tokens across both space and time—using attention so the network can learn which parts of one hand's motion influence the other—then outputs the final 3D hand shape and how each hand moved between frames.", "ww": "Reasoning about hand relationships early (not as an afterthought) lets the network avoid the ambiguity trap: it knows from the start that one hand's position constrains the other. By encoding relative position as a first-class fact, the network doesn't have to spend capacity figuring out \"am I looking at two hands or is this a weird single hand?\" Moreover, fusing across time with attention means the network can use motion itself as a cue—if one hand pushes the other, the temporal flow makes it obvious which is which. This also makes the method robust to real footage because the temporal reasoning is flexible enough to adapt to messy videos.", "po": "The method works on a single hand, two hands, video, multi-view setups—anything with hands—without retraining. On standard benchmarks it recovers hand positions and movements accurately, and crucially it keeps working on real-world video where previous methods falter. This unifies a fragmented toolbox into one system, which matters for animation pipelines and VR applications that need to handle any hand scenario seamlessly."}}, {"t": "DealMaTe: Multi-Dimensional Material Transfer via Diffusion Transformer", "th": "material transfer", "m": ["diffusion", "lora", "attention optimization"], "pr": "Material transfer methods rely on text guidance and auxiliary networks with feature misalignment", "ap": "Diffusion framework with Multi-Dim 3D Shader LoRA and Shader Causal Mutual Attention", "co": "Text-free material transfer achieving high-fidelity results with low architectural complexity", "u": "https://www.semanticscholar.org/paper/fde0f7ea41a20ec4c3d38c6009aeddc64389b129", "rc": {"bp": "Imagine photographing a ceramic vase in one lighting setup, then asking: \"show me how this vase would look in bronze, under different light, with a glossy surface.\" That's material transfer—repainting the surface properties of an object in an image so it looks like a different substance. It's essential for art direction in film and games, where you want to try a thousand looks without reshooting.", "wh": "The old way: you fine-tune a giant diffusion model on text descriptions and reference images, requiring lots of data and compute. Better ways add auxiliary networks to help guide the diffusion—but each network is extra baggage, and you have to retrain them for new material types. The real tension is this: a material isn't just a color—it's how the surface responds to light (shiny vs matte), how shadows fall on it, how light bounces inside (like wax). An image only shows one lighting moment. To transfer materials correctly, you need to separate out the geometry (the shape), the lighting, and the surface properties—which means somehow reasoning about depth, surface normals (the direction each tiny surface patch is facing), and light direction from a flat photo. Current methods either guess or require manual input.", "ap": "DealMaTe uses diffusion (a way to gradually build an image from pure noise) but instead of feeding it text, it feeds it geometry facts: a depth map (how far each pixel is from the camera), a normal map (which direction each surface faces), and a lighting map (where the light comes from). These three things paint a picture of the shape and lighting environment. Then, instead of retraining the core diffusion model, they attach lightweight adapters (LoRA modules tuned for shaders, i.e., surface properties) that steer the diffusion toward the target material without touching the base model. They also optimize the internal attention mechanism (the way the model weighs information) to handle multiple condition maps at once without bloating compute time.", "ww": "By feeding geometry and lighting as explicit inputs rather than hoping the model infers them from text, you remove a layer of indirection—the model doesn't have to guess \"oh, 'bronze' means this depth and normal.\" The lightweight adapters work because the base diffusion model already knows rich image statistics; you're just steering it with LoRA (like a gentle nudge) rather than overhauling its weights. Caching keys and values in attention means the model doesn't recompute the expensive parts for each material condition, so the overhead stays low even with three geometry layers to process. This efficiency is key to a tool that artists will actually use interactively.", "po": "You can throw arbitrary input materials at the system—wood, metal, fabric—and high-fidelity transfers appear in seconds without retraining and without text prompts. The depth/normal/lighting inputs make it stable (materials transfer correctly even when lighting changes) and the low computational cost means it's practical for content pipelines. No auxiliary networks to maintain, no text tuning headaches."}}, {"t": "Low-Rank Koopman Deformables with Log-Linear Time Integration", "th": "deformable simulation", "m": ["koopman operator", "dynamic mode decomposition", "reduced-order modeling"], "pr": "Deformable simulation is computationally slow; Koopman models limited to single shape/discretization", "ap": "DMD-based Koopman operator with log-linear time integration generalizing across shapes/resolutions", "co": "Fast deformable simulation and shape optimization via generalized low-rank Koopman learning", "u": "https://www.semanticscholar.org/paper/fe347b42d3987e57af0a3248f236fd9a25b210ba", "rc": {"bp": "Simulating how soft objects deform—cloth draped on a mannequin, a rubber duck bouncing, or a sheet of metal bending—requires computing the shape at every time step, which is slow and expensive. The payoff: faster iteration for animators and engineers. Instead of waiting hours to preview a motion, you want the answer in seconds. This matters for design: if you can simulate 100 variations of a part's thickness to find the one that flexes just right, you've won.", "wh": "The straightforward approach: solve physics equations forward in time, step by step. Each step is cheap (just matrix multiplication for deformable objects) but you need thousands or millions of them for a video or animation of any length. The math describes how the shape evolves—it's deterministic—but you pay the time cost every single time. Worse, if you're trying to optimize (e.g., \"adjust the thickness so the final shape is perfect\"), you need to run the whole simulation backward and forward, which is prohibitive. Classic reduced-order models (simplified versions that only track important motion, not every tiny detail) can speed this up, but they're usually locked to one specific object shape and one mesh resolution. Retrain for a new shape? Start over.", "ap": "The authors reframe deformable motion using Koopman operator theory—a mathematical lens that says: 'the way shapes evolve over time can be learned as a simple linear operation in a transformed space.' They use Dynamic Mode Decomposition (DMD), a technique that looks at a sequence of shape snapshots and extracts the essential patterns of motion. Once learned, predicting the future shape is just matrix multiplication—no time-stepping loop needed. To make this practical, they extend the standard DMD to work across different shapes and mesh resolutions: instead of training one model per object, they train one model that understands the family of deformation behaviors and can apply them to any member of the family.", "ww": "Koopman works because physics isn't actually random—deformable motion follows patterns. By learning those patterns once (not solving from scratch each time), the model captures the essence of how this material behaves. Linear multiplication in the learned space is exponentially faster than marching through time. The multi-shape generalization works because the authors identify that the core dynamic—the low-rank patterns of deformation—are shared across shapes, even if the details differ. This is intuitive: a thin sheet folds similarly whether it's steel or copper, whether it's a mm-scale shim or a meter-wide panel; the pattern is universal.", "po": "You can predict entire trajectories of deformation in log-linear time (a huge speedup) and skip most of the intermediate steps, keeping only accuracy where it matters. For optimization tasks like control—'bend this part to achieve this goal'—the speedup is transformative because you no longer simulate forward 10,000 times; you evaluate the learned operator a few times. Best of all, you can optimize across shapes and resolutions together, which was impossible before. A designer can now explore thousands of geometric variations in the time it used to take to simulate a single one."}}];
let query = "", shown = 0, filtered = DATA, PAGE = 40;
const list = document.getElementById("list"), countEl = document.getElementById("count"), moreBtn = document.getElementById("more");
function esc(s){return (s||"").replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function sec(cls,lbl,txt){ return txt?`<div class="sec ${cls}"><span class="lbl">${lbl}</span><p>${esc(txt)}</p></div>`:""; }
function story(rc){
  if(!rc) return "";
  return `<details class="story"><summary>read the full first-principles story</summary>
    ${sec("bp","the big picture",rc.bp)}
    ${sec("wh","why it's hard",rc.wh)}
    ${sec("naive","the naive solution",rc.naive)}
    ${sec("ap","the core idea",rc.ap)}
    ${sec("mech","how the mechanism runs",rc.mech)}
    ${sec("math","mathematical concepts",rc.math)}
    ${sec("dots","connecting the dots",rc.dots)}
    ${sec("ww","why it works",rc.ww)}
    ${sec("po","the payoff",rc.po)}
    ${sec("limits","limits and assumptions",rc.limits)}
  </details>`;
}
function card(r){
  const m = (r.m||[]).slice(0,5).map(x=>esc(x)).join(" · ");
  return `<div class="card">
    <div class="ct">${r.u?`<a href="${r.u}" target="_blank" style="text-decoration:none;color:#fff">${esc(r.t)}</a>`:esc(r.t)}</div>
    <div class="cmeta"><span class="vtag">TOG</span>${r.th?`<span class="thtag">${esc(r.th)}</span>`:""}<span class="mtag">${m}</span></div>
    <div class="pac">
      <span class="k pr">problem</span><span class="val">${esc(r.pr)}</span>
      <span class="k ap">approach</span><span class="val">${esc(r.ap)}</span>
      <span class="k co">gives</span><span class="val">${esc(r.co)}</span>
    </div>${story(r.rc)}</div>`;
}
function apply(){
  const q = query.toLowerCase().split(/\s+/).filter(Boolean);
  filtered = DATA.filter(r=>{
    if(!q.length) return true;
    const rc = r.rc?Object.values(r.rc).join(" "):"";
    const hay = (r.t+" "+r.th+" "+r.pr+" "+r.ap+" "+r.co+" "+(r.m||[]).join(" ")+" "+rc).toLowerCase();
    return q.every(w=>hay.includes(w));
  });
  shown = 0; list.innerHTML = "";
  countEl.textContent = filtered.length.toLocaleString() + " papers" + (query?` · "${query}"`:"");
  render();
}
function render(){
  const next = filtered.slice(shown, shown+PAGE);
  list.insertAdjacentHTML("beforeend", next.map(card).join(""));
  shown += next.length;
  moreBtn.style.display = shown < filtered.length ? "" : "none";
}
document.getElementById("q").addEventListener("input", e=>{query=e.target.value; apply();});
moreBtn.addEventListener("click", render);
apply();
</script>
