transfer, and reconstruction. The ideal match is bijective (one-to-one and reversible) and covers the whole surface without tearing. Finding such matches is notoriously hard.", "wh": "Existing algorithms rely on combinatorial operations (mesh connectivity changes), barrier functions that prevent overlap, or require a good initial guess. All of these are fragile: they fail on noisy data, require hand-tuning, and sometimes need manual setup. The problem is that bijectivity is a global topological property that resists local optimization.", "ap": "This paper represents the match as a 4-dimensional surface sitting in the product space formed by combining the two input surfaces. The map between the surfaces is stored implicitly—as the zero-set of a complex function (roughly, points where a complex number equals zero). Distortion is minimized by shrinking this mapping surface's area using the Ginzburg-Landau functional, a principle borrowed from physics and differential geometry that naturally favors smooth, minimal solutions.", "ww": "The Ginzburg-Landau functional, well-understood in physics, tends to prefer configurations that are globally optimal and smooth. By encoding bijectivity as an implicit geometric object and minimizing its area rather than penalizing overlap locally, the method sidesteps combinatorics. The implicit representation avoids mesh topology changes; the map is always continuous.", "po": "The result avoids combinatorial mesh modifications and barrier functions, making it more robust to noise and simpler to implement. It does not assume a good starting point and can untangle wrong matches from faster, cheaper methods. Landmark points or curves guide the optimization, giving designers control."}}, {"t": "Mixed Material Point Methods for Stiff Elastoplasticity", "th": "material point methods", "m": ["material point method", "implicit integration", "mixed discretization"], "pr": "Simulating stiff elastoviscoplastic materials requires stable CFL-rate integration handling high-strain deformation", "ap": "Mixed Material Point Methods with implicit integration producing well-posed symmetric optimization", "co": "Extends mixed discretization to handle finite-strain viscoelasticity and general flow rules efficiently", "u": "https://www.semanticscholar.org/paper/98aa5aaa669fa6d8b27950a7f675d1ecabf9a455", "rc": {"bp": "In animation and engineering, we simulate how materials deform and flow—cloth, clay, snow, metals. Some materials are easy to simulate (soft and squishy), others are brutally hard (stiff rubber, plastic that resists deformation). Stiff materials demand tiny time steps, making simulations slow. We need stable, fast algorithms that handle the widest range of materials.", "wh": "Explicit time-stepping (the usual approach) requires tiny steps for stiff materials to remain stable—a CFL rate constraint. Implicit methods can use larger steps but create complex nonlinear systems that are expensive to solve. Standard implicit solvers also struggle when materials become nearly incompressible (volume-preserving).", "ap": "This method extends a mixed formulation (separating constraints from variables cleverly) to handle finite-strain viscoelasticity and general flow rules. The implicit time-stepping produces a symmetric optimization problem with compact stencils (local, sparse structure). The authors propose an efficient GPU solver, making the implicit system practical on modern hardware.", "ww": "By reformulating the equations as a symmetric optimization problem rather than a general nonlinear system, the solver can use better algorithms (like preconditioned conjugate gradient). Compact stencils mean sparse matrices and fast linear algebra. Running on GPUs adds massive parallelism.", "po": "The method enables stable simulation of stiff elastoviscoplastic materials up to the incompressible limit without requiring prohibitively small time steps. Examples range from granular materials and snow to elastic solids, and it supports two-way coupling with rigid bodies, greatly expanding the range of real-world phenomena that graphics pipelines can handle."}}, {"t": "Hi-SPAD: Video-Rate Hyperspectral Imaging and Inference with Single-Photon Cameras", "th": "hyperspectral imaging", "m": ["single-photon sensors", "pushbroom configuration", "spectrum reconstruction"], "pr": "Hyperspectral imaging requires high spatial, spectral, temporal resolution under passive ambient lighting", "ap": "Pushbroom architecture combining single-photon avalanche diode sensors for photon-counting spectral sensing", "co": "Demonstrates 26fps hyperspectral video with 123 spectral channels under ambient illumination", "u": "https://www.semanticscholar.org/paper/9c19574958436862d23aac162cd06ac80be46575", "rc": {"bp": "Knowing what material an object is made of—its chemical composition or reflectance properties—requires measuring not just brightness but the full spectrum of light. Today's hyperspectral cameras are bulky and slow. We want spectrum measurement fast, in video, with passive indoor lighting, using tiny sensor chips.", "wh": "Single-photon sensors (SPAD) count individual light particles, giving extreme sensitivity and speed. But they produce quantized, nonlinear measurements with massive noise. Hyperspectral imaging normally requires many wavelength measurements per pixel. Combining both seems impossible: quantization and nonlinearity fight against spectral reconstruction.", "ap": "Hi-SPAD uses a pushbroom camera design (a line of pixels that sweeps across the scene) paired with SPAD sensors arranged in a grid that captures color. The system measures how many photons arrive in each tiny time window for each color band. Despite the heavy quantization and noise, reconstruction algorithms and material classification work by leveraging the fact that errors decrease exponentially as measurements accumulate.", "ww": "The key insight is that photon counting, while noisy per sample, improves steadily as you collect more measurements. With enough observations in the right setup (pushbroom plus color-sorted photon detectors), the nonlinearity becomes manageable. Theoretical analysis shows error bounds shrink exponentially, so practical reconstruction becomes feasible.", "po": "The lab-built Hi-SPAD camera achieves hyperspectral video at 26 frames per second with 123 spectral channels under ambient lighting. The abstract validates accurate material classification and full-spectrum reconstruction through simulation and real prototypes, establishing the feasibility of photon-counting hyperspectral video in dynamic scenes."}}, {"t": "Structural MAT: Clean and Scalable Medial Axis Simplification via Explicit Surface Correspondence", "th": "medial axis transform", "m": ["voronoi diagram", "qem simplification", "surface correspondence"], "pr": "Computing high-quality medial axis transform with structural features and robust reconstruction from discrete meshes", "ap": "Explicit surface correspondence tracking during QEM-like Voronoi simplification with priority control strategies", "co": "Produces MAT with strong structural alignment and regularity while achieving high runtime efficiency", "u": "https://www.semanticscholar.org/paper/9d38f6bac96864c2ab8226e19ebf4a745728f32a", "rc": {"bp": "The medial axis of a shape is its skeleton—the locus of centers of circles that touch the boundary from inside. It completely describes the original shape and is invaluable for shape analysis and animation. Computing a clean, accurate medial axis from a triangle mesh is notoriously hard; results are usually tangled and unstable.", "wh": "Without explicit correspondence between medial axis vertices and surface regions, the simplification process can destroy structural integrity. The medial axis may no longer faithfully capture the shape's geometry, especially near fillets and feature regions where the rolling-ball interpretation breaks down.", "ap": "Structural MAT tracks correspondence explicitly throughout simplification. Every medial axis vertex is labeled with the surface region(s) it corresponds to. Edge collapses are sequenced according to priority rules that respect this correspondence, ensuring medial axis triangles reflect true symmetries. The method treats correspondence as a geometric constraint governing the order of operations.", "ww": "By maintaining explicit correspondence, each medial axis feature remains tied to the surface symmetry it represents. Priority control ensures that important structural features (e.g., fillets) are preserved before simplifying less important parts. Correspondence also guides decisions about which edges should collapse, naturally enforcing boundary regularity.", "po": "The result is a medial axis that is runtime-efficient, structurally aligned with input geometry, has clean boundaries, high-quality triangles, and robust to noise. Performance improves across a large test set and on 10,000 diverse shapes; the method remains expressive for both articulated shapes and CAD models."}}, {"t": "ProXeek: Seeking and Leveraging Real-World Objects and Environments as Haptic Proxies for Virtual Reality through Multimodal Reasoning", "th": "haptic VR interaction", "m": ["large language model", "multimodal reasoning", "proxy matching"], "pr": "Providing realistic haptic feedback in VR without bulky hardware or pre-fabricated physical proxies", "ap": "LLM-based multi-agent system using multimodal reasoning to match virtual objects with real-world proxies", "co": "Leverages environmental snapshots to identify viable haptic proxies with higher fidelity than 3D-printed replicas", "u": "https://www.semanticscholar.org/paper/9f27d2de680da2dba1dc836890f24ed7b552c832", "rc": {"bp": "Virtual reality feels immersive when you can touch and feel objects. Active haptic devices (motors, cables) that push back on your hands are ideal but bulky and expensive. The clever idea: use whatever's lying around in your room—a pillow, cup, table—as a stand-in for the virtual object you're touching.", "wh": "Finding the right physical proxy for a virtual object requires reasoning about both the virtual thing (how it should feel and resist touch) and the real environment (what objects are available, their material properties, their shape). A designer must annotate virtual objects with haptic hints, and the system must match those hints to real objects. This is inherently multimodal and ambiguous.", "ap": "ProXeek uses a large language model capable of vision and reasoning to solve this matching problem. Designers annotate virtual interactables with haptic characteristics via a node-based editor. When a user starts VR, they photograph their room using the VR headset. The LLM-based system combines understanding of the virtual haptics, the room's physical objects, and geometric constraints to find the best match.", "ww": "Large language models trained on diverse internet text and images have strong reasoning about objects, materials, and spatial fit. By framing the matching as a reasoning task (rather than pure geometry), the system can leverage semantic understanding: a squishy pillow \"feels like\" a cushioned seat; a wooden table is rigid. Multi-objective optimization balances multiple goals—comfort, realism, safety.", "po": "ProXeek effectively identifies viable proxies and delivers significantly higher haptic fidelity than 3D-printed replicas and visual-only interaction, according to user studies. It enables designers to opportunistically use real-world objects without pre-fabrication or special setup, making haptic VR practical in ordinary homes."}}, {"t": "NeuBase: Spline Surfaces with Neural Basis Functions", "th": "neural surface representation", "m": ["neural basis functions", "subdivision surface", "neural map"], "pr": "Neural surface representations lack intuitive real-time deformation and geometric properties for manipulation", "ap": "Catmull-Clark subdivision base surface with neural basis function offset fields via neural maps", "co": "Enables direct real-time deformation preserving linearity, locality, smoothness, and affine equivariance", "u": "https://www.semanticscholar.org/paper/a0a4e2605d2e19115e1cc95a7cd450f21cda5f24", "rc": {"bp": "Designing surfaces by hand is tedious—you move control points, waiting for the surface to update each time. Real-time deformation, where dragging a handle smoothly deforms the surface instantly, is what you want. Neural networks can fit surfaces to data beautifully, but they're black boxes that resist direct manipulation.", "wh": "Neural parametric surfaces fit detail well but break key geometric properties. Moving a control point should move only nearby surface—local control—and shouldn't break smoothness or require retraining. Neural networks globally couple all parameters to all outputs, so local intuitive edits are impossible.", "ap": "NeuBase pairs a traditional subdivision surface base (which has local control and smoothness built in) with an offset field defined by neural basis functions. The neural basis functions are encoded via a learned map. This hybrid approach lets the surface fit detail via neural learning while preserving the desirable properties of classical subdivision surfaces.", "ww": "By construction, the method maintains linearity (the surface depends linearly on control weights), locality (each control point influences only nearby surface), smoothness (inherited from subdivision), and affine equivariance (rotating the control mesh rotates the surface). These properties are not learned; they're architectural. So direct manipulation works without retraining.", "po": "NeuBase supports intuitive real-time surface deformation: designers deform the control mesh and see results instantly. The surface achieves better fitting accuracy than other neural parametric representations while staying efficient even for complex shapes with dense control meshes. It balances neural expressiveness with classical geometric guarantees."}}, {"t": "Walk on Decomposed Subdomains: A Hybrid Monte Carlo–Deterministic Solver for Elliptic PDEs", "th": "PDE solving", "m": ["monte carlo", "domain decomposition", "hybrid solver"], "pr": "Solving elliptic PDEs on complex geometries requires either heavy meshing or long slow random walks with high variance", "ap": "Hybrid approach combining Monte Carlo first-passage operators with deterministic global linear solve", "co": "Achieves geometric flexibility of Monte Carlo with stable, reusable solution operators and controlled variance", "u": "https://www.semanticscholar.org/paper/a0afb5b2a3cf8dfa6dd65a6efeb97b4c585c8ddd", "rc": {"bp": "Many phenomena in graphics and engineering are governed by elliptic PDEs—Poisson's equation for smoke, heat transfer for materials, electromagnetic potentials. Solving them on complex evolving shapes (like deforming cloth or fracturing materials) is slow and requires heavy mesh construction.", "wh": "Traditional methods (finite element or finite difference) require meshing the domain, often with extreme refinement near geometric features. Grid-free Monte Carlo methods (random walk techniques) adapt to any geometry but lose accuracy fast, especially near boundaries. Neither approach is ideal: finite element is slow and meshing-heavy; Monte Carlo is grid-free but high-variance and slow to converge.", "ap": "Walk on Decomposed Subdomains combines both approaches. The domain is split into simple, regular pieces. Within each piece, Monte Carlo estimates local solutions (Poisson kernels) where random walks are short and variance is controlled. These local solutions are assembled into a sparse global system solved deterministically, replacing the need to simulate random walks across the whole domain.", "ww": "Decomposition makes Monte Carlo estimates stable: short walks mean low variance. The deterministic global solve then uses these local operators as building blocks, trading the stochastic variance of long walks for a fixed, resolution-dependent discretization error. The local estimates are reusable across different boundary conditions, further amortizing cost.", "po": "The method combines the geometric flexibility and parallelism of Monte Carlo with the stability of deterministic solves. It naturally handles arbitrary and evolving geometry without meshing, adapts computational effort to geometry complexity, and provides stable, reusable solution operators for repeated problems."}}, {"t": "Generalized Aberrations for Processing-Aware Optical Design", "th": "optical design optimization", "m": ["ray aberrations", "levenberg-marquardt", "end-to-end optimization"], "pr": "Processing-aware optical design lacks effective second-order optimization due to rank-deficient Jacobians", "ap": "Generalized transverse ray aberrations lifting scalar losses into high-dimensional ray-level residuals", "co": "Enables robust Levenberg-Marquardt optimization for end-to-end imaging pipeline design", "u": "https://www.semanticscholar.org/paper/a164aa8aaccaabc2fec7ee662e38ee4589ae64d4", "rc": {"bp": "Camera lenses today are not just optical systems—they're part of an end-to-end pipeline: optics capture light, then software reconstructs and enhances the image. Modern design should optimize the optics specifically for the downstream software, not for traditional goals like flat focus or low aberration. This needs better mathematical tools.", "wh": "Optimizing optics jointly with software means the designer must choose from thousands of optical parameters to minimize a single number (image quality or reconstruction loss). The Jacobian matrix (how each parameter affects the result) becomes rank-deficient: there are many more parameters than constraints, so standard least-squares methods like Levenberg-Marquardt fail with numerical instability.", "ap": "The paper introduces generalized transverse ray aberrations (GTRA), a generalization of classical spot-radius optimization. Instead of working with a single scalar loss, GTRA lifts scalar task-driven losses into high-dimensional ray-level residuals. This creates many more constraints, filling out the Jacobian matrix and making it invertible and well-behaved for Levenberg-Marquardt solvers.", "ww": "Classical optical design used ray aberrations (deviations per ray) to drive optimization—this gives many constraints per design. Task-driven end-to-end design uses one scalar loss—too few constraints. GTRA bridges the gap by decomposing the scalar loss back into per-ray residuals, which restores the constraint-rich structure that makes robust solvers work.", "po": "The method decisively outperforms first-order optimizers on over 100 design instances for end-to-end image restoration, including smartphone telephoto lenses, microscope objectives, and cameras. It brings the robustness of traditional optical design to the flexibility of end-to-end pipelines, making joint optimization practical."}}, {"t": "Role-Aware Virtual Agents for Navigational Interaction guided by a Multimodal Large Language Model", "th": "virtual agent navigation", "m": ["multimodal language model", "navigation planning", "role-aware behavior"], "pr": "Virtual agents need consistent role-aligned behaviors in dynamic immersive environments with spatial reasoning", "ap": "Multimodal LLM interprets scene information and role instructions to generate discrete navigation decisions", "co": "Enables role-aware embodied agent behaviors responding to dynamic user actions in AR/VR", "u": "https://www.semanticscholar.org/paper/a16ead96909aaa0d7a932cf767a65cf035f13f92", "rc": {"bp": "Animated characters in VR need to move and respond convincingly to what you're doing. A simple script that follows waypoints is rigid and unnatural. If you're hiding and the character is seeking, it should move like someone searching, not like a robot. Large language models trained on human behavior might encode this intuition.", "wh": "Agents need to generate navigation decisions that match their role in a narrative (seeker vs. hider), respond to dynamic changes in the scene or user behavior, and move in spatially consistent ways—all in real time in an immersive environment. Language models excel at reasoning but don't inherently understand spatial layout or embodied physics.", "ap": "The system feeds multimodal inputs to a large language model: scene information (geometry, room layout), user state (location, actions), and a high-level role instruction (seeker, guard, etc.). The model outputs navigation decisions and stylized planning paths. These are then executed by the virtual agent in the immersive environment.", "ww": "Modern multimodal language models integrate vision, text, and reasoning, so they can understand scene context and role constraints jointly. By grounding language instructions in spatial information, the model can reason about the character's intentions and how to move in ways that express that role.", "po": "The approach enables virtual agents to behave consistently with narrative roles and respond to dynamic actions. In examples like hide-and-seek, agents reason about the user's possible intentions given the role and the scene, generating movement behaviors that feel intentional rather than scripted."}}, {"t": "AniGen: Unified S3 Fields for Animatable 3D Asset Generation", "th": "animatable asset generation", "m": ["s3 fields", "flow-matching", "confidence-decaying fields"], "pr": "3D generation models produce static geometry; auto-rigging produces inconsistent skeletons and skinning", "ap": "Unified S3 Fields framework with confidence-decaying skeleton field and dual skin feature field", "co": "Directly generates animate-ready 3D assets with consistent rigging from single-image conditioning", "u": "https://www.semanticscholar.org/paper/a1fe3edc36d65e9e7b5dfdb0d39ff6141f01b9bb", "rc": {"bp": "Creating animated characters for games and film is expensive: you model the shape, then rig it with a skeleton and weights that dictate how the surface deforms as joints move. Generative models can create static 3D shapes from images, but automatically rigging them (auto-rigging) is brittle and often produces skeletons that don't match the geometry.", "wh": "The skeleton and skin weights are invisible in the rendered image, so it's hard to predict them from vision alone. The topology of the skeleton (which joints connect) must match the topology of the shape's parts. Topology is a discrete global property; local image cues don't constrain it well. Existing systems predict rigs after generating geometry, losing geometric coherence.", "ap": "AniGen represents shape, skeleton, and skin weights as three fields (S3 Fields) defined over the same spatial domain. It treats them as mutually consistent: the skeleton should trace symmetry axes, and skin weights should distribute influence smoothly. A flow-matching generative model first synthesizes a sparse structural scaffold (rough skeleton and shape), then fills in dense geometry and articulation in a learned latent space.", "ww": "Representing all three as fields over the same space forces geometric coherence. The model learns that bone predictions are ambiguous at Voronoi boundaries (edges where multiple surface regions equidistant), so it uses a confidence-decaying skeleton field to handle uncertainty. Decoupling skin weights from specific joint counts allows one network to predict rigs of arbitrary complexity.", "po": "AniGen directly generates animate-ready 3D assets from a single image. It substantially outperforms state-of-the-art systems by producing topologically consistent skeletons and skin weights that match the generated geometry, eliminating the brittleness of post-hoc auto-rigging."}}, {"t": "Learning a Delighting Prior for Facial Appearance Capture in the Wild", "th": "facial appearance capture", "m": ["inverse rendering", "delighting prior", "dataset modulation"], "pr": "In-the-wild facial appearance capture struggles with complex disentanglement of reflectance from unknown illumination", "ap": "Trains delighting prior network with dataset latent modulation integrating heterogeneous training data sources", "co": "Achieves high-quality reflectance estimation from casual video, enabling relightable facial scan collections", "u": "https://www.semanticscholar.org/paper/a64b4687cf2fbcfd04171157022038c8496fffe7", "rc": {"bp": "Professional facial capture (scanning faces to build digital copies for rendering) requires expensive studio setups with precise lighting. Smartphone cameras in the wild have unpredictable, uncontrolled illumination. We want studio-quality results from casual videos, which means disentangling what the face looks like from how the lighting happened to fall on it.", "wh": "Inverse rendering—solving for surface reflectance given an image—is ill-posed when illumination is unknown. The same pixel could be bright because the surface is shiny or because the light was strong. Many combinations of reflectance and lighting explain the image equally well, so optimization gets stuck.", "ap": "Instead of purely solving for reflectance, the method trains a powerful neural \"delighting\" network as a prior. It learns to estimate per-pixel illumination from the input video. Training combines two sources: the OLAT dataset (same face lit from different directions) and Light Stage scans (studio gold-standard captures). Dataset Latent Modulation (DLM) fuses these heterogeneous sources by conditioning the network on learnable source-aware tokens.", "ww": "A learned delighting prior constrains the otherwise ill-posed inverse problem. The network learns which variations are reliable (surface properties) and which are artifacts of lighting from the training data. By training on both casual and studio data with source-aware conditioning, the model learns universal delighting principles rather than overfitting to one data source.", "po": "The approach enables simple, automatic appearance capture from casual smartphone video, outperforming prior methods significantly. The authors transform the multi-view NeRSemble dataset into NeRSemble-Scan, a large-scale collection of 4K-resolution relightable facial scans, and open-source both the model and dataset to democratize high-end facial capture."}}, {"t": "PR-Cage: Progressive Feasibility Relaxation for Tight Bounding Cage Generation", "th": "cage generation", "m": ["quadric error metric", "edge collapse", "feasibility relaxation"], "pr": "Cage generation balances conflicting objectives of simplicity and tightness for geometric fidelity", "ap": "Progressive feasibility relaxation via staircase schedule on thickness parameter with constrained QEM framework", "co": "Achieves extreme simplification while maintaining high geometric adherence through nested optimization", "u": "https://www.semanticscholar.org/paper/a6eb454c649f5138b1a744c05e64538e3f6b412a", "rc": {"bp": "A cage is a low-polygon surface that wraps tightly around a more detailed shape. It serves as a simple proxy for rigging (animating by moving cage vertices), level-of-detail rendering, and deformation. A good cage is simple (few faces) and tight (stays close to the original shape). But simplicity and tightness fight each other.", "wh": "Aggressive simplification makes the cage diverge from the shape. Tight cages stay complex. The tradeoff is hard to navigate manually. Furthermore, simplification algorithms can create degenerate triangles (zero area) or flipped normals (facing inward), breaking geometric validity.", "ap": "PR-Cage uses nested optimization: an outer layer that guides simplification via a thickness parameter tau (defining how far the cage can stray from the original), and an inner iteration using Quadric Error Metric (QEM) with linear inequality constraints to suppress degeneracy and normal flips. The key insight is progressively relaxing tau on a schedule, which allows the algorithm to find the optimal balance between simplicity and tightness.", "ww": "Gradually relaxing the feasibility region (increasing tau) first forces a tight cage, then permits looser approximations as simplification proceeds. This guides the optimization toward good tradeoffs. Inequality constraints prevent invalid triangle configurations—the algorithm won't accept a solution with flipped normals or degenerate geometry.", "po": "PR-Cage consistently outperforms existing methods, achieving extreme simplification while maintaining high geometric fidelity. Its utility is demonstrated in downstream applications where tight cages are essential, and it relies only on simple edge operations (collapses and flips), ensuring high computational efficiency and robustness."}}, {"t": "Nexus: Native Mesh Generation with Diffusion", "th": "mesh generation", "m": ["diffusion", "octree", "topology modeling", "space-time interval"], "pr": "Autoregressive mesh methods suffer from error accumulation and inefficient inference", "ap": "Diffusion-based decoupled generation of vertices via octree and topologies via embeddings", "co": "Outperforms autoregressive baselines via holistic, parallelizable mesh generation avoiding sequential bottlenecks", "u": "https://www.semanticscholar.org/paper/a9a986382361845b0c753e4a3735592fe900ae6d", "rc": {"bp": "When you design a character, build a video-game world, or create special effects for a film, you need 3D shapes made from triangles—the most universal building block in computer graphics. Today, most of these shapes are sculpted by hand or generated sequentially, one piece at a time, which is slow and prone to mistakes because early errors cascade through the entire process.", "wh": "The team splits the problem into two independent tasks that can happen in parallel. First, they use a diffusion model—a process that gradually refines noise into a clean image—to generate the vertex positions (the corner points of all the triangles). They organize these vertices as an octree, which is a hierarchical 3D grid that lets them work coarse to fine, like sketching with broad strokes then adding detail. Second, they tackle the harder problem: figuring out which vertices connect to form faces (the actual triangles). They invented something called Space-time Interval, an extension of a prior concept called Spacetime Distance, that encodes all the connectivity information into a smooth, continuous embedding per vertex. Then another diffusion model reconstructs those embeddings to recover the final shape.", "ap": "", "ww": "Splitting vertex generation from connectivity generation avoids the bottleneck: vertices can be created efficiently without worrying about topology, and then topology can be derived globally rather than point-by-point. The diffusion approach inherently captures global structure because it refines the entire shape at once, and diffusion models are proven to be good at learning structure from data. The continuous embeddings from Space-time Interval allow complex, non-obvious topology—including non-standard configurations where surfaces fold in on themselves—to be recovered smoothly and globally.", "po": "The method outperforms hand-crafted, sequential approaches on standard datasets, and blind studies from 3D practitioners show strong preference for the results. It handles arbitrarily complex topology and scales to real-world scenarios like generating shapes from photographs, making it practical for production film, gaming, and interactive applications."}}, {"t": "Component Modes Synthesis Method with Multiple Partitions for Large-scale Eigenvalue Problem", "th": "modal analysis", "m": ["component mode synthesis", "domain partitioning", "basis acceleration"], "pr": "Component Mode Synthesis substructure bases do not span solution space efficiently for large-scale modal analysis", "ap": "Multiple spatially staggered domain partitions with low-frequency interface basis approximations", "co": "3 orders of magnitude accuracy improvement with better scaling on distributed computing clusters", "u": "https://www.semanticscholar.org/paper/b4e2c09b7b77c0a4ead896d256adc0ca091a2dba", "rc": {"bp": "When engineers design structures like buildings, bridges, or aircraft, they need to simulate how the thing vibrates and moves when disturbed. This vibrational analysis is critical for safety and performance, but for large, complex structures, the math becomes so expensive that it can take days to compute on supercomputers.", "wh": "The full problem is too large to solve in one go. Standard approaches divide the structure into smaller chunks (substructures) and solve each one independently, then stitch the results together. But the quality of the results depends on having a good basis—a set of mathematical building blocks—that captures all the important vibrational modes. When you use just the natural vibrations from each individual substructure, you don't get enough diversity to represent the full structure's behavior accurately, so you need many more modes than should theoretically be necessary.", "ap": "Instead of using vibration modes from just one partition of the structure, the researchers use modes from multiple overlapping partitions—like dividing a bridge into chunks in different ways and mining vibrations from each way separately. This gives a richer set of building blocks. They further speed things up by approximating the interfaces between chunks (the boundaries where pieces touch) using low-frequency signals derived from those modes, rather than keeping the full expensive representation at every interface.", "ww": "Overlapping partitions expose more of the structure's natural patterns; each partition captures different aspects of how the thing wants to move. Using modes from many different partitions is like getting suggestions from many different people—you get a more complete picture. The low-frequency approximation at interfaces works because most of the important information lives in the big, slow vibrations, not the tiny, fast ones, so you can throw away the fast wiggles without losing much accuracy.", "po": "The method improves accuracy by three orders of magnitude compared to standard Component Mode Synthesis, meaning you get the same answer using vastly fewer mathematical degrees of freedom. It also scales better on distributed supercomputers—communication and memory usage both improve—making large-scale simulations for film effects and industrial design far more practical."}}, {"t": "Semantic-Structural Alignment for Generative Pictorial Charts", "th": "generative visualization", "m": ["diffusion transformer", "semantic alignment", "structural guidance"], "pr": "Traditional statistical graphics lack visual appeal, memorability, and engagement compared to pictorial charts", "ap": "Multi-modal diffusion transformer with dual structural and semantic alignment guided by text and chart image", "co": "Generates artistically compelling pictorial charts maintaining structural consistency across visual channels", "u": "https://www.semanticscholar.org/paper/b6f416db6773802e499df51b1a4fc4ee3755c275", "rc": {"bp": "A bar chart showing sales numbers is precise but forgettable. A pictorial chart—one where bars are replaced by stacks of little coins or houses or people—is fun to look at and memorable. The challenge is to automate this transformation: take a boring statistical chart and turn it into an artistically compelling visual story while keeping the numbers accurate.", "wh": "You want two things at once, and they pull in opposite directions. You want artistic flair and visual interest—textures, shapes, thematic imagery—but you also want the chart to faithfully represent the underlying data. A system that blindly stylizes images might make things beautiful but wrong. You need a system that understands what the chart means (the statistics) and also respects the abstract structure (the grid, the axes, the proportions) while layering on artistic expression.", "ap": "The researchers frame this as two parallel control signals guiding a generative model. One signal is a text prompt—a description of the visual or semantic intent, like \"underwater theme\" or \"ancient Rome.\" The other signal is the original statistical chart itself, which provides the structure: \"this bar is 30% of the total, arranged vertically.\" They use a Diffusion Transformer (a neural network trained to gradually refine images) and inject two mechanisms to keep it honest: structural alignment, which anchors the output's spatial layout to the input chart, and semantic alignment, which borrows textures and artistic details from reference images to fill in the aesthetic layer.", "ww": "By separating structure from aesthetics as two independent controls, the model can learn them independently and then fuse them. The structural alignment acts as a \"fence\" preventing the artistic layers from distorting the data representation. The semantic alignment lets you borrow real, coherent visual styles rather than hallucinating them, because the model is conditioned on references that have the textures you want. Diffusion models naturally excel at composing multiple conditions into a coherent image.", "po": "The system produces pictorial charts that are both artistically compelling and mathematically faithful across diverse visual channels—length, area, angle, position—and semantic domains. Quantitative tests and user studies show it outperforms simpler approaches like stylization or image editing, enabling visual storytelling that actually respects the underlying data."}}, {"t": "Dual Contouring over Expanded Cubes (DCx) for Zero-Level Set Extraction from Neural Unsigned Distance Functions", "th": "mesh extraction", "m": ["dual contouring", "signed distance fields", "non-manifold handling"], "pr": "Extracting manifold and non-manifold surfaces from unsigned distance functions loses topology", "ap": "Extended Dual Contouring on expanded cubes with voxel-to-mesh lookup tables for arbitrary topology", "co": "Efficiently extracts both manifold and non-manifold surfaces from neural UDFs via optimization-based active cube detection", "u": "https://www.semanticscholar.org/paper/b7c2df840a2f0724a3a4cd7c452725187a538ed4", "rc": {"bp": "When you scan a real object with depth sensors or photogrammetry, or when a neural network predicts a 3D shape from an image, you get a continuous mathematical surface representation called a signed distance function. But some shapes—statues with overhangs, cloth with folds, hollow objects—can't be cleanly represented this way because the math breaks down at spots where topology is weird. You need a different representation that can handle any topology: unsigned distance functions.", "wh": "Unsigned distance functions (the distance from any point to the nearest surface, without caring about inside vs. outside) can represent any topology, including non-manifold shapes where surfaces fold back on themselves. But here's the catch: the standard tool for extracting a triangle mesh from these functions—Dual Contouring, which works brilliantly for signed distance—relies on detecting sign changes to figure out where the surface is. Without the sign, you lose that signal, and active-cube detection becomes unreliable. Also, in non-manifold regions, even detecting where to put triangle vertices becomes ambiguous.", "ap": "The researchers adapt Dual Contouring to work on unsigned distances, calling it DCx. Instead of asking \"did the sign flip?\", they use optimization to decide which voxel blocks (small 2×2×2 cubes) are active. Then, crucially, they operate on expanded cubes—groups of eight voxels—and use a lookup table mapping each possible local voxel configuration to a set of connectivity patterns (which vertices connect to which). This replaces hand-coded logic with template-based extraction: given a configuration, you already know which triangles to place and how they connect.", "ww": "Optimization-based activation works because unsigned distance can still be queried at every point; you just need to decide activity differently. The lookup table approach is powerful because it encodes non-manifold connectivity rules directly. By working on expanded cubes rather than individual voxels, the method has enough local context to make the right connectivity choices, avoiding the failure modes of standard Dual Contouring on unsigned distance.", "po": "DCx successfully extracts both manifold and non-manifold surface meshes from neural unsigned distance functions, which are increasingly common in neural 3D reconstruction. The method is simple, easy to implement, and handles edge cases that broke prior work, making it practical for generative 3D and reconstruction pipelines."}}, {"t": "Learned Universal Interoperable Virtual Try-ON", "th": "virtual try-on", "m": ["diffusion correspondence", "SMPL proxy", "physics simulation"], "pr": "Virtual try-on requires garment-to-body transfer despite mismatched skeletons and dense correspondences", "ap": "SMPL proxy with geometry-driven and diffusion-based correspondence models plus simulator-driven fitting", "co": "Handles complex multi-layer garments on diverse humanoids while maintaining physical plausibility", "u": "https://www.semanticscholar.org/paper/b866b857860c8953dc1b843ffaaee0de3fac7b39", "rc": {"bp": "In film and games, dressing a character in clothing is tedious. A designer places each garment by hand, adjusting folds and collisions. The dream is to build a library of real clothing and characters, then automatically dress any character in any garment, even if they're wildly different shapes (a human in a robot's outfit, a cartoon character in historical armor). This would unlock massive asset reuse.", "wh": "Garments and characters rarely come from the same pipeline; they have different underlying structures (skeletons), different body shapes, different numbers of vertices, and different geometric scales. Standard correspondence methods—figuring out which point on the garment touches which point on the body—assume dense point-to-point alignment, which breaks when you're trying to match a tight shirt designed for one body to a completely different body with different proportions. You also need the clothing to drape realistically under gravity, not just snap into place.", "ap": "The key insight is to use a universal intermediate form: SMPL, a standard parametric human body model. They break the problem into two stages. First, align the garment to SMPL using a geometry-driven method that understands shape. Second, align SMPL to the target character (human, robot, cartoon) using a diffusion model that leverages both rich visual features from multiple camera angles and a pretrained 2D vision model that understands human form, even across stylization. Once they have correspondences, they register SMPL's displacement surface to the garment, then smoothly transition the garment through SMPL to the target body, using physics simulation to make it drape naturally.", "ww": "SMPL acts as a Rosetta Stone: every garment learns to align to it, and every character learns to align to it, so transitively they can all align to each other. Using a diffusion model for the second stage is smart because it's naturally good at understanding spatial correspondence under large pose and shape changes. The physics simulation ensures the garment doesn't pass through bodies or fold unnaturally; it finds the equilibrium state under gravity.", "po": "The system handles complex, non-manifold garment geometry and generalizes to humans, robots, cartoons, and creatures while remaining computationally tractable. It enables fast asset reuse in production and supports post-transfer customization like changing garment size, solving a longstanding bottleneck in character dressing pipelines."}}, {"t": "Lifting Lines and Tone: Image-Space Stylization in Path-Space", "th": "non-photorealistic rendering", "m": ["path-space lifting", "stylized rendering equation", "geometry-driven mapping"], "pr": "Path-space stylization lacks mechanism for enforcing image-space consistency from hand-drawn styles", "ap": "Geometric lifting of image-space stylizations into path-space via parametrization and parallel transport", "co": "Principled SRE-compatible framework enabling feature lines and tone while preserving image-space structure", "u": "https://www.semanticscholar.org/paper/bf8c9518d79f12fbe5951208eaa02881186a4590", "rc": {"bp": "Non-photorealistic rendering (NPR) is the art of making 3D scenes look like drawings, paintings, or stylized illustrations instead of photographs. Feature lines (the silhouettes and sharp edges you see in a sketch) and tone-based styles (hatching, stippling) are essential to the look. But modern rendering systems compute light bouncing through space (path-space rendering), and image-space stylization techniques designed for 2D don't play well with it.", "wh": "Image-space stylization—detecting edges and hatching patterns by looking at the 2D rendered image—can produce inconsistent results under complex lighting because it treats every pixel independently. Modern physically-based rendering (the stylized rendering equation, SRE) computes light paths through space, which is powerful and accurate, but it has no native way to enforce that a feature line stays in the same place when light interacts with other objects. You need a way to lift 2D image patterns into 3D space while respecting light transport.", "ap": "The researchers propose a unified framework: for any image-space stylization, establish a geometric mapping from image-space to path-space. For feature lines, they combine path-space geometry (where objects are in 3D) with a mathematical tool from differential geometry called parallel transport, which lets you slide information along a curved surface while keeping it locally consistent. This gives you a curvature-aware, stochastic line detection that lives in path-space but produces image-consistent results. For tone-based styles (hatching), they derive a canonical lifting using ideas from wave optics (stationary-phase approximations), anchored to a material-independent mapping.", "ww": "Geometric mappings preserve structure: if a line is a silhouette in 3D, it should stay a silhouette when light bounces around. Parallel transport prevents distortion when the underlying geometry curves. The wave-optics motivation for tone is elegant: stationary-phase theory tells you which regions of path-space contribute most to image-space patterns, letting you do the computation where it's efficient and then project back to the image.", "po": "The method enables image-space NPR styles to coexist with complex light transport effects—shadows, reflections, transmittance—while maintaining visual consistency. Feature lines and tone styles now interact naturally with rendering physics, enabling richer, more visually coherent non-photorealistic images."}}, {"t": "Robust Planar Maps for 3D Vectorization", "th": "3D vectorization", "m": ["planar partitioning", "spatial hierarchy", "curve-line intersection"], "pr": "Vectorizing 3D scenes with proper occlusion requires robust handling of curve intersections and numerical errors", "ap": "Spatial hierarchy acceleration provides fundamental planar map representation with curve-line intersection", "co": "Scalable, output-sensitive vectorization robust to curve soup with topologically valid results", "u": "https://www.semanticscholar.org/paper/c2c2e8ebbe080a492e7b7d6528c76206a56104f5", "rc": {"bp": "When you draw a stylized illustration of a 3D scene, you draw outlines (silhouettes where the object edge faces away), curves from the surface (like contour lines on a map), and regions of solid color. Converting a 3D scene into a clean 2D vector illustration—curves and filled regions—is called vectorization. This is crucial for art direction and technical illustration.", "wh": "Curves from 3D geometry can be arbitrarily complex: they might cross each other (perspective!), touch tangentially, or create intricate tangles. When you try to organize these into a clean 2D map of regions (where each region is a single flat color), you need to know the precise topology—which region touches which, what's on top. Even tiny numerical errors can break the topology. Also, curves come from different source geometries: triangles, smooth splines, subdivision surfaces. You need a method that works across all of them.", "ap": "The key insight is that the spatial acceleration structure—the data structure used to speed up curve-curve intersection queries—can itself become the planar map representation. They build a hierarchical grid, query which grid cells are crossed by which curves, and this automatically partitions the image plane into regions. Cells are well-defined geometrically and remain valid even with numerical noise. They replace the hard problem (detecting all curve-curve intersections perfectly) with an easier one: checking which curves cross which grid cells, then detecting curve-line intersections (a line from the grid to a curve). They allow trade-offs: you can reduce precision to speed up, and the output remains topologically valid.", "ww": "Spatial hierarchies are robust because cells are always well-defined—numerical errors just shift a boundary slightly, they don't invalidate the topology. Curve-line intersection is algebraically simpler than curve-curve intersection, so it's faster and more stable. The hierarchy also naturally handles \"curve soup\" (segments that don't explicitly connect in the input) because the algorithm discovers connectivity implicitly from intersections.", "po": "The method robustly vectorizes complex 3D scenes across arbitrary surface representations and scales to scenes with many curves. It's orders of magnitude more efficient than naive approaches while handling messy real-world data like segment gaps, providing the clean, topologically valid 2D vector illustrations that traditional illustrators depend on."}}, {"t": "Soft Anisotropic Diagrams for Differentiable Image Representation", "th": "neural image representation", "m": ["gaussian splatting", "apollonius diagrams", "differentiable rendering"], "pr": "Gaussian splatting image representation lacks differentiability and efficient spatial representation", "ap": "Soft anisotropic Apollonius diagrams with learnable per-site temperatures and top-K propagation rendering", "co": "4-19x speedups over baselines with 46 dB PSNR on Kodak at matched bitrate via efficient GPU computation", "u": "https://www.semanticscholar.org/paper/c31bcff334a3f57122537816efca96ab5e420f66", "rc": {"bp": "Today, images are stored as grids of colored pixels. But you can also represent an image as a small set of abstract objects—Voronoi regions, each colored by a weighted blend—and store just the objects, not the grid. This is compact and lets you edit and resize images continuously. The challenge is making this work with neural networks and keeping it fast enough for real-time graphics.", "wh": "Most neural representations of images live in an abstract mathematical space (called a latent space) that's hard to interpret or edit. Soft Anisotropic Diagrams (SAD) tries to use an explicit, geometric representation: sites (points) with color and shape, blended at each pixel. But making this representation smooth enough for neural networks to learn—trainable, with good gradients—is tricky. Also, computing which sites affect each pixel is slow if done naively, and you need to keep the per-site costs constant regardless of image complexity.", "ap": "Each site specifies an anisotropic metric (a direction-dependent distance measure, like an ellipse) and a color weight, and each pixel is colored as a soft blend of its nearest sites. This creates a generalized Voronoi partition (called an Apollonius diagram). The trick is making it trainable: they use a softmax to create smooth blending with learnable per-site temperatures. For speed, they maintain a per-pixel top-K list of nearest sites and update it using a scheme inspired by jump-flooding (a fast algorithm for nearest-neighbor search), augmented with random sampling to ensure global coverage. Training uses gradient-weighted initialization and adaptive budget control (adding sites when needed, pruning when not).", "ww": "Softmax blending is smooth and differentiable, letting gradients flow during training. The top-K approximation is fast because queries are local and small; the jump-flooding update is inherently parallel, friendly to GPUs. Anisotropic metrics are more expressive than circles; they let sites adapt to local image structure. Adaptive densification and pruning let the method use just enough complexity for each image, avoiding overfitting.", "po": "SAD is fast (2.2s to encode on Kodak, vs 28s for a competitor), compact, and beats Image-GS and Instant-NGP at the same bitrate and computational budget. It provides a clean, interpretable, trainable representation suitable for neural graphics pipelines and real-time applications."}}, {"t": "A practical partitioner for distributed simulations on sparse dynamic domains using optimal transport", "th": "distributed simulation", "m": ["optimal transport", "power diagram", "domain partitioning"], "pr": "Physics simulations on rapidly evolving dynamic domains require even load distribution and minimal inter-node data exchange", "ap": "Optimal transport power diagram partitioner with surface and temporal consistency metrics", "co": "Outperforms state-of-the-art in film production distributed simulations via artist-friendly partitioning", "u": "https://www.semanticscholar.org/paper/c49244b243f1352ff41c4a9b8d736e261e2bfbe1", "rc": {"bp": "In visual effects (fire, explosions, water splashing), artists simulate fluid flow, flames, and smoke by solving physics equations on large computational grids. These simulations can take hours on a supercomputer. To speed this up, studios distribute the work across many computers, each solving a piece of the grid. The bottleneck: how do you split the grid to minimize communication and balance work fairly, especially when the active region shrinks and grows over time?", "wh": "Traditional partitioning divides the grid evenly, but in fire or fluid simulation, the interesting stuff is usually concentrated in a small region. If you partition evenly, some computers sit idle while others do all the work. If you partition adaptively, you might create many small pieces at boundaries that require expensive communication. You need something that balances work (even load), minimizes inter-node data exchange (few expensive messages), and stays consistent across time (partitions don't jump around wildly, confusing the artists).", "ap": "They use optimal transport, a mathematical framework from physics and economics that computes the most \"efficient\" way to redistribute resources. Optimal transport produces a power diagram—a partition of space where each region is associated with a generator point, and the region's size is chosen to be proportional to the local computational cost. The power diagram is intuitive: you can place generator points where the simulation is expensive, and the diagram automatically expands those regions. They also introduce metrics to quantify partition quality: a surface index (how much data crosses region boundaries) and a temporal consistency index (how much regions shift between time steps).", "ww": "Optimal transport theory guarantees that the partition minimizes wasted communication for a given load distribution. Power diagrams are geometric and artist-friendly—you can move points around intuitively. The metrics are grounded in what matters for production: communication cost and stability. By optimizing over these metrics on real film data, they found the sweet spot.", "po": "The method outperforms state-of-the-art partitioning on real production simulations of liquids, flames, and explosions, reducing communication and achieving better load balance while remaining intuitive for artists to control and predictable over time."}}, {"t": "MorphSkein: A Shape-Changing Afterimage Display Preserving Pixel Density During Surface-Area Changes Across Troposkein-Based Shapes", "th": "shape-changing displays", "m": ["persistence of vision", "troposkein geometry", "density preservation"], "pr": "Shape-changing displays lose pixel density as surface area expands, limiting usability", "ap": "Telescopic pole and LED-strip rewinders with troposkein geometry and angular velocity optimization", "co": "Preserves pixel density across expanding axisymmetric shapes via mathematical modeling and interpolation", "u": "https://www.semanticscholar.org/paper/c4b40104eb8be51f960feba2a8737012d04d8b00", "rc": {"bp": "Imagine a display made of spinning LED strips arranged like a spinning rope—the motion creates an illusion of a 3D shape, lit up with colors. As the shape morphs (the rope gets fatter or taller), you want the displayed image to adjust but stay readable: pixels should stay roughly the same size so text and details don't become invisible.", "wh": "Shape-changing displays (made from physical materials that morph) inherently change surface area as they move. If you want to cover a growing surface with a fixed number of LEDs, they spread out—pixel density drops, details vanish. You could add more LEDs, but then when the shape shrinks, you have too many LEDs crammed together and the display wastes energy. The challenge: keep pixel density nearly constant as the shape morphs without dynamically adding/removing LEDs.", "ap": "MorphSkein uses a troposkein—a shape mathematically formed by spinning cables under centrifugal force. LEDs are arranged on flexible strips wound on rewinders. As the base rotates faster, centrifugal force pushes the cables outward, making them wider and taller. As they shift shape, the system releases new rows of LEDs from the rewinders and renders extra columns per revolution on the strips. The density is preserved horizontally (more content per spin) and vertically (more rows as the troposkein expands).", "ww": "Troposkein geometry is predictable mathematically; the researchers model it and derive the relationship between rotation speed, shape, and required LED count. By releasing new rows opportunistically and increasing content per frame, they compensate for area changes. The key is getting the rotation speed right: it controls the final shape and determines how much new content to render to maintain density.", "po": "The system maintains pixel density (1.44 px/cm²) across naturally occurring axisymmetric shapes, keeping 69.44% of reachable configurations above 90% density accuracy and shape fidelity for at least one operating speed. This enables readable, morphing LED displays for dynamic, shape-changing applications."}}, {"t": "Gaussian Point Splatting", "th": "gaussian splatting", "m": ["stochastic sampling", "atomic operations", "frustum culling"], "pr": "Gaussian splatting rendering scales poorly to scenes with millions of Gaussians", "ap": "Stochastic sampling of pixel-sized opaque points with 64-bit atomic splatting and hierarchical culling", "co": "Renders hundreds of millions of Gaussians in real time with minimal perceptual difference from original", "u": "https://www.semanticscholar.org/paper/c6bfc2265a4a7b348e6b14b333c25dfece18299a", "rc": {"bp": "Gaussian splatting is a new method for rendering 3D scenes: instead of ray-tracing (simulating light bouncing), you store the scene as a collection of blurry Gaussian shapes and paint them onto the screen. It's fast and can handle millions of small Gaussians. But the bottleneck: rendering millions of overlapping Gaussians is still slow on modern hardware, especially when you have scenes with hundreds of millions of Gaussians.", "wh": "Standard Gaussian splatting processes Gaussians one at a time, projecting each onto the screen and blending. This doesn't parallelize well because of rendering order: you need to know which Gaussian is in front, which is behind. On a GPU with millions of parallel threads, this becomes a coordination nightmare. You need a method that lets threads work independently without strong synchronization.", "ap": "Gaussian Point Splatting rethinks the algorithm. Instead of rendering continuous Gaussian shapes, they sample discrete points from each Gaussian. Each point is tiny (pixel-sized) and opaque, and they splat it to the framebuffer using atomic operations—low-level hardware primitives that let millions of threads update memory safely without explicit locks. Multiple points can hit the same pixel, and that's okay: the algorithm figures out how many points to sample from each Gaussian and how to distribute them so that the final opacity matches the original Gaussian splatting output. They use hierarchical culling to skip Gaussians that are off-screen or hidden.", "ww": "Sampling discrete points decouples the problem: thread independence means massive parallelism. Atomic operations are fast—they're built into modern GPUs. The key insight is that you can solve the \"how many points per Gaussian\" problem mathematically: given a target opacity and the number of pixels a Gaussian covers, you can compute the sampling rate. The atomic splat becomes a counting problem, which has a clean mathematical solution.", "po": "The method renders hundreds of millions of Gaussians in real time—orders of magnitude faster than prior methods. The only trade-off is slight noise and aliasing differences, which are imperceptible at interactive frame rates, making it practical for real-time 3D graphics at massive scale."}}, {"t": "Closed-Form Convolution for physically-accurate defocus in Gaussian Splatting", "th": "depth-of-field rendering", "m": ["gaussian splatting", "depth-of-field", "closed-form convolution"], "pr": "3D Gaussian Splatting assumes perfect focus but real captures contain lens defocus blur under large apertures", "ap": "Closed-form convolution of projected Gaussians with Circle of Confusion kernel via error function", "co": "Physically accurate depth-of-field in 3DGS enabling refocusing and aperture manipulation from blurry captures", "u": "https://www.semanticscholar.org/paper/c6e82a79decf7384225a952d514d81ec5f5f8d42", "rc": {"bp": "Gaussian splatting produces sharp, perfect focus—every part of the image is in focus. But real cameras have a lens that creates depth-of-field blur: nearby objects are sharp if you focus on them, far objects blur, and there's a zone of acceptable sharpness. Reconstructing scenes from real, blurry photos requires modeling this blur, but Gaussian splatting doesn't do it. The result: poor reconstruction quality when real lens blur is present.", "wh": "Standard Gaussian splatting renders Gaussians assuming a perfect pinhole camera with infinite depth of field. Real cameras with apertures create a circle of confusion—the extent of blur increases with distance from the focal plane. When you feed Gaussian splatting a photograph with real lens blur, the model hallucinates sharpness and gets confused about where surfaces are. You need a physically accurate blur model integrated into the rendering process, but naive convolution is expensive and doesn't interact well with the Gaussian splatting algorithm.", "ap": "The researchers derive a closed-form analytical solution for convolving a projected 3D Gaussian with the Circle of Confusion (the blur kernel). They use the error function (erf), a standard mathematical function, to express the convolution analytically. This lets them compute the blurred Gaussian's shape in closed form rather than approximating. They extend it to anisotropic Gaussians (elliptical rather than circular) and approximate polygonal apertures by decomposing them into rectangles, each with its own convolution solution.", "ww": "Closed-form solutions are fast—no numerical integration needed. The error function is efficient to evaluate. By placing the blur computation at the rasterization level (where Gaussians are projected), it's integrated into the core algorithm rather than bolted on. The mathematical framework is physically accurate, meaning it reflects how real cameras work rather than using ad-hoc approximations.", "po": "The method enables high-fidelity 3D reconstruction from blurry, multi-focus image sets. It supports post-capture effects like refocusing and aperture manipulation—you can change the focal distance or simulate different lenses after the fact. Experiments show it significantly improves reconstruction quality on defocus-focused benchmarks."}}, {"t": "Neural Quadrature Rule and Autoregressive Adaptive Sampling", "th": "monte carlo integration", "m": ["neural networks", "adaptive sampling", "learned integration"], "pr": "Monte Carlo integration cannot effectively use auxiliary information or adapt sampling to informative regions", "ap": "End-to-end neural network learning sampler and integrator jointly with learned priors over integrand structure", "co": "Substantial improvements in equal-sample setting across diverse graphics applications via coupled sampling-integration", "u": "https://www.semanticscholar.org/paper/c93139eec41cbef87c122938d2237b1703233a78", "rc": {"bp": "Rendering needs to compute the brightness at each pixel by integrating light contributions—a complex mathematical integral over many possible light paths. Monte Carlo integration is the standard tool: you randomly sample paths and average the brightness. But classical Monte Carlo only averages brightness values; it ignores the rich information you already have about each sample, like where it came from or what geometry it touched.", "wh": "Standard Monte Carlo estimators can't effectively use auxiliary information (sample position, geometric features) to improve accuracy. They also struggle to concentrate samples where they matter most. Imagine integrating a spiky function: you need many samples in the spike, few elsewhere, but classical Monte Carlo is blind to this. Adapting the sampling distribution toward important regions (importance sampling) is hard to do well without good prior knowledge.", "ap": "The researchers propose learning both the sampler and the integrator end-to-end using neural networks. Instead of a hand-crafted Monte Carlo formula, they train a neural sampler that learns where to place samples (adapting the sampling distribution), and a neural integrator that learns how to combine samples with their auxiliary information. The model trains on a dataset of integrands (brightness functions from different lighting scenarios), so it learns priors specific to the domain. The sampler draws samples smartly, and the integrator makes better use of each one.", "ww": "Neural networks are good at discovering structure in data. By training on a family of related integrands (all from rendering, or all from a specific type of problem), the network learns shared patterns. The integration step can now encode geometric insight: a sample that grazes a specular surface is weighted differently than one that hits diffuse. The coupling between sampling and integration lets feedback flow: the integrator can learn to expect certain types of information from certain regions, and the sampler adapts.", "po": "On diverse applications—lighting, transmittance, generalized winding number, walk-on-spheres—spanning low and high dimensions, the method achieves substantial improvements in accuracy at equal sample counts. Though the neural networks add overhead, end-to-end speedups over learned baselines are substantial, enabling faster rendering."}}, {"t": "GPU-accelerated Certified Hausdorff Distance Between Triangle Meshes", "th": "hausdorff distance", "m": ["branch-and-bound", "gpu acceleration", "adaptive subdivision"], "pr": "Hausdorff distance branch-and-bound becomes prohibitively expensive on large models under tight tolerances", "ap": "GPU-accelerated certified branch-and-bound with sorted double-buffered wavefront and adaptive subdivision", "co": "Robust deep-refinement handling via resource-aware deferral while maintaining efficient SIMT mapping", "u": "https://www.semanticscholar.org/paper/c9ef4d7db340b8315658fba824d95c1cbb18306d", "rc": {"bp": "When simulating collisions, or checking if two 3D meshes overlap, you need to compute the distance between them: how far apart are the closest points? The Hausdorff distance is the most careful measurement—the farthest distance you'd have to travel to match every point on one surface to the nearest point on the other. Computing this on large meshes can be slow.", "wh": "Exact Hausdorff distance requires checking every point on one surface against every point on the other—a massive search. Branch-and-bound algorithms prune the search space by keeping upper and lower bounds on the answer, but when meshes are nearly touching or overlapping, pruning is limited and the search is exhaustive. Modern GPUs are powerful but have limited memory; the search tree for a large mesh can overflow. You need an algorithm that maintains numerical precision under tight tolerances while fitting the search in GPU memory.", "ap": "The researchers adapt branch-and-bound for GPU execution. Instead of sequential tree traversal and priority queues (which don't parallelize), they use a wavefront pipeline: bulk-parallel worklists for different phases (bound evaluation, culling, subdivision, compaction). This maps naturally to SIMT (single-instruction, multiple-thread) hardware. For thin, elongated primitives that produce loose bounds, they introduce adaptive subdivision: selective double longest-edge bisection that keeps constant cardinality. For deep-refinement cases where memory fills up, they add a deferral mechanism: prioritize candidates likely to be culled, postpone expensive ones.", "ww": "Wavefront algorithms are GPU-friendly—each thread handles independent work, synchronization is minimal. Adaptive subdivision avoids exploding bound looseness on thin features without creating too many cells. The deferral mechanism is clever: by predicting which branches won't contribute to the final answer, you avoid materializing them, staying within memory.", "po": "The method handles large meshes under tight tolerances and near-zero distance configurations efficiently. It's robust, maintains numerical precision, and uses GPU-acceleration effectively, making it practical for collision detection and geometry processing in interactive and simulation pipelines."}}, {"t": "Texture-Aware Remeshing for Texture-aware Geometry Processing", "th": "texture-aware processing", "m": ["remeshing", "vertex colors", "texture hoisting"], "pr": "Standard geometry processing tools ignore textures when meshes use UV parameterization with texture maps", "ap": "Remeshing hoists textures to vertex colors via per-triangle processing preserving appearance", "co": "Enables texture-aware geometry processing on segmentation, parameterization, and vector field operations", "u": "https://www.semanticscholar.org/paper/ca6a55ba8b9e7499725f75e9908209c650b58de7", "rc": {"bp": "3D artists paint textures (images applied to surfaces) using UV coordinates: they lay a 2D texture map flat, paint on it, then wrap it back onto the 3D surface. But geometry-processing algorithms often ignore textures because they don't know how to incorporate them. If you could treat textures as colors at the vertices themselves rather than maps, geometry algorithms could see and respect texture details naturally.", "wh": "Texture maps live in 2D UV space; geometry processing algorithms work in 3D. These are two different coordinate systems, making it hard to apply texture-aware algorithms like detecting edges based on texture gradients, or segmenting surfaces based on texture patterns. Most geometry software simply ignores textures when processing because the standard representation (UV + texture map) doesn't integrate well. Vertex-color meshes would work, but converting UV-textured meshes to vertex colors risks losing or distorting image quality.", "ap": "They developed a remeshing procedure that hoists textures from 2D UV maps into 3D vertex colors. For each triangle in the input mesh, they create a denser remeshed triangle, sample colors from the texture map at each new vertex, and store those colors as vertex attributes. This converts any UV-textured mesh into an equivalent vertex-color mesh that preserves the original appearance. With vertex colors in place, geometry algorithms can now incorporate texture information: surface segmentation can split based on color boundaries, Tutte parameterizations can preserve color variation, edge detection can find texture edges, and vector field operations can incorporate color gradients.", "ww": "Per-triangle remeshing is simple and preserves the original image because you're literally sampling the texture at new vertices—no approximation. Vertex colors are a standard, widely-supported format in graphics APIs, so algorithms can process them easily. By lifting the problem from image space to 3D vertex space, all the spatial geometry tools become applicable to texture.", "po": "Texture-aware geometry processing produces richer results than geometry-only or image-only methods. Segmentation respects texture boundaries, parameterizations avoid tearing textures, and filter operations like edge detection work in 3D space while preserving texture structure, making it practical for artists to maintain visual coherence while processing geometry."}}, {"t": "JGS2-GQ: Training-free 2nd Jacobi with Gaussian Quadrature", "th": "volumetric simulation", "m": ["gaussian quadrature", "jacobi solver", "perturbation subspace"], "pr": "JGS2 Cubature method degrades with high-resolution deformation lacking representative training data", "ap": "Training-free Gaussian quadrature integration with adaptive region generation for subspace integration", "co": "Stable volumetric simulation without data generation, handling large novel deformations and frictional contact", "u": "https://www.semanticscholar.org/paper/ccf06f092ccd17471354f493956b7c6f4105e43a", "rc": {"bp": "When a jello jiggles or a foam compresses, we want to predict exactly how it moves and deforms. This matters for animation, robot simulation, and design preview—you need fast, reliable answers without waiting hours for the computer.", "wh": "Jacobi-style solvers split the work into pieces, but overcompensate; prior data-driven fixes require expensive training and fail on new, detailed deformations.", "ap": "Instead of learning from examples, this paper uses classical mathematics: they treat the local solve as something that can be approximated by a low-degree polynomial. That means you can use Gaussian quadrature—a technique from calculus that computes integrals without needing data—to figure out the global influence analytically. The algorithm adaptively figures out the right region to integrate over for each piece, and does it without any training.", "ww": "A polynomial is a simple, smooth function, and Gaussian quadrature is basically the exact formula for integrating polynomials: it evaluates the function at a few clever points and combines them mathematically. No training, no data needed, just math that works.", "po": "The result is a simulator that handles large, never-before-seen deformations without training data, stays stable and convergent, and can even model friction and contact. It's versatile—you can use it on high-resolution foam, cloth, flesh, or anything else without preprocessing."}}, {"t": "Progressing Level-of-Detail Animation for Volumetric Elastodynamics", "th": "level-of-detail animation", "m": ["progressive dynamics", "velocity splitting", "finite elements"], "pr": "LOD animation design requires slow high-resolution preview iteration for volumetric elastodynamics", "ap": "VelPro Splitter integrator with velocity splitting and cross-level consistency in progressive dynamics", "co": "Decoupled finest-level enrichment from LOD levels, enabling efficient multi-resolution volumetric animation", "u": "https://www.semanticscholar.org/paper/cd75edf71b3d2981a6b8b3dbffc549063d0d6545", "rc": {"bp": "Animators and designers want to see a low-resolution preview of how their volumetric object will behave—a quick test—then refine it to high-resolution reality. The level-of-detail pipeline lets you iterate fast and then commit to expensive detail computation only once you're happy.", "wh": "When you solve a coarse simulation, the velocity (motion information) it produces isn't enough to guide a fine simulation: the coarse motion is smooth and lacks the fine vibrations and jitter that make high-res look lively. Previous methods enriched the velocity after the fact, but they mixed in geometric detail unevenly, and if you wanted many LOD levels (for very fine detail), the enrichment quality suffered.", "ap": "This paper introduces a smarter velocity splitter that separates the coarse motion into two parts: a low-frequency bulk motion and a high-frequency ripple component. It recombines these so that the coarse motion is used mainly for the bulk, while the high-frequency richness is generated independently from high-res data. The splitting is done consistently across all detail levels, so whether you have 2 LOD steps or 20, the final detail quality stays the same.", "ww": "Velocity is information about how fast and in which direction things move. By splitting it into slow-changing (bulk) and fast-changing (jiggles) parts, you can handle them separately: bulk motion guides the overall shape, jiggle details add richness. This decoupling means you don't need to stack more and more detail levels to get good shading—the high-res detail is *generated*, not inherited from coarse layers.", "po": "Animators can now run a cheap coarse-LOD simulation in seconds, preview the macro motion, then generate a high-fidelity version with rich bouncing and detail—all with cross-LOD consistency so the result makes sense as a refinement, not a divergent artifact."}}, {"t": "StyleID: A Perception-Aware Dataset and Metric for Stylization-Agnostic Facial Identity Recognition", "th": "face stylization", "m": ["psychometric calibration", "diffusion stylization", "semantic encoding"], "pr": "Identity encoders brittle under face stylization, confusing texture/color changes with identity drift", "ap": "Perception-aware benchmark with 2AFC psychometric experiments and fine-tuned semantic encoders", "co": "StyleID dataset and calibrated models achieving human-aligned perception of stylized face identity", "u": "https://www.semanticscholar.org/paper/cd868d46b4ea009f3e1328c363dbfd5a32b5773f", "rc": {"bp": "An artist wants to draw a face in cartoon, watercolor, or pencil style while keeping it recognizable as the same person. A computer should be able to verify identity is preserved across these artistic transformations, so systems can measure and improve consistency.", "wh": "Current face-recognition models are trained on natural photos, so when you apply stylization—turning a photo into a cartoon—the model gets confused. It mistakes the new colors or exaggerated features for a different person, or it can't tell one stylized version from another. There's no agreed standard for what \"same identity under cartoon style\" should even mean.", "ap": "This paper created two datasets: one where humans rated whether stylized portraits looked like the same person (across diffusion- and flow-based stylizations at different intensities), and another derived from careful controlled experiments asking humans to pick the stronger or weaker version of a face at different style strengths. Using this human-ground-truth data, they fine-tuned existing face encoders to match human perception, so the model learns what matters to human eyes across styles.", "ww": "A face encoder learns from human perception instead of just trying to memorize faces. When humans judge identity across styles, they ign
