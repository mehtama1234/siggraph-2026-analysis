<script>
const DATA = [{"t": "Lucky High Dynamic Range Smartphone Imaging", "th": "HDR image capture", "m": ["deep learning", "raw processing", "multi-exposure fusion"], "pr": "Smartphone cameras limited to 12 stops dynamic range vs 20 stops human perception", "ap": "Lightweight network on linear raw bracketed exposures with convex pixel combinations", "co": "Zero-shot mobile HDR from 3-9 exposures avoiding hallucination artifacts", "u": "https://www.semanticscholar.org/paper/00a21bbfbd00d51c0608d692aa36a5bc3fa3e50c", "rc": {"bp": "When you take a photo with your phone in bright sunlight next to a dark shadow, your camera has to choose: keep the sky white or show details in the shadow, but rarely both. Your eye handles this effortlessly because it sees about 20 stops of brightness levels (a \"stop\" is a doubling of brightness). This paper tackles the core problem of bringing that eye-like vision to smartphone cameras.", "wh": "Phone sensors today max out at about 12 stops of brightness range. Researchers have tried combining multiple exposures (taking the same scene at different brightnesses and merging them), which can squeeze out 3-5 extra stops. But the real trap is that current AI methods often hallucinate—they invent details that weren't actually captured, creating artifacts. You can't trust deep learning here without ground truth.", "ap": "Instead of trusting a neural network to imagine missing details, this method takes a more honest approach: every pixel in the final image is a weighted blend (a convex combination) of nearby pixels from the different exposures, adjusted for how dark or bright each exposure was. It's like mixing paints—if you combine 30% from a dark exposure and 70% from a bright one, you get something in between, not invented.", "ww": "This works because light is linear. If you have the raw pixel data from multiple cameras all pointing at the same scene, just at different exposure levels, you can safely mix them without cheating. The method avoids the brittleness of hallucination-based approaches and the method runs fast enough on your phone because it only does arithmetic, not big neural network inference.", "po": "The paper shows the method generalizes to real phones it never saw before, handling anywhere from 3 to 9 stacked photos. It also works well enough that it even improves other existing methods when you retrain them the same way, suggesting the training approach is robust. Your smartphone can now hold onto details in both blown-out skies and dark shadows without inventing things."}}, {"t": "PQ-Free HD: Priority-Queue-Free Hausdorff Distance for Triangle Meshes on GPU", "th": "mesh distance computation", "m": ["gpu parallelism", "branch-and-bound", "geometric culling"], "pr": "Hausdorff distance between meshes requires global priority queue bottleneck", "ap": "Parallel branch-and-bound with ring buffer replacing priority queue", "co": "71.7x GPU speedup over CPU with 83.9% memory reduction via 29-byte task descriptor", "u": "https://www.semanticscholar.org/paper/02471f49752f569676602199256df0bae66a06ca", "rc": {"bp": "When you have two 3D shapes and want to know how different they are, you compute the Hausdorff distance—the maximum gap between any point on one shape and the nearest point on the other. This matters for design verification, quality control in manufacturing, and collision detection. The trouble is computing it precisely and quickly, especially on modern graphics processors (GPUs).", "wh": "The standard computer-science approach (Branch-and-Bound) is sequential and relies on a priority queue—a data structure that sorts candidates to check next. This is fast on a single CPU core, but GPUs are massively parallel; they work best when thousands of tasks run simultaneously without waiting for each other. A global priority queue becomes a traffic jam—one core manages it while others sit idle.", "ap": "This paper throws away the priority queue and instead uses a ring buffer (a simple, lock-free circular array) to send work to thousands of GPU cores. The trick is relaxing the \"best-first\" ordering: instead of always checking the most promising candidates first, they process work in batches asynchronously. They also add a seven-stage filtering pipeline to quickly prune obviously empty regions so cores never even look there.", "ww": "Ordering doesn't actually matter for correctness if you filter enough. If you can eliminate whole regions as provably not-the-answer, you don't need to know which specific candidate is best next. By switching from sequential, ordered search to parallel, batch-ordered search, they turn a serial bottleneck into a high-throughput pipeline that feeds all GPU cores steadily.", "po": "The speedups are enormous: 71.7 times faster than the best CPU method on typical shapes, and over 10,000 times faster on tricky industrial CAD models. They also shrink the data for each task from many bytes to 29 bytes, saving memory bandwidth. This enables real-time shape comparison on the GPU, useful for interactive design and collision systems."}}, {"t": "Volume-Preserving LBM-MPM Coupling for Air-Water-Sand Mixtures", "th": "multiphase simulation", "m": ["lbm", "mpm", "fluid-solid coupling"], "pr": "Simulating coupled air-water-sand mixtures with multiscale interactions", "ap": "Lattice Boltzmann for fluids coupled with Material Point Method for granular sand", "co": "Volume-preserving simulation of sand mobilization, settling, erosion", "u": "https://www.semanticscholar.org/paper/029ed3becdc907e3350f41e5533db20074058287", "rc": {"bp": "Sand and water don't mix simply. When you pour water on dry sand, it flows through. When sand is fully soaked, it behaves like wet clay, sticky and heavy. Real beaches, riverbeds, and landslides involve complex feedback between flowing water, trapped air, and grains sliding and settling. Simulating this realistically is hard but matters for visual effects, environmental design, and understanding erosion.", "wh": "Most simulators treat water and sand separately. But they're deeply coupled: water changes how sand sticks together and moves, while sand changes how water flows. Separately simulating each and bolting them together creates artifacts—instability, incorrect settling, unrealistic erosion. A unified framework that handles both together needs a method that respects both the fluid flow equations and the granular mechanics.", "ap": "The paper uses two complementary numerical techniques: Lattice Boltzmann Method (LBM) for fluids—a way to simulate flowing, two-phase mixtures (water and air together) by tracking particle collisions on a grid, and Material Point Method (MPM) for granular material—which represents sand as particles moving through space and deforming as they go. A water retention model then describes how liquid clings to and fills the pores inside the granular structure.", "ww": "Combining them in a unified continuum (continuous) framework means both the fluid equations and the sand equations are written in the same language, so they naturally feed into each other. The water retention model is the key physical insight: it captures the transition from dry friction to wet stickiness by tracking how much water is absorbed. Volume conservation (tracking that matter doesn't vanish) stabilizes the whole system numerically.", "po": "The method handles complex real phenomena: sand washing away in floods, sediment settling to the bottom, erosion that undercuts banks. The paper validates on challenging scenarios like breaching a sand basin or a sand column collapsing into water. This opens the door to realistic effects for films and simulations of coastal or riverine disasters."}}, {"t": "Strips as Tokens: Artist Mesh Generation with Native UV Segmentation", "th": "mesh generation", "m": ["autoregressive", "transformer", "topology-aware tokenization"], "pr": "Mesh generation preserves edge flow yet autoregressive transformers fail artist standards", "ap": "Strip-based token ordering encoding UV boundaries as connected face chains", "co": "Unified decoder for both triangle and quad meshes with structured UV layout", "u": "https://www.semanticscholar.org/paper/03068f6631a4b3223963af039c1ef3cc5546363f", "rc": {"bp": "Professional 3D modelers create shapes by hand, laying out faces (flat surfaces) in organized flows, keeping similar sizes, and aligning edges into neat strips called \"quads\" (four-sided faces) when possible. This organization matters not just for looks but for animation, UV mapping (how textures wrap), and subsequent tools downstream. Generating meshes that meet artist standards has been elusive because most AI methods produce chaotic, random-looking topology.", "wh": "Recent AI methods (transformers) generate 3D shapes by predicting faces one at a time in some sequence. The problem is choosing what order. If you sort by coordinates, sequences get long and rambling. If you use patches (groups of faces), you break the continuous flow of edges that professionals carefully craft. You get shapes that are geometrically okay but organizationally ugly—random-looking and hard to edit.", "ap": "This paper treats faces as tokens in a sequence inspired by triangle strips, a graphics technique where you chain faces along edges to minimize data. They construct the sequence as a connected walk through faces that explicitly marks UV boundaries (seams where textures wrap). The same sequence can be decoded as either triangles or quads, letting them train jointly on both data types.", "ww": "By honoring the edge flow naturally, they preserve the semantic layout (what parts belong together) that artists encode. The UV boundaries are explicit in the token sequence, so the model learns that edges flow coherently. Training on both triangles (lots of data) and quads (high quality) lets the model learn coarse structure from abundant data and refine into organized topology from curated examples.", "po": "Output meshes have better geometric quality, more coherent structure, and cleaner UV segmentation. This means artists spend less time hand-editing generated shapes and can integrate them faster into pipelines. The model respects professional conventions instead of violating them, making AI-assisted modeling actually usable in studios."}}, {"t": "A Few-Step Generative Model on Cumulative Flow Maps", "th": "generative modeling", "m": ["flow-based models", "diffusion models", "cumulative transport"], "pr": "Generative models require many steps reducing inference efficiency for synthesis", "ap": "Cumulative flow maps framework unifying local updates with finite-time transport", "co": "Few-step or one-step generation with minimal training changes and quality preservation", "u": "https://www.semanticscholar.org/paper/034040ca5dc45cfa24da7bf931a43a5f5fbd221e", "rc": {"bp": "Generative models (like diffusion, which gradually adds noise then removes it) can create sharp, realistic images, but they usually need many steps of denoising—sometimes 50 or more. If you want fast generation (one or two steps), you sacrifice quality. This paper asks: can we redesign the math so that few steps still work well?", "wh": "Traditional diffusion models think in terms of a corruption schedule: add noise for T steps, then remove it for T steps. Moving between timesteps is slow and must be done sequentially. If you skip steps to go faster, you lose quality because you're making big jumps in an ill-conditioned space. Rethinking this as a probability flow (how the data shifts through space) doesn't obviously help if you still take small, local steps.", "ap": "Instead of thinking about local, instant changes, they introduce cumulative flow maps—a concept from physics where you track how points move over finite time, not just infinitesimal time. A cumulative flow parametrization groups many steps into a single coherent motion. They apply this to both diffusion and flow-based generative models, changing how the model predicts and how time embeddings work.", "ww": "Cumulative flows let the model reason about large, global state changes instead of micro-steps. It's like moving from considering the next grain of sand to move toward mapping out the whole avalanche. The model can learn to make a big, coherent jump that maintains quality, rather than many tiny hops. The framework needs minimal architecture changes and no extra parameters.", "po": "Images, 3D shapes, and other data can now be generated in one or few steps with quality comparable to 50-step methods. This cuts inference time dramatically while keeping synthesis quality, enabling fast text-to-image or text-to-shape on devices and in interactive applications. The method is general—it works for images, shapes defined as implicit fields (SDFs), and even joint prediction tasks."}}, {"t": "GenPIE: A Time-Resolved Plenoptic Imager", "th": "computational imaging", "m": ["time-resolved imaging", "inverse rendering", "foundation models"], "pr": "Time-resolved plenoptic imaging combats high dimensionality and occlusion blind spots", "ap": "Decoupled laser-detector hardware with generative inverse transient rendering", "co": "Sparse observations bridged to full light transport via 3D foundation model priors", "u": "https://www.semanticscholar.org/paper/09de3337717dc97eb3c39e753d3f8eca46e1dda7", "rc": {"bp": "The plenoptic function is the map of all light rays bouncing around a scene—for each direction looking from each spot, how bright is it? Capturing it fully reveals all the visual information about a scene. Time-resolved imaging (recording when light arrives) adds a temporal dimension, useful for seeing through fog or reconstructing 3D from light travel time. But sampling this huge space is practically impossible.", "wh": "The plenoptic function has five dimensions: two for camera position, two for viewing angle, and one for time. Sampling densely requires millions of measurements. Current systems couple illumination and viewing—you turn on a light and a camera sees it, but you can't independently control where light comes from and where you observe reflections. Many indirect light paths are blocked by occlusion (a nearby object hiding a far one).", "ap": "This paper decouples the laser (that sends light) from the detector (that measures it) so they can probe from different angles independently. They use a generative model—specifically, a 3D foundation model for initialization—to fill in the massive gaps from sparse samples. A differentiable transient path tracer (a physics simulator you can backpropagate through) refines the solution to match the few measurements you actually took.", "ww": "Foundation models come with strong 3D geometric priors (they've seen thousands of shapes and scenes), so they make reasonable guesses for unseen regions. The differentiable path tracer then tunes those guesses to be physically consistent with what you measured. Decoupling illumination and detection means you can shine light where a wall would block direct viewing, recovering indirect paths. The combination of learned priors and physics is more powerful than either alone.", "po": "The system captures high-dimensional light transport from sparse, practical measurements, recovering both visible and hidden regions. This enables new computational imaging: seeing through fog, capturing indirect reflections, reconstructing 3D transient phenomena. The generative framework elegantly bridges the gap between the measurements you can realistically take and the full information you want."}}, {"t": "Better Bending: Analysis, Construction and Verification of Discrete Bending Models for Kirchhoff-Love Shells", "th": "shell simulation", "m": ["discrete bending", "convergence analysis", "numerical validation"], "pr": "Thin shell discretization lacks consensus on best bending models across scenarios", "ap": "Systematic analysis of ten discrete Kirchhoff-Love bending models with variants", "co": "Best practices identifying model tradeoffs in accuracy, performance, stability", "u": "https://www.semanticscholar.org/paper/0b1200cce86bf09abcbc88e351afaabaa6327977", "rc": {"bp": "Thin shells—cloth, paper, metal sheets, membranes—are everywhere in animation and design. They bend and fold convincingly when you simulate them correctly, but getting the mathematics right is surprisingly subtle. Different ways of breaking the continuous shell mathematics into discrete pieces (on a computer) give different results. Which one should you use?", "wh": "For decades, graphics researchers have proposed ten or more different discrete models for shell bending, with no consensus. Each makes different trade-offs: some are fast but inaccurate, some squeeze out precision but choke on sharp folds, some work on regular grids but fail on irregular meshes. Without careful comparison, it's unclear which to pick. And the literature doesn't give clear guidance on when a model breaks down.", "ap": "The paper tests all ten major models on three levels of challenge: an analytic benchmark (a shape with a known perfect answer) to measure convergence, a sharp-bend benchmark to see behavior at creases, and large-scale practical problems (hanging cloth, folding paper, dynamic draping). They measure accuracy, convergence as the mesh gets finer, and computational cost. They also identify gaps and propose new variants to fix them.", "ww": "Systematic testing reveals that different models shine in different contexts. Some converge smoothly as you refine the mesh; others have weird artifacts. Some handle dynamics well but fail at equilibrium. By comparing side-by-side, you see that the best model depends on your priorities (speed vs. accuracy) and your mesh type. New variants address specific failure modes.", "po": "Practitioners now have concrete guidance: which model to use for cloth vs. paper, when mesh quality matters, how much refinement you need. The paper identifies leading models and their tradeoffs, proposes new energy formulations, and gives practical algorithms. This removes guesswork from shell simulation, saving artists and engineers time and preventing unexpected failures."}}, {"t": "YASPS: A Symbolic Framework for Extensible, High-Performance IPC Simulation", "th": "physics simulation", "m": ["symbolic differentiation", "incremental potential", "automatic derivatives"], "pr": "IPC contact simulation requires re-deriving derivatives for each energy variant", "ap": "Symbolic framework with JOIN/UNION operators encoding connectivity and parameterizations", "co": "Automatic derivative derivation enabling extensible contact simulation", "u": "https://www.semanticscholar.org/paper/0c236a5113e00a2b7ddd5a9cb35ed59228da52ca", "rc": {"bp": "Simulating objects that collide—cloth tangling, sand piling, characters grabbing props—requires solving one big physics equation per frame: minimize energy (the cost of deformation, interpenetration, friction) subject to contacts not overlapping. This is robust and handles messy scenarios well. But it's also complex: adding new materials or collision types means re-deriving calculus by hand and rewriting code for each case.", "wh": "Current simulators hard-code specific energy types, shape types (spheres, capsules, meshes), and shape representations (parameterizations). If you want to add a new energy or mix different parameterizations in the same equation, you manually derive all first and second derivatives (a day of calculus) and hand-code the assembly logic. With many parameterization pairs, this explodes combinatorially.", "ap": "This paper introduces a symbolic framework (YASPS) that makes the structure of physics explicit in a computation graph. Two operators—JOIN (connectivity) and UNION (heterogeneous types)—encode which objects interact and how they're represented. Symbolic differentiation automatically computes all the derivatives you need. The sparsity pattern of the resulting matrix (which entries are nonzero) emerges automatically from the graph structure.", "ww": "You write the physics once in an abstract language, and the system automatically derives gradients and assembles the linear system. This is safe (derivatives are computed correctly) and maintainable (adding a new energy type means writing it once, not deriving and coding). The symbolic structure also reveals sparsity, so you never allocate memory for zero entries—a huge win for large systems.", "po": "Adding new energies, parameterizations, or material behaviors is now a matter of describing them symbolically, not hand-coding derivatives. This opens the door to rapid prototyping of new simulation physics and to systems that mix diverse parameterization (rigid bodies, deformable solids, cloth, each with its own representation) seamlessly. The framework removes a major barrier to experimentation."}}, {"t": "RCGP: Resource Contracts for Graphics Programming", "th": "graphics programming", "m": ["formal verification", "type checking", "resource contracts"], "pr": "Graphics pipeline contracts enforced implicitly causing late detection of mismatches", "ap": "Centralized resource declarations with formal contract specification and verification", "co": "Statically enforced resource compatibility between shader and pipeline components", "u": "https://www.semanticscholar.org/paper/0c52f47fddd03b43e7ebd7a4d4eee475a4456f53", "rc": {"bp": "Modern graphics programs are orchestrations of thousands of parts: shaders (small programs on the GPU), buffers (blocks of data), pipelines (sequences of processing stages), and synchronization rules (when data is ready). These parts must agree on contracts: what type of data, what layout in memory, which GPU resources are bound where. Breaking a contract causes crashes or visual glitches that are hard to debug.", "wh": "Today, contracts are implicit—written in documentation or enforced by convention. A shader expects data in a buffer bound to location 5, but if the CPU code binds to location 4, there's no compile-time warning. The error emerges at runtime as corrupted visuals or cryptic validation failures. Catching these bugs requires careful testing and can be time-consuming for complex pipelines.", "ap": "RCGP formalizes contracts as explicit declarations, like type signatures in programming. Resources (buffers, textures, bindings) are declared in one central place. Program modules import and export these contracts. Combinators check that modules can connect—if one module outputs type A and the next expects type B, the composer catches it immediately. Witnesses enforce contracts at runtime.", "ww": "Making contracts explicit and centralizable means the compiler can check them statically (before running) instead of at runtime. If a contract breach happens, you get an error message pointing to the line, not a visual glitch after minutes of rendering. The central declaration avoids drift—you change the contract in one place, and the type checker ensures all modules see the same spec.", "po": "Graphics programmers catch resource contract bugs at development time, not in production. Visual artifacts from binding mismatches evaporate. The central declarations become documentation and reduce boilerplate. This is a quality-of-life improvement for teams writing large, modular graphics systems."}}, {"t": "GMT: A Geometric Multigrid Transformer Solver for Microstructure Homogenization", "th": "neural solvers", "m": ["transformer", "multigrid", "physics-informed learning"], "pr": "Lattice homogenization surrogates sacrifice accuracy/stability for speed", "ap": "Geometric Multigrid Transformer aligned with GMG hierarchies on sparse structures", "co": "160x speedup at 10^-5 residual error matching engineering requirements", "u": "https://www.semanticscholar.org/paper/0dfbe4906c02b552aef42f4d2e97f1478661829c", "rc": {"bp": "Lattice metamaterials are lightweight structures made from tiny repeating unit cells—think of a honeycomb or a truss. They're strong, light, and can be tuned for vibration damping or thermal properties. Evaluating their effective properties (how stiff they are, how they respond overall) requires solving large equations on the unit cell. Doing this for each design candidate is slow, but you need speed to explore designs.", "wh": "Classical solver methods (like conjugate gradient or multigrid) are accurate but slow, especially for high-resolution metamaterials. Replacing them with neural networks is tempting for speed, but neural networks often lack physical rigor—they might give wrong answers or be unstable. You need both the speed of neural prediction and the certainty of numerical solvers.", "ap": "GMT combines a Transformer (a neural architecture that sees long-range relationships) with Geometric Multigrid, a classical solver technique that works on multiple resolutions simultaneously. The Transformer runs on the coarse and fine levels, predicting both the solution and correction terms (residuals) needed. Then one step of the classical multigrid algorithm refines the prediction to convergence.", "ww": "Multigrid accelerates solvers by smoothing at coarse scales and refining at fine scales. The Transformer mirrors this hierarchy, capturing dependencies across scales. Predicting both the solution and residual corrections gives the classical solver a good initialization, reducing iterations. Physics-aware positional encoding (encoding periodicity directly into the Transformer) ensures answers respect the material's periodic structure.", "po": "The hybrid method achieves residual errors under 1 part in 100,000 (high numerical accuracy) and runs 160 times faster than GPU-based classical solvers at equivalent accuracy. For high-resolution metamaterials (512×512×512), where classical methods are prohibitively slow, this enables interactive design exploration. The approach demonstrates that neural and classical numerics can be married for the best of both worlds."}}, {"t": "Bounding Stratified Bernoulli Impulses for Ray Marching Gaussian Process Implicit Surfaces", "th": "neural rendering", "m": ["gaussian processes", "ray marching", "spatial acceleration"], "pr": "Ray marching Gaussian process surfaces requires full noise evaluations reducing efficiency", "ap": "Stratified Bernoulli impulses and region-level bounds pruning marching points", "co": "Accelerated GPIS rendering via two-level bounding strategies", "u": "https://www.semanticscholar.org/paper/0fe993ae7be82e61b8a2b8341782163fca4f330b", "rc": {"bp": "Rendering surfaces defined implicitly (as Gaussian process implicit surfaces—probabilistic descriptions of where surfaces are) allows rendering uncertainty and soft, fuzzy boundaries, useful for surfaces reconstructed from sensor noise. The catch is finding where rays hit the surface: you must march along the ray testing if you're inside the implicit surface, and each test is expensive because you must sample and evaluate Gaussian processes.", "wh": "Brute-force ray marching evaluates the implicit surface at every step along the ray, which is slow. If you can skip unnecessary steps or eliminate regions before reaching them, you save evaluations. Standard ray tracing uses bounding boxes to skip empty space, but implicit surfaces don't have a rigid boundary—they're probabilistic and fuzzy. It's unclear how to prune them safely.", "ap": "The paper derives mathematical bounds for Gaussian process implicit surfaces. Stratified Bernoulli impulses (a probabilistic technique) let you quickly bound whether a single ray point is likely to be near the surface, replacing expensive full evaluations. A region-level bound uses spatial acceleration structures to identify large patches of space that are probabilistically empty, so the ray marcher never checks them.", "ww": "Bounding works because Gaussian processes have structure: they're smooth and their variance changes predictably. You don't need to evaluate them densely; instead you prove that certain regions are too far from the surface and skip them. Two levels of bounds—point-level and region-level—cascade pruning: regions rules out large areas, point-level rules out remaining candidates.", "po": "Ray marching through implicit surfaces becomes much faster because evaluations are sparse. Overall rendering time improves substantially. This enables interactive rendering of probabilistic surfaces, useful for geometry from reconstruction algorithms that output uncertainty along with shape."}}, {"t": "Iskra: A System for Inverse Geometry Processing", "th": "inverse geometry", "m": ["automatic differentiation", "adjoint method", "geometry processing"], "pr": "Differentiating geometry processing algorithms requires reformulation for optimization", "ap": "Adjoint method applied to existing imperative geometry processing code", "co": "Efficient backward pass through mean curvature flow, parameterization, deformation", "u": "https://www.semanticscholar.org/paper/14ac03260a290a8b6effa303b50f4d0fa1ae0034", "rc": {"bp": "Geometry processing algorithms (smoothing surfaces, parameterizing textures, deforming shapes) output 3D shapes or parameters. What if you want to use these outputs as objectives in machine learning? For instance, \"minimize the distortion when texturing this mesh\" as a loss function? You'd need to differentiate through the geometry algorithm—compute gradients of its output with respect to inputs. Current tools make this tedious.", "wh": "Geometry algorithms are complex: they involve iterative solvers (local-global methods, ADMM), matrix operations, and approximations tailored to geometry. Standard automatic differentiation frameworks (like PyTorch) can backpropagate through anything, but they're slow because they don't exploit structure. Geometry processing inherits efficiency through specialized solvers; automatic differentiation throws that away.", "ap": "Iskra differentiates through geometry algorithms by using the adjoint method (a classical technique for computing gradients through PDEs and solvers) on user-written imperative code. It exploits the structure of common solvers—the algorithm's sweep patterns, the block structure of matrices—to build an efficient backward pass. It integrates with machine learning frameworks but doesn't force you to rewrite the algorithm.", "ww": "The adjoint method is mathematically sound and efficient because it directly computes gradients without unnecessary computation. Tailor-made for iterative solvers, it avoids storing full computational history. Scatter-gather operations (the core of mesh processing) map cleanly to tensor operations, bridging the gap between imperative mesh algorithms and differentiable compute graphs.", "po": "You can now differentiate through existing geometry solvers (mean curvature flow, conformal parameterization, deformation, geodesic computation) without rewriting them. This opens applications in inverse geometry: given a desired property, optimize the input shape to achieve it. The low memory and fast runtimes let practitioners use geometry algorithms inside machine learning workflows."}}, {"t": "Pixels2Peaks: Converting Terrain Images to Heightmaps", "th": "terrain reconstruction", "m": ["3d reconstruction", "diffusion models", "inverse graphics"], "pr": "Inferring terrain heightmaps from single images requires unoccluded and occluded regions", "ap": "Camera extraction and diffusion model for occluded regions with consistency constraints", "co": "Complete detailed heightmaps obeying geomorphological, hydrological, view consistency", "u": "https://www.semanticscholar.org/paper/17cbcfd6f7a5c95576e635d8cc3ee14c39048532", "rc": {"bp": "When filmmakers or game artists build a scene, they often start with a photograph of real terrain as reference: \"I want mountains that look like this photo.\" Manually building a matching 3D terrain is slow and tedious. This paper asks: given a single photo, can you automatically generate a 3D heightmap (a 2D grid where each cell's height is the elevation) that matches the photo's view?", "wh": "From a single photo, you can only see what the camera points at. Terrain behind hills or outside the frame is invisible. Naively extracting 3D shape from the visible parts gives an incomplete terrain. A diffusion-based generative model can invent the hidden parts, but there's no guarantee the made-up terrain is plausible or consistent with the visible region.", "ap": "The method runs in two phases. First, it extracts the camera position and 3D point cloud from the image, converting that to a heightmap for visible areas. Second, it uses a diffusion model (trained on real elevation data) to fill in occluded regions. Three consistency checks guide the generation: geomorphological (hidden terrain resembles visible), hydrological (rivers flow realistically), and visual (rendering the result matches the input photo).", "ww": "The visible-part extraction is grounded in photo geometry—it doesn't hallucinate, just reconstructs captured data. For occluded regions, the diffusion model has seen real terrain and learned what elevation patterns are plausible. The three consistency principles anchor the solution: they prevent the invisible parts from being arbitrary or violating terrain physics. Rendering checks ensure the final terrain actually looks like the photo.", "po": "Artists can feed a reference photo and get a complete, renderable 3D terrain in minutes instead of hours. The heightmap integrates with standard scene authoring tools. The method handles various scales and terrain types. This bridges the gap between concept-art reference and functional 3D assets for games and films."}}, {"t": "Heterogeneous Subspace Corrections for GPU Deformable Multibody Dynamics", "th": "multibody dynamics", "m": ["gpu solver", "krylov iteration", "adaptive cross approximation"], "pr": "GPU solvers struggle with ill-conditioning in heterogeneous multibody stiff contacts", "ap": "Newton-CG variant with adaptive cross approximation for low-rank coupling", "co": "GPU convergence comparable to direct solvers with high-resolution stiff contacts", "u": "https://www.semanticscholar.org/paper/1eddb895a5cd9d7c620ce236ea4b999c02cbc920", "rc": {"bp": "Simulating multibody systems with mixed materials—rigid metal parts touching soft cloth and foam—is tricky on GPUs because each type needs different math. Stiff contacts (rigid bodies pressing together) and soft deformations (foam squashing) have very different time scales and behavior. A solver that works well for one often fails on the other.", "wh": "Standard Newton-Krylov solvers (iterative methods for large systems) converge slowly when the equation is ill-conditioned—when small changes in input cause huge changes in output. Mixed stiffness (some parts very stiff, others soft) creates terrible conditioning. GPU solvers must be matrix-free (avoiding storing huge matrices), but Krylov methods need good conditioning to converge fast.", "ap": "Heterogeneous Subspace Corrections splits the problem into two parts: a Newton-CG iteration for deformable bodies and a Neumann-based iteration for rigid-body contacts. A GPU-based Adaptive Cross Approximation algorithm exploits the low-rank structure of coupling matrices (the parts that connect deformable and rigid regions) to avoid expensive sparse matrix operations. A specialized data structure assembles contact forces in parallel.", "ww": "Splitting by material type decouples the ill-conditioning: each part has better conditioning on its own. Low-rank approximation of coupling means you don't multiply huge matrices; you work with compact representations. Parallel contact Hessian assembly (building the matrix describing contact forces) avoids serialization. Together, these transform a slow, ill-conditioned problem into a fast, well-structured computation.", "po": "Complex heterogeneous multibody systems now converge as quickly as direct solvers but run on GPUs and scale to high-resolution models with extensive contact. This enables real-time simulation of mixed-material scenes: rigid machinery interacting with cloth or foam, scenarios where prior GPU solvers would thrash or fail."}}, {"t": "Persistence-guided Prescribed Topological Simplification", "th": "topology simplification", "m": ["persistent homology", "topological algorithms", "mesh editing"], "pr": "Topology simplification either removes all features or provides indirect control", "ap": "Persistent homology guides cutting/filling to remove low-persistence features", "co": "Exact preservation of prescribed topological features with minimal geometric change", "u": "https://www.semanticscholar.org/paper/205d64fa2ff3ec2c09fc680ab354e88d494dbcbf", "rc": {"bp": "3D shapes have topology—holes, handles, cavities—independent of their exact geometry. Sometimes you want to simplify topology (remove holes) while keeping geometry (the shape's look) as unchanged as possible. This is useful for repairing noisy scans, preparing assets for animation, or ensuring shapes have certain structural properties. Existing methods either remove everything or give you little control.", "wh": "Topology is global structure: a shape's number of handles (donut holes), components (separate pieces), and voids (enclosed cavities). Simplifying it naively creates big geometric changes. And specifying exactly which topological features to keep is hard—you'd need to manually identify every hole you want. Automating this requires understanding which features matter and which can be discarded cheaply.", "ap": "The method uses persistent homology (a mathematical tool tracking which topological features are significant) to identify low-importance holes, handles, and voids. For each one marked for removal, it computes candidate cutting and filling operations (operations that would eliminate it). An efficient algorithm picks an optimal subset of candidates to minimize geometric change while hitting the target topology. An iterative refinement alternates between candidate suggestion and selection.", "ww": "Persistence measures whether a feature is \"fleeting\" (appears and disappears as you scan across the shape) or \"robust\" (lasts across many scales). Fleeting features are noise; robust ones are real. By removing only low-persistence features, the method discards noise-like artifacts and preserves intended structure. Candidate precomputation and optimal subset selection avoid exponential search.", "po": "Users specify the target number of components, handles, and voids, and the method simplifies the topology to match, making minimal geometric changes. This works on complex real shapes with hundreds of holes. The method is highly successful, making it practical for asset repair, scan cleanup, and ensuring structural properties needed downstream."}}, {"t": "SQuadGen: Generating Simple Quad Layouts via Chart Distance Fields", "th": "mesh generation", "m": ["diffusion", "continuous representation", "generative model"], "pr": "3D shapes lack simple quad mesh layouts for efficient editing and modeling", "ap": "Diffusion-based generative framework leveraging Chart Distance Fields continuous representation", "co": "Synthesizes artist-friendly simple quad layouts with robust automated recovery pipeline", "u": "https://www.semanticscholar.org/paper/25c0967c1908443b3f6bcbd8b74cac6c0ad95b01", "rc": {"bp": "When you scan a real object or generate a 3D shape with AI, you get a jumbled tangle of polygons that's hard for artists to edit. To make the shape flexible for modeling—stretching, sculpting, changing how it bends—you need it organized into rows and columns of four-sided blocks, like a quilt. This is the invisible scaffolding that holds a digital shape together so humans can shape it without fighting chaos.", "wh": "Making that quilt automatically is exceptionally tricky. Most algorithms grind away and produce ugly, knotted layouts—spirals and dead ends and twisted bands—that force an artist to spend days cleaning up by hand. The computer can't easily 'think' about what makes a layout simple because topology (the connections between pieces) is a discrete puzzle with no smooth gradient to follow.", "ap": "This paper introduces a generation model trained to dream up simple quilt layouts directly. Instead of working with the tangled mesh itself, they convert it into something smoother: Chart Distance Fields, which measure distance across the surface in a continuous way. They feed noisy versions of this field into a diffusion model—like reversing a blurring process—and it learns to denoise toward plausible, neat layouts. They also built a big dataset by mining existing 3D repositories and recovering the quilt structure from good examples.", "ww": "By working in this continuous distance-field space, the model sidesteps the discrete nightmare. It can learn gradual transitions between messy and neat layouts, and diffusion naturally captures the varied patterns that make a layout simple (long straight lines, few branches). Training on real successful quilts means the model learns human taste, not arbitrary rules.", "po": "The system reliably generates layouts that are simple and artist-friendly, cutting tedious manual cleanup. Real test cases show it outperforms traditional algorithms and works on diverse shapes—from scanned objects to AI-generated characters—with robust, buildable results."}}, {"t": "Implicit Surface Compression -- with Good Old Discrete Cosine Transform and Motion Compensation", "th": "volumetric compression", "m": ["discrete cosine transform", "motion compensation", "temporal coding"], "pr": "Dynamic 3D content compression requires real-time encoding for volumetric capture streaming", "ap": "Adapts 2D video coding paradigms DCT and motion compensation to TSDF volumes", "co": "Achieves 35% bitrate savings and 12× reduction with real-time 30 FPS encoding", "u": "https://www.semanticscholar.org/paper/25fc40c511bb89ab96ad7de8bc26072350864dfe", "rc": {"bp": "Virtual cameras now capture real people and objects in 3D video—every moment, every angle. Storing and streaming this mountain of volumetric data is expensive; you need compression that's fast enough to use live and compact enough for transmission. This is the video codec for 3D.", "wh": "Existing compression methods either treat each frame in isolation (wasteful, ignoring that the shape barely changes frame-to-frame) or require expensive registration algorithms that track how surfaces move in time. Neither works well for real-time capture or large virtual worlds.", "ap": "The authors adapt vintage video-compression tricks from the 1980s and 90s—things like Discrete Cosine Transform (the math that powers JPEG) and motion compensation (predicting where a region moved based on nearby motion)—to compress volumetric 3D content frame by frame. They work with Truncated Signed Distance Fields, a standard way to represent captured surfaces, which is nice because it fits naturally into existing capture pipelines and doesn't need to track vertex-by-vertex motion.", "ww": "Video compression works because adjacent frames are nearly identical, and motion compensation exploits that: if you know a block shifted left, you can predict the next frame by copying and shifting. The same logic applies to 3D volumes shifting in time. Discrete Cosine Transform is mathematically efficient and hardware-friendly. No expensive learning or registration needed.", "po": "The codec runs in real-time at 30 FPS and cuts bitrate by roughly 35% compared to per-frame storage. On synthetic scenes with big motion, it reaches 12× compression—dramatically cheaper to store and stream live captured performance."}}, {"t": "Matérn Noise for Triangulation-Agnostic Flow Matching on Meshes", "th": "mesh generation", "m": ["flow matching", "matérn process", "gradient domain"], "pr": "Mesh signal generation needs triangulation-agnostic models for diverse mesh topologies", "ap": "Adapts flow matching with Matérn noise distribution using PoissonNet denoiser", "co": "Generates realistic signals on million-triangle meshes triangulation-independently", "u": "https://www.semanticscholar.org/paper/2808c15d221f9ff41cf1fbbdb47292eb993569c9", "rc": {"bp": "You want a computer to generate signals draped over a wiggly surface (a curved mesh of triangles) the way a scattering pattern sits on a canvas or waves flow over landscape. But there's a catch: the training should work on one triangulated surface and automatically apply to any mesh, even if it's divided into triangles a different way.", "wh": "Meshes are arbitrary—the same shape can be split into triangles in a million different ways. Training a model on one particular triangle layout breaks immediately when you feed it a different triangulation of the same shape. Most generative models assume a fixed grid (like pixels in an image), so this problem doesn't exist for them.", "ap": "The paper adapts flow matching—a generative technique that reverses a blurring process—to work on meshes in a triangulation-agnostic way. The key innovation is choosing the right noise distribution: they use Matern noise, a mathematical construct from random fields theory, because its spectrum (its mathematical fingerprint) is invariant to triangulation. The denoiser learns to refine noisy mesh signals using PoissonNet, a method that works in the gradient domain and doesn't care about triangle layout.", "ww": "The spectrum of a noise distribution captures its essential character independent of how you sample or discretize it. Matern noise has this universal property built in. By working in gradient space, the model thinks about local slopes, not absolute positions—another triangulation-agnostic quantity. This lets the model learn the intrinsic geometry of the surface, not artifacts of the mesh.", "po": "The system generates realistic elastic poses and humanoid positions on meshes with over a million triangles, and seamlessly generalizes to any triangulation of the same shape—no retraining needed. It beats prior methods in both quality and generality."}}, {"t": "Surface chamfering for robust tetrahedral meshing", "th": "tetrahedral meshing", "m": ["delaunay refinement", "geometric predicates", "chamfering"], "pr": "Tetrahedral meshing fails on complex inputs with acute angles causing robustness issues", "ap": "Delaunay refinement with novel chamfering approach removing acute input angles", "co": "Succeeds on 100% of test models versus 63% for existing methods with bounded angles", "u": "https://www.semanticscholar.org/paper/290c7015aeb20ffd5a39c070151361844968e7aa", "rc": {"bp": "Engineering and science often need volumetric meshes made of tetrahedra—chunks filling a 3D shape—to run simulations (stress, heat, flow) or prepare models for 3D printing. Making these high-quality meshes is a bottleneck: traditional algorithms fail on realistic shapes with tight corners and ugly angles.", "wh": "Sharp corners in the input (acute angles) wreck Delaunay refinement, the standard algorithm for tetrahedral meshing. When the input has a corner, the algorithm struggles to terminate gracefully and produces badly-shaped tetrahedra. Current tools like Tetgen fail on a third of real models.", "ap": "The authors modify the input shape by chamfering: they slice off the sharp corners with small bevels, creating rounded transitions. On this smoothed input, Delaunay refinement produces clean tetrahedra. Then they reinsert the removed corner material, accepting a small number of distorted tetrahedra localized to those regions. They use modern mathematical tricks—clever indirect predicates and implicit point representations—to guarantee numerical robustness through all stages.", "ww": "Chamfering removes the root cause of failure (acute angles). Delaunay refinement is mathematically elegant and guaranteed to terminate on smooth inputs. Reinserting the corners separately means imperfection is localized and predictable. Using indirect geometric predicates means the algorithm never computes exact coordinates, avoiding floating-point catastrophe.", "po": "The system succeeds on all 3942 models in a standard benchmark, whereas the best prior tool failed on 37% of them. Mesh quality matches the best existing methods, with robust handling of diverse, difficult real-world shapes."}}, {"t": "LLM-enhanced Scene Graph Learning for Household Rearrangement", "th": "scene understanding", "m": ["scene graphs", "affordance learning", "llm integration"], "pr": "Scene rearrangement requires balancing objective functionality and subjective user preferences", "ap": "LLM-enhanced scene graphs create Affordance Enhanced Graphs with enriched node relations", "co": "Autonomous household rearrangement in unseen environments achieving state-of-the-art detection", "u": "https://www.semanticscholar.org/paper/2b6fafa606a5670efe7ad6d97d692b5db61108e0", "rc": {"bp": "A robot tidying a messy home needs to understand what objects belong where—not just by rote rule, but by reasoning about what each surface is for, what you might put on it, and what you prefer. This combines common sense, physical understanding, and personal taste into a task-planning problem.", "wh": "Traditional approaches either rely on hand-coded rules (fragile and not personal) or ignore context entirely. A bowl can go on a table, but maybe not your living-room coffee table. The space between true understanding (semantic, preferential) and brittle automation is vast.", "ap": "The authors use a scene graph—a structured representation of objects and their spatial relationships—as the starting point. They feed this graph to a large language model to enrich it: each surface object (table, shelf, counter) is augmented with affordances—learned descriptions of what can be placed on it, conditioned on context. New abstract relationships are discovered and added to the graph. Then the robot plans by finding misplaced objects and determining the best receptacle for each, guided by the enriched graph.", "ww": "Large language models encode world knowledge—what kitchens look like, what typically holds what—learned from text. The scene graph makes this knowledge concrete and spatial: the model can reason about \"this shelf in this room\" rather than abstractions. By aligning affordances with user preference (learned from context), the system balances common sense with individual choice.", "po": "The system achieves state-of-the-art performance on detecting misplaced objects and choosing proper homes for them, in both simulated and real robotic systems. It generalizes to unseen home layouts without retraining, and improves as it observes user corrections."}}, {"t": "Mixwell: Sharp 2D Fluid Brushes for Progressive Physics-Based Mixing", "th": "fluid simulation", "m": ["potential flow", "reverse-drift functions", "gpu acceleration"], "pr": "2D fluid brushes need resolution-independent sharp mixing without global solves or blurring", "ap": "GPU-accelerated analytical methods from potential flow and Maxwell drift formulation", "co": "Progressive real-time mixing via Reverse-Drift Functions without intermediate resampling", "u": "https://www.semanticscholar.org/paper/2b7df31fcec90379d6ce4b67d00c8c11bcf48acd", "rc": {"bp": "Digital painting brushes in software like Photoshop blend colors and mix textures. Currently most do this with heavy computation or look mushy. You want a brush that realistically simulates fluid flow—the way a bristle pushes and swirls paint—while staying sharp and running fast on the GPU.", "wh": "Real physics simulation of fluid flow is expensive and grid-based—it bloats memory and destroys fine detail. Simpler approaches fake it, but lose the tactile realism of bristles moving through paint. The tension is between physical fidelity and speed.", "ap": "The authors design brushes based on potential flow theory—the mathematics of fluid moving around a cylinder. They derive a fast, continuous velocity field for a brush tine, then use GPU-friendly tricks to track how particles drift through this field. Instead of simulating from scratch each stroke, they precompute displacement fields (Reverse-Drift Functions) that encode what happens when you insert, drag, and lift the brush. These stack together like layers, so complex brush paths compose from simple building blocks without needing to resimulate.", "ww": "Potential flow gives an analytical (closed-form) solution instead of requiring numerical solving. Drift functions let you compose effects: a complex stroke is just a chain of simpler operations, each captured as a displacement map. Working in image space and composing in shaders means every pixel is independent—parallelizes perfectly on modern GPUs.", "po": "The system renders realistic, sharp mixing effects in real-time at arbitrary resolution, with no grid-induced blur and zero numerical drift over time. Painters can produce complex, natural-looking results with minimal latency, and it integrates into production tools like Houdini."}}, {"t": "The PhaseTree: Multiphase Signed Distance Fields", "th": "implicit surfaces", "m": ["signed distance fields", "hierarchical trees", "sphere tracing"], "pr": "Volumetric objects with multiple materials need compact representation supporting complex topologies", "ap": "Hierarchical construction tree combining phase-aware primitives through composition operators", "co": "Seamlessly integrates multiphase SDF into standard workflows with 25% overhead preservation", "u": "https://www.semanticscholar.org/paper/2ca224cf8f9913011ef79485dfc20079e8100210", "rc": {"bp": "Real objects—a sandwich, a layered rock, a foam material—are made of multiple materials or phases nested inside each other, with boundaries between them. You want a compact, elegant representation that lets you model all of this at once, render it fast, and do physics-based operations on it like ray tracing.", "wh": "Most methods for representing shapes inside computers use signed distance fields (a function that tells you how far you are from the surface). They work beautifully for single materials, but extending them to multiple materials, interfaces, and complex topology is clunky and expensive.", "ap": "The authors introduce the PhaseTree, a hierarchical tree of primitives (spheres, boxes, bent shapes) combined with composition and warping operators, that directly represents a multiphase object. Each phase has its own signed distance, and the tree structure lets you build complex arrangements by combining simpler pieces. It's like a Lego instruction manual: layers of assembly that build up to the whole.", "ww": "The tree structure mirrors how you'd think about building the object: start with phases, layer them, warp them to fit. Signed distance is preserved through composition (the union of two signed-distance objects is still a valid signed distance). This means classical algorithms designed for single-phase shapes—like ray marching—extend almost automatically to multiphase objects. The hierarchy keeps memory tight and computation smooth.", "po": "The system runs ray tracing (a key rendering algorithm) with only 25% slowdown compared to single-phase, yet handles complex topologies and material boundaries seamlessly. It integrates into existing graphics pipelines without modification, and users can treat single and multiphase workflows identically."}}, {"t": "LayerInbetween: Occlusion-Aware Stroke Correspondence and Inbetweening with Automatic Layering", "th": "animation synthesis", "m": ["stroke correspondence", "automatic layering", "spatial alignment"], "pr": "Vector animation inbetweening struggles with occluded strokes requiring tedious manual layering", "ap": "Occlusion-aware framework with Global-Local Layer Transformation for automatic layering", "co": "Automatic inbetweening resolving occlusions with layer prediction and flexible animation editing", "u": "https://www.semanticscholar.org/paper/2cb10478d6850fa452257dcac8d7fb4c3777d137", "rc": {"bp": "In hand-drawn 2D animation, filling in the frames between key poses (inbetweening) is tedious. When one character stands in front of another, strokes get hidden behind the foreground figure. Animators manually redraw hidden strokes, hide them, and manage layers frame by frame—laborious busywork.", "wh": "Occlusion breaks automated inbetweening: if you don't explicitly draw a hidden stroke in both keyframes, interpolation fails. Standard approaches either ignore hidden strokes or require manual intervention for each one.", "ap": "This paper introduces LayerInbetween, which predicts occlusion and handles it automatically. It learns to infer which strokes are hidden and at what layer depth, then uses a module called Global-Local Layer Transformation to guide how hidden strokes move and deform across keyframes. The system was trained on 17,000+ synthetic pairs of keyframes with known occlusions. During inbetweening, layers are resolved automatically so hidden strokes stay hidden without animator effort.", "ww": "By treating the layer structure as an intermediate variable the model learns, it gains a powerful constraint on stroke motion: strokes at the same layer move coherently, and layers don't penetrate each other. This layer-aware guidance is stronger than raw pixel matching. Machine learning on synthetic data lets the system generalize to hand-drawn styles it's never seen.", "po": "The system reliably inbetweens strokes even with occlusion, generalizing to diverse drawing styles and enabling more flexible editing of 2D animation. It removes a significant category of manual work, letting animators focus on creativity rather than frame-by-frame busywork."}}, {"t": "ACT: A Unified Framework for Rigging and Animating Characters with Arbitrary Topologies", "th": "character animation", "m": ["diffusion transformer", "vision language model", "geometry-guided decoder"], "pr": "Character animation pipelines fracture into sequential rigging and motion stages ignoring morphology coupling", "ap": "Unified generative framework modeling joint skeletal topology and motion in shared latent space", "co": "Zero-shot rigging and text-guided motion for arbitrary non-humanoid characters end-to-end", "u": "https://www.semanticscholar.org/paper/2eaa0951cbea0d5ba5fa83a51709d5a016a2cc89", "rc": {"bp": "Creating 3D animated characters used to require three separate expert tasks: building a skeleton (rigging), painting how skin deforms around bones (skinning), and choreographing motion. AI now generates gorgeous static character models by the thousands—but they're frozen. Getting them to move requires the same tedious pipeline, one character at a time.", "wh": "Rigging and animation are currently independent: you rig a character, then animate it. But there's an implicit coupling—a character's skeleton should match its shape and move in ways consistent with its structure. Sequential pipelines ignore this coupling.", "ap": "ACT reformulates the problem: it treats rigging and animation as two views of the same thing. It uses a Vision Language Model to extract semantic clues from the shape (\"this is an arm, this is a leg\"), then conditions a Diffusion Transformer to jointly generate skeleton topology and motion as a unified sequence. A geometry-aware decoder ensures the skin deforms correctly around the generated skeleton. The same model does zero-shot rigging, text-guided animation, and motion completion by masking different parts of the sequence.", "ww": "Unifying rigging and animation in a shared latent space lets both inform each other: the skeleton respects the shape's structure, and motion respects the skeleton's degrees of freedom. Treating static pose and motion as a sequence in time is natural—the model learns that skeletal configuration and motion are linked. A single end-to-end model eliminates brittle handoff points between pipeline stages.", "po": "The system rigs and animates non-humanoid characters in zero-shot mode (no retraining), generalizing robustly to diverse shapes. It replaces a multi-stage manual workflow with a single end-to-end model, dramatically accelerating character creation from generated assets."}}, {"t": "EgoRelight: Egocentric Human Capture and Illumination Recovery for Relightable and Photoreal Avatar Rendering", "th": "neural rendering", "m": ["egocentric perception", "neural appearance", "hdr estimation"], "pr": "Egocentric telepresence requires simultaneous capture appearance lighting and environment estimation", "ap": "Holistic framework with stereo depth cameras and neural appearance model separating shading", "co": "Photorealistic relightable avatars from HMD with novel ray-sampling generalizing to unseen illumination", "u": "https://www.semanticscholar.org/paper/2ef6b384001f60e03924ee4c1b3b24b3da681b33", "rc": {"bp": "Imagine standing face-to-face with a holographic version of a friend, indistinguishable from real. This requires capturing their motion, inferring how light bounces off their clothes and skin, and predicting how they'd look under different lighting—all from a head-mounted camera looking outward. This is the foundation for true mixed-reality presence.", "wh": "Existing methods solve pieces separately: capture without relighting, or require studio environments. Capturing everything simultaneously from a single viewpoint (the HMD camera) while inferring appearance under novel lighting is vastly harder than studio capture.", "ap": "EgoRelight combines three components: stereo cameras on the head-mounted display capture dense depth maps, which drive an avatar mesh precisely. A neural appearance model learns to separate light-dependent shine (specularity) from permanent color (diffuse), using a specialized ray-sampling strategy that generalizes to unseen lighting without relying on rigid mathematical models of material. Finally, the system estimates the surrounding light environment as a high-dynamic-range map, so the avatar can be relit in any scene.", "ww": "Depth maps give geometric ground truth, reducing ambiguity in appearance inference. Separating specular (view-dependent) from diffuse (view-independent) components makes the appearance model simpler and more transferable to new lighting. Ray-sampling strategy lets the model focus on regions that matter most perceptually, improving generalization beyond training lighting.", "po": "The system produces photorealistic, relightable avatars from egocentric video alone—no studio needed—and renders them seamlessly in any lighting environment. This unlocks practical mixed-reality telepresence with convincing appearance."}}, {"t": "Stochastic geomorphological transport for terrain erosion simulation", "th": "terrain simulation", "m": ["particle methods", "stochastic transport", "momentum conservation"], "pr": "Erosion simulation struggles with temporal scale differences between transport and erosive processes", "ap": "Parallel stochastic particle-based method relaxing strong velocity assumptions for transport", "co": "Simulates multiscale geomorphological features including braided rivers meanders and deltas", "u": "https://www.semanticscholar.org/paper/31e880ae078359ffdcfd02b6a8c0d66db53031f7", "rc": {"bp": "Mountains are carved by water and gravity over millions of years. Landscapes erode, valleys deepen, sediment settles downhill—these processes are fundamental to terrain formation. Computer graphics wants to simulate this and create believable, complex landscapes automatically, with deltas and braided rivers.", "wh": "Water flow and sediment transport happen over vastly different timescales. Water responds in minutes; bedrock erosion takes millennia. Simulating both together is computationally nightmarish. Prior methods made simplifying assumptions (like Stream Power Law) that miss important behaviors.", "ap": "The authors develop a particle-based stochastic method that relaxes those simplifying assumptions. Individual particles represent water or sediment parcels that move, collide, and interact according to momentum conservation—more general physics. The method parallelizes beautifully and tolerates the varied timescales by using statistical averaging rather than synchronized updates.", "ww": "Particle methods are inherently parallel: each particle's motion is independent until collision. Stochasticity handles timescale mismatch: millions of tiny movements sum to larger geomorphological changes without explicit timestep coupling. Grounding in momentum conservation (rather than ad-hoc rules) means the model naturally captures multiscale phenomena.", "po": "The system produces realistic terrain with coherent basins, braided rivers, meanders, and deltas—complex geomorphological features that emerge from simple physics. It runs fast enough for interactive design and avoids artifacts plaguing prior methods."}}, {"t": "Forget Superresolution, Sample Adaptively (when Path Tracing)", "th": "path tracing", "m": ["adaptive sampling", "denoising", "perceptual loss"], "pr": "Sub-1-spp path tracing needs adaptive sampling avoiding uniform quality tradeoffs across image", "ap": "Neural sampler with stochastic sample placement and tone-mapping-aware perceptual training", "co": "End-to-end adaptive sampling and denoising for sparse rendering with improved efficiency", "u": "https://www.semanticscholar.org/paper/32984f79f05451e034b6fccbd1271a4a93165ca2", "rc": {"bp": "Real-time ray tracing (the gold standard for photorealistic images) is expensive. Current methods downsample the image (render at lower resolution, then enlarge) to save cost. But this treats every pixel equally—some regions are visually important, others are just background blur. You want to spend samples where they matter most.", "wh": "Traditional adaptive sampling is mathematically brittle at very low sampling budgets (below one sample per pixel), and deciding where to sample is a discrete choice that breaks gradient-based optimization. Balancing perceptual importance (foreground matters more than background) with sampling cost is hard.", "ap": "The authors develop an end-to-end neural system that learns to place samples adaptively. They use stochastic relaxation to convert discrete sampling decisions into differentiable operations, enabling stable training even at ultra-low budgets. Crucially, they train with a tone-mapping-aware loss that includes realistic image viewing (with gamma correction), preventing over-sampling of imperceptible regions. A pyramidal denoising filter recovers detail from sparse samples.", "ww": "Stochastic formulation of sampling placement allows gradient flow despite discrete choices. Tone-mapping-aware loss aligns optimization with human perception—a region that's perceptually identical after denoising doesn't need extra samples, even if it's technically noisier. Pyramidal denoising exploits multiscale structure in noise and detail.", "po": "The system produces high-quality, perceptually accurate images at sub-one-sample-per-pixel budgets, cutting rendering cost substantially. It learns to focus samples on regions that matter to the viewer, outperforming uniform superresolution approaches."}}, {"t": "HairGPT: Strand-as-Language Autoregressive Modeling for Realistic 3D Hairstyle Synthesis", "th": "hair synthesis", "m": ["autoregressive modeling", "geometric tokenizer", "semantic decoupling"], "pr": "Hair generation entangles global topology with local texture obscuring semantic organization", "ap": "Strand-centric framework treating strands as primitives with spatial and structural decoupling", "co": "Compositional hairstyle synthesis across rare complex and stylized domains with semantic control", "u": "https://www.semanticscholar.org/paper/32b2ca7e3e3ca56340285f69df6eb6dd82c1f68e", "rc": {"bp": "Hair is stunning but geometrically complicated—thousands of strands, each curling and flowing. Creating realistic hairstyles by hand is expert work. You want a generative model that understands hair as a structured, semantic object (scalp regions, style layers) and can synthesize plausible variations, edit parts, and even imagine rare or fantastical styles.", "wh": "Most generative models treat hair as texture or a continuous field, mixing global structure (which strands go where) with local texture (curl and shine). This obscures semantic organization and makes editing and control nearly impossible. You end up with pretty blur, not controllable hair.", "ap": "HairGPT reformulates hair synthesis as a sequence problem: strands are generative primitives, and you build hair hierarchically, scalp region by region, from global layout to fine-grained style. It tokenizes geometry (converting 3D strand curves into discrete tokens) and uses spatial and structural decomposition—treating each scalp region separately, then building each strand from coarse (where it goes) to fine (its exact shape). This mirrors how digital artists actually groom hair.", "ww": "Sequence generation naturally captures hierarchy: earlier tokens set direction, later tokens refine. Spatial and structural decomposition reduces complexity: each subproblem is simpler and more learnable. Aligning the model with artist workflow means semantics (scalp region, strand layer) emerge naturally from the learning process.", "po": "The system generates complex, realistic hairstyles with fine detail, supports semantic editing of scalp regions and layers, and generalizes to rare styles and stylized domains. It transforms hair from opaque texture synthesis into a structured, controllable creative tool."}}, {"t": "TwinPose: Person-Specific Subspaces for Multi-View 3D Pose Estimation", "th": "pose estimation", "m": ["pose subspaces", "twin pose", "multi-view reconstruction"], "pr": "Multi-view 3D pose estimation faces complexity in global optimization and detector coupling", "ap": "Person-specific 3D pose subspaces optimizing with twin pose inheriting instance representations", "co": "Supports diverse 2D detectors leveraging pose-instance cues for simplified multi-person inference", "u": "https://www.semanticscholar.org/paper/32eb49d68b080322f67afe3901261b7bd580e6f3", "rc": {"bp": "Capturing 3D poses of multiple people from several camera angles is useful for VFX, sports, dance. A computer has to detect where people are in each 2D image, then figure out which 2D arms and legs correspond to the same person and reconstruct their 3D skeleton.", "wh": "Current methods treat all people's poses as a global optimization puzzle—a massive tangle of possible combinations. This makes the problem explosively complex and prone to mistakes. Additionally, they're locked to a specific 2D pose detector (OpenPose), preventing the use of newer, better detectors.", "ap": "TwinPose introduces twin poses: for each person detected in 2D, create a corresponding 3D pose that inherits the 2D detector's confidence and instance information. The twins aggregate 2D joints from other camera views that are geometrically consistent with that 3D pose. All twins live in a shared 3D space, but optimization happens person-by-person in learned person-specific subspaces, not globally.", "ww": "Optimizing within person-specific subspaces dramatically reduces complexity—N small problems instead of one giant tangle. Inheriting instance representation from the 2D detector lets newer detectors plug in seamlessly. Geometric consistency (rays from different cameras must intersect) is a powerful constraint that doesn't require global knowledge.", "po": "The system works with diverse 2D pose detectors, scales to many people without explosion in complexity, and leverages richer per-instance information from modern detectors. It achieves robust, efficient multi-person 3D pose reconstruction."}}, {"t": "Physics-Inspired Procedural Texturing of Extremely Deformable Surfaces", "th": "texture synthesis", "m": ["procedural texturing", "wave-based", "gpu-parallel"], "pr": "Dynamic deformable surfaces lose texture quality through extreme map distortion and shifting scales", "ap": "Wave-based procedural texturing algorithms encoding physical processes without simulation", "co": "Plausible animation of deforming objects with extreme texture distortion real-time efficient", "u": "https://www.semanticscholar.org/paper/33347cff4dcb8c1ce9a3791684d909b38d0a2207", "rc": {"bp": "Cloth, skin, water, and other soft materials deform dramatically. When you animate them, texture maps stretch and squash with the surface, resulting in ugly distortion. In nature, deforming materials rupture, wrinkle, compress, and expose internal layers—phenomena that change appearance in realistic ways. You want simulation that captures this.", "wh": "Simply following texture maps to deforming surfaces creates obvious artifacts: extreme stretching, baking distortion into the image. Physics-based texturing is expensive if you require actual simulation. The gap between per-pixel texture fixes and true physical behavior is wide.", "ap": "The authors propose wave-based procedural texturing driven by surface deformation. The algorithm uses standard deformation measurements (strain, curvature) to modulate texture procedurally in real-time on the GPU, mimicking physical phenomena like wrinkling and rupturing without simulating them. Multiple procedural algorithms capture self-similar details at different scales and advect pattern the way fluids do—all computed on the fly from the UV map and deformation, with no history or state needed.", "ww": "Procedural texturing is inherently parallelizable (each pixel computed independently) and stateless (only depends on current input). Grounding texture modulation in physical principles (strain causes wrinkling, rupture follows high-stress regions) makes results look natural and perceptually believable. Wave-based patterns capture self-similarity efficiently.", "po": "The system handles extreme deformations in real-time, producing convincing texture variation without physics simulation or memory overhead. It works with arbitrary deformation patterns, from severe crumpling to fluid-like flow, enabling rich animation of soft materials."}}, {"t": "NILE: Nested Interleaving of Low-Dimensional Elements", "th": "sampling strategies", "m": ["low-discrepancy sequences", "hierarchical sampling", "stratified sampling"], "pr": "Global samplers lack control over subspace sample distributions, causing aliasing artifacts.", "ap": "Meta-sampler architecture orchestrating local samplers via hierarchical low-discrepancy sequences.", "co": "Hybrid sampling bridging local and global methods with better alias control.", "u": "https://www.semanticscholar.org/paper/3718e968daf0d04ab12e700e6a5ff99649ac62f7", "rc": {"bp": "When you render an image on a computer, you need to shoot rays through each pixel and figure out what light bounces around. To avoid noise and artifacts, you want your ray samples to be evenly spread. The problem: should you spread them uniformly within each pixel in isolation, or coordinate them across the entire image to maintain global smoothness?", "wh": "Global samplers (which coordinate rays across the whole image) converge faster and look smoother, but they give you almost no power to fix specific visual problems like jagged edges or aliasing. Local samplers (which optimize each pixel separately) let you use specialized tricks like blue noise or stratified grids, but they lose the overall coordination that makes rendering efficient.", "ap": "The authors create a modular framework that lets you use local sampling techniques (like stratified grids or blue noise) while still getting the efficiency of global sampling. The trick is to use hierarchical intervals—chunks at different scales—and let specialized local samplers fill in each chunk, while a global low-discrepancy sequence orchestrates which chunk gets sampled when.", "ww": "Hierarchical structure naturally matches how both local and global sampling work. By letting local samplers work within power-of-two sized regions that nest together perfectly, you get local control *and* global coherence. The global sequence merely tells the local samplers which regions to fill and in what order, without dictating the exact sample positions inside each region.", "po": "Artists and rendering engineers can now use their favorite local sampling tricks (blue noise, stratified patterns) and still get the fast convergence and smooth appearance of global samplers. This is practical because it means hybrid rendering pipelines can actually combine the best of both worlds instead of choosing one at the expense of the other."}}, {"t": "Gradient Domain Reconstruction for Monte Carlo PDE Solvers", "th": "PDE solving", "m": ["gradient domain", "monte carlo", "poisson equation"], "pr": "Monte Carlo Poisson solvers have high variance and slow convergence in primal domain.", "ap": "Gradient-domain framework targeting solution differences with reconstruction techniques.", "co": "Faster Poisson solving on complex domains via gradient-domain estimates.", "u": "https://www.semanticscholar.org/paper/3950f8016166815cd1574f1e959f10a67fc71cfe", "rc": {"bp": "Physicists and engineers often need to solve differential equations on complicated shapes—things like steady-state heat flow or electrostatics. Traditional grid-based methods struggle with complex geometries, but Monte Carlo sampling (throwing random rays) can handle any shape. The question is: can we make Monte Carlo *faster* by learning tricks from rendering?", "wh": "Naive Monte Carlo on Poisson equations (which describe how quantities like temperature change across a domain) converges slowly because the variance is huge. Rendering has a technique called gradient-domain rendering—instead of estimating the final image directly, you estimate differences between nearby pixels and reconstruct the image. This is much faster, but it was never adapted to solve differential equations.", "ap": "The authors adapt the gradient-domain idea: instead of estimating the solution at each point separately, they estimate the *difference* in
