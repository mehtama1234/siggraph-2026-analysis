the solution between nearby query locations. They also borrow reconstruction techniques from gradient-domain rendering to recover the full solution from these differences without adding extra error. The Monte Carlo sampling itself targets these local differences, which have much lower variance than the absolute values.", "ww": "Differences between nearby points are intrinsically smaller and noisier than absolute values, so they converge faster with random sampling. By reconstructing the whole solution field afterward (a technique rendering developed decades ago for image denoising), you get an accurate answer from fewer samples. This is the same principle that makes gradient-domain rendering work: collaborate with math that's already efficient rather than fighting variance head-on.", "po": "Physics simulations on complex meshes and grids converge faster with lower error. This matters for applications like acoustic simulations, electromagnetic field modeling, or fluid dynamics on irregular domains where traditional grid methods were cumbersome or inaccurate."}}, {"t": "SharpNet: Enhancing MLPs to Represent Functions with Controlled Non-differentiability", "th": "neural shape representation", "m": ["implicit neural fields", "poisson equation", "neural network"], "pr": "MLPs produce smooth outputs, struggling to represent sharp discontinuous features.", "ap": "MLP augmented with auxiliary Poisson feature function encoding sharp edges.", "co": "Precise C0 discontinuity control in neural function representation.", "u": "https://www.semanticscholar.org/paper/3a4357d26d5091d5cffec22d1a57d01a6574dd34", "rc": {"bp": "Neural networks are great at learning smooth functions—like predicting how a surface curves or an object's shape from sparse data—but the real world has sharp edges: corners in a CAD model, creases in a folded surface, the edge where a wall meets the floor. We want a neural network that can learn *exactly where* sharp features belong and keep everything smooth everywhere else.", "wh": "Standard neural networks produce outputs that are smooth everywhere by mathematical construction. They can approximate sharp edges by squeezing the change into a thin band, but they blur it. If you want true sharp corners (where the slope is actually discontinuous), you have to add it as a post-processing hack after the network finishes, which breaks the whole learning and optimization process.", "ap": "SharpNet adds an auxiliary feature function to the network that explicitly encodes sharp edges and corners. That auxiliary function is solved using Poisson's equation—a classical math tool—with special boundary conditions that create jump discontinuities (sudden slope changes) at user-specified locations. The main network learns everything smooth, and this auxiliary function adds the sharp features on top. Both are optimized jointly to recover the target shape.", "ww": "Poisson's equation is designed to handle boundary conditions that create discontinuities in the gradient (slope). By solving it once and reusing the result, the network doesn't have to learn sharp features from scratch; instead, it learns *where* to place them and what smooth details go alongside. Since both the feature positions and the network weights are jointly optimized, the method finds the exact configuration that best explains the target geometry.", "po": "3D shape reconstruction and CAD model learning now recover sharp edges and corners accurately instead of blurring them. For things like architectural models, mechanical parts, or scanned objects with defined creases, this means the learned representation is actually faithful to the real geometry instead of a smoothed-out approximation."}}, {"t": "Co-Optimization of Structure and Manufacturable Semi-Continuous Layers for Laminated Composites", "th": "structure optimization", "m": ["topology optimization", "implicit neural field", "semi-continuous design"], "pr": "Optimizing composite structures with partial fabric layers is complex and unconventional.", "ap": "Field-driven joint optimization of topology and semi-continuous fabric layers.", "co": "Laminated composites achieving 43.8% higher stiffness via optimized partial layers.", "u": "https://www.semanticscholar.org/paper/3a8ff88d9ded6c7b9a5e367515de702334a42174", "rc": {"bp": "Engineers want to design composite materials—layers of fabric embedded in resin—that are both strong and light. But fabric comes in fixed sheets, and you can only control which pieces you use in each layer and at what angle. The ideal would be to optimize the structure and the layer composition simultaneously, but that's almost impossible to solve because partial layers are hard to model.", "wh": "Structural optimization (making things stronger with less material) is well understood for solid materials. But composites with woven fabric are different: a partial layer (using only 60% of a ply's area in one region) has thickness that's nearly uniform but its properties vary spatially, creating anisotropic behavior (different stiffness in different directions) that depends on where the fabric is cut. Current methods either ignore partial layers or treat them crudely.", "ap": "The authors represent partial fabric coverage as a periodic scalar field—a continuous map where each location gets a number between 0 and 1 indicating how much fabric covers it. They parameterize this field using a neural vector field (a learned continuous function), which lets them optimize it smoothly. They simultaneously optimize the overall structural topology, the partial-layer fields, and the angles of each ply using a unified framework that handles the complex mechanical interactions between partial and full layers.", "ww": "By treating partial-layer coverage as a continuous field rather than a discrete choice, the optimization can explore all possibilities smoothly and efficiently. Neural parameterization lets the method learn natural patterns for how fabric should be distributed. Since they derived the correct equations for how partial layers interact mechanically (including how stiffness changes at the boundaries), the optimization finds genuinely manufacturable designs that actually work as predicted.", "po": "Optimized carbon-fiber and glass-fiber composites can now be up to 44% stiffer for the same weight, making them practical for aerospace, automotive, and sports equipment. The designs are also actually manufacturable because they respect the constraints of real fabric sheets and partial plies."}}, {"t": "Kinetic Predicted-Moment Flux Reconstruction for High-Order High-Performance Fluid Simulation", "th": "fluid simulation", "m": ["kinetic scheme", "flux reconstruction", "moment-based formulation"], "pr": "Fluid simulation must balance fidelity, performance, and memory efficiency.", "ap": "Kinetic scheme solving Boltzmann-BGK equation in moment-space via high-order flux reconstruction.", "co": "5x memory reduction vs LBM with high-order accuracy and minimal dissipation.", "u": "https://www.semanticscholar.org/paper/3beee114aeda6756e0b1eeadae98bebcaba8d566", "rc": {"bp": "Simulating flowing fluids—air, water, smoke—is critical for engineering design, visual effects, and scientific prediction. The challenge is that you want high accuracy (detailed flow patterns), fast computation (millions of cells per second), and low memory (not running out of RAM). Current methods force you to pick two and sacrifice the third.", "wh": "Traditional grid-based solvers (Navier-Stokes) are memory-efficient but spread numerical error that creates artificial viscosity, smoothing out details you want to see. Lattice Boltzmann methods are accurate and fast, but they require storing many velocity components per grid cell, tripling or quadrupling memory use. High-order methods are accurate but slow. Something has to give.", "ap": "The authors combine two ideas: gas-kinetic schemes (which compute fluid motion by thinking about the microscopic bouncing of gas molecules) and high-order flux reconstruction (a math technique for computing flows accurately). They carry all the kinetic calculations in \"moment space\" (a compressed representation) rather than tracking individual velocities. Two GPU kernels per time step handle all the work, and intermediate data stays in fast on-chip memory instead of spilling to slow main memory.", "ww": "By working in compressed moment space, you get the accuracy of lattice Boltzmann without storing massive arrays. Fusing the computation into two tight kernels means the GPU doesn't waste time moving data around; everything flows through the processor in pipeline fashion. High-order formulation means the spatial accuracy is excellent so you need fewer cells to reach a target precision.", "po": "Fluid simulations now run 5x faster with 5x less memory than traditional lattice Boltzmann while producing higher-quality results. This matters for real-time smoke and fire in visual effects, or for engineering simulations of turbulent flows that previously needed specialized supercomputers."}}, {"t": "MUSIC: Learning Muscle-Driven Dexterous Hand Control", "th": "character animation", "m": ["reinforcement learning", "variational autoencoder", "musculoskeletal model"], "pr": "Muscle-driven hand control for complex tasks like piano playing lacks generalization.", "ap": "Hierarchical RL combining muscle-level tracking with VAE latent-space coordination.", "co": "Dexterous musculoskeletal hands performing novel piano pieces beyond training data.", "u": "https://www.semanticscholar.org/paper/3c74c8d1ec829048e2e4399159ab2f9d1e689d23", "rc": {"bp": "Professional musicians train for years to develop finger control so precise they can play virtuoso piano pieces. A robot hand with real muscles and tendons (connected like a biological hand) is incredibly hard to control because muscle activation isn't instantaneous—it takes time to build tension and then release. Can we make a robot hand learn to play pieces it's never seen?", "wh": "Direct muscle control is high-dimensional and has long time-lags (muscles don't respond immediately), making it noisy to optimize. Simple supervised learning doesn't work because the robot needs to *coordinate* both hands, handle timing constraints from the musical score, and actually generate new motions beyond what it learned from examples. You need planning, not just imitation.", "ap": "The approach splits control into two levels. At the low level, a policy trained via reinforcement learning generates real muscle activations while tracking motion from reference examples. These policies are distilled into a compact latent space using a variational autoencoder—a technique that compresses high-dimensional muscle sequences into smooth, low-dimensional codes. At the high level, a separate policy learns to coordinate both hands by deciding which latent codes to activate based on note events from the musical score. The high-level policy uses multi-agent reinforcement learning (treating each hand as an agent) plus adversarial learning to maintain realistic motion style.", "ww": "By separating low-level muscle dynamics (which are hard to optimize directly) from high-level coordination (which is easier), the method avoids the curse of trying to optimize everything at once. The latent space acts as a bridge—it's already smooth and structured so the high-level policy just has to pick the right latents at the right times. Training on diverse reference data gives the latent space common motion primitives that generalize to novel pieces.", "po": "A musculoskeletal hand model now learns to play piano pieces beyond its training data, handling the timing constraints of music while maintaining realistic muscle-level dynamics. This is a practical step toward dexterous robot hands that can perform complex manipulation tasks."}}, {"t": "Loops2Roofs: Diffusion-based 3D Roof Generation using a Loop Representation", "th": "roof generation", "m": ["diffusion model", "transformer", "mesh generation"], "pr": "Representing and generating complex 3D roof structures is difficult.", "ap": "Diffusion model directly denoising roof vertices, conditioned on structural priors.", "co": "Flexible loop-based representation enabling realistic roof generation across styles.", "u": "https://www.semanticscholar.org/paper/3ddc9fe0b045c4a4f43f1e7b5ad15f424d9d672f", "rc": {"bp": "Urban planners, game developers, and architects need to create realistic 3D building roofs—and there are infinite variations. A simple roof might have one or two slopes, but complex architecture includes dormers, valleys, ridges, and multiple levels. Generating diverse plausible roofs procedurally is hard because roofs have structure: edges must connect properly, slopes must match at corners, the whole shape has to make sense.", "wh": "Most shape generation methods output point clouds or voxels (3D cubes), which are messy and hard to interpret as a proper roof. If you try to generate roof faces directly as polygons, you get disconnected pieces that don't form a closed surface. Existing methods either over-simplify (single sloped roof) or produce invalid topology that doesn't actually close or connect properly.", "ap": "The authors represent a roof as a set of polygonal faces bounded by loops (closed curves that form edges). A neural diffusion model gradually denoises the 3D vertex coordinates while conditioning on structural priors (the number of faces and vertices per face, predicted in a separate step). After the model outputs raw coordinates, a neural stitching module fixes the topology: it enforces that edges connect properly, adjacent faces align, and the whole mesh forms a valid closed surface. A diffusion model learns what realistic roof distributions look like, and the stitching module ensures the output is geometrically valid.", "ww": "Representing roofs as loops of polygonal faces is flexible enough to handle complex architecture yet constrained enough that you can enforce connectivity. Diffusion models are excellent at learning complex distributions from examples. By separating the learning (what do realistic roofs look like?) from the constraint enforcement (does this roof actually close?), each part becomes tractable.", "po": "Game engines and urban modeling tools can now generate diverse, realistic roofs for thousands of buildings in procedural cities. The method handles everything from simple houses to complex architectural styles, and the output is always valid geometry ready to render or simulate."}}, {"t": "Schrödinger Bridges on Discretized Geometric Domains", "th": "optimal transport", "m": ["optimal transport", "heat equation", "sinkhorn algorithm"], "pr": "Interpolating probability distributions on meshes requires high computational cost.", "ap": "Discrete Schrödinger bridge via entropy-regularized transport on mesh domains.", "co": "Sharper, faster interpolation with exact endpoint marginals on high-resolution meshes.", "u": "https://www.semanticscholar.org/paper/3e04ef3985bdf79966cf90cc7e7400e89afa603b", "rc": {"bp": "Imagine you want to smoothly morph between two shapes, or smoothly interpolate between two distributions of color—say, black on the left fading to white on the right. You want the intermediate steps to look natural, not just fade everything to gray. Optimal transport is the right math framework, but traditional methods are slow and work poorly on the complex surfaces we actually care about.", "wh": "Standard optimal transport methods (like Wasserstein barycenters) are expensive: they require discretizing the path between the two distributions and solving large systems. On mesh-based domains (surfaces and grids), naive discretization blows up the problem size. Even with clever tricks, the interpolations tend to blur details and don't preserve the exact boundary distributions you started with.", "ap": "The authors use a classical connection between optimal transport and heat flow (Schrödinger bridges), developing a discrete version that works directly on meshes and grids. The core algorithm alternates between applying the heat kernel (standard numerical technique for diffusion) and enforcing boundary constraints via multiplicative updates. This is a direct, efficient algorithm (Sinkhorn iteration) that respects the mesh structure and avoids expensive transport computations.", "ww": "The heat kernel is already well-understood for meshes (finite element methods have been using it for decades) and is cheap to compute. By grounding the math in diffusion rather than explicit transport, the method naturally handles irregular geometries. The iterative enforcement of boundary conditions means you get interpolants that exactly match the start and end distributions, not blurred approximations.", "po": "Smooth shape morphing, color transfers, and other interpolations on complex meshes and grids now converge faster while preserving geometric detail. This is useful for animation (smooth transitions between poses), image editing (natural color transfers), and physics simulation (smooth initial conditions)."}}, {"t": "GimmBO: Interactive Generative Image Model Merging via Bayesian Optimization", "th": "image generation", "m": ["bayesian optimization", "diffusion model", "adapter merging"], "pr": "Manual tuning of diffusion adapter merging scales poorly with many adapters.", "ap": "Preferential Bayesian optimization for interactive exploration of adapter coefficients.", "co": "Efficient two-stage BO enabling practical high-dimensional adapter merging.", "u": "https://www.semanticscholar.org/paper/3e071bc6e65cfac633d4f522b87b9319d16f37b9", "rc": {"bp": "Image generation models like Stable Diffusion have spawned thousands of community-created specialized adapters—custom models fine-tuned to generate specific subjects (a celebrity, a pet) or styles (watercolor, neon). Artists want to combine multiple adapters to get a new look, but doing this manually requires sliding dozens of numerical knobs in the dark, trying random combinations until something looks good.", "wh": "The space of possible combinations is vast (if you have 30 adapters, each with a blending coefficient, that's a 30-dimensional search space). Manual slider adjustment doesn't scale—you can't possibly evaluate enough combinations by hand. Simple optimization methods like gradient descent don't apply because you can only evaluate combinations by running the full generative model, which is slow. And the user's preference isn't a simple mathematical function; it's subjective.", "ap": "The authors use Bayesian Optimization (BO), a statistical method that learns a model of which combinations look good based on examples, and intelligently suggests new combinations to try. Given that real users only like a subset of extreme coefficient values (not intermediate values), they introduce a two-stage BO backend: first, a stage that explores sparse, realistic settings; then, a refinement stage that zooms into promising regions. The method adaptively samples combinations based on what the user prefers so far.", "ww": "Bayesian Optimization is specifically designed for expensive, subjective evaluations. By building a statistical model of user preference from a small number of trials, it reduces the number of combinations the user has to manually judge from hundreds down to a handful. The two-stage approach respects the structure of the problem: adapters don't work well at intermediate mixtures, so the method learns to focus on the sparse, valid configurations.", "po": "Artists can explore vast adapter-merging spaces interactively, converging to a desired visual look in 10-20 trials instead of 100+. This makes community-created model adapters actually usable for creative workflows."}}, {"t": "Skinned Motion Retargeting with Spatially Adaptive Interaction Guidance", "th": "motion retargeting", "m": ["transformer", "graph neural network", "spatial adaptation"], "pr": "Retargeting motion to exaggerated characters loses interaction semantics.", "ap": "Transformer-based anchor refinement with spatial adaptation for interaction guidance.", "co": "Geometry-aware retargeting preserving self-contact across varied body proportions.", "u": "https://www.semanticscholar.org/paper/426dcc613b11a4d0f23395a92292b8ffc6d5c464", "rc": {"bp": "When you move an animation from one character to another (like transferring a hand-gesturing animation from a tall actor to a short actor), you want to preserve the *meaning* of the motion. A hand that touches the face should still touch the face, not pass through it or gesture in empty air. This is motion retargeting, and it's hard when the target character has very different proportions.", "wh": "Simple retargeting just rescales the skeleton to match the target character's limb lengths. But if the target is much shorter, hands reach only to the hip instead of the face—the semantic meaning (hand touching face) is lost. Geometry-aware methods fix this by defining correspondence points (\"this source region maps to this target region\"), but these correspondences are static. If the target has exaggerated proportions, the fixed correspondences become unreachable.", "ap": "Instead of static correspondence points, this method dynamically repositions anchor points (semantic points being transferred) to lie on reachable regions of the target character. A neural network predicts how much to shift each anchor, and soft projection ensures shifted anchors stay on the target's surface. The motion retargeting then uses these dynamically adapted anchors as semantic guides. Because anchors move per-frame based on the source pose, they always point to achievable regions on the target.", "ww": "By decoupling anchor placement from motion retargeting, the method can adapt anchors to reflect what's physically possible for the target character while still maintaining semantic meaning. The neural network learns to recognize which regions of the source character matter most for interaction (hand touching face) and translates that to the target's most analogous reachable location. Dynamic repositioning avoids the brittleness of static correspondences.", "po": "Animators can retarget motion to stylized or exaggerated characters—cartoony proportions, extreme sizes—while preserving the intent of the original animation. This is valuable for game engines and film, where you want rich animations to apply across a diverse cast of characters."}}, {"t": "Sample Matching for Joint Extinction Gradient Estimation in Differentiable Volume Rendering", "th": "volume rendering", "m": ["differentiable rendering", "monte carlo", "gradient estimation"], "pr": "Differentiable volume rendering suffers from high gradient variance.", "ap": "Sample matching coupling scattering and transmittance components at shared locations.", "co": "Up to 80% variance reduction in extinction gradients via coupled estimators.", "u": "https://www.semanticscholar.org/paper/42bfe088db9ff528254a4701e860d616fc479091", "rc": {"bp": "When you render a volumetric scene (smoke, clouds, fog, the inside of a translucent object) and want to optimize it to match a target appearance, you need gradient information—how much does the final image change if you tweak the volume slightly? But computing these gradients is extremely noisy, making optimization slow. Can we reduce that noise?", "wh": "The gradient has two conceptually different pieces: (1) how much light scatters at a particular point (a point-wise calculation), and (2) how much light gets transmitted through a segment of the volume (an integral along the ray). Existing methods sample these two pieces at different locations because they're mathematically separate. But because they have opposite signs and cancel each other, sampling them independently throws away huge negative correlations that could reduce variance.", "ap": "The authors reformulate the math so both gradient components are evaluated at the *same* sample locations. Instead of treating them as separate integrals, they fold them into a single integrand. This \"sample matching\" principle makes the negative correlation between the two terms explicit and unavoidable. To be efficient, the method reuses partially sampled light paths from rendering and evaluates gradients at multiple probe points per segment, amortizing cost.", "ww": "When two quantities have opposite signs and are negatively correlated, sampling them together at matched locations lets them cancel partially, reducing variance dramatically. This is a basic Monte Carlo principle—you want to capture negative correlations, not throw them away. The reformulation isn't mathematically new (it's still unbiased), but it exposes the correlation structure.", "po": "Volume rendering optimization converges 5x faster with 80% lower gradient variance. This matters for inverse problems like reconstructing volumetric density from images, or optimizing volumetric effects to match live-action video in visual effects."}}, {"t": "Surface Power Diagrams for Knit Singularity Placement", "th": "knit structure planning", "m": ["power diagram", "lloyd algorithm", "geodesic heat kernel"], "pr": "Global knit structure planning has limited singularity placement optimization.", "ap": "Power diagram generalization via geodesic heat kernels for optimal singularity quantization.", "co": "Faster knit graph generation with robust helix-free constraints.", "u": "https://www.semanticscholar.org/paper/43323d1ad765b9ea74eabee05a0e0f3dcc723db4", "rc": {"bp": "Knitting sweaters and socks on computer-controlled machines requires planning a global knit structure—deciding where to place increases and decreases (the points where stitches multiply or merge) so the fabric follows the right 3D shape without visible spiral patterns. This is a complex discrete combinatorial problem.", "wh": "Knit singularities (increases/decreases) are discrete positions, so you're searching a massive combinatorial space. Prior methods place singularities locally and iteratively, settling into suboptimal configurations. Finding the globally optimal set of singularity positions that minimizes visual artifacts (spirals/helices) while fitting the target shape is hard.", "ap": "The authors generalize power diagrams (a geometric concept from computational geometry) to surfaces. A power diagram partitions space into regions associated with sites (singularity locations), using a modified measure of distance based on curl in the knitting direction. They optimize singularity positions jointly using a Lloyd-type algorithm (an iterative method that repeatedly moves sites to the centers of their regions). They also introduce ordering constraints that prevent the knitting path from spiraling.", "ww": "Power diagrams naturally quantize spatial functions (like the curl of the knit direction) into discrete regions, making them perfect for placing discrete singularities. Lloyd's algorithm converges to locally optimal configurations efficiently. By adding spiral-prevention constraints, the method finds configurations that are both geometric-optimal (minimal distortion) and practically knittable (no visible defects).", "po": "Knit designers can now create dense, complex knit patterns that follow arbitrary 3D surfaces without visible spirals. This enables denser sweaters, more complex shapes, and faster computation of the knit graph—practically useful for digital knitting systems."}}, {"t": "ToF ReSTIR: Time-of-Flight Rendering with Spatio-temporal Reservoir Resampling", "th": "time-resolved rendering", "m": ["reservoir resampling", "path reuse", "temporal gating"], "pr": "Time-of-flight rendering is computationally expensive for interactive applications.", "ap": "ReSTIR adaptation with path-length-aware shift mapping for temporal gating.", "co": "Interactive-rate ToF simulation handling dynamic scenes with glossy materials.", "u": "https://www.semanticscholar.org/paper/487242ec3cc5d7d59f4920a06bf4b7b6220dbe4f", "rc": {"bp": "Time-of-flight cameras and transient light capture measure how long light takes to travel from a camera to an object and back. This encodes incredible depth and material information, enabling new imaging modes and special effects. But simulating time-of-flight light transport is painfully slow—you need to track light that bounces at *exact* time intervals, making the rendering problem massively harder.", "wh": "Rendering uses sophisticated path reuse techniques (ReSTIR) to speed up normal rendering by reusing light paths from one frame to the next. But time-of-flight adds an extra constraint: the total optical path length (the sum of distances light travels) must satisfy temporal gating—it must be within a specific time window. Most reused paths violate this constraint, so they become useless.", "ap": "The authors adapt ReSTIR's path reuse to time-of-flight by introducing path-length-aware shift mapping. When reusing a light path, instead of using it as-is, they geometrically adjust it (using Newton's method) to satisfy the temporal gating constraint. This is inspired by techniques for rendering caustics (sparkling light patterns). The resulting framework reuses paths efficiently while ensuring they contribute valid light for the time gate.", "ww": "Instead of discarding paths that violate timing constraints, the method smoothly adjusts their geometry to make them valid. Since the adjustment is geometrically principled (based on Newton's method for finding intersections), the reused paths stay physically plausible. Reusing adjusted paths means you evaluate many fewer unique light paths to get a clean result.", "po": "Time-of-flight rendering of complex scenes with glossy and specular materials now runs at interactive rates instead of taking hours. This enables real-time simulation of advanced imaging modes, and new applications in visual effects and computational imaging."}}, {"t": "An Extended Full GKS Formulation for High-Efficiency and Low-Memory Two-Phase Flow Simulation", "th": "two-phase flow", "m": ["gas-kinetic scheme", "phase-field model", "explicit solver"], "pr": "Two-phase flow simulation struggles to balance accuracy, efficiency, and memory.", "ap": "Extended GKS formulation coupled with phase-field model on Navier-Stokes solver.", "co": "Unified two-phase solver with high accuracy, efficiency, and low memory footprint.", "u": "https://www.semanticscholar.org/paper/48ee1be7225927fc60060e8fa885655316e2e2b6", "rc": {"bp": "Two-phase flows—like water splashing in air, or oil moving through water—are everywhere in nature and industry. Simulating them accurately and fast is crucial for engineering and effects. But existing solvers force a triple trade-off: you can have high accuracy, or high speed, or low memory, but not all three.", "wh": "Traditional grid-based Navier-Stokes solvers (NS) are memory-light but numerically dissipative—they artificially smooth out fine details you want to see. Lattice Boltzmann methods are accurate and efficient but gobble memory even with modern compression. And two-phase flows are even harder because the fluid-fluid interface itself is moving and complex.", "ap": "The authors extend the gas-kinetic scheme (GKS)—a method based on microscopic particle bouncing—to two-phase flows. They derive a coupled formulation combining GKS with phase-field models (which track the interface smoothly). Novel mathematical constructs handle the mechanical behavior at the interface, including how anisotropy changes across the boundary. The formulation is explicit (straightforward to compute) and includes robust boundary treatments and turbulence techniques.", "ww": "GKS naturally handles complex fluid-fluid coupling because it's rooted in particle-level physics. By deriving the correct math for phase-field interaction, the method captures interface physics accurately. Explicit formulation means you compute each cell independently (massive parallelization), and the careful mathematical derivation ensures accuracy and stability even with large density contrasts and high turbulence.", "po": "Two-phase flow simulations now achieve high accuracy, high speed, and low memory simultaneously. This matters for industrial applications (oil-water separation), visual effects (splashing water, bubbling), and scientific simulation (atmospheric multiphase flows)."}}, {"t": "Generative Modeling with Orbit-Space Particle Flow Matching", "th": "generative modeling", "m": ["flow matching", "particle systems", "geometric probability paths"], "pr": "Particle flow matching has high per-index variance and curved learning flows.", "ap": "Orbit-space canonicalization with geometric probability paths and arc-length awareness.", "co": "Particle generation with 2-100x error reduction and competitive surface normal quality.", "u": "https://www.semanticscholar.org/paper/49a28644bd2112373bbc65bc57b12da0224e3e90", "rc": {"bp": "Generating 3D shapes made of particles—like point clouds, or collections of points that represent surfaces—is increasingly important for graphics and physics. But particles are fundamentally anonymous: swapping two particles' positions shouldn't change the shape, yet machine learning models often treat them as ordered lists, introducing artificial asymmetry that makes training harder.", "wh": "Standard generative models (like diffusion models or VAEs) treat each point as a separate numbered entity. If you shuffle the point indices, the model sees a completely different training example even though it represents the same geometric shape. This inflates the variance the model has to learn, making training slower and results worse. The learning path from noise to shape is also often curved and hard to follow.", "ap": "The authors build a particle-native flow-matching framework that respects permutation symmetry (the mathematical fact that swapping particle labels doesn't matter). Three key pieces: (1) canonicalize the terminal distribution so particles have canonical roles; (2) use particle embeddings so the network can specialize roles if needed; (3) design the probability path with arc-length-aware terminal velocities that respect 3D geometry. As a bonus, the terminal velocity naturally encodes surface normals as a byproduct of the flow.", "ww": "By eliminating artificial permutation asymmetry from the training data, you reduce the learning problem's variance dramatically. Canonicalization means the model always sees shapes in a consistent orientation. Arc-length-aware terminal velocities ground the abstract learning process in physical geometry—instead of arbitrary high-dimensional vectors, the model is learning physically meaningful quantities.", "po": "Generative models for point clouds now converge faster (5x fewer denoising steps), use fewer parameters (26x fewer for airplane shapes), and naturally produce surface normals without separate computation. This is useful for 3D object generation, shape synthesis, and point-based rendering."}}, {"t": "Photons × Force: Differentiable Radiation Pressure Modeling", "th": "physics-based optimization", "m": ["monte carlo simulation", "neural networks", "differentiable rendering"], "pr": "High computational cost limits radiation pressure modeling for spacecraft design optimization", "ap": "Monte Carlo simulation with neural proxy model for fast differentiable force queries", "co": "Orders of magnitude speedup enabling inverse design optimization of radiation pressure effects", "u": "https://www.semanticscholar.org/paper/4acf31e933320f75475f7583726bda8814a4133a", "rc": {"bp": "Satellites and spacecraft orbiting high above Earth face a gentle but persistent push from sunlight itself—photons carrying momentum that can alter the spacecraft's path and speed. Engineers want to design better spacecraft that either resist this pressure or harness it, but simulating its effects accurately is expensive, which has kept it out of most design and planning tools.", "wh": "The problem is computational: accurately modeling radiation pressure at the detail level required for good design means running expensive light-bouncing simulations (following each photon's path through the scene many times to average out randomness). Doing this for thousands of candidate designs during optimization becomes prohibitively slow, so engineers have largely given up and used rough approximations instead.", "ap": "The authors use three connected ideas. First, they borrowed Monte Carlo light simulation from computer graphics—a well-proven method for realistic image-making—and adapted it to model radiation pressure in parallel, using clever variance-reduction tricks borrowed from rendering. Second, they train a neural network to learn the relationship between spacecraft geometry, materials, and the resulting forces; once trained, this learned model answers force queries instantly. Third, they use this fast neural proxy inside an optimization loop to find geometries that minimize travel time or maximize safety margins.", "ww": "The neural network acts as a learned shortcut: instead of rerunning expensive simulations, it interpolates from patterns it learned during training, trading small accuracy loss for enormous speed gain. Because the network is inherently differentiable—its outputs change smoothly with input parameters—you can point optimization algorithms directly at good designs, just as you would in image synthesis when optimizing camera settings to match a target appearance.", "po": "Engineers can now optimize spacecraft designs considering radiation pressure as a real constraint, not an afterthought. The abstract claims the approach is \"orders of magnitude faster\" than full simulation, enabling inverse design (\"find me a geometry that does X\") where previously only forward simulation (\"tell me what this geometry does\") was feasible. The entire design family can be explored in time that once was needed for a single spacecraft."}}, {"t": "Robust Computation of Boundary Path Integrals Using Kernel-Density Estimation", "th": "differentiable rendering", "m": ["kernel density estimation", "path integrals", "inverse rendering"], "pr": "Robust numerical estimation of boundary path integrals for differentiable rendering remains challenging", "ap": "Kernel density estimation to expand integration domain, avoiding direct delta-function sampling", "co": "First kernel-density boundary integral formulation with consistent derivative estimates", "u": "https://www.semanticscholar.org/paper/4e83502eb15801d50dd832445824a75433a38f7d", "rc": {"bp": "To make a photorealistic computer image that also teaches us something (or lets an artist tweak the design), we need to know how each pixel changed when we nudged a 3D object's surface by a millimeter. This gradient information is central to inverse rendering—the art of working backward from pictures to figure out what geometry and materials would produce them.", "wh": "The challenge lies at the intersection of discrete sampling and continuous calculus. When light bounces off a surface, the rendering equation involves an integral over all possible light paths. To differentiate this integral with respect to geometry, we need to integrate over the *boundary* of the surface—a mathematical surface of zero thickness. In practice, we must sample it numerically, but standard sampling methods break down when surfaces are finely detailed (many small triangles) or when the geometry changes slightly (the boundary shifts in space).", "ap": "Instead of trying to sample directly on the zero-thickness boundary, the authors \"thicken\" it slightly using a kernel—a smooth, bump-shaped weight function. This transforms the boundary integral into a regular integral over a thin shell around the surface, where standard sampling works reliably. The kernel-based approach borrows from photon mapping (a rendering technique that also uses kernels to blur point-like contributions into smoother distributions), making the mathematical formulation both simpler and more robust to geometric imprecision.", "ww": "Kernels work because they blur out the sharp discontinuities that make direct boundary sampling fail. When the geometry is tessellated finely or when we perturb it, the kernel automatically smooths over the discretization artifacts; this is the same reason kernels help in statistics and image processing. The price is a small approximation error, but the gain in stability and simplicity far outweighs it.", "po": "The method reliably computes derivatives (gradients) of rendering integrals with respect to shape changes, validated by comparing against finite-difference estimates. This opens the door to practical inverse-rendering pipelines where an artist or algorithm can adjust object shapes to match a reference image, or explore how material or geometry variations affect the final render—capabilities that were fragile or unavailable before."}}, {"t": "MPM Lite: Linear Kernels and Integration without Particles", "th": "physics simulation", "m": ["hybrid lagrangian eulerian", "material point method", "fem integration"], "pr": "Material Point Method implicit solve cost scales with particle count, limiting performance", "ap": "Hybrid method using compact linear kernels with fixed quadrature points, eliminating particle quadrature", "co": "Solver complexity independent of particle count via rotation-free deformation reference", "u": "https://www.semanticscholar.org/paper/4fad535e6d8052addfe1b1058b2065307053cea7", "rc": {"bp": "When you simulate cloth, sand, or lava in a movie or game, one popular tool is the Material Point Method—a hybrid approach that tracks tiny particles moving on a fixed background grid, combining the advantages of both representations. However, the bigger the particles-per-cell ratio, the slower the solver becomes, which limits how detailed a simulation you can run in reasonable time.", "wh": "Standard MPM stores material state (position, velocity, stress, past deformation) as a cloud of particles scattered throughout the grid cells. During each solve step, the solver must gather information from every particle and scatter it back; as the particle count grows, this communication overhead dominates the computational cost. The solver's speed becomes locked to the number of particles, not the size of the grid.", "ap": "MPM Lite reframes particles as mere carriers of history and state, not as quadrature (integration) points. Instead of using particles to define where forces are calculated, it places force-calculation points at fixed locations within each grid cell using simple linear interpolation weights. The solver then reads particle state, resamples it onto these fixed points using compact kernels, and proceeds with a standard FEM-style (Finite Element Method) integration. Crucially, the actual force assembly and time stepping happen entirely on the grid; particles are never queried again during the solve.", "ww": "By decoupling particle count from the solve loop, the algorithm's speed becomes independent of how many particles you use—it depends only on grid resolution. This is a significant architectural shift: particles now feed information *in* and *out*, but the core solver runs without them. The linear kernels and fixed quadrature points also play nicely with modern optimization-based solvers and preconditioning tricks from FEM, which are battle-tested and highly optimized.", "po": "Simulations that were slow because of many particles-per-cell now run faster; you can use more particles (better accuracy) without pay cost of slower solve time. The abstract demonstrates this on materials like sand and foam, showing that solver complexity no longer depends on particle density, unlocking finer-grained detail in interactive and offline simulations."}}, {"t": "Generalized Spherical Harmonics Products using Spherical Grids", "th": "rendering algorithms", "m": ["spherical harmonics", "grid representation", "frequency domain"], "pr": "Spherical Harmonics product computation is inefficient and requires identical input orders", "ap": "Spherical Grids as intermediate representation enabling point-wise multiplication", "co": "Generalized SH products supporting different orders with superior performance", "u": "https://www.semanticscholar.org/paper/504092464459e7c4dcdc333af421344f0ed0cda0", "rc": {"bp": "In computer graphics, spherical harmonics are a compact mathematical language for representing low-frequency patterns on a sphere—think of the diffuse sky in a rendered scene, or the soft ambient light in a room. Multiplying two such patterns together is a fundamental operation in many rendering algorithms, but it's often a performance bottleneck because the algebra is dense.", "wh": "The standard method for multiplying spherical harmonics coefficients requires special formulas that depend on having the same frequency order (the 'degree' of the harmonic expansion) for both inputs. If one input is high-frequency and the other low-frequency, you must expand both to the higher degree, wasting computation. Also, the required tensor operations are expensive and inflexible.", "ap": "The authors introduce spherical harmonics products using a spherical grid—a set of regularly spaced sample points on a sphere. Instead of multiplying the coefficients directly, they convert both harmonic representations to values sampled on the grid, multiply point-wise (trivially fast), and convert the result back to harmonics. The key insight is deriving conditions that guarantee this grid-based computation is *exact* (not an approximation) for appropriate grid densities.", "ww": "Sampling, multiplying point-wise, and resampling avoids the dense tensor operations of coefficient-space multiplication. Because point-wise multiplication is linear in memory and highly parallelizable, it scales well and can be accelerated on GPUs. When you need approximate results, using a coarser grid gives you a speed-accuracy tradeoff; when you need exactness, the method tells you what grid size guarantees it.", "po": "Multiplying spherical harmonics is now faster, even for the special case of equal-order inputs where classical methods were designed. The method also handles mixed orders (different input frequencies) without duplication, and the user can trade accuracy for speed by adjusting grid resolution. This removes a common bottleneck in rendering algorithms that rely on harmonic decompositions of light distributions and material reflectance."}}, {"t": "Robust Constrained Tetrahedralization with Steiner-point-free Boundaries", "th": "mesh generation", "m": ["constrained tetrahedralization", "steiner points", "mesh optimization"], "pr": "Controlling Steiner point placement in tetrahedral mesh generation for complex geometries", "ap": "Flip-hard configuration analysis with boundary Steiner relocation and local optimization", "co": "Robust constrained tetrahedralization preserving boundary topology without Steiner points", "u": "https://www.semanticscholar.org/paper/5176c0f584832de751f9a671d590289e046b01fe", "rc": {"bp": "When you build a 3D simulation or 3D printed object, you often start with a surface shape (a 'piecewise-linear complex'—a surface made of flat polygons with well-defined edges). To simulate or analyze it, you need to fill the interior with tetrahedra (three-dimensional triangles). Doing this automatically while preserving the original surface is surprisingly hard, and failure means incorrect simulations or broken prints.", "wh": "The core challenge is that tetrahedra don't naturally fit around an arbitrary boundary shape. Standard algorithms add Steiner points (extra vertices) inside and on the surface boundary to help tetrahedral elements conform to the shape. These extra points can wreck the boundary topology—they might pierce edges or faces—and floating-point rounding errors in the geometric tests can cause the algorithm to fail silently, producing tangled or self-intersecting meshes.", "ap": "The authors identify flip-hard configurations (FHCs)—geometric patterns where flipping tetrahedra alone cannot recover the boundary without adding extra points. By detecting FHCs, they guide interior Steiner insertion only where truly necessary and relocate boundary Steiner points smartly to avoid topology breakage. Their error decomposition strategy separates coefficient error (from input precision) from arithmetic error (from floating-point rounding), allowing the algorithm to make robust geometric decisions even in the presence of rounding.", "ww": "By reducing reliance on boundary Steiner points and applying careful numerical error analysis, the algorithm avoids the most fragile configurations where rounding causes cascading failures. FHCs act as a diagnostic tool, showing where the algorithm is about to fail and allowing preemptive corrective steps. The rotation-free deformation analysis (mentioned for stress transfer) further avoids ambiguities that arise from averaging.", "po": "The method successfully meshed all 5,468 models in a challenging public dataset, preserving the input surface topology without artificial extra vertices on the boundary. This means simulation results won't be contaminated by accidental changes to the boundary, and the resulting tetrahedralization is faithful to the original design—essential for accurate simulations and manufacturing."}}, {"t": "HoloPathTracer: Fast and Accurate Wave Path Tracing for Holography", "th": "holographic rendering", "m": ["wave optics", "path tracing", "monte carlo"], "pr": "Existing CGH paradigms separate radiometric and wave-optical computation, limiting visual effects", "ap": "Monte Carlo path tracing solving rendering and wave propagation equations simultaneously", "co": "Physically accurate hologram generation with full 3D visual cues and material effects", "u": "https://www.semanticscholar.org/paper/530c9d9af9f5e368b2666e31a3181c4786d744e0", "rc": {"bp": "Holographic displays promise to show 3D images with convincing depth cues and natural perspectives, without requiring glasses. But holography is fundamentally about light waves interfering, not just rays bouncing; the computer must simulate wave optics, not just standard ray-bouncing image rendering. This wave simulation is expensive and often decoupled from realistic image synthesis, limiting the visual quality of holograms.", "wh": "Existing holographic rendering methods compute realistic radiance (light bouncing and material properties) separately from wave-optical computation (how light waves interfere and create holograms). This separation means that subtle visual effects—glossy reflections, view-dependent detail, depth continuity—get lost or approximated crudely when encoding the image as an interference pattern. The two physics simulations aren't talking to each other.", "ap": "HoloPathTracer solves both the rendering equation (which rays of light bounce where and what colors they carry) and the Rayleigh-Sommerfeld integral (which governs how waves propagate and interfere) using a single Monte Carlo path-tracing algorithm. By running light paths through both computations in tandem, the method captures realistic illumination *and* faithful wave-optical encoding. A \"path reuse\" technique generates multiple random hologram samples with minimal extra cost.", "ww": "Unified path tracing ensures that every surface reflection and material effect that matters for the radiance image also encodes into the phase hologram correctly. The wave physics and image physics stay synchronized. An ambient radiance cache (pre-computed background lighting) accelerates convergence roughly tenfold by reducing noise quickly.", "po": "The system produces holographic phase patterns that encode 3D visual depth cues, material properties (glossy surfaces reflect coherently), and continuous view changes—all in one pass. The abstract claims \"order of magnitude convergence speed improvement\" via caching, meaning you can generate holograms of photorealistic scenes in practical time, not requiring trade-offs between wave fidelity and image quality."}}, {"t": "PAColorHolo: A Perceptually-Aware Color Management Framework for Holographic Displays", "th": "holographic display", "m": ["color management", "neural networks", "perceptual modeling"], "pr": "Holographic displays struggle with perceptually accurate color reproduction due to system distortions", "ap": "Color space transformation with adaptive illumination and neural perceptual color response modeling", "co": "Perceptually-aware color management framework improving color fidelity in holographic displays", "u": "https://www.semanticscholar.org/paper/53bab426db248a7cb967792372c29771ede4cd85", "rc": {"bp": "Holographic displays produce 3D images with excellent depth perception, but getting colors to look right is surprisingly difficult. The laser light, the liquid-crystal modulators, optical aberrations, and camera artifacts all conspire to twist colors—red comes out as orange, greens desaturate. A perceptually accurate holographic display requires careful end-to-end color management, not unlike color grading in film.", "wh": "The challenge is that holography introduces multiple layers of color distortion: the coherent laser illumination (monochromatic light sources) mixes differently than white light; the spatial light modulator has unequal efficiency across wavelengths; chromatic aberration (different colors bend by different amounts through the optics) smears the image; and the camera used to measure the display's output introduces its own color bias. No single correction suffices—you need a system.", "ap": "PAColorHolo combines four techniques. Input color space transformation maps the desired RGB to a representation suited to the coherent laser system. Adaptive illumination control adjusts laser power and timing to compensate for wavelength-dependent losses. A neural network learns the camera's color response (how it maps the actual light spectrum to RGB), inverting that mapping so the captured colors match intent. Experiments verify the approach through simulations, optical tests, and a user study where people judge color fidelity.", "ww": "Neural networks excel at learning complex, non-linear mappings like \"what does this light spectrum look like through a camera?\" Once trained on diverse lighting and material samples, they generalize to novel scenes. Addressing color distortion at multiple stages—input, illumination, perception—means you're not fighting a single-point bottleneck but systematically trimming all sources of error. The perceptual framing (not just matching RGB values, but matching what the eye sees) ensures that the result *looks* right.", "po": "Users report substantially improved color fidelity in both simulation and real optical experiments, confirmed by controlled user studies. This breakthrough clears a major hurdle for holographic displays as practical displays for AR/VR applications—perception of color is closely tied to perceived realism, and now that gap closes."}}, {"t": "HIL: Hybrid Imitation Learning for Dynamic Athletic Control", "th": "character animation", "m": ["imitation learning", "reinforcement learning", "motion control"], "pr": "Data-driven character controllers struggle with novel environments and skill composition", "ap": "Hybrid framework combining motion tracking with adversarial imitation learning via multi-task learning", "co": "Athletic controller preserving motion naturalness while generalizing to challenging environments", "u": "https://www.semanticscholar.org/paper/53c8c29d003e26edaf470b015919ba9d91d80c3a", "rc": {"bp": "Movie studios and video-game developers want characters to perform acrobatic stunts—parkour, backflips, dodging obstacles—that look natural and react sensibly to unexpected changes in the environment. The traditional approach, hand-animation, is labor-intensive; machine learning offers a faster path, but most learning-based methods either nail the reference motion *or* adapt to new situations, rarely both at once.", "wh": "Imitation learning can copy a reference motion but struggles when the environment changes (new obstacle shapes, different terrain). Reinforcement learning alone adapts to novelty but often discards the naturalness of the reference motion in favor of crude strategies that just 'work.' The two approaches want different things and rarely cooperate well.", "ap": "Hybrid Imitation Learning (HIL) runs two parallel learning agents in a shared observation space: one trained with motion tracking (\"stick closely to the reference animation\") and one trained with adversarial imitation learning (\"fool a discriminator that watches real vs. learned motion\"). A goal-conditioned representation (a shared encoding of \"what we're trying to do\") allows knowledge to flow between the two agents. A unified action space means they're literally controlling the same character, so their competing objectives shape a controller that is both naturalistic and adaptive.", "ww": "Running both objectives in parallel on the same agent creates a productive tension. The tracking agent's gradient pushes toward reference motions; the adversarial agent's gradient pushes toward generalization. The shared representation ensures both agents see the same features, so a learned concept like \"how to land from a jump\" can benefit both objectives. This is a form of multi-task learning where the tasks are complementary—naturalness *and* adaptability.", "po": "The resulting controller performs parkour-style obstacle courses and heading control (turning the character to face a target) in procedurally generated environments it has never seen. It preserves the fluidity of the reference motion library while adapting to novel scenarios—a practical system for game AI and animation that combines the strengths of both learning paradigms."}}, {"t": "Invisible Holographic Window: Full-color 3D Image Reconstruction from Transparent Surface-relief Computer-generated Holograms", "th": "holographic displays", "m": ["computer generated holograms", "diffractive optics", "frequency multiplexing"], "pr": "Limited wavelength selectivity in DOEs reduces transmittance, requiring separate CGHs for colors", "ap": "Spatial frequency domain band-division multiplexing on shallow sinusoidal phase profiles", "co": "Single transparent surface-relief CGH achieving full-color 3D reconstruction on glass", "u": "https://www.semanticscholar.org/paper/5a08dc24185b9623500b14d78a948af9b17ccf4b", "rc": {"bp": "Traditional analog holograms (photographed on film) can display stunningly realistic 3D images with full color and no special glasses. Researchers now want to print computer-generated holograms (CGHs) onto glass using etching or lithography so that a thin, transparent window displays a 3D image in full color. The catch: most approaches need three separate etched holograms, one per color channel, making the window opaque or fragile.", "wh": "The problem is wavelength selectivity: a diffractive optical element (an etched surface that bends light) is designed for one wavelength (red, say) but also interacts with others (blue, green). This crosstalk means colors blur together unless you use three separate holograms per color. Additionally, the phase profiles in deeply etched holograms create jagged surface features that scatter light and reduce transparency—you lose brightness and color fidelity.", "ap": "Instead of deeply etching phase profiles, the authors use grayscale lithography to create shallow, smooth sinusoidal surface structures that modulate phase more gently. By encoding only the real part of the interference pattern (not the full phase) and applying a spatial-frequency-domain band-division strategy, they multiplex all three color channels into a single etched surface without crosstalk. The shallower etch also improves transmittance—light bounces and refracts less through scattering.", "ww": "Smooth, shallow sinusoidal profiles scatter and absorb less light than jagged, deeply wrapped phase profiles; this is a straightforward consequence of reduced surface roughness and better impedance matching at the air-glass boundary. Band-division multiplexing works because the three colors are naturally separated in frequency space; etching at the right frequencies keeps them from interfering. Encoding only the real part of the phase reduces the required etch depth while retaining enough phase modulation.", "po": "A single transparent surface now displays full-color 3D images with improved brightness compared to previous methods. This \"invisible holographic window\" paves the way for practical AR glasses or displays that overlay 3D content onto the real world without requiring multiple layers or sacrificing see-through transmission."}}, {"t": "Floating-Point Robustness in Parametric Surface Continuous Collision Detection: From Algorithm to Benchmarking", "th": "collision detection", "m": ["continuous collision detection", "robustness analysis", "benchmarking"], "pr": "Ensuring floating-point robustness for parametric surface collision detection remains open", "ap": "Time-dependent inclusion-based method with error decomposition and rational arithmetic benchmarking", "co": "First floating-point robust CCD framework for parametric surfaces with rigorous validation", "u": "https://www.semanticscholar.org/paper/5a1feaca6f1cceccd8126cda4a02b4966cda85cd", "rc": {"bp": "When you simulate or fabricate an object described by smooth curved surfaces (like a NURBS surface used in CAD), collision detection must catch when two surfaces touch or intersect. Standard robust collision detection works well for polygonal meshes (made of flat triangles) but curves introduce subtle edge cases where tiny numerical errors in floating-point arithmetic lead to missed collisions or false positives.", "wh": "Parametric surfaces like NURBS are defined by equations, not discrete points, so geometric tests—\"do these surfaces intersect?\"—involve solving polynomial equations to high precision. Floating-point arithmetic introduces two types of error: coefficient error (the input surface coefficients have limited precision) and arithmetic error (rounding during calculations). Distinguishing between them and managing both is difficult; existing CCD methods either ignore the problem or use expensive symbolic computation.", "ap": "The authors present a floating-point-robust CCD framework built on the Time-Dependent Inclusion-Based Method (TDIBM). The key innovation is an error decomposition strategy that explicitly separates coefficient error from arithmetic rounding error, allowing the algorithm to make conservative ('safe') decisions about whether a collision truly occurred. To validate the method, they reverse-engineered a benchmark: starting from ground-truth collision scenarios, they generated exact datasets using rational arithmetic, then measured how well different algorithms recover the true collision events.", "ww": "By decomposing error sources, the algorithm can apply appropriate safety margins to each type of error independently. Coefficient error is unavoidable (surfaces are approximate); arithmetic error can be bounded by analyzing the floating-point operations in the algorithm. A conservative algorithm that may report \"collision\" when there is genuine uncertainty is better than silently missing real collisions. The synthetic benchmark (ground truth generated exactly, then corrupted) reveals algorithm failure modes clearly.", "po": "The method reliably detects collisions between curved surfaces in the presence of realistic floating-point errors, tested against a comprehensive benchmark of 5,468 models (the Thingi10K dataset). This closes a gap between robust mesh-based collision detection and the real needs of CAD, 3D printing, and animation with smooth surfaces."}}, {"t": "TOG 45(4) Editorial", "th": "conference editorial", "m": [], "pr": "SIGGRAPH 2026 conference editorial introduction to special issue", "ap": "Editorial documenting acceptance statistics and submissions overview", "co": "Context for 327 accepted papers from 1177 submissions across journal and conference tracks", "u": "https://www.semanticscholar.org/paper/5c910402755e8eea456ee759feb3f54fe791065c", "rc": {"bp": "This is the editorial introduction to the SIGGRAPH 2026 conference and associated journal issue. It provides context on the conference: submission statistics, acceptance rates, and organizational details. The editorial acknowledges the extraordinary volume of research (1177 submissions) and the expert committee that reviewed submissions across multiple categories.", "wh": "No technical challenge is posed in an editorial—it serves to introduce the collection and set scope. The note of interest is the scale: the conference received over a thousand submissions, indicating intense research activity in computer graphics, and the committee accepted roughly one in four, reflecting high selectivity.", "ap": "The editorial reports that 1177 complete submissions were received: 216 journal-only and 961 dual-track (eligible for both conference and journal publication). A committee of 111 experts accepted 327: 132 as journal papers (97 from the journal-only track, 35 from dual-track) and 195 as conference papers, yielding a 27% acceptance rate overall.", "ww": "The high acceptance rate (27% out of ~1200) reflects both the breadth of acceptable research in computer graphics and the quality bar set by the conference. The dual-track system allows researchers to aim for either venue (journal archival or conference presentation) or both, increasing flexibility.", "po": "This editorial contextualizes the SIGGRAPH 2026 conference as a major event showcasing 327 accepted research contributions across computer graphics—a representative snapshot of the field's activity and directions in 2026. The following papers in this batch and others across multiple batches are among those 327 contributions."}}, {"t": "Uniformly Deployable Kirigami on Arbitrary Planar Graphs", "th": "kirigami design", "m": ["computational geometry", "mechanical design", "graph theory"], "pr": "Designing deployable kirigami from arbitrary planar graphs lacks systematic framework", "ap": "Analytical framework deriving geometric constraints for uniform rigid deployability", "co": "Multiple distinct kirigami structures from same graph with full design space characterization", "u": "https://www.semanticscholar.org/paper/601f178d11bc45c62f2ccbb6f5fa35b2bd383a29", "rc": {"bp": "Kirigami—the art of paper cutting and folding—has inspired engineers and designers to create structures that fold and unfold in a controlled way. Imagine a flat piece of paper with cuts and hinges that, when opened, rigidly expands into a 3D shape. Such deployable structures have applications in aerospace (solar panels, antennas), medicine (stents), and robotics. The challenge is to design them systematically for arbitrary shapes, not just simple patterns.", "wh": "Most prior work focuses on specific restricted kirigami types—quadrilateral (four-sided) patterns or structures derived from graphs that split into two colors (like a checkerboard). These frameworks don't generalize to arbitrary graphs, especially those that can't be cleanly split into two groups. Additionally, even when deployability is possible, the full space of possible structures from a given graph, and their degrees of freedom, remains poorly understood.", "ap": "The authors introduce an analytical framework that derives kirigami structures directly from arbitrary planar graphs. The key is connecting graph topology (the connectivity of faces) to geometric constraints (how the faces must be sized and angled to fold rigidly). They show that multiple distinct kirigami structures can be generated from the same graph and provide explicit geometric conditions ensuring uniform rigid deployability—meaning every crease rotates by the same amount as every other crease.", "ww": "Planar graphs encode the combinatorial structure (which faces share edges); geometric constraints then ensure the faces can rotate together without deformation. By analyzing the degrees of freedom (how many independent angles can vary), the framework reveals that many graphs admit multiple distinct deployable designs, not just one. This gives designers a palette of options from a single logical structure.", "po": "Designers can now systematically explore and construct deployable kirigami from graphs representing virtually any planar configuration. The analytical approach reveals the full design space, including degrees of freedom for each structure, enabling targeted optimization for specific goals (minimize material, maximize range of motion, etc.). This moves kirigami from artisanal craft to a systematic design tool."}}, {"t": "Dual-Path Holographic Laser-Excited Volumetric Display", "th": "volumetric display", "m": ["laser rendering", "holography", "volumetric graphics"], "pr": "Volumetric displays require improved brightness and voxel density for practical applications", "ap": "Dual optical paths with femtosecond lasers and synchronized spatial light modulators", "co": "Centimeter-scale volumetric graphics with interactive performance under room lighting", "u": "https://www.semanticscholar.org/paper/614305ac112901da83cfab6fc904758e0a3cced3", "rc": {"bp": "Volumetric displays show 3D images floating in mid-air, viewable from all angles without glasses. Early attempts were dim or small; a new dual-laser approach aims to produce bright, room-scale volumetric graphics. The challenge is achieving sufficient brightness and voxel density (3D pixel density) so the image is crisp and visible under normal room lighting.", "wh": "Laser-excited volumetric displays work by focusing a laser beam at precise points inside a gas-filled chamber (xenon); the intense local heating causes the gas to emit light at that voxel. A single laser path, however, produces limited brightness because the signal from each voxel is weak and the laser must dwell briefly at each point. Building larger, brighter displays requires rethinking the architecture.", "ap": "The system uses two synchronized laser paths, each with a femtosecond laser, a spatial light modulator (which shapes the light beam), a 3D scanning module (galvanometer mirrors and varifocal lens to steer and focus the beam), and a xenon-filled chamber. Both paths render simultaneously into the same volume, effectively doubling the laser power and voxel density. Careful synchronization ensures the two paths don't interfere.", "ww": "Two independent laser paths rendering in parallel cooperatively increase brightness: more photons are deposited per unit time into the gas, producing brighter emission. Doubling the rendering resources roughly doubles the achievable brightness and voxel count. The varifocal lens (adjustable focus) allows sharp rendering at varying depths within the gas, improving image quality.", "po": "The system produces centimeter-scale volumetric graphics and animations bright enough to see under normal room lighting—a major step forward from prior laser volumetric displays. The authors demonstrated the prototype publicly at SIGGRAPH 2024 with interactive graphics, showing that practical, user-safe, visually compelling volumetric displays are now feasible."}}, {"t": "Thermal Non-Line-of-Sight Imaging through Rough Surfaces", "th": "computational imaging", "m": ["neural networks", "non line of sight", "thermal imaging"], "pr": "Reconstructing hidden scenes through rough surfaces suffers from severe spatial mixing", "ap": "Physics-embedded neural network estimating convolution kernels for light transport", "co": "Real-time thermal NLOS imaging through rough surfaces with relative depth estimation", "u": "https://www.semanticscholar.org/paper/638321a0651c4081c8d40831314ed64c119a0c56", "rc": {"bp": "Non-line-of-sight (NLOS) imaging uses light bouncing off an indirect relay (a rough wall) to 'see' hidden objects around a corner—useful for rescue missions and security. Thermal NLOS imaging uses heat radiation (infrared) instead of visible light, which penetrates dust and poor visibility. The challenge is reconstructing the hidden scene from noisy thermal measurements through rough, scattering surfaces.", "wh": "Rough surfaces (unlike shiny mirrors) scatter light and heat in complex ways. This scattering spreads signal from the hidden scene over a large area on the relay surface, and the inverse problem—recovering what the hidden scene looks like from relay measurements—becomes ill-posed and extremely sensitive to noise. Prior methods fail here because they assume relatively specular (mirror-like) reflection.", "ap": "NLOSFormer is a neural network that explicitly embeds physics. It models light transport as a convolution: the hidden scene, passed through the scattering relay, produces the measured pattern. The network estimates this convolution kernel directly from the thermal measurements, using it to guide reconstruction. A companion dataset (ThermalNLOS) supports training, and a novel data augmentation strategy reduces overfitting. The network outputs both the hidden scene and relative depth cues.", "ww": "By estimating the convolution kernel explicitly, the network narrows the solution space: it's not just learning \"any reconstruction\" but specifically one consistent with the measured light transport. The kernel acts as a learned model of how the rough surface scatters and mixes light; once estimated, it strongly constrains what reconstructions are plausible. Relative depth comes naturally from the model's understanding of how different distances map to the measurements.", "po": "The method reconstructs hidden scenes through rough thermal relay surfaces significantly better than prior work, even in real-time for dynamic targets. This advances thermal NLOS imaging from laboratory curiosity to practical tool for seeing around corners and through difficult visibility conditions—valuable for search-and-rescue and surveillance applications."}}, {"t": "A Unified Homogenization Framework for Straight- and Curved-Crease Origami Materials", "th": "origami materials", "m": ["homogenization", "simulation", "material modeling"], "pr": "Predicting macroscopic origami material properties from crease patterns remains challenging", "ap": "Simulation-based folding with numerical homogenization and Classical Laminate Theory", "co": "Unified framework for straight and curved crease materials revealing diverse behavior", "u": "https://www.semanticscholar.org/paper/63b649757fdc8b21479585f087d32f5e27f2267f", "rc": {"bp": "Origami—folded paper with crease patterns—can exhibit unusual mechanical properties. A sheet with the right crease pattern becomes stretchy in one direction and stiff in another, or lightweight yet strong. Designers want to predict and design these properties, but the link between the geometric crease pattern and the resulting material behavior is complex. Understanding it requires simulating the folding and measuring how forces transmit through the deformed structure.", "wh": "Crease geometry, the kinematics of how the paper folds at creases, and the elastic stretching of the sheet surface are all coupled. A straight crease behaves differently from a curved crease; the pattern's symmetry affects overall isotropy or anisotropy (uniformity in all directions vs. preferential directions). Predicting effective macroscopic stiffness and strength from crease patterns requires a computational framework that handles both the complex folding deformation and the multi-scale averaging from microscopic crease-scale to bulk material behavior.", "ap": "The authors introduce a computational framework that simulates folding of a detailed crease pattern, then applies numerical homogenization—a technique from materials science—to extract effective macroscopic properties. The framework accommodates both straight and curved creases by using a quadratic energy model (analogous to Classical Laminate Theory in composites) and a simplified crease plasticity model. They explore how pattern symmetries correlate with resulting material symmetries.", "ww": "Homogenization works by simulating the full detailed structure under load, measuring the average stress and strain, and extracting an effective stiffness—the continuum-level material property. Because origami folding has well-defined symmetries (rotational, reflective), the homogenized material inherits those symmetries, producing isotropic materials (same in all directions) or anisotropic ones (stiffer along certain axes). The energy-based framework unifies straight and curved creases despite their geometric differences.", "po": "The framework reveals a rich design space of origami materials spanning from perfectly isotropic (uniform properties in all directions) to highly anisotropic (vastly different along different directions). Designers can now predict how a chosen crease pattern maps to bulk properties like stiffness, enabling inverse design (\"find me a crease pattern with stiffness ratio X\") and exploration of metamaterial applications where natural materials don't offer sufficient variety."}}, {"t": "M-ABD: Scalable, Efficient, and Robust Multi-Affine-Body Dynamics", "th": "rigid body dynamics", "m": ["affine body dynamics", "corotational", "constraint enforcement", "specialized solvers"], "pr": "Simulating large-scale articulated assemblies with numerical stiffness and high DOF", "ap": "Linear kinematic mapping with affine body dynamics and corotational framework", "co": "Interactive simulation of hundreds of thousands of bodies via pre-factorized matrices", "u": "https://www.semanticscholar.org/paper/679616243fccddfcb544ef5f7b7c3c36a6fd73de", "rc": {"bp": "When you build a machine with gears, joints, and chains, or simulate crowds of characters interacting through rigid limbs, you need to compute how thousands or millions of connected pieces move over time. A simulation that runs at interactive speeds makes it possible to design robots, animate films, and build games where complex assemblies snap together and flex realistically. The core challenge is speed without sacrificing accuracy.", "wh": "Rigid body simulators traditionally struggle when many pieces are locked together through joints because the math becomes very stiff and complicated. Rotation is hard to represent smoothly—rotate an object mathematically and the equations become nonlinear, which makes solvers slow and unstable. When you also have hundreds of thousands of bodies coupled together, the sheer volume of numbers you need to crunch becomes prohibitive.", "ap": "Instead of tracking each body's position and orientation directly, this method uses an affine (linear-like) representation that simplifies the rotation problem. The key insight is that near-rigid objects, the material properties are similar enough that you can ignore their fine differences. This lets the method pre-compute the system matrices once at the start and reuse them throughout the entire simulation—like solving the same type of equation repeatedly rather than rebuilding it each frame. The forces and constraints flow through a compact space defined only by the actual joints, not every particle.", "ww": "By pre-computing the matrices and collapsing the problem into the minimal joint space, the solver avoids redundant work and numerical instability. The affine approach isolates the geometric twist from material variation, so the mathematics stays well-behaved even with large time steps and many bodies. Exact constraint enforcement means the joints never wobble or separate, which keeps the entire assembly coherent.", "po": "The paper shows simulations of hundreds of thousands of bodies running at interactive rates on a single CPU core—tasks that would typically require a cluster or exp
