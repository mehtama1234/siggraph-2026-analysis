ensive GPU. This enables real-time design iteration for mechanical systems and high-fidelity animation of complex articulated characters and rigid assemblies without the usual performance penalty."}}, {"t": "DMP: Directable Motion Retargeting through Motion Paraphrasing", "th": "motion retargeting", "m": ["diffusion", "motion paraphrasing", "masked inpainting", "loss guidance"], "pr": "Motion retargeting limits diversity, realism, and artistic control across character morphologies", "ap": "Diffusion-based motion paraphrasing with spatio-temporal constraints and masked inpainting", "co": "Diverse, controllable motion retargeting via diffusion priors and flexible constraint specification", "u": "https://www.semanticscholar.org/paper/6938da28aa6dfd43689ec786caa5fd1777c8b323", "rc": {"bp": "Motion capture is the gold standard for realistic human animation—actors wear sensors, their movements are recorded, and artists use those recordings to animate digital characters. But capturing unique, fresh motions for every character shape and performance is prohibitively expensive. Motion retargeting solves this by adapting existing captured motions to fit different body proportions and artistic intentions, letting one recording serve many purposes.", "wh": "The obvious approach—just map the joints from one body to another—produces stiff, lifeless results that lose the life and flow of the original performance. Existing retargeting methods force you to choose: either stick rigidly to the original motion (realistic but inflexible), or allow artistic freedom (creative but risking unrealistic limb contortions and joint distortions). There is no good way to let artists steer the outcome while maintaining believable human motion.", "ap": "This method treats motion retargeting as a paraphrasing problem, similar to rewording a sentence while keeping its meaning. A large-scale dataset captures the same semantic movement performed across many different body shapes, and a generative model learns both what stays constant (the core movement) and what varies (how different bodies express it). During animation, artists can add constraints—fix a hand's position, lock a foot to the ground, specify when to grab an object—and the model fills in the rest by learning from the dataset.", "ww": "By learning variations from real data, the model internalizes what realistic human motion looks like across body types. The semantic core of the movement is preserved because the model learned what variants of it remain recognizable. Constraints guide the generation without forcing unnatural poses because the model knows the boundaries of plausible motion.", "po": "Artists can now retarget motion to diverse characters and situations in a single workflow—short to tall, different body shapes, different actions—while maintaining realism and keeping full creative control. The framework handles complex interactions like grabbing objects or reacting to the environment, which standard retargeting ignores."}}, {"t": "BodyReLux: Temporally Consistent Full-Body Video Relighting", "th": "video relighting", "m": ["video diffusion", "token conditioning", "masked attention", "dynamic capture"], "pr": "Relighting full-body video while maintaining temporal consistency and photorealism", "ap": "Video diffusion with token-based lighting conditioning and masked attention control", "co": "Photorealistic temporally consistent human relighting from hybrid OLAT and dynamic capture", "u": "https://www.semanticscholar.org/paper/6bae9afcb76871594371fa7de47aeade03812629", "rc": {"bp": "In film and video production, relighting—changing how light falls on actors and environments after they've been filmed—is crucial for matching scenes, fixing technical problems, and achieving the director's vision. Doing this convincingly in video requires understanding how light bounces off skin, cloth, and hair in three dimensions while maintaining temporal consistency (the same surface shouldn't jump between lit and dark between frames).", "wh": "Video is the hardest case for relighting because you must preserve the exact shape and motion of the actor while plausibly recomputing how light hits and reflects from every surface, across thousands of frames, without flickering or losing detail. Simple approaches either blur out fine details (shadows, skin texture, hair strands) or introduce temporal flicker. Training on real video data is nearly impossible because filmmakers rarely shoot the same actor in the same pose under many different lighting conditions.", "ap": "The method captures a unique performer in many lighting conditions by using clever real-time capture: actors perform while two smoothly changing light sequences alternate so quickly that the human eye doesn't see strobing. This yields paired video frames—the same motion lit two different ways. A video diffusion model (a type of neural network trained to gradually refine noisy frames into sharp ones) learns from this data to predict how the same video should look under different lighting. Control comes through a lighting token system—each light is represented as a discrete unit—and masked attention allows smooth transitions between different light setups over time.", "ww": "Diffusion models naturally handle the complexity of human appearance (skin, hair, cloth, specularity) because they learn from real video. The pre-training on general text-to-video patterns gives the model strong priors about how things should look. Masked attention ensures continuity across time, so the model doesn't reinvent the surface geometry or texture between frames—it only redistributes light.", "po": "The result is photorealistic relighting of a specific person or actor that works for full-body performances in real time, with smooth control over arbitrary lighting setups. This dramatically speeds up post-production workflows and makes it possible to achieve creative lighting looks that were impossible to capture on set."}}, {"t": "A Real-time, Multiscale and Procedural Feather Appearance Model", "th": "appearance modeling", "m": ["procedural representation", "hierarchical encoding", "scattering model", "multiscale rendering"], "pr": "Realistic bird feather rendering requires high detail but impractical memory and computation", "ap": "Hierarchical procedural representation in UV domain with novel scattering model", "co": "Real-time feather rendering from single photo with minimal memory and high visual fidelity", "u": "https://www.semanticscholar.org/paper/6ebf9c0393cd550439edb0bb928b9c08e502bcf0", "rc": {"bp": "Feathers are everywhere in nature and animation—birds, fantasy creatures, clothing details—and they catch light in beautiful, complex ways. Rendering them realistically is essential for visual fidelity, but modeling each individual hair-like filament is computationally prohibitive. A practical feather model should be simple enough to use in real-time graphics but detailed enough to look like an actual feather under different light and viewing angles.", "wh": "Feathers have structure across many scales: a central shaft, barbs branching off it, and smaller barbules off each barb. The appearance depends on this hierarchy—you see both the overall shape and fine fiber details, plus self-shadowing where one barb blocks light from reaching another. Capturing all this geometry explicitly creates millions of triangles per feather. A simpler approach loses the delicate appearance and visual fluency that makes feathers recognizable.", "ap": "Given a single photograph of a real feather, the method extracts the overall outline and the central shaft, then reconstructs the barb and barbule details procedurally—using mathematical functions to generate fine structure on demand rather than storing it explicitly. The feathers are represented in a compact planar (unfolded) coordinate system. During rendering, the model computes how light scatters from fibers and how barbs shadow each other, plus a special sheen layer that captures the distinctive soft glow you see on fluffy feathers.", "ww": "Procedural generation scales beautifully—the same rule set generates consistent detail at any zoom level, and shading happens per-ray rather than per-triangle, so no explosion of geometry. The single-image input is practical; photographers always have feather images. The appearance model captures real physics: fibers scatter light in specific ways, and the hierarchy ensures that fine details contribute realistically to the overall look.", "po": "Feathers now render in real time using 0.02% of the memory that explicit geometry would require, with photorealistic appearance under arbitrary lighting. This makes feathered characters and creatures practical for games, films, and interactive applications without the traditional fidelity-versus-speed tradeoff."}}, {"t": "ATGS: Anchored Temporal Gaussian Splatting for Long Volumetric Video Representation", "th": "volumetric video", "m": ["gaussian splatting", "time-conditioned anchors", "temporal windowing", "multi-level features"], "pr": "Long volumetric videos suffer from temporal instability and motion complexity artifacts", "ap": "Time-conditioned anchors organizing Gaussians with temporal windowing strategy", "co": "Stable volumetric video reconstruction for long sequences with complex motions", "u": "https://www.semanticscholar.org/paper/71945117d6f400609038c5ea15ffba3d63c59c40", "rc": {"bp": "Volumetric video—capturing performers or scenes in full 3D from multiple camera angles and reconstructing them as free-viewpoint video—is the future of immersive media. It enables viewers to choose their perspective, move their heads in VR, and see the scene from any angle. The challenge is handling long performances (several minutes or longer) with complex movements while maintaining visual consistency and smooth motion.", "wh": "Existing volumetric video methods struggle with temporal stability because they track motion frame-by-frame. Over a long sequence, small errors accumulate, and the same person or surface flickers or drifts between frames. Representing motion directly with individual primitives (like tiny spheres of light called Gaussians) is inherently unstable over long time ranges—tracking a tiny detail through hundreds of frames is error-prone. Scalability is also poor; systems need to process huge amounts of time and spatial data.", "ap": "Instead of tracking individual Gaussians through time independently, the method anchors them to time-dependent spatial reference points that move predictably. These anchors are like temporary \"hooks\" that constrain where Gaussians can appear and move, which drastically simplifies the tracking problem. Only the anchors relevant to a specific time frame are activated, reducing computational load. A multi-level feature representation captures global patterns, local spatial fine detail, and local temporal smoothness, constraining how Gaussians are generated frame by frame.", "ww": "Anchors reduce long-range tracking to local, short-term problems, which are much more stable. The coarse-to-fine hierarchy ensures that gross motion is correct first, then details refine within that stable skeleton. Temporal windowing means you only compute what you need, eliminating wasted effort on irrelevant frames.", "po": "Long volumetric video sequences with dancers, actors, or complex interactions now stay temporally coherent without flickering or drifting. Scenes with fast, intricate motion (like martial arts or sports) render smoothly from any viewpoint, opening up immersive experiences that were previously impossible at this quality level."}}, {"t": "Tensor Decomposition-Based Four-dimensional Background-Oriented Schlieren Tomography for High-Speed, High-Fidelity Flow Field Reconstruction", "th": "flow reconstruction", "m": ["tensor decomposition", "neural networks", "ray tracing", "mixed-precision computing"], "pr": "Time-resolved flow field reconstruction from Schlieren tomography is memory and time expensive", "ap": "Tensor decomposition with neural networks and distortion correction optimization", "co": "Fast high-fidelity flow field reconstruction via tensor decomposition and ray tracing", "u": "https://www.semanticscholar.org/paper/72d01ad780c5d789ea664c3a49b28f1e51613b14", "rc": {"bp": "Understanding airflow and pressure around fast-moving objects—jets, missiles, wings, wind-tunnel tests—is critical for aerospace and automotive design. Schlieren tomography is an experimental technique that uses light distortion to visualize invisible air currents. Reconstructing the full 3D flow from 2D images is a classic inverse problem, and faster, more accurate reconstruction enables real-time feedback for designers and researchers.", "wh": "Flow fields are four-dimensional—three spatial dimensions plus time—and reconstructing them from 2D projections is mathematically underdetermined; many different 3D flows could produce the same images. The raw data from multiple camera angles is enormous and noisy, and small errors in interpreting distortions (bent light rays) accumulate into large reconstruction mistakes. Traditional methods are slow and require extensive pre-training.", "ap": "The method organizes all the spatial-temporal data into a four-dimensional tensor (a multi-dimensional array) and decomposes it into components using mathematical factorization. A lightweight neural network works alongside the decomposition to correct for distortions—it learns how light rays bend in an inhomogeneous flow and iteratively adjusts the reconstruction. The computation uses mixed precision (different numerical accuracies for different steps) to speed things up without losing critical precision.", "ww": "Tensor decomposition exploits the redundancy and structure in flow fields; similar flow patterns repeat spatially and over time. The neural network learns the physics of distortion directly from data rather than requiring hand-tuned models. Mixed precision keeps the computationally expensive parts fast while protecting the accuracy where it matters.", "po": "Reconstruction runs in 12.6 seconds per frame without pre-training, a major speedup that enables real-time or near-real-time flow visualization. This makes it practical for experimental scientists to adjust their tests on the fly and for engineers to iterate on designs based on live flow data."}}, {"t": "Spatiotemporal FLIP for Fast Free-Surface and Two-Phase Simulation With Very Large Time Steps", "th": "fluid simulation", "m": ["flip", "space-time sampling", "phase-field", "particle-grid methods"], "pr": "Large time steps in liquid simulation cause temporal aliasing and free-surface artifacts", "ap": "4D space-time particle sampling with separable kernels and phase-field weighting", "co": "Order-of-magnitude larger time steps in FLIP solvers preserving flow structures", "u": "https://www.semanticscholar.org/paper/72de78bc50217a495f56db9de532298725379e7b", "rc": {"bp": "Simulating water splashing, waves sloshing in a tank, or liquid interacting with air—two-phase flow—is essential for realistic animation and engineering analysis. The standard approach limits time steps to maintain stability, which means computing the same physics many times to advance just a few seconds of simulation. Larger time steps enable faster animation and design iteration.", "wh": "Hybrid solvers (part particles, part grid) are fast, but large time steps cause aliasing—when particles move far between frames, their sampling of the flow becomes coarse and jerky, producing visual artifacts like jagged surfaces or lost splash details. The longer you let particles move in a single step, the more information you lose about the fine structure of the flow.", "ap": "The method treats particles not just as points in 3D space but as samples in 4D space-time—the same particle position is jittered not only in 3D but also randomly shifted along the time axis. When particles deposit their density onto the grid, a 4D kernel (a mathematical weight function) spreads them smoothly across both space and time, producing a temporal average of particle contributions rather than a single snapshot. This is mathematically equivalent to a Monte Carlo estimate of integrated flow properties over the time interval.", "ww": "By integrating over time, the method naturally averages out the aliasing that comes from coarse temporal sampling. The time-slab integration means that even if a particle moves far in one step, its contribution is temporally smoothed, avoiding the jagged artifacts. The grid-collapse step ensures the method integrates seamlessly into existing solvers.", "po": "Time steps can be ten times larger than conventional methods allow, dramatically accelerating liquid simulations while preserving detailed splashes, waves, and flow structures. This makes real-time liquid animation practical and speeds up engineering simulations where time is a constraint."}}, {"t": "Fast and Accurate Gaussian Process Modelling of Real-World Materials", "th": "BRDF modeling", "m": ["gaussian process", "bayesian regression", "covariance kernels", "spherical harmonics"], "pr": "BRDF modeling requires both accuracy and computational efficiency for diverse materials", "ap": "Gaussian process regression with generalized distance kernel and factorization", "co": "Fast analytical BRDF representations with compact form and flexible accuracy", "u": "https://www.semanticscholar.org/paper/746d55da081851bf071478aa96d47055b9b4add1", "rc": {"bp": "Materials reflect light in complex, distinctive ways—brushed aluminum looks different from polished gold, and silk cloth differs from rough leather. Capturing and representing this appearance mathematically is crucial for photorealistic rendering and material design. A compact representation enables real-time rendering while a flexible one adapts to any material type.", "wh": "Traditional methods either require many samples per material (expensive to measure and store) or use rigid mathematical models that don't capture real-world complexity. Modern measurements produce high-dimensional data (viewing angle, illumination angle, wavelength), and standard interpolation methods either bloat the representation or smooth away important fine structure like specular peaks and anisotropic patterns.", "ap": "This method uses Bayesian regression with a Gaussian process—a statistical framework that treats the material's reflectivity as a smooth function and learns it from sparse samples. Instead of the usual Gaussian kernel, it uses a generalized distance covariance kernel specifically designed to preserve fine features in material appearance (like sharp specular highlights). The data is organized cleverly so that factorization dramatically reduces the dimensionality, making the computation tractable—fitting and rendering both reduce to matrix operations.", "ww": "Gaussian processes provide a principled uncertainty estimate; they know which regions of the material's properties are well-constrained and which are not. The custom kernel respects the structure of material appearance better than generic smoothing. Factorization exploits the inherent separability in material data (viewing angle decouples from illumination angle in certain coordinate systems), avoiding the full curse of dimensionality.", "po": "A complete BRDF representation fits in seconds rather than hours or days, is compact enough for real-time rendering, and adapts its complexity to match the material's actual complexity. The representation converts easily to standard rendering formats, making it plug-and-play for existing graphics pipelines. Different materials—isotropic brushed metals, anisotropic fabrics, pearls—all work uniformly."}}, {"t": "Inverse Rendering for Discrete X-Ray Computed Tomography", "th": "computed tomography", "m": ["inverse rendering", "gradient optimization", "volumetric loss", "material distributions"], "pr": "Discrete tomography becomes ill-posed with sparse or limited-angle X-ray projections", "ap": "Gradient-based volumetric optimization with probability distributions over materials", "co": "Inverse rendering approach surpasses SIRT/DART in sparse and limited-angle scenarios", "u": "https://www.semanticscholar.org/paper/74f38a1a0377c1cf80f97597dcfca5747960b501", "rc": {"bp": "Discrete X-ray tomography reconstructs what's inside an object—a cast iron engine block, an aluminum bracket, a composite material—by shooting X-rays through it at many angles and reconstructing the 3D composition from the 2D radiographs. When only a handful of angles are available (the practical, radiation-safe case), reconstruction becomes dramatically harder and ambiguous.", "wh": "With few images, many different internal structures could plausibly produce the same X-ray shadows. Standard tomography algorithms (SIRT, DART, TVR-DART) use handcrafted constraints and heuristics that work for simple cases but struggle with sparse or limited-angle data—they get stuck in local minima and produce artifacts. These methods also ignore subtle effects like X-rays scattering inside the object.", "ap": "This method treats the problem as inverse rendering: instead of simulating X-rays from a known object, it inverts the process. Each location in the 3D volume is represented as a probability distribution over the known materials (steel is likely here, air is likely there). The method minimizes a loss function by comparing predicted X-rays (computed by simulating rays through the probabilistic volume) to the measured X-rays. Gradients flow backward through the ray simulation, adjusting the material probabilities to fit the data better. It naturally incorporates scattering and works on GPUs.", "ww": "Gradient-based optimization is powerful and flexible—it can incorporate nonlinear effects like scattering that traditional methods ignore. The probabilistic formulation naturally handles uncertainty; regions with conflicting evidence become ambiguous (high entropy) rather than forced into one material. GPU parallelization makes the optimization tractable even with fine spatial resolution.", "po": "Reconstruction quality surpasses traditional methods, especially in sparse and limited-angle scenarios where ambiguity is highest. The method handles scattering and nonlinear effects that other approaches miss, and the probabilistic output tells you which reconstructed details are confident versus ambiguous—critical information for engineering decisions."}}, {"t": "The Antipodal Method: Fast, Accurate, and Robust 3D Generalized Winding Numbers", "th": "geometry processing", "m": ["winding numbers", "ray tracing", "boundary integrals", "spherical projection"], "pr": "Computing generalized winding numbers trades off accuracy versus computational efficiency", "ap": "Ray-surface intersection plus boundary integral formulation with efficient discretization", "co": "22X CPU speedup and 109 queries/second GPU throughput for precise winding numbers", "u": "https://www.semanticscholar.org/paper/78de1b1dbadf5036e2ed801d92b0b7f13931fb16", "rc": {"bp": "Determining whether a point is inside or outside a 3D shape is a fundamental operation in computer graphics, simulation, and manufacturing. You need it to check if an object has collided with something, to apply volume forces, to slice shapes in CAD software, or to prepare geometry for 3D printing. The method must work on any shape—open surfaces, self-intersecting meshes, tangled or non-manifold geometry—that real data contains.", "wh": "Ray casting dominates the cost; the new formulation reduces it dramatically by exploiting the sphere projection structure. The boundary integral component handles tricky cases (tangent intersections, small loops) that raw ray casting misses. Precomputation and GPU implementation reach billions of queries per second.", "ap": "This method expresses insidedness as the sum of two geometric quantities: the signed number of times a ray pierces the surface, and a boundary integral computed over the surface's projection onto a sphere surrounding the query point. The integral is rewritten to avoid expensive surface calculations—it becomes a 2D computation on the sphere projection instead. For meshes, this discretizes efficiently. For curved parametric surfaces, the method adapts the same principle with analytic precision.", "ww": "", "po": "Speedups of 22× on CPU and 109 queries per second on GPU make generalized winding numbers practical for real-time geometry processing, large-scale simulations, and interactive design. The same algorithm works uniformly on meshes and smooth surfaces, open and closed, manifold and non-manifold—solving a long-standing robustness problem."}}, {"t": "Stress-Aware Panelization of Freeform Surfaces", "th": "surface panelization", "m": ["surface flow", "stress analysis", "elastic shells", "shape optimization"], "pr": "Panelizing freeform surfaces requires balancing geometric fidelity and structural robustness", "ap": "Continuous surface flow coupled to stress analysis via creased elastic shells", "co": "Joint optimization of geometry and panelization for both aesthetic and structural goals", "u": "https://www.semanticscholar.org/paper/7a9194585ca321f9b7abd6e1291494c8940ea887", "rc": {"bp": "Architects design beautiful freeform surfaces—curved facades, flowing shells, undulating roofs—but actually building them is expensive because you can't cut them from flat sheet materials efficiently. The solution is panelization: approximating the freeform surface with an assembly of flat polygonal panels that can be cut from wood, metal, or glass and then assembled. The panels must fit the surface tightly and also support their own weight and external loads (snow, wind) without deforming or breaking.", "wh": "Panelization is a two-way fight: make the panels very small and flat-fitting, but the structure becomes expensive and complex; make them larger and simpler, and the deviation from the intended shape becomes visible. The structural requirements are global—a weak spot creates cascading stress concentrations that might require reinforcement far away. Solving panelization and structural optimization separately usually yields compromises; jointly optimizing both is hard because you have many combinatorial choices (which boundary vertices form a panel?) coupled to complex nonlinear stress analysis.", "ap": "The method formulates panelization as continuous surface flow where candidate panels are creased elastic shells (like origami). Rather than choosing panel edges discretely, the algorithm flows the surface toward an optimal panelization while simultaneously computing internal stresses. The objective function integrates an arbitrary stress-based measure (minimize peak stress, or spread stress evenly) over the shell. Gradients of this objective with respect to the surface shape enable gradient-based optimization, and terms in the flow encourage the result to stay close to the original design intent.", "ww": "Continuous flow converts the discrete combinatorial problem into a smooth optimization, enabling gradient methods. Creased shells can be analyzed as simple elastic structures, making stress computation and differentiation tractable. The integrated objective couples geometry and mechanics throughout optimization, so the algorithm never settles on a geometrically beautiful but structurally weak solution.", "po": "Panelizations are geometrically faithful to the original freeform design and structurally optimized for fabrication loads—no post-hoc reinforcement needed. The method accelerates architectural fabrication workflows and enables more ambitious freeform designs to be built cost-effectively."}}, {"t": "Untangling Surfaces via Shape and Mesh Repulsion", "th": "surface untangling", "m": ["energy minimization", "shape repulsion", "mesh penalties", "multi-level enforcement"], "pr": "Self-intersections in meshes break downstream simulation, fabrication, and learning pipelines", "ap": "Energy-based framework enforcing embeddedness at both shape and mesh levels", "co": "Reliable self-intersection removal via global shape and local mesh repulsion energies", "u": "https://www.semanticscholar.org/paper/7b7774a3773f8caf2fee47e5e4aebd86cc2af11e", "rc": {"bp": "Self-intersecting surfaces (where the surface pierces through itself) break downstream pipelines: physics simulations diverge, 3D printing fails, and machine learning models trained on valid geometry behave unexpectedly. Untangling surfaces—removing self-intersections while preserving the intended shape—is essential for cleaning up 3D scans, procedurally generated geometry, and artistic models.", "wh": "Self-intersections are global topological tangles, not local collisions; moving two vertices apart in one spot may create new intersections elsewhere. Local collision-response methods (push vertices away from each other) often just shift the problem. A true fix requires reasoning about the overall shape configuration simultaneously, which most methods don't do.", "ap": "This method defines two energies: a shape-level energy that penalizes global entanglement (measured in the continuous surface, independent of how finely it's tessellated), and a mesh-level energy that prevents local discrete interactions (triangles piercing through each other). Together, they enforce embeddedness—the geometric property that a surface doesn't self-intersect. The framework works on surfaces with boundary, non-manifold configurations, multi-object scenes, and handles cases where the surface has immersion failures (high curvature pathologies).", "ww": "The shape-level energy prevents the untangling from just shifting self-intersections rather than removing them; it's insensitive to mesh resolution, so coarse and fine meshes converge to the same shape. The mesh-level penalty catches local discrete issues that the shape-level energy might miss. Neither energy requires modifying the mesh connectivity, so the untangling respects the user's intended surface topology.", "po": "Complex self-tangled surfaces untangle reliably across varied geometry types and dataset challenges, enabling robust downstream processing. Scanned point clouds converted to mesh, procedurally generated shapes, and hand-sculpted models all now have a single, reliable untangling mechanism that preserves artistic intent while removing pathologies."}}, {"t": "Grow3D: Hierarchical Next-Scale Octree Prediction for Fast and High-Fidelity 3D Shape Generation", "th": "3D shape generation", "m": ["auto-regressive", "next-scale prediction", "vq-vae", "octree attention"], "pr": "3D shape generation via diffusion or auto-regressive models requires dozens of slow steps", "ap": "Next-scale prediction auto-regressive framework with VQ-VAE and octree attention", "co": "Fast high-quality 3D shape generation via coarse-to-fine octree structure prediction", "u": "https://www.semanticscholar.org/paper/7cb46f245cb3e124a0320d769417e8bb83021902", "rc": {"bp": "Generating diverse, high-quality 3D shapes on demand—furniture, tools, characters, creatures—is valuable for design, gaming, and storytelling. Existing generative models (diffusion and autoregressive) produce excellent results but require many generation steps, making them slow. Faster inference enables interactive design and real-time applications.", "wh": "Standard diffusion and autoregressive models generate the entire shape incrementally, which requires dozens to hundreds of steps. Recent work shows that next-scale prediction—generating coarser structures first, then refining them level by level—is faster and higher quality, but this works only for fixed-resolution grids. Real 3D data is often sparse (most of space is empty), so fixed grids waste computation on empty regions. Adaptive variable-length representations like sparse octrees are more efficient but incompatible with existing next-scale methods.", "ap": "This method encodes 3D shapes into a multiscale octree representation using a specialized compression network (VQ-VAE with residual serialization). An octree is a hierarchical tree where each level subdivides space more finely—like a zoom-in-and-refine view. A generative model then predicts the octree structure and geometry features level by level, from coarse to fine. The key innovation is an attention mechanism that understands octree structure and only attends to truly relevant features at each scale, avoiding wasted computation on empty or irrelevant branches.", "ww": "Octrees naturally compress sparse shapes, eliminating the resolution waste of fixed grids. Next-scale prediction is fast because each level is a small prediction task; coarse levels guide subsequent refinements. Octree-aware attention focuses computation where it matters, respecting the hierarchical structure rather than treating space uniformly.", "po": "High-quality 3D shapes generate in a small number of steps, orders of magnitude faster than standard diffusion or autoregressive models. This enables interactive shape creation, real-time game asset generation, and design workflows where artists iterate rapidly."}}, {"t": "A Robust and Efficient Intersection Algorithm for NURBS Surfaces: Handling Small Loops and Tangent Intersections", "th": "NURBS intersection", "m": ["winding number theory", "subdivision scheme", "vector field analysis", "topological detection"], "pr": "NURBS surface intersection fails on complex topology with small loops and tangencies", "ap": "Winding number theory combined with subdivision scheme for vector field detection", "co": "Robust detection of all intersection branches including small loops and tangencies", "u": "https://www.semanticscholar.org/paper/7d60e630cd05bb43caf0977ccdd7fba2096ff63d", "rc": {"bp": "NURBS surfaces (Non-Uniform Rational B-Splines) are the standard mathematical representation for curves and surfaces in CAD systems and design software. When two NURBS surfaces meet, their intersection curve defines edges and seams in the model. Computing this intersection correctly is fundamental to CAD reliability; mistakes in topology (failing to detect a loop, missing an isolated point) cause cascading failures in downstream operations.", "wh": "Identifying all intersection branches robustly is hard because complex topology can include tiny loops (nearly tangent curves that form small loops before separating), degenerate tangent intersections (curves touching but not crossing), and self-intersections. Industrial methods work most of the time but fail on edge cases. Existing approaches trade speed for robustness; catching all topology is slow.", "ap": "The method detects intersection branches by computing their starting points robustly. It combines winding number theory (a mathematical tool for counting how many times a curve winds around a point) with a subdivision scheme. The idea is to find points on the parametric domain where the vector field (a mathematical representation of potential intersection directions) has special structure (singularities). Winding numbers detect small loops and isolated singularities; subdivision localizes tangent intersection points precisely.", "ww": "Winding numbers count global topology without explicitly computing intersections, making small loops visible even if they're nearly tangent. Subdivision converges to tangent points precisely. Starting points are more robust to compute than full curves, so the method avoids numerical creep and instability that plague direct curve tracing.", "po": "Topologically correct intersection computation on complex inputs—small loops, tangencies, degenerate configurations—now outperforms both commercial and open-source CAD kernels. This improves reliability of CAD systems for manufacturing, design fabrication, and complex assemblies where topological errors are expensive."}}, {"t": "Interactive Yarn-level Knitwear with Nested Douglas-Rachford Splitting", "th": "cloth simulation", "m": ["douglas-rachford splitting", "nested decomposition", "convexification", "admm"], "pr": "Yarn-level knitwear simulation is prohibitively expensive due to high DOF and non-convex coupling", "ap": "Nested Douglas-Rachford splitting decoupling non-convex variational energy subproblems", "co": "Stable high-resolution knitwear simulation via convexification and theoretically grounded metrics", "u": "https://www.semanticscholar.org/paper/80e2957983181a5ac0b822330b5018626661eb78", "rc": {"bp": "Knitted garments—sweaters, socks, scarves—have richly detailed structure: yarn strands interlock in complex patterns. Simulating knitwear at the yarn level (rather than treating it as a triangular mesh) captures intricate wrinkles, folds, and draping that matter for visual realism in high-end animation. However, yarn-level simulation is computationally prohibitive; each stitch involves thousands of tiny degrees of freedom.", "wh": "Yarn-level knitwear has multiple competing physical effects: stretching and compression in the yarn, bending resistance (yarn doesn't fold like paper), twisting, shearing, and contacts where yarns collide. These effects are tightly coupled and nonlinear, making optimization per frame slow. Standard numerical methods require expensive line searches and frequent small steps because the system is non-convex (multiple local solutions exist).", "ap": "The method extends Douglas-Rachford Splitting (DRS), an optimization algorithm, to handle non-convex problems. The key innovation is nested decomposition: instead of solving the full coupled problem, it breaks it into independent sub-problems (one for stretching, one for bending, etc.), each of which is convex (has a single optimum). The nested structure ensures these sub-problems couple correctly across yarn threads and contacts. The paper derives principled metric selection for each sub-problem based on convergence theory, replacing ad-hoc tuning.", "ww": "Splitting converts a hard non-convex problem into a sequence of easier convex sub-problems, improving robustness and convergence. Convexity eliminates the need for line searches and frequent convergence checks. Theoretical metric selection grounds parameter choices, yielding near-optimal convergence without trial-and-error.", "po": "Yarn-level knitwear simulates efficiently enough for animation workflows, maintaining high-resolution detail and realistic deformation without the computational burden that previously limited adoption. This enables feature-quality cloth simulation with yarn-level realism in film and animation pipelines."}}, {"t": "Guidestar-Free Adaptive Optics with Asymmetric Apertures", "th": "adaptive optics imaging", "m": ["phase retrieval", "machine learning", "computational sensing"], "pr": "Real-time wavefront sensing without guidestar or dedicated sensor in adaptive optics", "ap": "Asymmetric apertures with phase retrieval and machine learning for computational wavefront sensing", "co": "First guidestar-free closed-loop AO system with order of magnitude fewer measurements", "u": "https://www.semanticscholar.org/paper/814cfe34cda97cde72f42f94f9f7ce28b39fb7d0", "rc": {"bp": "Telescopes and microscopes struggle to see clearly through turbulent air or cloudy glass — the atmosphere or optical imperfections scramble incoming light waves. We want to correct this distortion in real-time and in software, recovering sharp images of distant objects without needing artificial reference beacons (guidestars) placed in the sky.", "wh": "Measuring how much the light has been distorted requires knowing either the original light pattern (which you don't have for natural scenes) or a bright reference star at a known position (which may not exist or be too faint). The trick is getting the wavefront measurement from the blurry image alone, using only the quirky shape of the telescope's opening.", "ap": "They use an asymmetric telescope pupil (an oddly-shaped opening instead of a circular one) that encodes wavefront distortions into measurable patterns in the image. Two neural networks then infer the optical distortion from these patterns and predict what the true image looks like. A deformable mirror at the pupil plane applies the computed correction optically, closing the loop in real-time.", "ww": "An asymmetric pupil breaks the symmetry of how light spreads in the image, so the blurry pattern itself now contains information about the distortion — like a broken mirror shape tells you how light was bent. Neural networks learn this relationship from training data, so correcting distortions that haven't been seen before still works reasonably well.", "po": "The system corrects optical aberrations without a guidestar, uses 100× fewer images, and needs 1000× less computation than older phase-retrieval methods. It enables sharp imaging of natural scenes through unknown obstacles (dust, haze, or fog) with only a camera and a controllable mirror."}}, {"t": "Learning Sparse Singularities for Cross Field Design", "th": "quad mesh generation", "m": ["neural networks", "singularity learning", "geodesic distance fields"], "pr": "Manual quad mesh design; neural networks struggle with cross field discontinuities", "ap": "Learn sparse singularities and indices, then use smooth conventional methods to connect", "co": "Smooth cross fields with varying topologies via learned singularities", "u": "https://www.semanticscholar.org/paper/83abfb7bed6c44e990f40adaa87585dbafad7328", "rc": {"bp": "Quad meshes are four-sided grids that artists and engineers drape over 3D shapes to control how surfaces behave and look — they're essential for character animation, manufacturing, and numerical simulation. Hand-drawing these grids is tedious and requires expertise, so automating the process would save enormous time.", "wh": "Neural networks that directly predict quad grids struggle because small changes in the shape create large, chaotic shifts in the quad pattern, even when the underlying 'singularities' (special points where quads meet at odd angles) barely move. This creates visually jarring, inconsistent results when you blend multiple suggestions.", "ap": "Instead of predicting the entire quad grid, they train a network to predict only the sparse singular points: where they lie and their 'index' (how many quads spiral around them). They convert this into auxiliary fields to make the learning problem well-behaved. Then conventional algorithms smoothly connect the singular points to build the full, coherent quad grid.", "ww": "Singular points are the core structure that determines a quad grid's shape. By learning those rare, stable points instead of the millions of quad edges, the network sees a cleaner problem with less noise. The subsequent smooth-connection step (done non-neuronally) guarantees that the final grid is always valid and coherent, regardless of small prediction errors.", "po": "The method generates smooth, topologically varying quad grids and simplifies dataset preparation. Results are stable across shape variations and automatically handle coordinate invariance and insensitivity to tessellation choices — properties that matter for production automation."}}, {"t": "Pixel Cube: Diffusion-based Portrait Video Relighting Through Realistic Lighting Reproduction", "th": "portrait video relighting", "m": ["diffusion models", "neural rendering", "hdr environment maps"], "pr": "Dynamic portrait video relighting lacks photorealism and temporal consistency", "ap": "Video diffusion models trained on hybrid real+rendered data with HDR environment map control", "co": "Temporally consistent realistic relighting preserving subject identity and facial details", "u": "https://www.semanticscholar.org/paper/84f3047c877f42606af9d6619d802ff103110485", "rc": {"bp": "Relit portrait videos are videos where the lighting on an actor's face is changed after filming — perhaps to match a new scene or mood. The challenge is making the relighting look photorealistic and keeping it consistent frame-to-frame so the actor's face doesn't flicker or look artificial.", "wh": "Older methods either work on still images (ignoring flicker) or are too slow for video. Building a learning model requires diverse training data showing the same actor under many different lighting conditions, which is expensive to capture. Generative models also struggle to preserve fine facial details (skin tone, wrinkles, hair) while changing lighting.", "ap": "They built a physical LED lighting rig to capture real portrait videos under known lighting. A diffusion model (a generative tool that learns patterns by removing noise from images) is trained on this hybrid dataset of real and rendered videos. At runtime, the model takes an HDR environment map (a 360-degree image describing the new lighting) and synthesizes the relit frame.", "ww": "Diffusion models are naturally good at preserving details (like wrinkles) while smoothing unrealistic lighting artifacts because they learn what real skin looks like under varied light. The real LED captures and the HDR control signal together teach the model to respect both identity and photorealism. Temporal consistency emerges because the underlying video diffusion model is trained to keep motion smooth.", "po": "Videos relight with photorealistic quality, preserve the actor's expression and fine facial features, and generalize to unseen subjects, motions, and new lighting conditions. The model works on in-the-wild videos (filmed normally) with no manual setup."}}, {"t": "A Two-Millisecond Passthrough Headset for Perceptual Studies", "th": "virtual reality headsets", "m": ["catadioptric optics", "low-latency rendering", "passthrough display"], "pr": "HMD end-to-end latency 12-60ms prevents perceptual studies of lower latencies", "ap": "Video passthrough HMD with catadioptric design achieving 2ms e2e latency", "co": "First passthrough HMD platform for studying sub-10ms latency effects on user experience", "u": "https://www.semanticscholar.org/paper/86b5a8083ebcead20fb679d94166bbcde26d71b6", "rc": {"bp": "In virtual reality, the delay between when you move your head and when the display updates (latency) makes you feel disconnected and dizzy. Lower latency makes VR feel more real and responsive. Current headsets have 12-60 ms latency; understanding whether even lower latencies matter for user comfort and performance requires a device that can test it.", "wh": "Modern VR systems use clever tricks (pose prediction, late reprojection) to hide latency, but these tricks only work down to about 12 ms. Testing true latencies below that requires new hardware that doesn't need those tricks — a much harder engineering problem.", "ap": "They built a video passthrough headset called Camsicle with two cameras and a special mirror-lens system (catadioptric design) that displays the real world with only 2 milliseconds of end-to-end latency. The cameras capture what you see, the system processes it instantly, and the display shows it with virtually no delay.", "ww": "By using cameras and mirrors instead of prediction hacks, there's no accumulated error — the user sees the physical world nearly as if the headset weren't there. This true low-latency passthrough is the key to testing whether sub-12-ms latencies actually matter for user preference, rather than just theory.", "po": "User studies with 57 participants show that 2 ms and 14.3 ms latencies are preferred over 23 and 29 ms in a ball-catching task. The platform enables perceptual research on latency thresholds that was previously impossible, grounding subjective VR comfort in measurable physical quantities."}}, {"t": "Woodstock: Interactive Modeling of Fungal Wood Decay", "th": "biological material simulation", "m": ["volumetric simulation", "anisotropic diffusion", "grain-aligned meshes"], "pr": "Simulating complex fungal wood decay with biological and mechanical interactions", "ap": "Volumetric tree representation with anisotropic diffusion, fungal colonization, and moisture dynamics", "co": "Realistic simulation of cuboid fractures, trunk hollowing, and environmental moisture effects", "u": "https://www.semanticscholar.org/paper/88ef33768b45dfaeb903fb38b43a7e1815d59442", "rc": {"bp": "When fungi decay wood, they don't just eat away randomly — they break down specific chemicals (lignin, sugars, defenses), and the wood's moisture and grain structure determine how fast and where the decay spreads and causes structural failure. Simulating this process realistically would help visualize how trees rot and inform timber engineering.", "wh": "Wood decay couples biology (fungal spread, chemical degradation), fluid flow (moisture moving through grain), and mechanics (wood fracturing and hollowing) in complex ways. Each domain has different physics, and they strongly influence each other. No prior method unified them.", "ap": "They represent wood as a 3D volumetric model with explicit grain alignment, internal moisture, and tissue health states (intact, colonized, consumed). They simulate three coupled processes: anisotropic spread of fungal colonies (following grain and moisture), consumption of wood resources, and stress-driven fracture patterns (driven by moisture and material loss).", "ww": "Tracking moisture, fungal spread, and material failure together lets each influence the others correctly. Fungal spread follows grain (anisotropic), so it doesn't just make a sphere around the infection point. Moisture and chemical consumption weaken wood locally, leading to realistic cuboid fracture patterns (characteristic of rot) rather than smooth erosion.", "po": "Simulations realistically capture the progression of rot: fungal colonization spread, characteristic cube-shaped fracture patterns, trunk hollowing, and environmental moisture effects on structural stability. The rendering shows volumetric decay as a realistic 3D process, not an abstract animation."}}, {"t": "Uncertainty-aware geometry processing on Gaussian Process Implicit Surfaces", "th": "probabilistic geometry processing", "m": ["gaussian processes", "differential operators", "kac-rice formula"], "pr": "Geometry processing on uncertain/probabilistic surface representations", "ap": "Kac-Rice formula to embed differential operators on Gaussian Process Implicit Surfaces", "co": "Uncertainty-aware geometry processing with principled handling of noise and ambiguity", "u": "https://www.semanticscholar.org/paper/89a577193e34cd580c346b65d08d1a6a23236640", "rc": {"bp": "When you scan a 3D shape with sensors (cameras, LiDAR) or reconstruct it from partial data, there's always uncertainty — ambiguity about the exact surface. Most geometry processing assumes a single, definite shape, throwing away that uncertainty. The goal is to do useful operations (smoothing, curvature, flow) while acknowledging and using the uncertainty.", "wh": "Classical geometry processing (computing gradients, Laplacians, running smoothing algorithms) assumes a crisp, deterministic surface. But if the input is uncertain, a single fixed surface can mask important ambiguities. Building math for uncertain surfaces from scratch is non-trivial.", "ap": "They use Gaussian Process Implicit Surfaces, a probabilistic representation that stores a distribution over plausible shapes instead of one fixed shape. They define analogs of classical operators (gradient, divergence, Laplacian) that work on this distribution, computing expected values using the Kac-Rice formula (a tool from random surface theory).", "ww": "Gaussian processes naturally encode uncertainty, and the Kac-Rice formula lets you compute integrals and derivatives over random surfaces by embedding them into a fixed volumetric domain. This converts an intractable problem (differentiate a probabilistic surface) into an integral over a volume, which is computationally tractable.", "po": "You can now do geometry processing (like smoothing or curvature estimation) that accounts for input noise and ambiguity rather than pretending the input is perfect. This bridges classical surface equations and modern probabilistic shape representations, enabling principled handling of noisy or incomplete scans."}}, {"t": "MotionBricks: Scalable Real-Time Motions with Modular Latent Generative Model and Smart Primitives", "th": "motion generation and synthesis", "m": ["latent generative models", "smart primitives", "motion authoring"], "pr": "Real-time generative motion control lacks scalability and multi-modal control interfaces", "ap": "Modular latent generative backbone with smart primitives for navigation and interaction", "co": "Real-time generation of 350k+ motions with unified control interface and zero-shot adaptation", "u": "https://www.semanticscholar.org/paper/8c10d76b4727be49cda4bbb2a7d9c3e8791148bb", "rc": {"bp": "In video games, movies, and robotics, characters need to move in real-time with precise control — walk faster, face a direction, reach for an object. Generative AI can synthesize convincing motions, but it's slow and hard to control in the fine-grained, multi-faceted way that production pipelines need.", "wh": "Generative models trained on massive motion datasets can produce diverse and realistic motion, but they require seconds of computation. Real-time demands milliseconds. Existing models also respond poorly to multi-modal control: velocity commands, style choices, and exact keyframes simultaneously, which production rarely addresses.", "ap": "MotionBricks uses a large modular neural backbone trained on 350,000 motion clips that generates motions in a learned 'latent' space (compressed, efficient representation). On top, 'smart primitives' provide an authoring interface for intuitive control: speed commands, style labels, and spatial keyframe constraints. The model learns to blend these controls naturally.", "ww": "Modularity means the core model learns general motion patterns once, then different downstream tasks (walking, reaching, dancing) reuse the same backbone without retraining. Smart primitives encode common control needs so the system learns what users actually want without task-specific annotations. This amortizes computation across many use cases.", "po": "The system generates diverse motions in real-time (critical for interactive apps), supports multi-modal control (velocity, style, keyframes), and works on new tasks zero-shot (without fine-tuning). It bridges the gap between research generative methods and production demands for control and speed."}}, {"t": "ReActor: Reinforcement Learning for Physics-Aware Motion Retargeting", "th": "motion retargeting robotics", "m": ["reinforcement learning", "bilevel optimization", "physics simulation"], "pr": "Robot motion retargeting produces physical inconsistencies and dynamically infeasible motions", "ap": "Bilevel optimization jointly adapting reference motions while training tracking policy via RL", "co": "Physically plausible retargeted motions enabling robust imitation learning across morphologies", "u": "https://www.semanticscholar.org/paper/8c964e7a26e5c9da1c8f5a62ada31f9a297da7d0", "rc": {"bp": "Teaching robots to move like humans is hard: human motions evolved for human bodies, but robots have different arm lengths, joint ranges, and physics. Naively copying a human motion onto a quadruped or unusual robot often produces sliding feet, self-collisions, or motions that violate physics, so the robot can't actually execute them.", "wh": "Retargeting (adapting a reference motion to a new body) is traditionally done by hand or with heuristics that ignore physics. If you account for physics, the optimization becomes complex and brittle. Reinforcement learning can produce physically valid motions, but it requires a lot of trial-and-error.", "ap": "ReActor uses a two-level optimization: the top level adapts the reference motion's parameters (e.g., joint angles) to match the robot's shape, and the bottom level trains a tracking policy using reinforcement learning to follow the adapted motion while respecting physics constraints. They derive approximations to make the bilevel problem solvable.", "ww": "By tightly coupling retargeting and RL training, the motion adapts to the specific robot body *and* the physics constraints, rather than one then the other. RL ensures the final motion is actually feasible for the robot to execute. The framework needs only sparse semantic hints (which human joints map to which robot joints), not manual tuning.", "po": "Robots can execute retargeted motions without foot sliding, self-collision, or dynamic infeasibility, even when retargeting to very different morphologies (e.g., a quadruped from a human). The method validates on real hardware, making human-inspired motion practical for robotics."}}, {"t": "Gabor Fields: Orientation-Selective Level-of-Detail for Volume Rendering", "th": "neural volume rendering", "m": ["gabor filters", "gaussian splatting", "frequency filtering"], "pr": "Gaussian-based volume representations lack efficient hierarchical level-of-detail strategies", "ap": "Mixture of Gabor kernels enabling orientation-selective frequency filtering via primitive pruning", "co": "Continuous smooth LOD transitions without refitting or extra storage; faster ray traversal", "u": "https://www.semanticscholar.org/paper/8cb0bbc0263e7ee2ca11230aea1423d732e187ce", "rc": {"bp": "Rendering complex 3D volumes (smoke, clouds, semi-transparent materials) is computationally expensive. To speed it up, we use hierarchies: show low detail far from the camera and high detail up close. This is easy with traditional voxel grids but hard with modern Gaussian-based representations, which are memory-efficient but don't have built-in levels of detail.", "wh": "Gaussian representations avoid the memory cost of voxel grids, but constructing a hierarchical version is awkward: prefiltering bloats memory, recomputing each level is expensive, and smooth transitions between levels are hard to guarantee. You need a method that prunes or filters without refitting.", "ap": "Gabor Fields replace Gaussian elements with Gabor kernels (sinusoidal functions modulated by a Gaussian envelope) that naturally encode frequency and orientation. Rendering can select which frequencies to use at each viewing distance. Pruning high-frequency kernels automatically reduces detail without refitting or extra storage.", "ww": "Gabor kernels inherently encode frequency information (spatial scale), so reducing detail is as simple as dropping the high-frequency components. This is cheap and automatic, unlike Gaussian prefiltering. Stochastically sampling different frequencies at different ray depths creates smooth transitions between hierarchy levels.", "po": "Gabor Fields enable smooth, continuous level-of-detail for Gaussian volumes with no refitting, no extra memory, and faster rendering. Ray traversal accelerates because high-frequency components can be masked, allowing the renderer to skip large volumetric regions."}}, {"t": "Monte Carlo PDE Solvers for Nonlinear Radiative Boundary Conditions", "th": "physics-based simulation", "m": ["monte carlo methods", "pde solvers", "fixed-point iteration"], "pr": "Monte Carlo PDE solvers cannot handle nonlinear radiative boundary conditions", "ap": "Picard-style fixed-point iteration with heteroscedastic regression denoising for on-boundary estimates", "co": "Stable convergent solver for thermal radiation with higher accuracy than linearization", "u": "https://www.semanticscholar.org/paper/8ddd357b6dbde1a4963520edb79eb84cec035814", "rc": {"bp": "Heat transfer in 3D shapes with realistic radiation (where hot surfaces emit infrared and cool other surfaces) is governed by complex equations that require numerical solving. Thermal simulations matter for engineering and also for graphics (hot metal rendering). Monte Carlo methods handle complex geometry robustly, but they don't yet handle the nonlinear radiation boundary conditions.", "wh": "Radiation produces a nonlinear boundary condition (the heat loss depends on the surface temperature to the fourth power, following Stefan-Boltzmann law). Nonlinear equations are much harder to solve than linear ones. Existing Monte Carlo PDE solvers handle linear boundary conditions but not this nonlinearity.", "ap": "They use Picard fixed-point iteration: repeatedly update boundary conditions and resolve the PDE, letting the solution converge by successive approximations. A denoising technique using heteroscedastic regression reduces the variance of Monte Carlo estimates at boundaries, focusing effort where it matters most.", "ww": "Picard iteration converts a hard nonlinear problem into a sequence of easier linear solves. Each solve uses Monte Carlo's robustness on complex geometry. The denoising step targets boundary variance specifically, filling a gap that prior methods (which denoised only interior points) left open.", "po": "Monte Carlo solvers now handle nonlinear thermal radiation boundaries with significantly higher accuracy than linearization approximations. The method works on complex geometries (the whole point of Monte Carlo) and is empirically stable even with bad initial guesses."}}, {"t": "Autoregressive Diffusion with Hybrid Representation for Interactive Human Motion Generation", "th": "human motion generation", "m": ["autoregressive diffusion", "hybrid representation", "text conditioning"], "pr": "Motion generation requires offline computation or sacrifices controllability for real-time", "ap": "Autoregressive hybrid representation combining explicit root features with latent body embedding", "co": "Real-time streaming motion generation with text and kinematic constraint control", "u": "https://www.semanticscholar.org/paper/8e28267f4c5e3133f2c8cca55e9dc1f62a1a3d0c", "rc": {"bp": "Animating 3D human characters in real-time for interactive games or VR requires generating believable motion fast and with responsive control — the player says \"walk forward and turn left\" and the character does it immediately, in a natural way, matching the narrative voice they requested.", "wh": "Offline generative models produce high-quality motion but are too slow for interactivity. Online methods are fast but often lack nuanced control (text semantics, long-horizon goals) and struggle to maintain temporal coherence over long sequences. The two worlds haven't converged.", "ap": "ARDY (Autoregressive Diffusion) streams motion generation in real-time using a hybrid representation: the character's root position (where they're walking) is explicit for precise control, and the body's pose is learned in a latent space for efficiency. A two-stage transformer-denoiser with variable context window generates new poses conditioned on text prompts and keyframe constraints.", "ww": "The hybrid representation separates concerns: trajectory control (where the character walks) is direct and stable, while body animation (posture, arm swing) is learned flexibly. Variable context lets the model look at different amounts of past motion depending on the situation. Training on text labels and ground-truth keyframes teaches the model to fuse both signals naturally.", "po": "The system generates high-fidelity human motion in real-time, responsive to text prompts and flexible kinematic constraints, with support for long-horizon goals. It bridges offline quality and online speed, enabling interactive animation with semantic and spatial control that was previously unavailable."}}, {"t": "Spatially Accelerated Winding Numbers for Curved Geometry", "th": "winding number computation", "m": ["bounding volume hierarchy", "moment data", "nurbs evaluation"], "pr": "Fast winding number evaluation limited to discrete inputs; slow on curved geometry", "ap": "Bounding volume hierarchy with precomputed moments for arbitrary NURBS curves and patches", "co": "Sub-linear complexity winding numbers on curved geometry preserving feature accuracy", "u": "https://www.semanticscholar.org/paper/8f09b64e0ca548613b3809628591abac8d85d376", "rc": {"bp": "Winding numbers answer a fundamental question: is a point inside or outside a 3D shape? This seems simple for clean, closed surfaces, but real meshes are messy — they have gaps, overlaps, and curved boundaries. A robust inside-outside test is essential for simulation, texturing, and boolean operations.", "wh": "Direct evaluation of winding numbers on large, complex meshes is slow, so spatial acceleration is needed. Existing fast methods approximate by clustering primitives far from the query point. But they only work on discrete meshes (triangles, points), not smooth curves or patches.", "ap": "They extend winding number acceleration to curved geometry (NURBS curves and trimmed patches) using a Bounding Volume Hierarchy that stores precomputed moment data at each node. Queries use fast approximations for far clusters but directly evaluate nearby curved primitives, preserving geometric accuracy.", "ww": "Precomputing moments (integrals of basis functions) at hierarchy nodes enables accurate approximations for distant clusters without refitting. Direct evaluation near the query preserves fine details (like thin features) that would be lost with purely approximate methods. The two-tier strategy keeps asymptotic complexity low while maintaining accuracy.", "po": "Winding number queries on curved geometry (NURBS) achieve sub-linear complexity while preserving geometric features, enabling containment queries on arbitrary curved shapes — not just triangle meshes. This is useful for procedural design and simulation on parametric surfaces."}}, {"t": "Probe-based Walk on Spheres for Efficient Path Reusing", "th": "monte carlo pde solving", "m": ["walk on spheres", "variance reduction", "control variates"], "pr": "Walk on Spheres has slow O(N^-1/2) convergence despite mesh-free flexibility", "ap": "Reuse intermediate walk states as fixed spherical probes with Poisson integral evaluation", "co": "Substantially improved sample efficiency via probe-based path reusing and variance reduction", "u": "https://www.semanticscholar.org/paper/90c07037c62cb5975ac553f08e35e19bfe1a7274", "rc": {"bp": "Walk on Spheres (WoS) is a flexible, meshless method for solving partial differential equations (heat, diffusion) by simulating random walks. It's robust to complex geometry, but converges slowly, requiring millions of walks. The goal is to reuse information from intermediate points along walks to speed convergence.", "wh": "Each random walk in WoS visits many points before reaching a boundary, but classical methods discard all intermediate values and only record the final result. Using intermediate points seems promising, but their probability distribution (shaped by dynamically generated spheres) is intractable to evaluate.", "ap": "Walk on Probes (WoP) replaces dynamic spheres with fixed, pre-distributed probe spheres throughout the domain. This converts the tricky distribution of walk points into simple samples on fixed sphere boundaries. A Poisson integral formula then cheaply evaluates each intermediate point's contribution without needing to recompute from scratch.", "ww": "Fixed probe boundaries have known, tractable distributions (uniform on a sphere), so their contribution to the solution is easy to compute. By reusing intermediate points, each random walk becomes multiple independent unbiased estimates instead of just one, dramatically improving variance without additional simulations.", "po": "Walk on Probes substantially improves sample efficiency and convergence speed while preserving WoS's flexibility for complex geometries. The method is general: it combines reuse with control variates and self-normalization for further variance reduction."}}, {"t": "Fast and Exact Winding Numbers for Triangle Meshes", "th": "winding number computation", "m": ["ray-mesh intersection", "analytical reduction", "robust geometry"], "pr": "Winding number computation on noisy meshes with gaps and self-intersections is slow", "ap": "Analytical reduction of surface integral to single ray-mesh test and edge sum", "co": "Orders of magnitude faster exact winding numbers with no approximations besides floating-point", "u": "https://www.semanticscholar.org/paper/94b32f4d8fce93c29bf8742983e480a33be8d839", "rc": {"bp": "Winding numbers — a measure of whether a point is inside a 3D shape — are used constantly in graphics and simulation. Computing them naively on large meshes is slow, but existing fast methods use approximations. The goal is to compute exact winding numbers quickly on realistic, messy meshes with gaps and overlaps.", "wh": "The classical formula for winding numbers is a surface integral that's expensive to evaluate. Fast approximations lose accuracy on imperfect meshes. There's a tension between accuracy and speed that existing methods don't fully resolve.", "ap": "They analytically simplify the surface integral to just a single ray-mesh intersection test plus an elementary sum over boundary edges. This reduction is mathematically exact (no approximation), yet vastly faster than the direct integral because it replaces billions of floating-point operations with a few geometric queries.", "ww": "The mathematical reduction works because the integral has special structure: most of it cancels, leaving only the contribution from ray intersections and edges. By computing analytically what would be expensive numerically, they keep the algorithm exact while making it practical on large meshes.", "po": "Winding number queries are orders of magnitude faster than prior methods while remaining exact (only floating-point rounding error). The algorithm is simple, debuggable, and robust even on extremely noisy or corrupt meshes, making it a practical replacement for existing approximation methods."}}, {"t": "Fiber-level Woven Fabric Capture from a Single Microscopic Image", "th": "fabric appearance capture", "m": ["differentiable rendering", "procedural models", "microscopy imaging"], "pr": "Fiber-level fabric geometry and appearance capture requires special devices or manual design", "ap": "Coarse-to-fine parameter estimation with differentiable procedural geometry and appearance models", "co": "Single microscope image to fiber-level fabric geometry and realistic rendering", "u": "https://www.semanticscholar.org/paper/95a4bbea4671e4d5b71901f84bfa1b99ca2aec9d", "rc": {"bp": "Fabric looks different under different lighting because of its fiber structure — how threads braid and bend affects how light bounces. Rendering fabric photorealistically requires capturing this structure at the fiber level, but current capture methods use expensive devices or hand-crafted pipelines. The goal is to infer fiber geometry and appearance from a single cheap microscope image.", "wh": "A microscope image and a final rendered image of woven fabric look vastly different — one is a 2D close-up of surface texture, the other a 3D view of complex shading. Inferring full 3D fiber geometry and optical properties from such minimal, 2D information seems under-constrained.", "ap": "They use differentiable procedural models: 3D fiber geometry and shading behavior are parameterized by a few numbers (thread thickness, weave pattern, fiber properties). A neural network predicts initial parameters, then optimization adjusts them to match the microscope image via differentiable rasterization (simulation-based fitting). Refinement improves details.", "ww": "Procedural models are expressive enough to capture real woven fabric but compact enough that optimization over parameters is tractable. Differentiable rasterization lets gradient-based optimization refine parameters to match observations. The coarse-to-fine approach first gets the macro structure right, then refines.", "po": "From a single microscope image, the method recovers fiber-level geometry and appearance suitable for photorealistic rendering. It sidesteps expensive CT scanners and manual authoring, enabling fiber-level fabric assets to be created from affordable tools."}}, {"t": "SAND: Spatially Adaptive Network Depth for Fast Sampling of Neural Implicit Surfaces", "th": "neural implicit surfaces", "m": ["neural implicit representation", "adaptive network depth", "multi-layer perceptron"], "pr": "High computational cost of neural implicit surface evaluations at all spatial locations", "ap": "Spatially adaptive network depth map with tailed MLP for efficient query point evaluation", "co": "Terminating network evaluation adaptively based on spatial geometry complexity reduces computation", "u": "https://www.semanticscholar.org/paper/96d71743cc43e1737ef59def660cabf17b4679da", "rc": {"bp": "When you describe a shape as a mathematical function, you can render it anywhere with perfect precision. But those functions run slow on computers, especially inside graphics engines where we need to evaluate them billions of times per second. We want the speed of simple tricks with the precision of mathematics.", "wh": "The key insight is that implicit representations naturally become harder to get right as you move away from surfaces, and as local geometry gets more complex. A flat floor is easy; a sharp corner or thin feature is hard. But conventional models treat all locations identically.", "ap": "SAND learns a volumetric map recording how deep a network needs to go in each region to be accurate enough. It then uses a modified network architecture where layers can terminate early: each hidden layer has an output option (called a 'tail'), so computation can stop as soon as the necessary accuracy is reached, without traversing the entire network.", "ww": "This works because neural networks can learn internal shortcuts. If a region needs less accuracy, the network can produce good-enough answers partway through. By explicitly allowing early termination and learning where to terminate, the method directs computation only to places where it matters geometrically.", "po": "According to the abstract, SAND achieves spatial adaptivity without retraining—directing computational resources to geometrically important and complex regions. The result is faster sampling of shapes encoded as neural functions, making them practical for real-time graphics."}}, {"t": "AtomSlicer: Constant-Thickness Field-Aligned Non-Planar Slicing and Continuous Toolpaths for FFF", "th": "3D printing toolpaths", "m": ["field-aligned layers", "phase fields", "collision-free toolpaths"], "pr": "Multi-axis 3D printing requires continuous collision-free toolpaths with constant bead geometry", "ap": "Field-aligned phase fields partitioned into layers with 2-RoSy-aligned toolpath synthesis", "co": "Reduces travel moves by 1-2 orders of magnitude while preserving field constraints and constant thickness", "u": "https://www.semanticscholar.org/paper/96efc601fc1ba81fdb8c1789c5de9c7797884538", "rc": {"bp": "3D printers using molten plastic (FFF) can tilt their nozzle in any direction, not just print flat layers. This opens the door to printing without the stepped staircases that plague vertical walls and to using far less support material. But making this work requires solving intricate geometry problems that didn't exist in flat-layer printing.", "wh": "Tilting the nozzle means each layer is no longer flat. Layers must follow prescribed direction fields (user intent), keep constant bead thickness (the plastic comes out at a fixed rate), avoid collisions and tool retractions, and flow continuously from one layer to the next. Doing all of this simultaneously is combinatorially hard—every constraint couples to every other one.", "ap": "AtomSlicer encodes the shape using three perpendicular phase fields (a mathematical trick for describing geometry smoothly), samples them into oriented atoms (spatial building blocks), partitions the model into layers, reconstructs each layer as a mesh, and then synthesizes toolpaths aligned to user-specified direction fields. The key is treating those fields as hard constraints: if the geometry cannot be printed respecting the specification, the algorithm reports it rather than quietly breaking the rules.", "ww": "By separating the problem into phases—encoding, partitioning, reconstruction—the method avoids the combinatorial explosion of trying to optimize everything at once. Each phase works locally on clean geometric building blocks (atoms), so constraints decouple and become tractable.", "po": "The abstract shows AtomSlicer reduces non-extruding travel (wasted motion) to just a few percent and cuts travel moves by one to two orders of magnitude versus earlier methods. For a large test set of 10,000 shapes and 13 physical prints, it stays 9 to 60 times faster than competing algorithms."}}, {"t": "CasLayout: Cascaded 3D Layout Diffusion for Indoor Scene Synthesis with Implicit Relation Modeling", "th": "3D scene generation", "m": ["cascaded diffusion", "sparse relation graphs", "conditional constraints"], "pr": "3D indoor scene synthesis lacks global architectural constraints and struggles with local semantic consistency", "ap": "Cascaded diffusion framework with sparse relation graphs and building elements as constraints", "co": "Reduces data requirements and enables zero-shot image-to-scene generation via LLM/VLM integration", "u": "https://www.semanticscholar.org/paper/975b63c859859ecd141d62cc63d550fb8fa45765", "rc": {"bp": "Imagine designing a living room: you mentally sketch the room's layout, picture where furniture fits, ensure nothing overlaps, and respect walls and doors. Creating realistic virtual rooms automatically is the same task, but machines must learn it. Today's methods either ignore spatial logic or drown in redundant connections, making them brittle and data-hungry.", "wh": "Scene design is a cascade of decisions. First, how many sofas and chairs? Then, how big? Then, where in the room and what spacing? Every decision depends on earlier ones, but also on the room's structure. A fully connected dependency graph between all objects creates redundancy and noise. Data scarcity makes learning hard.", "ap": "CasLayout breaks the problem into four discrete stages, each with explicit purpose: predict object counts and types, refine sizes and features, model spatial relations in a learned space (not pixel space), and generate precise bounding boxes. For spatial relations, the method builds a sparse graph (only relevant connections) rather than forcing every object to know about every other one. LLMs and vision-language models can guide the pipeline for zero-shot tasks like creating a scene from a photo.", "ww": "Breaking the task into stages mirrors how humans design: we sketch a plan, refine dimensions, check how objects relate, then finalize placement. Each stage focuses on one type of decision, so the network learns cleaner patterns. Sparse relations mean the model only learns necessary connections, not noise from irrelevant object pairs.", "po": "By decomposing the joint generation task, CasLayout reduces data requirements, maintains physical validity within floor plans by treating walls and doors as explicit constraints, and enables flexible integration with large language models for image-to-scene and text-to-scene generation."}}, {"t": "Implicit Minimal Surfaces for Bijective Correspondences", "th": "surface correspondence", "m": ["implicit representation", "complex sections", "ginzburg-landau functional"], "pr": "Computing bijective surface correspondences requires complex combinatorial mesh modifications and barrier functions", "ap": "Implicit 4D mapping surface using complex sections minimized via Ginzburg-Landau functional", "co": "Robust correspondence computation without initialization requirement or mesh modifications needed", "u": "https://www.semanticscholar.org/paper/981d199c34921eff47930fbf8e9a2b9787521739", "rc": {"bp": "Matching points on two shapes—finding which part of the first surface corresponds to which part of the second—is central to animation, shape
